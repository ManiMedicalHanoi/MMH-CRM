/* gọi backend file Event chạy đồng bộ ngay */
function syncEventNow(){
  busy(true,"Đang đọc file khách Event và ghi sang tab 2. CBC…");
  var cb="__mmhev_"+Date.now()+"_"+(++_seq);
  var el=document.createElement("script");
  var t=setTimeout(function(){ done(); busy(false);
    toast("Quá thời gian chờ — mở file Event rồi chạy menu MMH Event ▸ ② Đồng bộ ngay","warn",8000); },90000);
  function done(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
                   if(el.parentNode) el.parentNode.removeChild(el); }
  window[cb]=function(j){
    done();
    if(!j||!j.ok){ busy(false); return toast("Lỗi đồng bộ: "+((j&&j.error)||"không rõ"),"err",8000); }
    S.eventSync=j;
    /* đọc lại danh bạ CBC ngay, chờ xong mới vẽ ⇒ thấy số liệu mới lập tức */
    busy(true,"Đang nạp lại danh bạ CBC…");
    reloadCbc(function(rows){
      busy(false);
      toast("✓ "+j.message,"ok",7000);
      if(S.tab==="stake") renderStake();
      if(S.tab==="dash"){ S.dash=null; renderDash(); }
      var nEv=(rows||[]).filter(function(b){ return EVENT_NOTE_RE.test(String(b.note||"")); }).length;
      if(j.added>0 && !nEv)
        toast("Đã ghi "+j.added+" dòng sang sheet nhưng app chưa nhận ra khách event — "+
              "kiểm tra cột Ghi chú (R) của tab 2. CBC có đúng dạng “Khách hàng từ Event: …” không.",
              "warn",11000);
    });
  };
  el.src=EVENT_URL+"?action=sync&team="+encodeURIComponent(curTeam().eventSrc)+"&callback="+cb+"&_ts="+Date.now();
  el.onerror=function(){ done(); busy(false);
    toast("Không gọi được file Event — kiểm tra Web App đã Deploy quyền “Anyone”.","err",8000); };
  document.body.appendChild(el);
}

function stakeDiag(){

    if(!r.event) return false;
    return isMgmt() || !r.pic || picEq(r.pic,S.user.pic);
  }).length;
  var L=[];
  L.push('Danh bạ CBC app đang giữ: <b>'+fmtN(all)+'</b> dòng');
  L.push('Trong đó có ghi chú “Khách hàng từ Event”: <b>'+fmtN(withNote)+'</b>');

    hint='Đã có khách từ event nhưng chưa dòng nào ghi PIC là <b>'+esc(S.user.pic)+'</b>. '+

  else
    hint='Thử bỏ bộ lọc sự kiện hoặc xoá từ khoá tìm kiếm.';
  return '<div class="st-diag"><div class="dg-l">'+L.join('<br>')+'</div>'+

function stakeRow(r,toks,showEv){
  var lv=r.last?Math.round((new Date(todayISO())-new Date(r.last))/86400000):null;
  var acts=[];
  if(r.nVisit) acts.push('<span class="tag t-b" title="Viếng thăm">📍 '+r.nVisit+'</span>');
  if(r.nTele)  acts.push('<span class="tag t-n" title="Gọi điện">📞 '+r.nTele+'</span>');
  if(r.nMsg)   acts.push('<span class="tag t-n" title="Nhắn tin / email">💬 '+r.nMsg+'</span>');
  if(r.nOther) acts.push('<span class="tag t-n" title="Hình thức khác">• '+r.nOther+'</span>');
  return '<tr'+(r.nTotal?"":' class="st-cold"')+' style="cursor:pointer" onclick="openCust(\''+esc(r.code)+'\')">'+
    '<td><b>'+skHl(r.contact,toks)+'</b>'+
      (r.role?'<div class="cx-sub">'+esc(r.role)+'</div>':"")+'</td>'+
    '<td>'+(r.acc?skHl(r.acc,toks):'<span class="cx-none">chưa gán account</span>')+
      (r.province?'<div class="cx-sub">'+esc(r.province)+(r.pic?' · '+esc(r.pic):"")+'</div>':"")+'</td>'+
    '<td>'+(r.phone?'<a href="tel:'+esc(String(r.phone).replace(/\s/g,""))+'" onclick="event.stopPropagation()" class="ot-link">'+esc(r.phone)+'</a>':'<span class="cx-none">—</span>')+'</td>'+
    '<td>'+esc(r.jobTitle||"—")+(r.specialize?'<div class="cx-sub">'+esc(r.specialize)+'</div>':"")+'</td>'+
    '<td>'+(r.influence||r.trust
      ? (r.influence?'<span class="tag t-y">'+esc(r.influence)+'</span> ':"")+
        (r.trust?'<span class="tag t-g">'+esc(r.trust)+'</span>':"")
      : '<span class="cx-none">chưa đánh giá</span>')+'</td>'+
    (showEv?'<td>'+(r.event?'<span class="tag t-p" title="'+esc(r.event)+'">🎪 '+esc(String(r.event).slice(0,26))+'</span>':'<span class="cx-none">—</span>')+'</td>':"")+
    '<td>'+(acts.length
      ? '<div class="st-acts">'+acts.join("")+'</div>'+
        (lv!=null?'<div class="cx-sub">'+(lv===0?"hôm nay":lv+" ngày trước")+'</div>':"")
      : '<span class="tag t-r">chưa chăm sóc</span>')+'</td>'+
    '<td class="num">'+(r.sales?fmtVND(r.sales):'<span class="cx-none">—</span>')+'</td>'+
    '<td>'+(r.created?fmtVN(r.created):'<span class="cx-none">—</span>')+'</td></tr>';
}

/* ───────── NAV ───────── */
var TABS=[
  {id:"dash",   ic:"📊", lb:"Dashboard",   grp:"Tổng quan", mob:1},
  {id:"kpi",    ic:"🎯", lb:"KPI & Mục tiêu", grp:"Tổng quan", mob:1},
  {id:"cust",   ic:"👥", lb:"Khách hàng",  mlb:"Khách hàng", grp:"Dữ liệu", mob:1},
  {id:"stake",  ic:"🤝", lb:"Key stakeholder", mlb:"CBC",    grp:"Dữ liệu"},
  {id:"weekly", ic:"📍", lb:"Cập nhật", mlb:"Cập nhật", grp:"Dữ liệu", mob:1},
  {id:"order",  ic:"🧾", lb:"Đơn hàng",    mlb:"Đơn hàng",  grp:"Dữ liệu"},
  {id:"present",ic:"🎤", lb:"Thuyết trình",mlb:"Thuyết trình", grp:"Dữ liệu"},
  {id:"monthly",ic:"🗓", lb:"Công việc trong tháng",mlb:"CV tháng", grp:"Dữ liệu"},
  {id:"adp",    ic:"⭐", lb:"ADP Key account",mlb:"ADP",     grp:"Dữ liệu"},
  {id:"meet",   ic:"🗂️", lb:"Họp tuần",    mlb:"Họp tuần",  grp:"Công cụ", mob:1, gate:"meet"},   /* ⭐ v18 — chỉ nhóm Surgical */
  {id:"photos", ic:"🖼️", lb:"Xem ảnh đi địa bàn", mlb:"Ảnh", grp:"Công cụ", mob:0, gate:"gallery"},
  {id:"report", ic:"📧", lb:"Gửi báo cáo", mlb:"Mail",      grp:"Công cụ", mob:1}
];
/* thứ tự nút ở thanh dưới trên điện thoại */
var MOB_ORDER=["weekly","meet","cust","stake","order","present","report","monthly","adp","dash","kpi","photos"];
function navTabs(){ return TABS.filter(function(t){
  if(t.gate==="meet") return typeof canSeeMeet==="function" && canSeeMeet();   /* ⭐ v18 */
  return t.gate!=="gallery" || canSeeGallery(); }); }
function buildNav(){
  var h="",lastGrp="";
  if(isMgmt()){
    var ck=curTeamKey();
    h+='<div class="tmsw"><div class="tl">Nhóm đang xem</div>'+Object.keys(TEAMS).map(function(k){
      var tm=TEAMS[k];
      return '<button class="'+(k===ck?"on":"")+'" title="'+esc(tm.short)+'" onclick="'+(k===ck?"":"switchTeam(\''+k+'\')")+'">'+
        '<span class="ic">'+tm.ic+'</span><b>'+esc(tm.label)+'</b></button>';
    }).join("")+'</div>';
  }
  navTabs().forEach(function(t){
    if(t.grp!==lastGrp){ h+='<div class="grp">'+t.grp+'</div>'; lastGrp=t.grp; }
    h+='<button class="nvi" data-t="'+t.id+'" onclick="go(\''+t.id+'\')"><span class="ic">'+t.ic+'</span><span class="lb">'+t.lb+'</span></button>';
  });
  h+='<div style="flex:1"></div><div style="padding:10px;font-size:10.5px;color:var(--mute);line-height:1.5">MMH CRM v13<br>'+
     (isMgmt()?'<a href="'+DRIVE_FOLDER+'" target="_blank">📁 Folder ảnh Drive</a>':"")+'</div>';
  $("side").innerHTML=h;
  /* ⭐ v4.5 — thanh dưới trượt ngang, đủ mọi mục, bỏ nút "Thêm" */
  var map={}; navTabs().forEach(function(t){ map[t.id]=t; });
  var seq=MOB_ORDER.filter(function(id){ return map[id]; });
  navTabs().forEach(function(t){ if(seq.indexOf(t.id)<0) seq.push(t.id); });
  $("navMob").innerHTML=seq.map(function(id){
    var t=map[id];
    return '<button data-t="'+t.id+'" onclick="go(\''+t.id+'\')"><span class="ic">'+t.ic+'</span>'+(t.mlb||t.lb.split(" ")[0])+'</button>';
  }).join("");
}
function moreMenu(){
  var h='<div class="list">'+navTabs().filter(function(t){return !t.mob;}).map(function(t){
    return '<div class="li" onclick="closeModal();go(\''+t.id+'\')"><div class="t1"><span style="font-size:18px">'+t.ic+'</span><b>'+t.lb+'</b></div></div>';
  }).join("")+'</div>';
  openModal("Chức năng khác",h,'<button class="btn" onclick="closeModal()">Đóng</button>');
}
function go(tab){
  S.tab=tab;
  document.querySelectorAll("[data-t]").forEach(function(el){ el.classList.toggle("on", el.getAttribute("data-t")===tab); });
  $("fab").classList.toggle("on", tab==="weekly"||tab==="dash");
  $("fab").title = (tab==="weekly") ? "Thêm task đi địa bàn" : "Ghi nhanh hoạt động";
  $("main").scrollTop=0;
  ({dash:pgDash,kpi:pgKPI,cust:pgCust,stake:pgStake,weekly:pgWeekly,order:pgOrder,present:pgPresent,monthly:pgMonthly,adp:pgADP,photos:pgGallery,report:pgReport,meet:window.pgMeet}[tab]||pgDash)();
  syncTabOnEnter(tab);        /* ⭐ v7.1 — nạp nền bản mới nhất, vẽ lại khi có */
}
/* ⭐ v2: khung xương thay vì vòng xoay chặn màn hình */
function loading(msg){
  $("main").innerHTML='<div class="pg"><div class="ph"><div><div class="sk t" style="width:180px;margin-bottom:8px"></div>'
    +'<div class="sk" style="width:'+(msg?Math.min(320,msg.length*7):200)+'px"></div></div></div>'+skRows(7,true)+'</div>';
}

/* ───────── customer index ───────── */
function loadCustomerIndex(force){
  if(S.custIndex.length&&!force) return Promise.resolve(S.custIndex);
  /* ⭐ v13 — gom các lần gọi trùng (trước đây mở app bắn 3–4 request customerIndex cùng lúc) */
  if(S._ciLoading){ return force ? S._ciLoading.then(function(){ return loadCustomerIndex(true); }) : S._ciLoading; }
  S._ciLoading=apiGet("customerIndex").then(function(j){
    S._ciLoading=null;
    S.custIndex=j.rows||[]; S.custMap={};
    S.custIndex.forEach(function(c){ S.custMap[c.code]=c; });
    return S.custIndex;
  }).catch(function(){ S._ciLoading=null; return S.custIndex||[]; });
  return S._ciLoading;
}
/* ⭐ v2: loading không chặn — dùng khung xương thay vòng xoay toàn màn hình */
function skeleton(html){ $("main").innerHTML='<div class="pg">'+html+'</div>'; }
function myCust(){
  if(S.user.role==="manager"&&!S.filt.pic) return S.custIndex;
  var p=S.filt.pic||S.user.pic;
  return S.custIndex.filter(function(c){ return c.pic===p; });
}
</script>

<script>
/* ═══════════════════════ CHART HELPER ═══════════════════════ */
var CH={};
var PAL=["#3A5CAA","#7D97CE","#1E9E5A","#E8A302","#B44FA6","#00A0B0","#D9433F","#5C6B8A","#8FBF4D","#C77DFF"];

/* ═══════════════════════ ⭐ v4.2 — DASHBOARD TÍNH TẠI CHỖ ═══════════════════════
   Trước: mỗi lần bấm Dashboard / đổi PIC / đổi FY đều gọi action "dashboard" trên
   Apps Script ⇒ 3–6 giây mỗi thao tác.
   Nay: mọi con số được tính TRỰC TIẾP trong trình duyệt từ dữ liệu đã nạp sẵn
   (kho địa bàn cả FY + tab Đơn hàng + Thuyết trình + danh mục khách hàng).
   ⇒ đổi PIC / đổi khoảng thời gian = 0 lần gọi mạng, và số liệu luôn khớp tức thì
   với mọi thay đổi vừa ghi (afterWrite đã vá thẳng vào các kho này).
   ═══════════════════════════════════════════════════════════════════════════════ */
function dashRange(){
  var ms=fyMonths(S.fy), r=S.dashR||{mode:"FY"};
  if(r.mode==="Q"){
    var i=(Math.max(1,Math.min(4,r.q||1))-1)*3;
    return { months:ms.slice(i,i+3), label:"Quý "+(r.q||1)+" · "+S.fy, sub:ms.slice(i,i+3).map(mLb).join(" · ") };
  }
  if(r.mode==="M"){
    var m=r.m||ymOf(todayISO()); if(ms.indexOf(m)<0) m=ms[ms.length-1];
    return { months:[m], label:"Tháng "+mLb(m), sub:"" };
  }
  return { months:ms, label:"Cả năm tài chính "+S.fy, sub:mLb(ms[0])+" → "+mLb(ms[11]) };
}
function mLb(m){ return String(m).slice(4)+"/"+String(m).slice(0,4); }
function setDashR(mode,v){
  S.dashR = (mode==="Q") ? {mode:"Q",q:v} : (mode==="M") ? {mode:"M",m:v} : {mode:"FY"};
  renderDash();
}
function dashPic(p){ S.filt.pic=p; renderDash(); }          /* tức thì, không gọi mạng */

/* nguồn dữ liệu sẵn có */
function dashSrc(){
  return { weekly: terrRows(), order: tGet("order")||[], present: tGet("present")||[],
           cust: S.custIndex||[], cbc: S.cbcRows||[], adp: tGet("adp")||[] };
}
function dashMissing(){
  var m=[];
  if(!S.cache.weekly) m.push("hoạt động địa bàn");
  if(!tGet("order")) m.push("đơn hàng");
  if(!tGet("present")) m.push("thuyết trình");
  if(!(S.custIndex&&S.custIndex.length)) m.push("danh mục khách hàng");
  if(!S.cbcRows) m.push("người liên hệ (CBC)");
  if(!tGet("adp")) m.push("ADP key account");
  return m;
}
/* nhóm thông tin trên Dashboard */
var DASH_GROUPS=[["all","📊 Tổng quan"],["cust","🏥 Khách hàng"],["field","📍 Đi địa bàn"],
                 ["biz","🧾 Kinh doanh"],["adp","⭐ ADP Key account"]];
function setDashG(g){ S.dashG=g; renderDash(); }
/* ── tính toàn bộ số liệu dashboard trong trình duyệt ── */
function dashBuild(){
  var R=dashRange(), months=R.months, src=dashSrc();
  var mIdx={}; months.forEach(function(m,i){ mIdx[m]=i; });
  var pic=S.filt.pic||"";
  function keep(p){ if(!pic) return true; var s=String(p||"");
    return s===pic || s.toLowerCase().indexOf(pic.toLowerCase())>=0; }
  function z(){ return months.map(function(){ return 0; }); }
  function top(o,k){ return Object.keys(o).map(function(x){return {k:x,v:o[x]};})
      .sort(function(a,b){return b.v-a.v;}).slice(0,k||10); }
  function ymField(v,alt){ var s=String(v==null?"":v).replace(/\D/g,""); return s.length>=6?s.slice(0,6):ymOf(alt||""); }

  /* ── đơn hàng ── */
  var amtByMonth=z(), ordByMonth=z(), amtByPic={}, custAmt={}, prodAmt={}, channel={};
  src.order.forEach(function(o){
    if(!keep(o.pic)) return;
    var i=mIdx[ymField(o.month,o.day)]; if(i===undefined) return;
    var a=n(o.amount);
    amtByMonth[i]+=a; ordByMonth[i]+=1;
    amtByPic[String(o.pic||"—")]=(amtByPic[String(o.pic||"—")]||0)+a;
    var cn=String(o.name||o.code||"(không rõ)"); custAmt[cn]=(custAmt[cn]||0)+a;
    var pt=String(o.ptype||"Khác");             prodAmt[pt]=(prodAmt[pt]||0)+a;
    var ch=String(o.channel||"Khác");           channel[ch]=(channel[ch]||0)+a;
  });

  /* ── hoạt động đi địa bàn ── */
  var visByMonth=z(), actByType={}, byAccountType={}, byStatus={}, byProcess={}, byFeedback={}, byProduct={}, byPicVisit={};
  var visited={}, overdue=0, withPhoto=0, total=0, today=todayISO(), inRange=[];
  src.weekly.forEach(function(w){
    if(!keep(w.pic)) return;
    var d=String(w.start).slice(0,10);
    var i=mIdx[ymField(w.month,d)]; if(i===undefined) return;
    total++; inRange.push(w);
    if(String(w.typeAction||"")==="Visiting") visByMonth[i]++;
    var A=parseAcc(w.account);
    function bump(o,k){ k=String(k||"—")||"—"; o[k]=(o[k]||0)+1; }
    bump(actByType,w.typeAction); bump(byAccountType,A.type||w.type);
    bump(byStatus,w.status||"Chưa cập nhật"); bump(byProcess,w.process);
    bump(byFeedback,w.feedback); bump(byProduct,w.product); bump(byPicVisit,w.pic);
    if(A.name) visited[A.name.toLowerCase()]=1;
    if((w.photos&&w.photos.length)||String(w.photo||"").trim()) withPhoto++;
    var fin=String(w.finish||"").slice(0,10)||d;
    if(!/complet|cancel/i.test(String(w.status||"")) && fin && fin<today) overdue++;
  });

  /* ── khách hàng & account mở mới ── */
  var totalAcc=0, coveredAcc=0, byAreaAcc={}, newAcc=z();
  src.cust.forEach(function(c){
    if(!keep(c.pic)) return;
    totalAcc++;
    var ar=String(c.area||"—")||"—"; byAreaAcc[ar]=(byAreaAcc[ar]||0)+1;
    if(visited[String(c.name||"").toLowerCase()]) coveredAcc++;
    var i=mIdx[ymOf(String(c.openDate||"").slice(0,10))];
    if(i!==undefined) newAcc[i]++;
  });

  /* ── CBC / người liên hệ ──
     Tab "2. CBC" không có cột ngày tạo ⇒ không đếm được "CBC mới theo tháng" trực tiếp.
     Thay vào đó: gắn CBC theo NGÀY MỞ ACCOUNT của account tương ứng (proxy đủ dùng),
     đồng thời vẫn cho biết tổng CBC và phân bổ theo PIC / khu vực. */
  var accOpenYm={}, accPicMap={};
  src.cust.forEach(function(c){
    var k=String(c.name||"").trim().toLowerCase(); if(!k) return;
    accOpenYm[k]=ymOf(String(c.openDate||"").slice(0,10));
    accPicMap[k]=c.pic||"";
  });
  var cbcTotal=0, newCbc=z(), cbcByPic={}, cbcByArea={}, cbcPerAcc={}, cbcNoAcc=0;
  src.cbc.forEach(function(b){
    var owner=String(b.pic||"")||accPicMap[String(b.name||"").trim().toLowerCase()]||"";
    if(!keep(owner)) return;
    if(!String(b.contact||"").trim()) return;
    cbcTotal++;
    var an=String(b.name||"").trim();
    if(an){ cbcPerAcc[an]=(cbcPerAcc[an]||0)+1; } else cbcNoAcc++;
    cbcByPic[String(owner||"—")]=(cbcByPic[String(owner||"—")]||0)+1;
    var ar=String(b.area||"—")||"—"; cbcByArea[ar]=(cbcByArea[ar]||0)+1;
    var i=mIdx[accOpenYm[an.toLowerCase()]||""]; if(i!==undefined) newCbc[i]++;
  });

  /* ── ⭐ v6.0 — CHĂM SÓC KHÁCH HÀNG TỪ EVENT ──
     CBC có Ghi chú "Khách hàng từ Event: …" là khách thu được tại sự kiện.
     Đếm xem sales phụ trách đã tiếp xúc lại bao nhiêu người trong số đó. */
  var evTotal=0, evTouched=0, evByEvent={}, evTouchByEvent={}, evOrder=0, evNoAcc=0;
  var evAccSet={};
  src.cbc.forEach(function(b){
    var owner=String(b.pic||"")||accPicMap[String(b.name||"").trim().toLowerCase()]||"";
    if(!keep(owner)) return;
    if(!String(b.contact||"").trim()) return;
    var m=/Khách hàng từ Event:\s*([^·\n]+)/i.exec(String(b.note||""));
    if(!m) return;
    var ev=String(m[1]).trim();
    evTotal++;
    evByEvent[ev]=(evByEvent[ev]||0)+1;
    var an=String(b.name||"").trim();
    if(!an){ evNoAcc++; return; }
    evAccSet[an.toLowerCase()]=1;
    var who=noAcc(b.contact).replace(/\s+/g," ").trim();
    var hit=(src.weekly||[]).some(function(w){
      if(String(w.fy||"")!==S.fy) return false;
      if(noAcc(parseAcc(w.account).name).trim()!==noAcc(an).trim()) return false;
      var meet=(MEET_RE.exec(String(w.result||""))||[""])[0];
      return who && noAcc(meet).indexOf(who)>=0;
    });
    if(hit){ evTouched++; evTouchByEvent[ev]=(evTouchByEvent[ev]||0)+1; }
  });
  src.order.forEach(function(r){
    if(!keep(r.pic)) return;
    if(evAccSet[String(r.name||"").trim().toLowerCase()]) evOrder+=n(r.amount);
  });

  /* ── ADP key account theo kỳ ──
     Tab "8. ADP" có 12 cột tháng m09..m08 ⇒ cộng đúng các tháng nằm trong kỳ đang xem. */
  var ADP_MK={ "09":"m09","10":"m10","11":"m11","12":"m12","01":"m01","02":"m02",
               "03":"m03","04":"m04","05":"m05","06":"m06","07":"m07","08":"m08" };
  var adpRows=[], adpByGrp={A:0,B:0,C:0,D:0,"—":0}, adpTargetFY=0, adpActualFY=0;
  var adpPeriodAmt=z(), adpPeriodTotal=0, adpNoVisit=0, adpVisitCov=0;
  /* ⭐ v5.9 — "ADP mới" = số bản ADP được TẠO trong kỳ, đọc từ cột AE "Ngày tạo".
     Trước đây thẻ này cộng tiền các cột tháng nên ra 9,58 tỷ — không phải số lượng. */
  var adpNewCnt=0, adpNewTarget=0, adpNoStamp=0;
  src.adp.forEach(function(r){
    if(!keep(r.pic)) return;
    if(String(r.fy||"") && String(r.fy)!==S.fy) return;
    adpRows.push(r);
    var g=(typeof abcdKey==="function"?abcdKey(r.abcd):"")||"—";
    adpByGrp[g]=(adpByGrp[g]||0)+1;
    adpTargetFY+=n(r.targetAmt); adpActualFY+=n(r.actualAmt);
    months.forEach(function(m,i){
      var f=ADP_MK[String(m).slice(4,6)];
      if(f){ var v=n(r[f]); adpPeriodAmt[i]+=v; adpPeriodTotal+=v; }
    });
    var an=parseAcc(r.account).name;
    if(an && visited[an.toLowerCase()]) adpVisitCov++; else adpNoVisit++;

    var made=String(r.created||"").replace(/[^\d-]/g,"").slice(0,7);   /* "YYYY-MM" */
    var madeYm=made.replace("-","");
    if(!madeYm){ adpNoStamp++; }
    else if(mIdx[madeYm]!==undefined){ adpNewCnt++; adpNewTarget+=n(r.targetAmt); }
  });

  /* ── thuyết trình ── */
  var presByMonth=z(), attByMonth=z();
  src.present.forEach(function(r){
    if(!keep(r.pic)) return;
    var i=mIdx[ymField(r.month,r.day)]; if(i===undefined) return;
    presByMonth[i]++; attByMonth[i]+=n(r.actual);
  });

  var recent=inRange.slice().sort(function(a,b){ return String(b.start).localeCompare(String(a.start)); })
    .slice(0,25).map(function(w){
      return { start:w.start, pic:w.pic, account:parseAcc(w.account).name, typeAction:w.typeAction,
               typeTask:w.typeTask, status:w.status, result:String(w.result||"").slice(0,220),
               photo:((w.photos&&w.photos.length)?"1":w.photo), _row:w._row };
    });

  return { months:months, rangeLabel:R.label, rangeSub:R.sub,
    monthLabels: months.map(function(m){ return "T"+parseInt(String(m).slice(4,6),10); }),
    amtByMonth:amtByMonth, ordByMonth:ordByMonth, visByMonth:visByMonth, newAcc:newAcc,
    presByMonth:presByMonth, attByMonth:attByMonth,
    amtByPic:top(amtByPic,12), topCustomers:top(custAmt,10), prodAmt:top(prodAmt,10),
    channel:top(channel,6), actByType:top(actByType,10), byAccountType:top(byAccountType,10),
    byStatus:top(byStatus,10), byProcess:top(byProcess,10), byFeedback:top(byFeedback,6),
    byProduct:top(byProduct,12), byPicVisit:top(byPicVisit,12), byAreaAcc:top(byAreaAcc,6),

/* nạp những nguồn còn thiếu — mỗi nguồn xong là vẽ lại ngay, không chờ nhau */
function dashEnsure(force){
  if(!S.cache.weekly || force) loadTerritoryAll(true).then(dashRepaint);
  if(!tGet("order")   || force) ensureTab("order",{},  function(r,ready){ if(ready) dashRepaint(); });
  if(!tGet("present") || force) ensureTab("present",{},function(r,ready){ if(ready) dashRepaint(); });
  if(!tGet("adp")     || force) ensureTab("adp",{},    function(r,ready){ if(ready) dashRepaint(); });
  if(!(S.custIndex&&S.custIndex.length)) loadCustomerIndex().then(dashRepaint);
  if(force){ S.cbcRows=null; S._cbcLoading=false; }
  if(!S.cbcRows){ ensureCbc(); setTimeout(dashRepaint,1400); }
}

function distributorOf(name){
  var raw=noAcc(name).replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();
  if(!raw) return null;
  var tight=raw.replace(/ /g,""), words=raw.split(" ");
  var LST=distributorList(), anyD=null;
  for(var i=0;i<LST.length;i++){
    var d=LST[i], j;
    if(d.any){ anyD=anyD||d; continue; }          /* ⭐ v7.2 — dòng "nhận mọi NPP" xét sau cùng */
    for(j=0;j<(d.match||[]).length;j++) if(tight.indexOf(d.match[j])>=0) return d;
    for(j=0;j<(d.abbr||[]).length;j++) if(words.indexOf(d.abbr[j])>=0||tight===d.abbr[j]) return d;
  }
  if(anyD) return { label:String(name).replace(/\s+/g," ").trim(), pic:anyD.pic, any:true };
  return null;
}

function turnoverJsonp(params,timeoutMs){
  return new Promise(function(res,rej){
    var cb="__mmhto_"+Date.now()+"_"+(++_seq);
    var el=document.createElement("script");
    var t=setTimeout(function(){ done(); rej(new Error("Quá thời gian chờ khi đọc file Turnover")); }, timeoutMs||45000);
    function done(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
                     if(el.parentNode) el.parentNode.removeChild(el); }
    window[cb]=function(d){ done(); res(d); };
    params=params||{}; params.callback=cb;
    var qs=Object.keys(params).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(params[k]==null?"":params[k]); }).join("&");
    el.src=TURNOVER_URL+"?"+qs;
    el.onerror=function(){ done(); rej(new Error("Không đọc được file Turnover — kiểm tra Web App của file đó đã Deploy với quyền “Anyone” chưa.")); };
    document.body.appendChild(el);
  });
}
function loadTurnover(force){
  if(S.turnover && !force) return Promise.resolve(S.turnover);
  if(S._toLoading) return S._toLoading;
  /* _ts đổi mỗi lần gọi để trình duyệt và proxy không trả bản cũ.
     File Turnover còn cache phía server 60 giây nên số mới nhất về chậm nhất sau 1 phút. */
  S._toLoading = turnoverJsonp({action:"getTurnoverData", _ts:Date.now()}).then(function(j){
    S._toLoading=null; S.turnoverErr="";
    if(!j || !j.ok) throw new Error((j&&j.error)||"File Turnover trả về dữ liệu không hợp lệ");
    /* rowsJizai = các dòng Type "2 Jizai Qty" — là SỐ LƯỢNG, không phải tiền */
    S.turnover={ rows:j.rows||[], jizai:j.rowsJizai||[], composite:j.rowsComposite||[], at:Date.now() };
    return S.turnover;
  }).catch(function(e){ S._toLoading=null; S.turnoverErr=e.message; throw e; });
  return S._toLoading;
}

/* gộp theo NPP trong khoảng tháng đang xem */
function turnoverByDistributor(months,picOnly){
  var t=S.turnover; if(!t) return null;
  var inM={}; (months||[]).forEach(function(m){ inM[String(m)]=1; });
  var segOK={}; turnoverSegments().forEach(function(x){ segOK[String(x).toLowerCase()]=1; });
  var byD={}, allMonths={}, segSeen={}, skipped={};
  t.rows.forEach(function(r){
    var seg=String(r.segment||""); segSeen[seg]=1;
    if(!segOK[seg.toLowerCase()]) return;
    var d=distributorOf(r.distributor);
    if(!d){ skipped[String(r.distributor||"—")]=1; return; }   /* ngoài 4 NPP ⇒ bỏ */
    if(picOnly && d.pic!==picOnly) return;
    allMonths[String(r.month)]=1;
    if(months && months.length && !inM[String(r.month)]) return;
    var key=d.label;
    if(!byD[key]) byD[key]={ name:d.label, pic:d.pic, budget:0, actual:0, bySeg:{} };
    byD[key].budget+=n(r.budget); byD[key].actual+=n(r.forecast);
    if(!byD[key].bySeg[seg]) byD[key].bySeg[seg]={budget:0,actual:0};
    byD[key].bySeg[seg].budget+=n(r.budget); byD[key].bySeg[seg].actual+=n(r.forecast);
  });
  var list=Object.keys(byD).map(function(k){ return byD[k]; })
    .sort(function(a,b){ return b.actual-a.actual; });
  return { list:list, budget:list.reduce(function(x,r){return x+r.budget;},0),
           actual:list.reduce(function(x,r){return x+r.actual;},0),
           fileMonths:Object.keys(allMonths).sort(), segments:Object.keys(segSeen).sort(),
           skipped:Object.keys(skipped).sort() };
}
/* Cộng số cho một thẻ sản phẩm, vẫn giới hạn trong 4 NPP và PIC đang chọn. */
function productStat(card,months,picOnly){
  var t=S.turnover; if(!t) return null;
  var src = (card.src==="jizai")     ? (t.jizai||[])
          : (card.src==="composite") ? (t.composite||[])
          : (t.rows||[]);
  var inM={}; (months||[]).forEach(function(m){ inM[String(m)]=1; });
  var want=noAcc(card.prod||"");
  var budget=0, actual=0, hit=0, seen={}, noCol=false;
  src.forEach(function(r){
    var pr=String(r.products||"");
    if(!pr) noCol=true; else seen[pr]=1;
    if(want && noAcc(pr)!==want) return;
    var d=distributorOf(r.distributor); if(!d) return;
    if(picOnly && d.pic!==picOnly) return;
    if(months && months.length && !inM[String(r.month)]) return;
    budget+=n(r.budget); actual+=n(r.forecast); hit++;
  });
  return { budget:budget, actual:actual, hit:hit, products:Object.keys(seen).sort(), noCol:(noCol&&!hit) };
}

    '</div>'+
    '<button class="btn xs" onclick="refreshTurnover()">⟳ Đọc lại</button></div>';

  if(S.turnoverErr)
    return '<div class="card pad" style="margin-bottom:14px">'+head+
      '<div class="empty" style="padding:18px 0"><div class="e">⚠️</div><p style="max-width:560px;margin:0 auto">'+
      esc(S.turnoverErr)+'</p><button class="btn sm" style="margin-top:11px" onclick="refreshTurnover()">Thử lại</button></div></div>';
  if(!S.turnover)
    return '<div class="card pad" style="margin-bottom:14px">'+head+
      '<div class="empty" style="padding:18px 0"><div class="e">⏳</div><p>Đang đọc doanh số NPP từ file MMH Turnover…</p></div></div>';

  var g=turnoverByDistributor(months,picSel||"");
  if(!g.list.length){
    if(picSel && !distributorList().some(function(d){ return d.pic===picSel; }))
      return '<div class="card pad" style="margin-bottom:14px">'+head+
        '<div class="empty" style="padding:18px 0"><div class="e">👤</div><p><b>'+esc(picSel)+
        '</b> chưa được gán nhà phân phối nào. Bấm “Toàn nhóm” để xem toàn bộ NPP của nhóm.</p></div></div>';
    var why = (months && g.fileMonths.length)
      ? ('File Turnover đang chứa dữ liệu các tháng <b>'+esc(g.fileMonths[0])+' → '+esc(g.fileMonths[g.fileMonths.length-1])+
         '</b>, không trùng tháng nào của '+esc(S.fy)+'. Bấm “Toàn bộ file” để xem, hoặc mở file Turnover sửa <b>CONFIG.FY_FILTER</b> và <b>VALID_MONTHS</b> sang '+esc(S.fy)+'.')
      : ('Không thấy dòng nào thuộc segment '+turnoverSegments().join(" / ")+
         (g.segments.length?('. Segment có trong file: <b>'+esc(g.segments.join(", "))+'</b>'):"")+'.');
    return '<div class="card pad" style="margin-bottom:14px">'+head+
      '<div class="empty" style="padding:18px 0"><div class="e">📭</div><p style="max-width:620px;margin:0 auto;line-height:1.65">'+why+'</p></div></div>';
  }
  var pct=g.budget?g.actual/g.budget:null;
  var lbl=(months?("Theo "+S.fy):("Toàn bộ file"+(g.fileMonths.length?(" · "+g.fileMonths[0]+" → "+g.fileMonths[g.fileMonths.length-1]):"")));

  return '<div class="card pad" style="margin-bottom:14px">'+head+
    '<div class="grid g4" style="margin:4px 0 13px">'+
      '<div class="kpi"><div class="lb">Mục tiêu MMH (Budget Mani)</div><div class="vl">'+fmtUSD(g.budget)+'</div><div class="sb">'+esc(lbl)+'</div></div>'+
      '<div class="kpi"><div class="lb">Actual / Forecast</div><div class="vl">'+fmtUSD(g.actual)+'</div>'+
        (pct!=null?pb(pct)+'<div class="pbl"><span style="color:'+pctColor(pct)+'">'+Math.round(pct*100)+'%</span><span>'+
          (g.actual>=g.budget?("vượt "+fmtUSD(g.actual-g.budget)):("còn "+fmtUSD(g.budget-g.actual)))+'</span></div>':"")+'</div>'+
      (PRODUCT_CARDS[productGroup()]||[]).map(function(c){
        var st=productStat(c,months,picSel||"");
        if(!st) return '';
        var isQty=(c.unit==="qty");
        var val=isQty?fmtQty(st.actual):fmtUSD(st.actual);
        var pc=st.budget?st.actual/st.budget:null;
        var sub;
        if(!st.hit){
          sub = st.noCol
            ? 'File Turnover chưa gửi cột <b>Products</b> — cập nhật Code.gs của file đó (bản v5.3)'
            : ('Không có dòng nào thuộc Products <b>'+esc(c.prod)+'</b>'+
               (st.products.length?(' · Products trong file: '+esc(st.products.join(", "))):""));
          return '<div class="kpi"><div class="lb">'+esc(c.label)+'</div><div class="vl" style="color:var(--mute)">—</div>'+
                 '<div class="sb">'+sub+'</div></div>';
        }
        sub = st.budget
          ? ('Mục tiêu <b>'+(isQty?fmtQty(st.budget):fmtUSD(st.budget))+'</b>')
          : 'Chưa có budget';
        return '<div class="kpi"><div class="lb">'+esc(c.label)+(isQty?' <span style="font-weight:600;color:var(--mute)">(số lượng)</span>':"")+'</div>'+
          '<div class="vl">'+val+'</div>'+
          '<div class="sb">'+sub+'</div>'+
          (pc!=null?pb(pc)+'<div class="pbl"><span style="color:'+pctColor(pc)+'">'+Math.round(pc*100)+'%</span><span>'+
            (st.actual>=st.budget?"đạt":"còn "+(isQty?fmtQty(st.budget-st.actual):fmtUSD(st.budget-st.actual)))+'</span></div>':"")+
          (c.note?'<div class="kpi-note">'+c.note+'</div>':"")+'</div>';
      }).join("")+
    '</div>'+
    '<div class="tbwrap"><table class="tb"><thead><tr><th>Nhà phân phối</th>'+
      turnoverSegments().map(function(sg){ return '<th class="num">'+esc(sg)+'</th>'; }).join("")+
      '<th class="num">Mục tiêu MMH</th><th class="num">Actual / Forecast</th><th class="num">Chênh lệch</th>'+
      '<th style="width:170px">% đạt</th></tr></thead><tbody>'+
    g.list.map(function(r){
      var p=r.budget?r.actual/r.budget:null;
      return '<tr><td><b>'+esc(r.name)+'</b>'+
        '<div style="font-size:11px;color:var(--mute)">PIC: '+esc(r.pic)+'</div></td>'+
        turnoverSegments().map(function(sg){
          var v=r.bySeg[sg]; return '<td class="num">'+(v&&v.actual?fmtUSD(v.actual):"—")+'</td>'; }).join("")+
        '<td class="num">'+(r.budget?fmtUSD(r.budget):"—")+'</td>'+
        '<td class="num"><b>'+fmtUSD(r.actual)+'</b></td>'+
        '<td class="num" style="color:'+(r.actual>=r.budget?"var(--ok)":"var(--dang)")+'">'+
          (r.budget?((r.actual>=r.budget?"+":"−")+fmtUSD(Math.abs(r.actual-r.budget))):"—")+'</td>'+
        '<td>'+(p==null?'<span style="color:var(--mute);font-size:12px">chưa có budget</span>'
          :pb(p)+'<div class="pbl"><span style="color:'+pctColor(p)+'">'+Math.round(p*100)+'%</span><span>'+
            (p>=1?"Đạt":p>=.9?"Gần đạt":"Chưa đạt")+'</span></div>')+'</td></tr>';
    }).join("")+
    '<tr style="background:var(--pale)"><td><b>TỔNG</b></td>'+
      turnoverSegments().map(function(sg){
        var t2=g.list.reduce(function(x,r){ return x+((r.bySeg[sg]&&r.bySeg[sg].actual)||0); },0);
        return '<td class="num"><b>'+(t2?fmtUSD(t2):"—")+'</b></td>'; }).join("")+
      '<td class="num"><b>'+fmtUSD(g.budget)+'</b></td><td class="num"><b>'+fmtUSD(g.actual)+'</b></td>'+
      '<td class="num"><b style="color:'+(g.actual>=g.budget?"var(--ok)":"var(--dang)")+'">'+
        (g.actual>=g.budget?"+":"−")+fmtUSD(Math.abs(g.actual-g.budget))+'</b></td>'+
      '<td>'+(pct==null?"—":pb(pct)+'<div class="pbl"><span style="color:'+pctColor(pct)+'">'+Math.round(pct*100)+'%</span><span></span></div>')+'</td></tr>'+
    '</tbody></table></div></div>';
}
function renderKPI(){
  var k=S.kpi, mgr=S.user.role==="manager";
  var qsel=S.kpiQ||"FY";
  var picSel=mgr?(S.kpiPic||""):S.user.pic;   /* sales chỉ xem chỉ tiêu của mình */
  turnoverAutoOn();

  /* ── PHẦN A ── */
  var partA='<div class="tbwrap"><table class="tb"><thead><tr>'+
    '<th style="width:32px">#</th><th>Mục tiêu chiến lược</th><th>Chỉ số</th><th class="num">Mục tiêu FY</th>'+
    '<th class="num">'+esc(k.prevFY)+'</th><th class="num">Chênh lệch</th><th class="num">Actual</th><th style="width:160px">% đạt</th></tr></thead><tbody>'+
    k.partA.map(function(a){
      var dv=S.targetDraft["A"+a.row];
      var v=dv!==undefined?dv.value:(a.target?fmtN(a.target):"");
      var inp=mgr?'<input class="inp num" style="height:32px;text-align:right" value="'+esc(v)+'" data-scope="A" data-row="'+a.row+'" oninput="tgIn(this)">':('<b>'+(a.target?fmtN(a.target):"—")+'</b>');
      /* ⭐ v5.6 — Actual lấy từ tổng 4 NPP bên file Turnover, NHƯNG chỉ khi ĐƠN VỊ KHỚP.
         File Turnover tính bằng USD; nếu dòng KPI khai đơn vị VND thì hai con số
         không so được với nhau (trước đây ghép vào ra 0% vô nghĩa) ⇒ giữ Actual
         gốc từ tab 3. SALE ORDER và ghi chú lý do. */
      var act=a.actual, pct=a.pct, live=false, mismatch=false;
      if(a.blockId==="amount"){
        var lv=turnoverDentalActual(picSel);
        var isUsd=/usd/i.test(String(a.unit||""));
        if(lv!=null && lv>0){
          if(isUsd){ act=(/kusd/i.test(String(a.unit||""))?lv/1000:lv); pct=a.target?act/a.target:null; live=true; }
          else mismatch=true;
        }
      }
      return '<tr><td class="ctr" style="color:var(--mute)">'+esc(a.no)+'</td><td><b>'+esc(a.objective)+'</b></td><td>'+esc(a.kpi)+' <span style="color:var(--mute)">('+esc(a.unit)+')</span></td>'+
        '<td class="num" style="width:130px">'+inp+'</td>'+
        '<td class="num">'+(a.prevActual?fmtN(a.prevActual):"—")+'</td>'+
        deltaCell(a.growth)+
        '<td class="num"><b>'+fmtN(act)+'</b>'+
          (mismatch?'<div class="unitnote" title="Doanh số nhà phân phối tính bằng USD, dòng này khai đơn vị '+esc(a.unit||"")+' nên không cộng gộp được. Số đang hiển thị lấy từ tab 3. SALE ORDER.">số từ tab SALE ORDER · đơn vị '+esc(a.unit||"—")+'</div>':"")+'</td>'+
        '<td>'+(pct==null?'<span style="color:var(--mute);font-size:12px">chưa đặt mục tiêu</span>':pb(pct)+'<div class="pbl"><span style="color:'+pctColor(pct)+'">'+Math.round(pct*100)+'%</span><span>'+(pct>=1?"Đạt":pct>=.8?"Gần đạt":"Chưa đạt")+'</span></div>')+'</td></tr>';
    }).join("")+'</tbody></table></div>';

  /* ── PHẦN B ── */
  var picList=[];
  (k.blocks||[]).forEach(function(b){ (b.rows||[]).forEach(function(r){ if(picList.indexOf(r.pic)<0) picList.push(r.pic); }); });
  distributorList().forEach(function(d){ if(d.pic&&picList.indexOf(d.pic)<0) picList.push(d.pic); });

  var blocks=(k.blocks||[]).filter(function(b){ return !KPI_HIDE[b.id]; }).map(function(b){
    var showD=!!KPI_DELTA[b.id];
    var rows0=(b.rows||[]).filter(function(r){ return !picSel||r.pic===picSel; });
    var qHead=k.quarters.map(function(q){ return '<th class="num">'+q.name+'</th>'; }).join("");
    var rows=rows0.map(function(r){
      var dv=S.targetDraft["B"+r.row];
      var v=dv!==undefined?dv.value:(r.targetMonth?fmtN(r.targetMonth):"");
      var inp=mgr?'<input class="inp" style="height:30px;text-align:right;font-size:12.5px" value="'+esc(v)+'" data-scope="B" data-row="'+r.row+'" oninput="tgIn(this)">':('<b>'+(r.targetMonth?fmtN(r.targetMonth):"—")+'</b>');
      var cells=(qsel==="FY")
        ? k.quarters.map(function(q,i){ var qq=r.q[i]; return '<td class="num" style="color:'+(qq.pct==null?"var(--mute)":pctColor(qq.pct))+'">'+fmtN(qq.actual)+(qq.target?'<span style="color:var(--mute);font-weight:400">/'+fmtN(qq.target)+'</span>':"")+'</td>'; }).join("")
        : r.monthly.map(function(m,i){ return '<td class="num'+((i%3===2)?'" style="border-right:1px solid var(--line)':'')+'">'+(m?fmtN(m):'<span style="color:#D5DDEC">·</span>')+'</td>'; }).join("");
      return '<tr><td><b>'+esc(r.pic)+'</b></td>'+(b.byType?'<td>'+esc(r.cat)+'</td>':"")+
        '<td class="num" style="width:96px">'+inp+'</td>'+
        '<td class="num" style="color:var(--sub)">'+(r.targetFY?fmtN(r.targetFY):"—")+'</td>'+
        cells+
        '<td class="num"><b>'+(b.id==="amount"?fmtVND(r.fyActual):fmtN(r.fyActual))+'</b></td>'+
        (showD?'<td class="num" style="color:var(--sub)">'+(r.prevActual?(b.id==="amount"?fmtVND(r.prevActual):fmtN(r.prevActual)):"—")+'</td>'+deltaCell(r.growth):"")+
        '<td style="width:120px">'+(r.pct==null?'<span style="color:var(--mute);font-size:11.5px">—</span>':pb(r.pct)+'<div class="pbl"><span style="color:'+pctColor(r.pct)+'">'+Math.round(r.pct*100)+'%</span><span>-'+fmtN(r.gap)+'</span></div>')+'</td></tr>';
    }).join("");

    var gA=rows0.reduce(function(s,r){return s+n(r.fyActual);},0);
    var gT=rows0.reduce(function(s,r){return s+n(r.targetFY);},0);
    var gP=rows0.reduce(function(s,r){return s+n(r.prevActual);},0);
    var gPct=gT?gA/gT:null;
    var gGrow=gP?((gA-gP)/gP):null;
    var gcells=(qsel==="FY")? k.quarters.map(function(q,i){
        var aa=rows0.reduce(function(s,r){return s+r.q[i].actual;},0);
        var tt=rows0.reduce(function(s,r){return s+r.q[i].target;},0);
        return '<td class="num"><b>'+fmtN(aa)+(tt?'<span style="font-weight:400;color:var(--sub)">/'+fmtN(tt)+'</span>':"")+'</b></td>'; }).join("")
      : k.monthLabels.map(function(_,i){
        var mm=rows0.reduce(function(s,r){return s+n(r.monthly[i]);},0);
        return '<td class="num'+((i%3===2)?'" style="border-right:1px solid var(--line)':'')+'"><b>'+(mm?fmtN(mm):"·")+'</b></td>'; }).join("");

    return '<div class="card pad" style="margin-bottom:12px">'+
      '<div class="ct"><span class="dot"></span>'+esc(b.title)+'<small>('+esc(b.unit)+')</small><span class="sp"></span>'+
        (showD&&gGrow!=null?'<span class="dlt '+(gGrow>0?"up":gGrow<0?"dn":"fl")+'" style="margin-right:9px">'+(gGrow>0?"▲ +":gGrow<0?"▼ ":"")+Math.round(gGrow*100)+'% vs '+esc(k.prevFY)+'</span>':"")+
        '<span class="tag '+(gPct==null?"t-n":gPct>=1?"t-g":gPct>=.8?"t-y":"t-r")+'">'+(gPct==null?"chưa đặt mục tiêu":Math.round(gPct*100)+"% FY")+'</span></div>'+
      (rows?('<div class="tbwrap" style="max-height:none"><table class="tb"><thead><tr><th>PIC</th>'+(b.byType?"<th>Loại KH</th>":"")+
        '<th class="num">TG/tháng</th><th class="num">TG FY</th>'+
        (qsel==="FY"?qHead:k.monthLabels.map(function(m){return '<th class="num">'+m+'</th>';}).join(""))+
        '<th class="num">FY Actual</th>'+(showD?'<th class="num">'+esc(k.prevFY)+'</th><th class="num">Chênh lệch</th>':"")+'<th>% đạt FY</th></tr></thead><tbody>'+rows+
        '<tr style="background:var(--pale)"><td'+(b.byType?' colspan="2"':"")+'><b>'+(picSel?"TỔNG "+esc(picSel):"TỔNG NHÓM")+'</b></td>'+
          '<td class="num">—</td><td class="num"><b>'+(gT?fmtN(gT):"—")+'</b></td>'+gcells+
          '<td class="num"><b>'+(b.id==="amount"?fmtVND(gA):fmtN(gA))+'</b></td>'+
          (showD?'<td class="num">'+(gP?(b.id==="amount"?fmtVND(gP):fmtN(gP)):"—")+'</td>'+deltaCell(gGrow):"")+
          '<td>'+(gPct==null?"—":pb(gPct)+'<div class="pbl"><span style="color:'+pctColor(gPct)+'">'+Math.round(gPct*100)+'%</span><span></span></div>')+'</td></tr>'+
        '</tbody></table></div>')
        :'<div class="empty" style="padding:20px 0"><p style="font-size:12.5px">Chưa có chỉ tiêu cho '+esc(picSel)+'</p></div>')+
      '</div>';
  }).join("");

  $("main").innerHTML='<div class="pg">'+
    '<div class="ph"><div><h2>KPI &amp; Mục tiêu '+esc(S.fy)+'</h2><p>Target nhập tại đây ghi thẳng vào tab "9. MỤC TIÊU &amp; KPI" · Actual tính tự động từ dữ liệu thực</p></div><div class="sp"></div>'+
      '<div class="chips"><div class="chip'+(qsel==="FY"?" on":"")+'" onclick="setKpiQ(\'FY\')">Theo quý</div>'+
      '<div class="chip'+(qsel==="M"?" on":"")+'" onclick="setKpiQ(\'M\')">Theo tháng</div></div></div>'+

    '<div class="card pad" style="margin-bottom:14px"><div class="ct"><span class="dot"></span>PHẦN A — Tổng mục tiêu MMH '+esc(curTeam().label)+'</div>'+partA+'</div>'+
    turnoverBlock(picSel)+

    '<div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:16px 4px 10px">'+
      '<div><div style="font-size:12.5px;font-weight:800;color:var(--navy);letter-spacing:.3px">PHẦN B — CHỈ TIÊU PHÂN BỔ THEO SALE</div>'+
      '<div style="font-size:11.5px;color:var(--mute);margin-top:2px">Chọn một sales để xem riêng chỉ tiêu của người đó</div></div></div>'+
    (mgr?'<div class="kpi-picbar"><div class="chip'+(picSel?"":" on")+'" onclick="setKpiPic(\'\')">Toàn nhóm</div>'+
      picList.map(function(p){ return '<div class="chip'+(picSel===p?" on":"")+'" onclick="setKpiPic(\''+esc(p)+'\')">'+esc(p)+'</div>'; }).join("")+'</div>':"")+
    blocks+
    (mgr?'<div class="savebar" id="kpiSaveBar" style="display:'+(kpiDirty()?"flex":"none")+'">'+
      '<span style="font-size:12.5px;font-weight:700;color:var(--amber)" id="kpiDirtyTxt">'+Object.keys(S.targetDraft||{}).length+' ô đang sửa — chưa lưu</span>'+
      '<div style="flex:1"></div>'+
      '<button class="btn" onclick="cancelTargets()">Huỷ thay đổi</button>'+
      '<button class="btn pri" onclick="saveTargets()">💾 Lưu mục tiêu vào Sheet</button></div>':"")+
  '</div>';
}
/* đổi chế độ xem KHÔNG làm mất ô đang sửa */
function setKpiQ(v){ S.kpiQ=v; renderKPI(); }
function setKpiPic(p){ S.kpiPic=p; renderKPI(); }
function tgIn(el){
  var scope=el.getAttribute("data-scope"), row=el.getAttribute("data-row");
  S.targetDraft[scope+row]={ row:+row, scope:scope, value:el.value.replace(/[^\d.\-]/g,"") };
  var bar=$("kpiSaveBar"); if(bar){ bar.style.display="flex"; }
  var t=$("kpiDirtyTxt"); if(t) t.textContent=Object.keys(S.targetDraft).length+" ô đang sửa — chưa lưu";
}
function cancelTargets(){ S.targetDraft={}; renderKPI(); toast("Đã bỏ thay đổi"); }
function saveTargets(){
  var items=Object.keys(S.targetDraft).map(function(k){ return S.targetDraft[k]; });
  if(!items.length) return;
  busy(true,"Đang lưu mục tiêu…");
  apiPost({action:"saveKpiTarget",items:items})
    .then(function(r){
      S.targetDraft={};
      return apiGet("kpi",{fy:S.fy}).then(function(j){
        busy(false); S.kpi=j; S.kpi._fy=S.fy; S.dash=null;
        toast(r.message||"Đã lưu mục tiêu","ok");
        if(S.tab==="kpi") renderKPI();
      });
    })
    .catch(function(e){ busy(false); toast(e.message,"err",5000); });
}

</script>

<script>
/* ═══════════════════════ KHÁCH HÀNG ═══════════════════════ */
function pgCustEnsure(){
  /* các chỉ số ADP / doanh số / visit cần 3 nguồn — nạp nền rồi vẽ lại danh sách */
  if(!tGet("adp"))   ensureTab("adp",{},  function(r,ready){ if(ready&&S.tab==="cust") renderCustList(); });
  if(!tGet("order")) ensureTab("order",{},function(r,ready){ if(ready&&S.tab==="cust") renderCustList(); });
  if(!S.cache.weekly) loadTerritoryAll(true).then(function(){ if(S.tab==="cust") renderCustList(); });
}
function pgCust(){
  pgCustEnsure();
  if(!S.custIndex.length){
    skeleton('<div class="ph"><div><h2>Khách hàng</h2><p>Đang tải danh sách…</p></div></div>'+skRows(8,true));
    loadCustomerIndex().then(function(){ if(S.tab==="cust") renderCust(); });
    return;
  }
  renderCust();
}
/* ⭐ v5.3 — GOM CHỈ SỐ CHO MÀN HÌNH KHÁCH HÀNG
   Với mỗi account, tính trong FY đang chọn:
     · thuộc nhóm ADP nào (A/B/C/D) và FY target
     · doanh số đã đạt (cộng từ tab 4. ORDER, không phải cột Actual gõ tay trong ADP)
     · số lượt viếng thăm đã ghi nhận
   Bộ nhớ đệm theo FY + số dòng nguồn nên đổi FY hoặc có dữ liệu mới là tính lại. */
var _cxCache=null,_cxKey="";
function custMetrics(){
  var wk=terrRows(), od=tGet("order")||[], adp=tGet("adp")||[];
  var key=[S.fy,wk.length,od.length,adp.length,(S.cache.weekly?S.cache.weekly.at:0)].join("|");
  if(_cxCache&&_cxKey===key) return _cxCache;
  var m={};
  function slot(name){
    var k=String(name||"").trim().toLowerCase(); if(!k) return null;
    if(!m[k]) m[k]={ abcd:"", target:0, adpActual:0, sales:0, visits:0, hasAdp:false, adpRow:0,
                     acts:0, aVisit:0, aTele:0, aMsg:0, aMail:0, aOther:0, lastAct:"" };
    return m[k];
  }
  adp.forEach(function(r){
    if(String(r.fy||"") && String(r.fy)!==S.fy) return;
    var o=slot(parseAcc(r.account).name); if(!o) return;
    o.hasAdp=true; o.adpRow=r._row||0;
    o.abcd=abcdKey(r.abcd)||o.abcd;
    o.target+=n(r.targetAmt); o.adpActual+=n(r.actualAmt);
  });
  var fym={}; fyMonths(S.fy).forEach(function(x){ fym[String(x)]=1; });
  od.forEach(function(r){
    if(!fym[String(r.month||"")]) return;
    var o=slot(r.name); if(!o) return;
    o.sales+=n(r.amount);
  });
  /* ⭐ v9 — Activities = TẤT CẢ hình thức làm việc, không chỉ Visiting:
     viếng thăm · gọi điện · nhắn tin/Zalo · email · hình thức khác. */
  wk.forEach(function(r){
    if(String(r.fy||"")!==S.fy) return;
    var o=slot(parseAcc(r.account).name); if(!o) return;
    var ta=noAcc(r.typeAction||"");
    if(ta.indexOf("visit")>=0){ o.aVisit++; }
    else if(ta.indexOf("tele")>=0||ta.indexOf("phone")>=0||ta.indexOf("goi")>=0){ o.aTele++; }
    else if(ta.indexOf("mail")>=0){ o.aMail++; }
    else if(ta.indexOf("mess")>=0||ta.indexOf("zalo")>=0||ta.indexOf("chat")>=0||ta.indexOf("sms")>=0){ o.aMsg++; }
    else { o.aOther++; }
    o.acts++;
    var d=String(r.start||"").slice(0,10); if(d>o.lastAct) o.lastAct=d;
    if(isVisiting(r)) o.visits++;
  });
  _cxCache=m; _cxKey=key; return m;
}
function custMetricOf(name){
  var m=custMetrics()[String(name||"").trim().toLowerCase()];
  return m||{ abcd:"", target:0, adpActual:0, sales:0, visits:0, hasAdp:false, adpRow:0,
              acts:0, aVisit:0, aTele:0, aMsg:0, aMail:0, aOther:0, lastAct:"" };
}
function custFiltered(){
  var f=S.filt, toks=skTokens(f.q||"");
  /* các bộ lọc dưới đây dựa vào ADP và lịch sử đi địa bàn — chưa nạp xong thì tạm bỏ qua,
     nếu không cả danh sách bị lọc sạch và người dùng tưởng mất dữ liệu */
  var hasAdpData=!!tGet("adp"), hasWkData=!!S.cache.weekly;
  var out=[];
  (S.custIndex||[]).forEach(function(c){
    if(f.pic && c.pic!==f.pic) return;
    if(f.type && c.type!==f.type) return;
    if(f.area && c.area!==f.area) return;
    var mx=custMetricOf(c.name);
    if(hasAdpData){
      if(f.abcd==="ADP"   && !mx.hasAdp) return;
      else if(f.abcd==="NOADP" && mx.hasAdp) return;
      else if(f.abcd && "ABCD".indexOf(f.abcd)>=0 && mx.abcd!==f.abcd) return;
    }
    if(hasWkData){
      if(f.visit==="none" && mx.visits>0) return;
      if(f.visit==="has"  && !mx.visits)  return;
    }
    var sc=skScore(c,toks); if(!sc) return;
    out.push({c:c,sc:sc,mx:mx});
  });
  if(f.sort==="sales")
    out.sort(function(x,y){ return (y.mx.sales||y.mx.adpActual)-(x.mx.sales||x.mx.adpActual); });
  else if(toks.length) out.sort(function(x,y){
    return y.sc-x.sc || String(x.c.name||"").localeCompare(String(y.c.name||""));
  });
  return { rows:out.map(function(x){return x.c;}), toks:toks };
}

/* ═══════════ ⭐ v5.1 — SMART SEARCH ═══════════
   Trước đây gõ vào ô tìm kiếm sẽ vẽ lại TOÀN BỘ trang, ô input bị tạo mới nên
   mất con trỏ — người dùng thấy chữ "bị gián đoạn" khi gõ nhanh.
   Nay: ô input KHÔNG bị đụng tới, chỉ phần danh sách bên dưới được vẽ lại.

   Thuật toán khớp:
     · bỏ dấu tiếng Việt   ("xanh pon"  → khớp "Bệnh Viện Đa Khoa Xanh Pôn")
     · tách nhiều từ khoá  ("pon ha noi" → phải khớp CẢ HAI, không cần liền nhau)
     · tìm cả mã, tên, tỉnh, khu vực, PIC, địa chỉ
     · xếp hạng: trùng mã > tên bắt đầu bằng từ khoá > khớp trong tên > khớp nơi khác */
function skTokens(q){
  return noAcc(q).split(/[\s,;]+/).filter(function(t){ return t.length>0; });
}
/* trả về điểm khớp; 0 = không khớp */
function skScore(fields, toks){
  if(!toks.length) return 1;
  var name=noAcc(fields.name||""), code=noAcc(fields.code||"");
  var hay=noAcc([fields.name,fields.code,fields.province,fields.area,fields.pic,
                 fields.type,fields.address,fields.note].filter(Boolean).join(" "));
  var total=0;
  for(var i=0;i<toks.length;i++){
    var t=toks[i], sc=0;
    if(code===t) sc=1000;
    else if(code.indexOf(t)===0) sc=700;
    else if(name.indexOf(t)===0) sc=500;
    else if(new RegExp("(^|\\s)"+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(name)) sc=400;
    else if(name.indexOf(t)>=0) sc=300;
    else if(hay.indexOf(t)>=0) sc=100;
    else return 0;                        /* thiếu 1 từ khoá ⇒ loại */
    /* khớp càng gần đầu tên càng đáng lên trên */
    if(sc>=300){ var at=name.indexOf(t); if(at>=0) sc+=Math.max(0,60-at); }
    total+=sc;
  }
  return total;
}
/* tô sáng phần khớp, không phá dấu tiếng Việt của chuỗi gốc */
function skHl(text,toks){
  var t=String(text||"");
  if(!toks||!toks.length) return esc(t);
  var flat=noAcc(t), marks=new Array(t.length).fill(0), found=false;
  toks.forEach(function(tok){
    var from=0,i;
    while((i=flat.indexOf(tok,from))>=0){
      for(var k=i;k<i+tok.length&&k<marks.length;k++) marks[k]=1;
      found=true; from=i+tok.length;
    }
  });
  if(!found) return esc(t);
  var out="",open=false;
  for(var i2=0;i2<t.length;i2++){
    if(marks[i2]&&!open){ out+="<mark>"; open=true; }
    if(!marks[i2]&&open){ out+="</mark>"; open=false; }
    out+=esc(t[i2]);
  }
  return out+(open?"</mark>":"");
}
/* giữ nguyên vị trí con trỏ khi buộc phải vẽ lại ô nhập */
function keepCaret(id,fn){
  var el=$(id), pos=el?el.selectionStart:null, had=(document.activeElement===el);
  fn();
  if(!had) return;
  var e2=$(id); if(!e2) return;
  try{ e2.focus(); if(pos!=null) e2.setSelectionRange(pos,pos); }catch(err){}
}
var _dbc;
/* ⭐ v5.1 — chỉ vẽ lại DANH SÁCH, ô tìm kiếm giữ nguyên ⇒ gõ không bị ngắt */
function debCust(){ clearTimeout(_dbc); _dbc=setTimeout(renderCustList,90); }

function openCust(code){

/* ⭐ v5 — sinh mã khách hàng kế tiếp.
   Đọc toàn bộ mã đang có, tách <chữ cái đầu><số>, lấy số lớn nhất của mỗi tiền tố + 1.
   Tiền tố mặc định suy từ Account type đang chọn (Clinic→CL, Hospital→HO, Dealer→DL…). */
function codeParts(code){
  var m=/^([A-Za-z]*)(\d+)$/.exec(String(code||"").trim());
  return m?{p:m[1].toUpperCase(),n:parseInt(m[2],10),w:m[2].length}:null;
}
function prefixForType(t){
  var k=noAcc(String(t||"")).replace(/[^a-z]/g,"");
  if(!k) return "";
  var pool={}, best="", bestN=0;
  (S.custIndex||[]).forEach(function(c){
    if(noAcc(String(c.type||"")).replace(/[^a-z]/g,"")!==k) return;
    var q=codeParts(c.code); if(!q) return;
    pool[q.p]=(pool[q.p]||0)+1;
  });
  for(var pf in pool) if(pool[pf]>bestN){ bestN=pool[pf]; best=pf; }
  return best;
}
function nextCustCode(type){
  var pf=prefixForType(type);
  if(!pf){                                    /* chưa có mã nào cho loại này ⇒ dùng mã phổ biến nhất */
    var cnt={}, b="", bn=0;
    (S.custIndex||[]).forEach(function(c){ var q=codeParts(c.code); if(q){ cnt[q.p]=(cnt[q.p]||0)+1; } });
    for(var k in cnt) if(cnt[k]>bn){ bn=cnt[k]; b=k; }
    pf=b;
  }
  if(!pf) return "";
  var mx=0, w=4;
  (S.custIndex||[]).forEach(function(c){
    var q=codeParts(c.code); if(!q||q.p!==pf) return;
    if(q.n>mx){ mx=q.n; w=q.w; }
  });
  return pf + ("0000000000"+(mx+1)).slice(-Math.max(w,String(mx+1).length));
}
function custCodeSuggest(){
  var t=$("f_type"), e=$("f_code"), h=$("f_codeHint");
  if(!t||!e) return;
  if(e.getAttribute("data-touched")==="1") return;   /* người dùng đã tự gõ ⇒ không ghi đè */
  var v=nextCustCode(t.value);
  if(v){ e.value=v; if(h) h.textContent="Mã kế tiếp tự đề xuất — sửa được nếu cần"; }
}

/* việc cần chạy sau khi một dialog phụ lưu xong và trả lại dialog cha */
var SUBDONE=null;
function subReturn(fn){ SUBDONE=fn; }
function runSubDone(d){ var f=SUBDONE; SUBDONE=null; if(f) setTimeout(function(){ try{ f(d); }catch(e){} },80); }

/* danh sách địa bàn PIC đang phụ trách (quản lý thì thấy tất cả) */
function myTerritories(){
  var mgr=(S.user&&S.user.role==="manager");
  var pool=(S.custIndex||[]).filter(function(c){ return mgr || !c.pic || picMatch(c.pic,S.user.pic); });
  return pool.length?pool:(S.custIndex||[]);
}
function terrItems(){
  return myTerritories().map(function(c){
    return { v:c.name, label:c.name,
      meta:[c.code,c.type,c.province,c.area,"PIC "+(c.pic||"—")].filter(Boolean).join(" · "), raw:c };
  });
}
/* số CBC lớn nhất đang có của một địa bàn */
function cbcMaxNo(code){
  var mx=0;
  function scan(list){ (list||[]).forEach(function(x){
    if(String(x.code||"")!==String(code)) return;
    var v=parseInt(String(x.cbcNo||"").replace(/\D/g,""),10); if(v>mx) mx=v; }); }
  scan(S.cbcRows); scan(S.detail&&S.detail.cbc); scan(S.acc&&S.acc.cbc);
  return mx;
}
function cbcSyncCode(){
  var code=$("b_code")?$("b_code").value:"";

  if($("b_cbcCode")) $("b_cbcCode").value=code?(code+"-PIC"+no):"";

/* ─────── ACCOUNT PICKER (dùng chung) ─────── */
function accountPickerOld(inputId,hiddenId,onPick){
  var el=$(inputId); if(!el) return;
  var box=document.createElement("div"); box.className="sres"; box.id=inputId+"_res";
  el.parentNode.appendChild(box);
  function close(){ box.classList.remove("on"); }
  el.addEventListener("input",function(){
    var q=el.value.trim().toLowerCase();
    if(q.length<2){ close(); return; }
    var pool=(S.user.role==="manager")?S.custIndex:S.custIndex.filter(function(c){return c.pic===S.user.pic;});
    var hit=pool.filter(function(c){ return (c.name+" "+c.code+" "+c.province).toLowerCase().indexOf(q)>=0; }).slice(0,40);
    if(!pool.length) hit=[];
    box.innerHTML=hit.length?hit.map(function(c,i){
      return '<div class="sitem" data-i="'+i+'"><b>'+esc(c.name)+'</b><span>'+esc(c.code)+' · '+esc(c.type)+' · '+esc(c.province)+' · '+esc(c.area)+' · PIC '+esc(c.pic)+'</span></div>'; }).join("")
      :'<div class="sitem" style="color:var(--mute)">Không tìm thấy — kiểm tra lại tên hoặc tạo account mới</div>';
    box.classList.add("on");
    Array.prototype.forEach.call(box.querySelectorAll("[data-i]"),function(node){
      node.onclick=function(){
        var c=hit[+node.getAttribute("data-i")];
        el.value=c.name;
        if($(hiddenId)) $(hiddenId).value=mkAcc(c);
        close(); if(onPick) onPick(c);
      };
    });
  });
  el.addEventListener("blur",function(){ setTimeout(close,180); });
}

<script>
/* ═══════════════════════ ⭐ v4 — CẬP NHẬT THÔNG TIN ĐỊA BÀN ═══════════════════════
   Viết lại hoàn toàn theo tham chiếu Surgical Field Report:
   · xem task theo Ngày / Tuần / Tháng / Quý / FY — mở app là thấy ngay
   · sửa task tại chỗ trong drawer (dirty-tracking), không phải mở form lại
   · 1 task Visiting = bắt buộc 1 ảnh, đúng 1 ảnh (đè hoặc xoá ảnh cũ)
   · ảnh lưu kèm GPS + địa chỉ nơi chụp
   · cột T (Next action) dùng đúng 4 lựa chọn của sheet
   · Task Result bắt buộc có CBC (người gặp); thiếu CBC ⇒ thêm Key stakeholder ngay

   · Ô Task Result do Code.gs điền CÔNG THỨC, tự tổng hợp cuối tuần

/* ⭐ v11 — danh sách tỉnh quá dài để bày thành chip; dùng ô tìm kiếm + danh sách
   cuộn dọc, bấm để thêm, bấm chip đã chọn để bỏ. Hợp cả điện thoại lẫn máy tính. */
function tbdProvSel(pfx){ S.tbdProv=S.tbdProv||{}; if(!S.tbdProv[pfx]) S.tbdProv[pfx]=[]; return S.tbdProv[pfx]; }
function tbdProvInit(pfx){ S.tbdProv=S.tbdProv||{}; S.tbdProv[pfx]=[]; tbdProvDraw(pfx); tbdProvFilter(pfx); }
function tbdProvDraw(pfx){
  var box=$(pfx+"_psel"); if(!box) return;
  var L=tbdProvSel(pfx);
  box.innerHTML = L.length
    ? L.map(function(p,i){ return '<div class="chip on" title="Bỏ chọn" onclick="tbdProvDel(\''+pfx+'\','+i+')">'+esc(p)+' ✕</div>'; }).join("")
    : '<span style="font-size:12px;color:var(--mute)">Chưa chọn tỉnh/thành nào</span>';
  tbdPrev(pfx);
}
function tbdProvFilter(pfx){
  var box=$(pfx+"_plist"); if(!box) return;
  var q=noAcc(String(($(pfx+"_pq")||{}).value||"").trim());
  var L=tbdProvSel(pfx), all=S.master.province||[], out=[];
  all.forEach(function(v,i){
    if(L.indexOf(v)>=0) return;
    if(q && noAcc(v).indexOf(q)<0) return;
    out.push('<div class="tbdli" onclick="tbdProvAdd(\''+pfx+'\','+i+')">'+esc(v)+'</div>');
  });
  box.innerHTML = out.length ? out.slice(0,60).join("")
    : '<div class="tbdli mute">'+(q?"Không có tỉnh/thành nào khớp":"Đã chọn hết danh sách")+'</div>';
}
function tbdProvAdd(pfx,i){
  var v=(S.master.province||[])[i]; if(!v) return;
  var L=tbdProvSel(pfx); if(L.indexOf(v)<0) L.push(v);
  var q=$(pfx+"_pq"); if(q){ q.value=""; q.focus(); }
  tbdProvDraw(pfx); tbdProvFilter(pfx);
}
function tbdProvDel(pfx,i){ tbdProvSel(pfx).splice(i,1); tbdProvDraw(pfx); tbdProvFilter(pfx); }
function tbdTog(el,pfx){ el.classList.toggle("on"); tbdPrev(pfx); }
function tbdSel(pfx,kind){
  if(kind==="p") return tbdProvSel(pfx).slice();
  var box=$(pfx+"_"+kind); if(!box) return [];
  return [].slice.call(box.querySelectorAll(".chip.on")).map(function(c){ return c.getAttribute("data-v"); });
}
function tbdPlanText(pfx){
  var p=tbdSel(pfx,"p"), note=String(($(pfx+"_note")||{}).value||"").trim(), L=[];
  if(p.length) L.push("Tỉnh/thành dự kiến: "+p.join(", "));
  if(note) L.push(note);
  return L.join("\n");
}
function tbdPrev(pfx){
  var b=$(pfx+"_prev"); if(!b) return;
  var t=tbdPlanText(pfx);
  b.textContent = t || "Chọn tỉnh/thành dự kiến — nội dung Plan sẽ hiện ở đây.";
}
/* ═══════════ ⭐ v11 — KẾT QUẢ CỦA DÒNG TBD DO APP TỰ TÍNH ═══════════
   Bản trước ghi một công thức COUNTIFS vào ô Task Result. Công thức đó luôn báo
   #ERROR! vì Google Sheet của MMH dùng locale có dấu phân cách tham số là ";",
   trong khi Apps Script chỉ ghi được công thức kiểu ",". Thay vì chống chế theo
   locale, app tự đếm rồi ghi THẲNG chuỗi text vào ô — hết phụ thuộc locale, lại
   lọc được theo Task Status (chỉ tính buổi đã Completed).
   Thứ tự hiển thị: phòng khám → bệnh viện → trường đại học → đại lý → NPP. */
var TBD_ORDER=["Clinic","Hospital","University","Dealer","Distributor"];
var TBD_EMPTY="Chưa ghi nhận hoạt động đi địa bàn nào hoàn thành trong tuần";
function tbdIsDone(st){ return /complet/i.test(String(st||"")); }
/* ⭐ v13 — đếm một lần cho mọi (PIC, tuần) thay vì quét toàn bộ dòng cho từng dòng TBD */
function tbdIndex(rows){
  var idx={};
  (rows||[]).forEach(function(r){
    if(isTbdAcc(r.account)) return;
    if(!tbdIsDone(r.status)) return;
    var d=String(r.start||"").slice(0,10); if(!d) return;
    var t=noAcc(parseAcc(r.account).type||r.type||""), hit="";
    for(var i=0;i<TBD_ORDER.length;i++) if(noAcc(TBD_ORDER[i])===t){ hit=TBD_ORDER[i]; break; }
    if(!hit) return;
    var mon=mondayOf(d);
    [String(r.pic||"")+"|"+mon, "*|"+mon].forEach(function(k){
      var e=idx[k]||(idx[k]={c:{},n:0}); e.c[hit]=(e.c[hit]||0)+1; e.n++;
    });
  });
  return idx;
}
function tbdCounts(rows,pic,startIso,idx){
  if(idx) return idx[(pic||"*")+"|"+mondayOf(startIso)]||{c:{},n:0};
  var from=mondayOf(startIso), to=addDays(from,6), c={}, n=0;
  (rows||[]).forEach(function(r){
    if(isTbdAcc(r.account)) return;                 /* không tự đếm chính mình */
    if(pic && String(r.pic||"")!==pic) return;
    var d=String(r.start||"").slice(0,10);
    if(!d||d<from||d>to) return;
    if(!tbdIsDone(r.status)) return;
    var t=noAcc(parseAcc(r.account).type||r.type||"");
    TBD_ORDER.forEach(function(k){ if(noAcc(k)===t){ c[k]=(c[k]||0)+1; n++; } });
  });
  return { c:c, n:n };
}
function tbdResultText(rows,pic,startIso,idx){
  var x=tbdCounts(rows,pic,startIso,idx);
  var parts=TBD_ORDER.filter(function(k){ return x.c[k]; })
    .map(function(k){ return x.c[k]+" "+tbdGroupVn(k).toLowerCase(); });
  return parts.length ? ("Đã tiếp cận "+parts.join(", ")) : TBD_EMPTY;
}
/* ⭐ v12 — Task Status của dòng TBD do hệ thống giữ, sales không phải tự đổi:
     chưa đi buổi nào            → Not Started
     đã đi ≥ 1 buổi (Completed)  → In Progress 25%
     từ thứ Năm của tuần đó      → In Progress 50%
     khi gửi báo cáo tuần        → Completed (chốt số liệu lần cuối) */
function tbdStatusFor(rows,pic,startIso,cur,finalize,idx){
  if(finalize) return stDone();
  if(/complet/i.test(String(cur||""))) return cur;      /* đã chốt thì giữ nguyên */
  if(!tbdCounts(rows,pic,startIso,idx).n) return stTodo();
  var pct = (todayISO() >= addDays(mondayOf(startIso),3)) ? 50 : 25;   /* thứ Hai + 3 = thứ Năm */
  return (stFind(/progress|đang/i,"In Progress")) + " " + pct + "%";
}
/* Ghi đè kết quả hiển thị của mọi dòng TBD đang có trong bộ nhớ — nhờ vậy
   danh sách, bản xem trước báo cáo và ô kết quả đều đúng ngay, kể cả khi ô trên
   sheet còn là #ERROR! của bản cũ chưa kịp đồng bộ. */
function tbdFixRows(rows){
  if(!rows||!rows.length) return rows;
  var any=false;
  for(var i=0;i<rows.length;i++) if(isTbdAcc(rows[i].account)){ any=true; break; }
  if(!any) return rows;
  var idx=tbdIndex(rows);
  rows.forEach(function(r){
    if(!isTbdAcc(r.account)) return;
    var st0=String(r.start||"").slice(0,10), pic0=String(r.pic||"");
    if(r._tbdRaw===undefined)   r._tbdRaw=String(r.result||"");   /* giá trị thật trên sheet */
    if(r._tbdRawSt===undefined) r._tbdRawSt=String(r.status||"");
    r.result=tbdResultText(rows,pic0,st0,idx);
    r.status=tbdStatusFor(rows,pic0,st0,r._tbdRawSt,false,idx);
  });
  return rows;
}
/* Đẩy kết quả đã tính lên Google Sheet cho các dòng TBD của tuần chứa dIso */
/* ⭐ v13 — bản cũ gọi fetchTab("weekly") (tải TOÀN BỘ tab 6 của FY) mỗi lần mở tuần mới và mỗi
   lần lưu task. Nay dùng dữ liệu địa bàn đã có trong máy nếu còn mới; chỉ tải khi sheet đã đổi. */
function tbdSrcRows(){
  var c=S.cache.weekly;
  if(c && c._k===terrKey() && c.fresh && !dataStale(c.at)) return Promise.resolve(c.rows);
  return loadTerritoryAll(true).then(function(){
    var c2=S.cache.weekly;
    return (S._terrOk && c2 && c2._k===terrKey()) ? c2.rows : null;
  });
}
function tbdSyncWeek(dIso,pic,finalize){
  return tbdSrcRows().then(function(all){
    if(!all) return false;
    var from=mondayOf(dIso), to=addDays(from,6), jobs=[], idx=tbdIndex(all);
    (all||[]).forEach(function(r){
      if(!isTbdAcc(r.account)) return;
      if(pic && String(r.pic||"")!==pic) return;
      var st=String(r.start||"").slice(0,10);
      if(!st||st<from||st>to) return;
      var want=tbdResultText(all,String(r.pic||""),st,idx);
      var curSt=String(r._tbdRawSt!==undefined?r._tbdRawSt:(r.status||""));
      var wantSt=tbdStatusFor(all,String(r.pic||""),st,curSt,finalize,idx);
      var now=String(r._tbdRaw!==undefined?r._tbdRaw:(r.result||""));   /* so với ô THẬT trên sheet */
      if(now.trim()===want && curSt===wantSt) return;
      r._tbdRaw=want; r._tbdRawSt=wantSt; r.result=want; r.status=wantSt;
      jobs.push(apiPost({action:"saveWeekly",data:{
        _row:r._row, account:r.account, pic:r.pic,
        start:r.start, finish:r.finish, result:want, status:wantSt }}));
    });
    if(!jobs.length) return false;
    return Promise.all(jobs).then(function(){
      if(TSTORE.weekly){ delete TSTORE.weekly; savTabs(); }     /* ⭐ v13 — chỉ bỏ bản tab 6, không xoá mọi tab */
      return true;
    });
  }).catch(function(){ return false; });
}
function tbdPickBad(pfx){
  if(!tbdSel(pfx,"p").length) return "Tỉnh/thành dự kiến";
  return "";
}
/* ⭐ v14 — MỖI TUẦN CHỈ MỘT DÒNG TBD CHO MỘT PIC.
   Trả về dòng TBD đã có của tuần chứa startIso (hoặc null). Backend cũng chặn y hệt,
   nhưng chặn ngay tại app thì sales biết trước khi bấm Lưu và được mở thẳng dòng cũ. */
function tbdExistingRow(startIso,pic,skipRow){
  var from=mondayOf(startIso||todayISO()), to=addDays(from,6);
  var key=noAcc(pic||"").replace(/\s+/g," ").trim();
  var hit=null;
  terrRows().forEach(function(r){
    if(hit||!isTbdAcc(r.account)) return;
    if(skipRow && r._row===skipRow) return;
    if(key && noAcc(r.pic||"").replace(/\s+/g," ").trim()!==key) return;
    var d=String(r.start||"").slice(0,10);
    if(!d||d<from||d>to) return;
    hit=r;
  });
  return hit;
}
function tbdDupMsg(r){
  var from=mondayOf(String(r.start||"").slice(0,10));
  return "Tuần "+fmtVN(from)+" – "+fmtVN(addDays(from,6))+" đã có một dòng kế hoạch đi địa bàn "+
         "chưa xác định account của "+(r.pic||"PIC này")+". Mỗi tuần chỉ tạo một dòng.";
}
function isTbdName(v){ return String(v||"").trim().toUpperCase()===TBD_NAME; }
function isTbdAcc(a){ return isTbdName(parseAcc(a).name); }
function isFieldType(t){
  var k=noAcc(t||"");
  return FIELD_ACC_TYPES.some(function(x){ return noAcc(x)===k; });
}
function nextMonday(iso){ return addDays(mondayOf(iso||todayISO()),7); }
function pickOpt(list,re,dflt){
  var a=(list||[]).filter(function(x){ return re.test(String(x)); });
  return a.length?a[0]:dflt;
}
function tbdProcess(){ return pickOpt(S.master.process,/t[ìi]m\s*hi[ểe]u/i,"TÌM HIỂU"); }
function tbdAction(){ return pickOpt(S.master.typeAction,/visiting/i,"Visiting"); }
function tbdTypeTask(cur){ return cur||pickOpt(S.master.typeTask,/^sale/i,(S.master.typeTask||[])[0]||""); }
/* dựng dữ liệu 1 dòng TBD trọn tuần — dùng chung cho form thủ công và hộp thoại gửi báo cáo */
function tbdRow(startIso,plan,prov,pic){
  var from=mondayOf(startIso||nextMonday(todayISO()));
  return { _row:0,
    account:[TBD_NAME,TBD_TYPE,prov||"",""].join("/"),
    start:from, finish:addDays(from,6), pic:pic||S.user.pic,
    typeTask:tbdTypeTask(""), typeAction:tbdAction(), process:tbdProcess(),
    product:"", plan:String(plan||""), result:"",
    status:stTodo(), feedback:"", nextAction:"", stopReason:"" };
}
var MEET_RE = /^Người gặp:[^\n]*/m;
var WD = ["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];

function weekRange(){
  if(!S.wkFrom){ S.wkFrom=mondayOf(todayISO()); S.wkTo=addDays(S.wkFrom,6); }
  return { from:S.wkFrom, to:S.wkTo };
}
function wdOf(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||"")); return m?WD[new Date(+m[1],+m[2]-1,+m[3]).getDay()]:""; }
function isVisiting(w){ return String(w.typeAction||"")==="Visiting"; }
function hasPhoto(w){ return !!((w.photos&&w.photos.length)||String(w.photo||"").trim()); }
function hasMeet(w){ return MEET_RE.test(String(w.result||"")); }
function tkFlag(w){ /* task thiếu dữ liệu bắt buộc */
  var miss=[];
  /* ⭐ v12 — dòng TBD không cần ảnh lẫn CBC; kết quả do hệ thống tự tổng hợp */
  if(isTbdAcc(w.account)) return miss;
  if(isVisiting(w)&&!hasPhoto(w)) miss.push("thiếu ảnh");
  if(!hasMeet(w)&&!/^MMH/i.test(parseAcc(w.account).name||"")) miss.push("thiếu CBC");
  if(String(w.nextAction||"")==="Dừng lại"&&!String(w.stopReason||"").trim()) miss.push("thiếu lý do dừng");
  return miss;
}

/* ───────── trang chính — ⭐ v4.1 TỐC ĐỘ ─────────
   Nguyên tắc: NẠP CẢ FY ĐÚNG MỘT LẦN rồi lọc hoàn toàn phía trình duyệt.
   Đổi Ngày/Tuần/Tháng/Quý, đổi PIC, đổi bộ lọc ⇒ 0 lần gọi mạng, hiện tức thì.
   Dữ liệu còn được ghi xuống localStorage nên mở lại app là thấy ngay. */
function terrScopePic(){ return (S.user && S.user.role === "manager") ? "" : (S.user ? S.user.pic : ""); }
function terrKey(){ return "TERR|" + S.fy + "|" + terrScopePic(); }
function terrLsKey(){ return ckey("terr:" + S.fy + ":" + (terrScopePic() || "ALL")); }   /* ⭐ v13 — gắn theo nhóm */
function fyRange(){
  var ms = fyMonths(S.fy), a = ms[0], b = ms[11];
  var y = +b.slice(0,4), m = +b.slice(4,6), ld = new Date(y, m, 0).getDate();
  return { from: a.slice(0,4)+"-"+a.slice(4,6)+"-01", to: y+"-"+("0"+m).slice(-2)+"-"+("0"+ld).slice(-2) };
}
function terrSave(rows){
  if(!KV.ok && (rows||[]).length>3000) return;
  kvSet(terrLsKey(),{at:Date.now(),rows:rows||[]});
}
function terrLoadLs(){
  var v=kvGet(terrLsKey());
  return (v&&v.rows&&v.rows.length)?v:null;
}
/* ⭐ v5.5 — hai "sheet tab" trong màn hình Cập nhật:
     · Thông tin địa bàn — toàn bộ chức năng cũ
     · Công việc khác    — Other task, ghi vào file Sales & Marketing */
function wkTabBar(){

}
function setWkTab(t){
  S.wkTab=t;
  try{ localStorage.setItem("mmh_wktab",t); }catch(e){}
  pgWeekly();
}
function pgWeekly(){
  if(S.wkTab==="other") return pgOther();
  var k = terrKey();
  if(S.cache.weekly && S.cache.weekly._k === k){
    renderTerritory();
    afterGate(function(){ if(S.cache.weekly && dataStale(S.cache.weekly.at)) loadTerritoryAll(true); });
    return;
  }
  var ls = terrLoadLs();
  if(ls){                                   /* có bản lưu ⇒ vẽ ngay, chỉ làm mới khi sheet đã đổi */
    S.cache.weekly = { rows:ls.rows, _k:k, at:ls.at }; S.visits=S.cache.weekly;
    renderTerritory();
    afterGate(function(){ if(S.cache.weekly && dataStale(S.cache.weekly.at)) loadTerritoryAll(true); });
    ensureCbc(); return;
  }
  var r = vRangeCalc();
  skeleton('<div class="ph"><div><h2>Cập nhật thông tin địa bàn</h2><p>'+esc(r.label)+' · đang nạp dữ liệu '+esc(S.fy)+'…</p></div></div>'
    +'<div class="grid g4" style="margin-bottom:12px">'+[0,1,2,3].map(function(){return '<div class="card pad"><div class="sk" style="width:54%;margin-bottom:10px"></div><div class="sk b" style="width:40%"></div></div>';}).join("")+'</div>'
    +skRows(6));
  loadTerritoryAll(false);
}
/* nạp 1 lần cho cả năm tài chính — mọi thao tác sau đó đều offline */
function loadTerritoryAll(silent){
  if(S._terrLoading) return S._terrLoading;
  var k = terrKey(), fr = fyRange(), t0 = Date.now();
  var vq = { pic: terrScopePic(), from: fr.from, to: fr.to };
  if(!(S.cache.weekly && S.cache.weekly._k===k && (S.cache.weekly.rows||[]).length)) cvDrop("visitFeed",vq);
  S._terrLoading = apiGet("visitFeed",vq)
    .then(function(x){
      S._terrLoading = null; S._terrOk = true;
      /* ⭐ v14 — sheet chưa đổi ⇒ giữ nguyên dữ liệu đang xem, không vẽ lại, không nhấp nháy */
      if(x && x.unchanged && S.cache.weekly && S.cache.weekly._k===k){
        S.cache.weekly.at=Date.now(); S.cache.weekly.fresh=true;
        return S.cache.weekly.rows;
      }
      /* ⭐ v14 — backend không gửi mảng photos nữa (mỗi dòng nhẹ đi ~200 byte); dựng lại ở máy */
      (x.rows||[]).forEach(function(r){ r.photos=photoObjsOf(r.photo); });
      S.cache.weekly = { rows: x.rows||[], _k:k, at:Date.now(), fresh:true };
      S.visits = S.cache.weekly;
      terrSave(S.cache.weekly.rows);
      _lvMap=null;
      if(S.tab==="weekly"||S.tab==="meet") softRepaint();
      /* vừa lưu task trong lúc request này đang chạy ⇒ nạp lại lần nữa cho chắc có dòng mới */
      if((S._terrDirtyAt||0)>t0) setTimeout(function(){ loadTerritoryAll(true); },300);
      if(!S.custIndex.length) loadCustomerIndex();
      ensureCbc();
      return S.cache.weekly.rows;
    })
    .catch(function(e){
      S._terrLoading = null; S._terrOk = false;
      if(silent) return [];
      $("main").innerHTML='<div class="pg"><div class="card pad"><b style="color:#A82F2C">Lỗi:</b> '+esc(e.message)
        +'<div style="margin-top:10px"><button class="btn sm" onclick="pgWeekly()">Thử lại</button></div></div></div>';
      return [];
    });
  return S._terrLoading;
}
/* sau khi ghi dữ liệu: vẽ lại ngay từ bộ nhớ, đồng bộ ngầm với Sheet */
function terrRefresh(){
  if(S.cache.weekly) S.cache.weekly.at = 0;
  if(S.tab==="weekly") renderTerritory();
  else if(S.tab==="meet" && typeof mtRepaint==="function") mtRepaint();   /* ⭐ v18 — đang họp thì ở lại trang Họp tuần */
  else go("weekly");
  loadTerritoryAll(true);
}
/* ⭐ v11 — mở tab Đi địa bàn là chốt luôn kết quả các dòng TBD của tuần đang xem,
   để ô trên Google Sheet không bị bỏ rỗng nếu sales chưa lưu thêm gì. */
function tbdAutoSync(){
  var d=S.wkFrom||S.vAnchor||todayISO(), pic=isMgmt()?"":scopePic();
  var k=mondayOf(d)+"|"+pic;
  S._tbdAuto=S._tbdAuto||{};
  if(S._tbdAuto[k]) return;
  S._tbdAuto[k]=1;
  /* ⭐ v13 — đợi dữ liệu mở app ổn định rồi mới chốt, không tranh request với lúc khởi động */
  afterGate(function(){ setTimeout(function(){ tbdSyncWeek(d,pic); },1500); });
}
function terrRows(){ return ((S.cache.weekly||{}).rows)||[]; }
/* ⭐ v14 — dựng danh sách ảnh từ ô "Photo link (Drive)" ngay tại máy
   (trước đây backend gửi kèm 4 đường dẫn dài cho mỗi dòng, dù mỗi task chỉ 1 ảnh) */
function driveIdOf(u){ var m=/[-\w]{25,}/.exec(String(u||"")); return m?m[0]:""; }
function photoObjsOf(cellVal){
  var raw=String(cellVal==null?"":cellVal).trim();
  if(!raw) return [];
  return raw.split(/[\s,;\n]+/).filter(function(x){ return /^https?:/.test(x); }).map(function(u){
    var id=driveIdOf(u);
    return { id:id,
      thumb: id?("https://drive.google.com/thumbnail?id="+id+"&sz=w400"):u,
      full : id?("https://drive.google.com/thumbnail?id="+id+"&sz=w1600"):u,
      open : u };
  });
}

function terrInRange(w, r){
  var a=String(w.start).slice(0,10), b=String(w.finish||"").slice(0,10)||a;
  if(!a) a=b; if(!b) b=a;
  return !(b < r.from || a > r.to);
}

var _stkIdx=null,_stkSrc=null,_stkLen=-1;
function stakeIdxReset(){ _stkSrc=null; }
function ensureCbc(){
  if(S._cbcLoading||S.cbcRows) return;
  S._cbcLoading=true;
  ensureTab("cbc",{fy:"",pic:"",limit:8000},function(rows,ready){
    if(rows){ S.cbcRows=rows; S._cbcLoading=false; }

  });

/* ⭐ v6.1 — BUỘC nạp lại danh bạ CBC từ Google Sheet.
   ensureCbc() dùng ensureTab(), mà ensureTab thấy cache còn hạn 4 phút thì trả luôn
   bản cũ và KHÔNG gọi máy chủ — nên sau khi đồng bộ khách event, app vẫn hiện 0 người.
   Hàm này xoá cache rồi tải thẳng, có callback để biết lúc nào xong. */
function reloadCbc(done){
  S._cbcLoading=true;
  delete TSTORE["cbc"];
  delete FETCHING["cbc"];
  _stCache=null;
  fetchTab("cbc",{fy:"",pic:"",limit:8000},function(rows,ready,err){
    if(!ready) return;
    S._cbcLoading=false;
    if(rows) S.cbcRows=rows;
    _stCache=null;
    if(done) done(rows||[],err||null);
  });
}
/* ⭐ v7.2 — so khớp tên địa bàn BỎ DẤU và chuẩn hoá khoảng trắng.
   Trước đây so chuỗi thô nên chỉ cần lệch một dấu cách hoặc khác dấu tiếng Việt
   là mất người liên hệ — BV có 2 bác sĩ mà picker chỉ hiện 1. */
function accKeyOf(v){ return noAcc(v).replace(/\s+/g," ").trim(); }
function stakeOf(accName){
  var key=accKeyOf(accName);
  if(!key) return [];
  var src=S.cbcRows||[];
  if(_stkSrc!==src || _stkLen!==src.length){
    _stkIdx={};
    src.forEach(function(c){
      if(!String(c.contact||"").trim()) return;
      var k=accKeyOf(c.name); (_stkIdx[k]=_stkIdx[k]||[]).push(c);
    });
    _stkSrc=src; _stkLen=src.length;
  }
  return (_stkIdx[key]||[]).slice();
}

var _lvMap=null,_lvStamp="";
function lastVisitMap(){
  var st=(S.cache.weekly?(S.cache.weekly._k+"|"+S.cache.weekly.at+"|"+terrRows().length):"0");
  if(_lvMap&&_lvStamp===st) return _lvMap;
  var m={};
  terrRows().forEach(function(w){
    var k=String(parseAcc(w.account).name||"").trim().toLowerCase(); if(!k) return;
    var d=String(w.start).slice(0,10); if(!d) return;
    if(!m[k]||d>m[k].date) m[k]={date:d,pic:w.pic||"",action:w.typeAction||"",row:w._row};
  });
  _lvMap=m; _lvStamp=st; return m;
}
function lastVisitOf(accName){
  var key=String(accName||"").trim().toLowerCase(); if(!key) return null;
  return lastVisitMap()[key]||null;
}

var WK_PAGE=60;
var _hayWM=(typeof WeakMap!=="undefined")?new WeakMap():null;
function wkHay(w){
  var h=_hayWM?_hayWM.get(w):undefined;
  if(h!==undefined) return h;
  h=noAcc([w.account,w.result,w.plan,w.typeTask,w.nextAction,w.pic,w.product,w.process].filter(Boolean).join(" "));
  if(_hayWM) _hayWM.set(w,h);
  return h;
}
function wkDaysHtml(days,byDay,today,total){
  var limit=S.wkLimit||WK_PAGE, shown=0, out="";
  for(var i=0;i<days.length && shown<limit;i++){
    var d=days[i], list=byDay[d], take=list.slice(0,limit-shown);
    shown+=take.length;
    out+='<div class="daysec"><div class="dayhd'+(d===today?" today":"")+'">'+
      '<span class="dt">'+fmtVN(d)+'</span><span class="wd">'+esc(wdOf(d))+(d===today?" · HÔM NAY":"")+'</span>'+
      '<span class="tag t-b">'+list.length+' task</span><span class="ln"></span></div>'+
      '<div class="tkgrid">'+take.map(taskCard).join("")+'</div></div>';
  }
  if(total>shown) out+='<div class="wkmore"><button class="btn sm" onclick="wkMore()">Xem thêm '+Math.min(WK_PAGE,total-shown)+' task · còn '+(total-shown)+'</button></div>';
  return out;
}

function tkReqSync(){
  var res=curV("tk-result","result"), st=curV("tk-status","status");
  var hasCbc=MEET_RE.test(String(res||"")), isDone=/complet/i.test(String(st||""));
  ["tk-next-rq","tk-fb-rq"].forEach(function(id){ var e=$(id); if(e) e.style.display=hasCbc?"":"none"; });
  var rq=$("tk-result-rq"); if(rq) rq.style.display=isDone?"":"none";
  var s=$("tk-status");
  if(s && !S.tkStatusManual && !isDone){
    var w=S.task||{}, ta=curV("tk-ta","typeAction");
    var photoOk=(ta!=="Visiting")||!!S.pending||((w.photos||[]).length>0);
    if(hasCbc && photoOk && String(curV("tk-next","nextAction")).trim()){
      var want=stDone();
      if(want && stHas(want)){ s.value=want; S.dirty.status=want;
        var b=$("tk-save"); if(b) b.classList.add("acc"); }
    }
  }
}

function markDirty(field,val){
  S.dirty[field]=val;
  if(field==="status") S.tkStatusManual=1;      /* ⭐ v8.1 — người dùng tự chọn thì không tự đổi nữa */
  var b=$("tk-save"); if(b) b.classList.add("acc");
  var el=$({status:"tk-status",nextAction:"tk-next",typeTask:"tk-tt",typeAction:"tk-ta",result:"tk-result",stopReason:"tk-stop"}[field]||"");
  if(el&&String(val||"").trim()) el.classList.remove("bad");
  if(field==="nextAction"){
    var sec=$("tk-stop-sec"); if(sec) sec.style.display=(val==="Dừng lại")?"":"none";
    if(val==="Dừng lại"&&$("tk-stop")) $("tk-stop").focus();
  }
  if(field==="result"){
    var f=$("tk-meetflag"); if(f){
      var has=!!String(val||"").trim(), ok=MEET_RE.test(val||"");
      f.style.color=!has?"var(--mute)":(ok?"var(--ok)":"var(--dang)");
      f.textContent=!has?"Để trống nếu mới lên kế hoạch — ghi kết quả sau khi đi"
                   :(ok?"✓ Đã ghi CBC (người gặp)":"⚠️ Đã có nội dung thì bắt buộc dòng “Người gặp:” — bấm nút CBC ở trên");
    }
  }
  if(field==="result"||field==="status"||field==="nextAction"||field==="typeAction") tkReqSync();
  if(field==="typeAction") renderPending();
}
function curV(id,field){ if(field in S.dirty) return S.dirty[field]; var el=$(id); return el?el.value:""; }
function pullPlanToResult(){
  var p=$("tk-plan"), r=$("tk-result"); if(!p||!r) return;
  var m=MEET_RE.exec(p.value||"");
  if(!m) return toast("Plan chưa có dòng “Người gặp:”","warn");
  r.value=m[0].trim()+"\n"+String(r.value||"").replace(MEET_RE,"").replace(/^\n+/,"");
  markDirty("result",r.value); toast("Đã chèn người gặp vào kết quả","ok");
}

/* ⭐ v4.7 — chèn dòng "Người gặp:" vào đúng ô đang soạn.
   Picker nằm ở lớp 2 nên form nhập vẫn còn nguyên trong DOM ⇒ ghi thẳng vào
   textarea thật. Có kiểm tra lại sau khi ghi; nếu vì lý do nào đó vẫn trống thì
   ghi lại lần 2 và báo rõ cho người dùng thay vì báo thành công giả. */
function insertMeetLine(line){
  var id=S._meetTarget||"tk-result";
  closeModal2();                                  /* chỉ đóng picker — KHÔNG đụng form */
  var ta=$(id) || $("nt_result") || $("tk-result");
  if(!ta){ toast("Không tìm thấy ô Task Result để chèn","warn",5000); return; }
  var rid=ta.id;
  function put(){
    var cur=String(ta.value||"");
    ta.value=line+"\n"+cur.replace(MEET_RE,"").replace(/^\n+/,"");
    try{ ta.dispatchEvent(new Event("input",{bubbles:true})); }catch(e){}
    if(rid==="tk-plan") markDirty("plan",ta.value);
    else if(rid==="tk-result") markDirty("result",ta.value);
    if(typeof ntMeetFlag==="function") ntMeetFlag();
  }
  put();
  try{
    ta.focus();
    ta.setSelectionRange(ta.value.length,ta.value.length);
    ta.scrollIntoView({block:"center",behavior:"smooth"});
  }catch(e){}
  setTimeout(function(){                          /* xác nhận thật sự đã vào ô */
    var el=$(rid);
    if(el&&MEET_RE.test(el.value||"")){ toast("✓ Đã chèn: "+line,"ok",3800); return; }
    if(el){ ta=el; put(); }
    var el2=$(rid);
    if(el2&&MEET_RE.test(el2.value||"")) toast("✓ Đã chèn: "+line,"ok",3800);
    else toast("⚠️ Chưa chèn được — copy dòng này dán vào Task Result: "+line,"warn",9000);
  },80);
}
