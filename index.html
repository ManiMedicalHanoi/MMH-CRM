/* ═══════════ ⭐ v10 — CỔNG KIỂM TRA KẾ HOẠCH ĐI ĐỊA BÀN TUẦN MỚI ═══════════ */
function tbdNextWeek(){ var f=addDays(S.rpFrom,7); return { from:f, to:addDays(f,6) }; }
/* đếm các dòng đi địa bàn THẬT của tuần sau (Hospital · Clinic · Dealer · University · Distributor) */
function tbdPlanCount(rows,who){
  var w=tbdNextWeek();
  return (rows||[]).filter(function(r){
    if(who && String(r.pic||"")!==who) return false;
    var a=String(r.start||"").slice(0,10), b=String(r.finish||"").slice(0,10)||a;
    if(!a) return false;
    if(!(a<=w.to && b>=w.from)) return false;
    return isFieldType(parseAcc(r.account).type||r.type||"");
  }).length;
}
function tbdGate(option,who){
  busy(true,"Đang kiểm tra kế hoạch tuần mới…");
  fetchTab("weekly").then(function(rows){
    busy(false);
    if(tbdPlanCount(rows,isMgmt()?"":who)>0){ S._tbdOk=S.rpFrom+"|"+who; return sendReport(option,true); }
    tbdGateDialog(option,who);
  }).catch(function(){ busy(false); S._tbdOk=S.rpFrom+"|"+who; sendReport(option,true); });
}
function tbdGateDialog(option,who){
  var w=tbdNextWeek();
  var h='<div class="card pad" style="background:#FFFBF1;border-color:#F3D69B;margin-bottom:12px">'
   +'<div style="font-size:14.5px;font-weight:800;color:#8A5A00;margin-bottom:6px">Bạn chưa thêm kế hoạch đi địa bàn cho tuần mới</div>'
   +'<div style="font-size:13px;color:var(--sub);line-height:1.65">Tuần <b>'+fmtVN(w.from)+' – '+fmtVN(w.to)+'</b> chưa có dòng nào thuộc '
   +'Hospital · Clinic · Dealer · University · Distributor.<br><br>'
   +'Nếu <b>đã có kế hoạch</b>, vui lòng quay lại để thêm kế hoạch.<br>'
   +'Nếu <b>chưa xác định</b>, hãy chọn <b>TBD</b> — vẫn cần ghi rõ dự tính tiếp cận nhóm khách hàng nào.</div></div>';
  openModal("Kiểm tra kế hoạch tuần mới",h,
    '<button class="btn" onclick="closeModal();go(\'weekly\')">Quay lại thêm kế hoạch</button>'+
    '<button class="btn pri" onclick="tbdForm(\''+esc(option)+'\',\''+esc(who)+'\')">Chưa xác định — chọn TBD</button>', true);
}
function tbdForm(option,who){
  var w=tbdNextWeek();
  var h='<div class="card pad" style="margin-bottom:12px;background:var(--pale);border-color:var(--lb1)">'
   +'<div style="font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:4px">Kế hoạch đi địa bàn — chưa xác định account</div>'
   +'<div style="font-size:12.5px;color:var(--sub);line-height:1.6">Hệ thống tạo một dòng Account <b>TBD</b> cho tuần <b>'
   +fmtVN(w.from)+' – '+fmtVN(w.to)+'</b>. Cuối tuần, ô kết quả tự tổng hợp các account bạn thực sự đi.</div></div>'
   +'<div class="fld"><label>Tỉnh/thành dự kiến</label><select class="inp" id="tb_prov" onchange="tbdFormProv()">'
     +opts(S.master.province,"","— không bắt buộc —")+'</select></div>'
   +'<div class="fld"><label>Plan — dự tính tiếp cận nhóm khách hàng nào <span class="rq">*</span></label>'
     +'<textarea class="inp" id="tb_plan" style="min-height:130px" placeholder="'+phAttr(TBD_PLAN_PH)+'"></textarea>'
     +'<div class="hint">Ví dụ: khảo sát nhóm phòng khám răng hàm mặt khu vực Cầu Giấy, tiếp cận 1–2 bệnh viện tuyến tỉnh.</div></div>';
  openModal("Tạo kế hoạch TBD cho tuần mới",h,
    '<button class="btn" onclick="closeModal();go(\'weekly\')">Quay lại thêm kế hoạch</button>'+
    '<button class="btn pri" onclick="tbdFormGo(\''+esc(option)+'\',\''+esc(who)+'\')">Tạo kế hoạch & gửi báo cáo</button>', true);
}
function tbdFormProv(){
  var sel=$("tb_prov"), t=$("tb_plan"); if(!sel||!t||!sel.value) return;
  var line="Khu vực dự kiến: "+sel.value, v=String(t.value||"");
  t.value = /Khu vực dự kiến:/.test(v) ? v.replace(/Khu vực dự kiến:[^\n]*/,line)
          : (v.trim()? v.replace(/\s+$/,"")+"\n"+line : line);
}
function tbdFormGo(option,who){
  var plan=String(($("tb_plan")||{}).value||"").trim();
  if(!plan) return toast("⚠️ Bắt buộc ghi Plan — dự tính tiếp cận nhóm khách hàng nào","warn",6000);
  var w=tbdNextWeek();
  var t=tbdRow(w.from, plan, ($("tb_prov")||{}).value||"", who||S.user.pic);
  busy(true,"Đang tạo kế hoạch TBD…");
  apiPost({action:"saveWeekly",data:t}).then(function(r){
    busy(false); closeModal();
    afterWrite("weekly", r.row||0, t);
    S._tbdOk=S.rpFrom+"|"+who;
    toast("✓ Đã tạo kế hoạch đi địa bàn tuần "+fmtVN(t.start)+" – "+fmtVN(t.finish),"ok",4600);
    sendReport(option,true);
  }).catch(function(e){ busy(false); toast(e.message,"err",6000); });
}

function sendReport(option,confirmed){
  var kind=S.rpKind, who=(S.rpPic||S.user.pic);
  var labels={self:"gửi thử cho chính bạn",team:"gửi chính thức tới team",pic:"gửi thay cho "+who,all:"gửi cho toàn bộ "+curTeam().label+" team",download:"tải PDF"};
  if(!confirmed) return askSend(option);
  /* ⭐ v8.1 — báo cáo tuần PHẢI kèm Other task. Chưa nạp xong mà bấm gửi thì payload
     "other" rỗng ⇒ email thiếu hẳn phần Công việc khác. Nạp xong rồi mới gửi. */
  if(kind==="week" && !S.other){
    busy(true,"Đang nạp Công việc khác…");
    return loadOther(true).then(function(){ busy(false); sendReport(option,true); })
      .catch(function(e){ busy(false); toast("Không nạp được Other task: "+e.message,"err",6500); });
  }
  /* ⭐ v10 — chưa có kế hoạch đi địa bàn tuần sau thì hỏi trước khi gửi */
  if(kind==="week" && option!=="download" && S._tbdOk!==(S.rpFrom+"|"+who))
    return tbdGate(option,who);
  busy(true, option==="download"?"Đang tạo PDF…":"Đang gửi email + tạo PDF đính kèm…");
  var send;
  if(kind==="week"){
    /* ⭐ v9 — Other task LUÔN đi bằng POST body.
       Trước đây apiPost() chỉ chuyển sang POST khi URL dài quá 6500 ký tự; payload
       ngắn thì đi bằng JSONP (GET) và nhánh doGet của Code.gs không đọc tham số
       "other" ⇒ email gửi đi mất hẳn mục Công việc khác dù bản xem trước vẫn hiện.
       Nay ép đúng một đường truyền; Code.gs v6.8 đọc tham số "other" và dựng
       mục ② / ④ Other tasks cho cả email lẫn PDF. */
    var op=rpOtherPayload(), cnt=0;
    Object.keys(op).forEach(function(k){
      (op[k].cur||[]).forEach(function(g){ cnt+=1+((g.subs||[]).length); }); });
    S._rpLastOther=cnt;
    send=postBody({ action:"weeklyReport", from:S.rpFrom, to:S.rpTo, option:option, toPic:who,
      other:JSON.stringify(op), otherCount:String(cnt) });
  } else {
    send=apiPost({ action:"monthlyReport", month:S.rpMonth, option:option, toPic:who });
  }
  send.then(function(r){
    busy(false);
    if(r.download&&r.files){ r.files.forEach(function(f){ dlB64(f.b64,f.name); }); toast(r.message||"Đã tạo PDF","ok",4200); return; }
    if(r.opaque){ toast("Đã gửi yêu cầu tới máy chủ (kèm "+(S._rpLastOther||0)+" mục Công việc khác). Kiểm tra hộp thư trong ~1 phút.","ok",5500); return; }
    toast(r.message||"Đã gửi báo cáo","ok",5000);
    /* backend bản mới trả về otherCount — bản cũ thì không, báo ngay cho người gửi biết */
    if(kind==="week" && S._rpLastOther>0 && r.otherCount==null)
      toast("⚠️ Đã gửi kèm "+S._rpLastOther+" mục Công việc khác nhưng Code.gs chưa xác nhận. "+
            "Nếu email thiếu mục ③ Other tasks, cần cập nhật Code.gs (xem hướng dẫn trong trang Gửi báo cáo).","warn",11000);
  }).catch(function(e){ busy(false); toast(e.message,"err",6500); });
}
function dlB64(b64,name){
  var bin=atob(b64), len=bin.length, arr=new Uint8Array(len);
  for(var i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  var url=URL.createObjectURL(new Blob([arr],{type:"application/pdf"}));
  var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1200);
}

</script>

<script>

/* ═══════════════════════════════════════════════════════════════════
   ⭐ v2 — BIỂU ĐỒ SVG (thay Chart.js)
   Bỏ hẳn CDN 210KB ⇒ app mở nhanh hơn hẳn, không phụ thuộc mạng ngoài.
   ═══════════════════════════════════════════════════════════════════ */
var PAL2=["#3A5CAA","#5B8DD9","#1E9E5A","#E8A302","#B44FA6","#0E9AA7","#D9433F","#7A6BC4","#8FBF4D","#C77DFF","#E07B39","#4B7A8C"];
function palAt(i){ return PAL2[i%PAL2.length]; }

/* Donut + chú giải */
function svgDonut(entries,center,sub,fmt){
  var list=(entries||[]).filter(function(e){return n(e[1])>0;});
  var total=list.reduce(function(a,e){return a+n(e[1]);},0);
  if(!total) return '<div class="empty" style="padding:24px 0"><p style="font-size:12.5px">Chưa có dữ liệu</p></div>';
  var R=54,SW=22,C=2*Math.PI*R,off=0,GAP=list.length>1?3:0;
  var segs=list.map(function(e,i){
    var col=e[2]||palAt(i), frac=n(e[1])/total, len=Math.max(1,frac*C-GAP);
    var s='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="'+SW+'" stroke-linecap="butt" '
      +'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" '
      +'transform="rotate(-90 70 70)"><title>'+esc(e[0])+': '+(fmt==="vnd"?fmtVND(e[1]):fmtN(e[1]))+' ('+Math.round(frac*100)+'%)</title></circle>';
    off+=frac*C; return s;
  }).join("");
  var lg=list.map(function(e,i){
    return '<div class="dlg-i"><span class="d" style="background:'+(e[2]||palAt(i))+'"></span>'
      +'<span class="nm" title="'+esc(e[0])+'">'+esc(e[0])+'</span>'
      +'<span class="vl">'+(fmt==="vnd"?fmtVND(e[1]):fmtN(e[1]))+' <small>· '+Math.round(n(e[1])/total*100)+'%</small></span></div>';
  }).join("");
  return '<div class="donut"><div class="donut-svg" style="width:140px;height:140px">'
    +'<svg viewBox="0 0 140 140" width="140" height="140"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#EEF3FA" stroke-width="'+SW+'"/>'+segs+'</svg>'
    +'<div class="donut-c"><b>'+esc(center)+'</b><span>'+esc(sub||"")+'</span></div></div>'
    +'<div class="dlg">'+lg+'</div></div>';
}

/* Cột / đường theo tháng — 1 hoặc nhiều chuỗi */
function svgSeries(labels,series,fmt,type){
  var W=560,H=176,PL=46,PR=8,PT=12,PB=26;
  var iw=W-PL-PR, ih=H-PT-PB;
  var all=[]; series.forEach(function(s){ (s.data||[]).forEach(function(v){ all.push(n(v)); }); });
  var mx=Math.max.apply(null,all.concat([1]));
  var step=Math.pow(10,Math.floor(Math.log(mx)/Math.LN10)), top=Math.ceil(mx/step)*step||1;
  var y=function(v){ return PT+ih-(n(v)/top)*ih; };
  var g="";
  for(var i=0;i<=4;i++){
    var yy=PT+ih*i/4, val=top*(1-i/4);
    g+='<line class="gl" x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'"/>'
      +'<text class="ax" x="'+(PL-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+(fmt==="vnd"?fmtVND(val):fmtN(Math.round(val)))+'</text>';
  }
  var nb=labels.length||1, bw=iw/nb;
  labels.forEach(function(lb,i){
    if(nb>13 && i%2) return;
    g+='<text class="ax" x="'+(PL+bw*(i+0.5)).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(lb)+'</text>';
  });
  if(type==="line"){
    series.forEach(function(s,si){
      var col=s.color||palAt(si), pts=[],ar=[];
      (s.data||[]).forEach(function(v,i){ var px=PL+bw*(i+0.5), py=y(v); pts.push(px.toFixed(1)+","+py.toFixed(1)); });
      if(!pts.length) return;
      ar=[PL+bw*0.5+",("+0+")"];

  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>'+lgd;

function acc360Local(code,name){
  var cus=(S.custIndex||[]).filter(function(c){
    return (code&&c.code===code) || (!code&&name&&c.name===name) || (name&&c.name===name);
  })[0];
  if(!cus) return null;
  var nm=cus.name, cd=cus.code;
  var low=String(nm||"").trim().toLowerCase();
  function accIs(v){ return String(parseAcc(v).name||"").trim().toLowerCase()===low; }
  var weekly=terrRows().filter(function(w){ return accIs(w.account); });
  var orders=(tGet("order")||[]).filter(function(o){ return (cd&&o.code===cd)||(nm&&o.name===nm); });
  var present=(tGet("present")||[]).filter(function(r){ return accIs(r.account); });
  var adp=(tGet("adp")||[]).filter(function(r){ return accIs(r.account); });
  var cbc=(S.cbcRows||[]).filter(function(r){ return (cd&&r.code===cd)||accIs(r.name); });

  var tl=[];
  orders.forEach(function(o){
    tl.push({kind:"order",date:String(o.day||"").slice(0,10)||ymIso(o.month),title:"Đơn hàng "+(o.orderNo||""),
      pic:o.pic,amount:n(o.amount),qty:n(o.qty),product:o.ptype||o.detail,channel:o.channel,row:o._row,
      detail:[o.detail,n(o.qty)?("SL "+n(o.qty)):""].filter(String).join(" · ")});
  });
  weekly.forEach(function(w){
    tl.push({kind:"visit",date:String(w.start).slice(0,10),title:w.typeAction||"Đi địa bàn",pic:w.pic,
      typeTask:w.typeTask,process:w.process,status:w.status,feedback:w.feedback,product:w.product,
      photos:w.photos||[],row:w._row,plan:w.plan,result:w.result,next:w.nextAction,
      detail:w.result||w.plan});
  });
  present.forEach(function(pr){
    tl.push({kind:"present",date:String(pr.day||"").slice(0,10)||ymIso(pr.month),title:"Thuyết trình sản phẩm",
      pic:pr.pic,target:n(pr.target),actual:n(pr.actual),link:pr.folder,row:pr._row,detail:pr.review});
  });
  adp.forEach(function(a){
    tl.push({kind:"adp",date:"",title:"ADP — "+(a.abcd||"Key account"),pic:a.pic,row:a._row,detail:a.objective});
  });
  tl.sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });

  var totalAmt=0,byMonth={},byProd={};
  orders.forEach(function(o){ var a=n(o.amount); totalAmt+=a;
    var mm=String(o.month||""); if(mm) byMonth[mm]=(byMonth[mm]||0)+a;
    var pd=o.ptype||o.detail||"(khác)"; byProd[pd]=(byProd[pd]||0)+a; });
  var lastVisit="",lastOrder="";
  weekly.forEach(function(w){ var d=String(w.start).slice(0,10); if(d>lastVisit) lastVisit=d; });
  orders.forEach(function(o){ var d=String(o.day||"").slice(0,10)||ymIso(o.month); if(d>lastOrder) lastOrder=d; });
  var photos=[];
  weekly.forEach(function(w){ (w.photos||[]).forEach(function(ph){
    photos.push({src:ph,date:String(w.start).slice(0,10),pic:w.pic,note:w.result||w.plan,row:w._row}); }); });
  photos.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });

  return { ok:true, _local:true,
    customer:{ _row:cus._row,code:cd,name:nm,type:cus.type,province:cus.province,area:cus.area,
               pic:cus.pic,fy:cus.fy,openDate:cus.openDate,note:cus.note,address:"" },
    cbc:cbc, orders:orders, weekly:weekly, present:present, adp:adp,
    timeline:tl.slice(0,300), photos:photos.slice(0,60),
    stats:{ totalAmount:totalAmt, orderCount:orders.length, visitCount:weekly.length,
            presentCount:present.length, cbcCount:cbc.length,
            lastVisit:lastVisit, lastOrder:lastOrder, byMonth:byMonth, byProduct:byProd,
            daysSinceVisit: lastVisit?Math.floor((new Date(todayISO())-new Date(lastVisit))/86400000):-1 } };
}

/* ═══════════════ CHI TIẾT 1 LẦN ĐI ĐỊA BÀN ═══════════════ */
function openVisit(w){
  if(typeof w==="string"){ try{ w=JSON.parse(w); }catch(e){ return; } }
  if(!w) return;
  if(w._row){
    var pool=(S.cache.weekly&&S.cache.weekly.rows)||[];
    if(!pool.filter(function(x){return x._row===w._row;}).length){
      S.cache.weekly=S.cache.weekly||{rows:[]};
      S.cache.weekly.rows=(S.cache.weekly.rows||[]).concat([w]);
    }
    return openTask(w._row);
  }
  toast("Task chưa có vị trí dòng trên Sheet","warn");
}
function openVisitRow(row){ return openTask(row); }

/* ═══════════════ BẢNG TIN HOẠT ĐỘNG ═══════════════ */
var ACTMETA={
  add   :{lb:"Thêm",   bg:"#E8F7EF", fg:"#15803D"},
  update:{lb:"Sửa",    bg:"#EDF3FE", fg:"#2F4C90"},
  delete:{lb:"Xoá",    bg:"#FDECEC", fg:"#B91C1C"},
  photo :{lb:"Ảnh",    bg:"#FFF6E4", fg:"#8A5A00"},
  report:{lb:"Báo cáo",bg:"#F3EDFB", fg:"#6B4A9E"},
  kpi   :{lb:"KPI",    bg:"#E4F5F6", fg:"#0B7480"}
};
var TABLB={customer:"Khách hàng",cbc:"CBC",order:"Đơn hàng",weekly:"Địa bàn",photos:"Ảnh địa bàn",monthly:"Báo cáo tháng",present:"Thuyết trình",adp:"ADP",kpi:"KPI"};
function toggleAct(){
  var r=$("actRail"), on=r.classList.toggle("on");
  if(on){ $("actDot").style.display="none"; if(!S.activity) loadActivity(); else renderAct(); }
}
function loadActivity(force){
  if(S.activity&&!force) return renderAct();
  $("actBody").innerHTML=skRows(4);
  apiGet("activity",{limit:120}).then(function(j){ S.activity=j.rows||[]; renderAct(); })
    .catch(function(){ $("actBody").innerHTML='<div class="empty"><p style="font-size:12.5px">Không tải được nhật ký</p></div>'; });
}
function relTime(s){
  if(!s) return "";
  var t=new Date(String(s).replace(" ","T"));
  if(isNaN(t)) return String(s);
  var d=(Date.now()-t.getTime())/1000;
  if(d<60) return "vừa xong";
  if(d<3600) return Math.floor(d/60)+" phút trước";
  if(d<86400) return Math.floor(d/3600)+" giờ trước";
  if(d<604800) return Math.floor(d/86400)+" ngày trước";
  return fmtVN(String(s).slice(0,10));
}
function renderAct(){
  var rows=S.activity||[];
  var sel=$("actPic");
  if(sel && !sel._built){
    var names={}; rows.forEach(function(a){ if(a.pic) names[a.pic]=1; });
    (S.picList||[]).forEach(function(p){ names[p.pic]=1; });
    sel.innerHTML='<option value="">👥 Tất cả</option>'+Object.keys(names).sort().map(function(p){
      return '<option value="'+esc(p)+'">'+esc(p)+'</option>'; }).join("");
    sel._built=true;
  }
  var fp=sel?sel.value:"", fk=$("actKind")?$("actKind").value:"";
  var list=rows.filter(function(a){
    if(fp && a.pic!==fp) return false;
    if(fk && a.action!==fk) return false;
    return true;
  });
  if(!list.length){ $("actBody").innerHTML='<div class="empty" style="padding:26px 0"><div class="e">🕘</div><p style="font-size:12.5px">Chưa có hoạt động nào</p></div>'; return; }
  $("actBody").innerHTML=list.map(function(a){
    var m=ACTMETA[a.action]||ACTMETA.update;
    return '<div class="acard a-'+esc(a.action||"update")+'">'
      +'<div class="ac-h"><span class="ac-av" style="background:'+avColor(a.pic)+'">'+esc(initials(a.pic))+'</span>'
      +'<span class="ac-who">'+esc(a.pic||"—")+'</span>'
      +'<span class="ac-bd" style="background:'+m.bg+';color:'+m.fg+'">'+m.lb+'</span></div>'
      +(a.target?'<div class="ac-tg">'+esc(a.target)+'</div>':"")
      +'<div class="ac-dt">'+esc(TABLB[a.tab]||a.tab||"")+(a.detail?" — "+esc(a.detail):"")+'</div>'
      +'<div class="ac-tm">'+esc(relTime(a.time))+'</div></div>';
  }).join("");
}

<script>

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v3 — KHO DỮ LIỆU TRONG BỘ NHỚ  (chuyển tab KHÔNG gọi mạng)
   Trước: mỗi lần bấm sang tab khác là 1 request JSONP tới GAS (2–6 giây).
   Nay  : nạp 1 lần lúc mở app, giữ trong RAM + localStorage. Chuyển tab
          = vẽ lại từ bộ nhớ ⇒ tức thì. Dữ liệu mới tải ngầm ở nền.
   ═══════════════════════════════════════════════════════════════════════ */
var TSTORE={};                 /* tab → {rows, at, key} */
function TKEY_(){ return "mmh_tabs_v4_"+curTeamKey(); }

function scopePic(){ return (S.user && S.user.role==="manager") ? "" : (S.user ? S.user.pic : ""); }
function tabKey(tab){ return tab+"|"+S.fy+"|"+scopePic(); }
function tGet(tab){
  var e=TSTORE[tab];
  return (e&&e.key===tabKey(tab))?e.rows:null;
}
function tPut(tab,rows){
  TSTORE[tab]={rows:rows||[],at:Date.now(),key:tabKey(tab)};
  savTabs();
}
var _savT;
function savTabs(){
  clearTimeout(_savT);
  _savT=setTimeout(function(){
    try{
      var slim={};
      Object.keys(TSTORE).forEach(function(k){
        /* weekly/order có thể rất lớn — chỉ lưu khi vừa phải */
        if((TSTORE[k].rows||[]).length<=2500) slim[k]=TSTORE[k];
      });
      localStorage.setItem(TKEY_(),JSON.stringify({ver:S.verSeen||S.ver||"",d:slim}));
    }catch(e){}
  },600);
}
function loadTabs(){
  try{
    var v=JSON.parse(localStorage.getItem(TKEY_())||"null");
    /* bản cache của phiên dữ liệu cũ thì bỏ, tránh hiện lại dòng đã xoá trên sheet */
    if(v&&v.d&&(!S.verSeen||!v.ver||v.ver===S.verSeen)) TSTORE=v.d;
  }catch(e){ TSTORE={}; }
}
function clearTabs(){ TSTORE={}; try{ localStorage.removeItem(TKEY_()); }catch(e){} }

/* Lấy 1 tab: trả ngay nếu có sẵn, đồng thời làm mới ngầm nếu đã cũ */
function ensureTab(tab,opts,onReady){
  var have=tGet(tab);
  if(have){ onReady(have,true); if(Date.now()-(TSTORE[tab].at||0)>240000) fetchTab(tab,opts); return; }
  onReady(null,false);
  fetchTab(tab,opts,onReady);
}
function fetchTab(tab,opts,onReady){
  var q=Object.assign({tab:tab,fy:S.fy,pic:scopePic(),limit:5000},opts||{});
  if(FETCHING[tab]) return FETCHING[tab];
  FETCHING[tab]=apiGet("list",q).then(function(j){
    delete FETCHING[tab];
    tPut(tab,j.rows||[]);
    if(onReady) onReady(j.rows||[],true);
    else if(S.tab===TAB_OF[tab]) go(S.tab);
    return j.rows||[];
  }).catch(function(e){ delete FETCHING[tab]; if(onReady) onReady([],true,e); throw e; });
  return FETCHING[tab];
}
var FETCHING={};
var TAB_OF={order:"order",monthly:"monthly",present:"present",adp:"adp",weekly:"weekly",cbc:"cust"};

/* Nạp sẵn ở nền — chạy sau khi app đã hiện, không làm chậm lần mở đầu */
function prefetchAll(){

/* Sau khi ghi/xoá: cập nhật NGAY trong bộ nhớ (không chờ mạng), rồi đồng bộ nền.
   Nhờ vậy dòng vừa lưu/xoá hiện đúng tức thì — dữ liệu trên Sheet cũng đã ghi xong
   vì backend dùng LockService + flush đồng bộ. */
/* ⭐ v5.9 — App giữ dữ liệu ở HAI kho: TSTORE (dùng cho Dashboard, hồ sơ account…)
   và S.cache (dùng cho màn hình Địa bàn, Báo cáo tháng, Đơn hàng…).
   Trước đây chỉ vá TSTORE nên thêm task xong màn hình vẫn trống cho tới khi
   tải lại trang. Nay vá cả hai rồi vẽ lại ngay màn hình đang mở. */
function patchRows(rows,row,data,isDelete){
  if(!rows) return rows;
  var i=-1;
  for(var k=0;k<rows.length;k++) if(rows[k]._row===row){ i=k; break; }
  if(isDelete){ if(i>=0) rows.splice(i,1); }
  else if(i>=0) rows[i]=Object.assign({},rows[i],data,{_row:row});
  else if(data) rows.unshift(Object.assign({},data,{_row:row}));
  return rows;
}
function patchLocal(tab,row,data,isDelete){
  var e=TSTORE[tab];
  if(e&&e.rows){ patchRows(e.rows,row,data,isDelete); e.at=0; savTabs(); }
  var c=S.cache[tab];
  if(c&&c.rows){ patchRows(c.rows,row,data,isDelete); }
}
/* vẽ lại đúng màn hình đang mở sau khi dữ liệu đổi */
/* ⭐ v7.1 — mỗi lần chuyển tab: vẽ ngay bằng dữ liệu đang có (không chờ),
   đồng thời nạp nền bản mới nhất từ sheet rồi vẽ lại. Nhờ vậy nếu anh vừa sửa
   hoặc xoá tay trên Google Sheet thì app cập nhật theo mà không phải F5. */
var TAB_SRC={ weekly:"weekly", monthly:"monthly", order:"order", present:"present", adp:"adp" };
var _tabSync={};
function syncTabOnEnter(tab){
  var src=TAB_SRC[tab]; if(!src) return;
  var now=Date.now();
  if(_tabSync[src] && now-_tabSync[src]<15000) return;   /* vừa nạp xong thì thôi */
  if(hasOpenEditor()) return;                            /* đang gõ dở thì đừng đụng vào */
  _tabSync[src]=now;

  /* ⭐ v7.3 — hoạt động đi địa bàn phải nạp bằng visitFeed (kèm ảnh và đủ dòng).
     Dùng fetchTab("weekly") sẽ trả bản nghèo hơn rồi ghi đè, làm mất ảnh và mất task. */
  if(src==="weekly"){
    S._terrLoading=null;
    loadTerritoryAll(true).then(function(){ if(S.tab===tab) repaintTab(); }).catch(function(){});
    return;
  }
  delete FETCHING[src];
  fetchTab(src,{},function(rows,ready){
    if(!ready||!rows) return;
    if(S.cache[src]||src==="monthly") S.cache[src]={rows:rows,at:Date.now()};
    _cxCache=null; _stCache=null;
    if(S.tab===tab) repaintTab();
  });
}
/* đang có ô nhập nào được focus hoặc modal đang mở thì hoãn nạp nền,
   tránh dữ liệu nhảy làm mất nội dung người dùng đang gõ */
function hasOpenEditor(){
  try{
    if($("ov").classList.contains("on")||$("ov2").classList.contains("on")) return true;
    var a=document.activeElement;
    return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }catch(e){ return false; }
}
function repaintTab(){
  try{
    if(S.tab==="weekly"){ if(S.wkTab==="other") renderOther(); else renderTerritory(); }
    else if(S.tab==="monthly") renderMonthly();
    else if(S.tab==="order")   renderOrder();
    else if(S.tab==="present") renderPresent();
    else if(S.tab==="adp")     renderADP();
    else if(S.tab==="cust")    renderCustList();
    else if(S.tab==="report")  renderReport();
  }catch(e){}
}
/* Gọi sau mỗi lần ghi thành công */
function afterWrite(tab,row,data,isDelete){
  patchLocal(tab,row,data,isDelete);
  S.dash=null; S.kpi=null; S.acc=null; S.acc360=null; S.activity=null;
  if(S.cache.weekly) S.cache.weekly.at=0;   /* v4.1 giu kho FY, chi danh dau can dong bo */
  try{ localStorage.removeItem(bundleKey_()); }catch(e){}
  if(tab) delete FETCHING[tab];
  repaintTab();                              /* ⭐ v5.9 — thấy ngay, không chờ tải lại */
  /* lấy bản chính thức từ máy chủ (có No., FY, Month do sheet tự tính) rồi vẽ lại */
  setTimeout(function(){
    if(tab) fetchTab(tab,{},function(rows,ready){
      if(!ready||!rows) return;
      if(S.cache[tab]) S.cache[tab]={rows:rows,at:Date.now()};
      else if(tab==="weekly"||tab==="monthly") S.cache[tab]={rows:rows,at:Date.now()};
      repaintTab();

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v3 — COMBOBOX: gõ tới đâu thấy danh sách mờ tới đó
   Hiện danh sách NGAY khi bấm vào ô (chưa cần gõ), lọc dần theo từng ký tự,
   tô sáng phần khớp, di chuyển bằng phím ↑ ↓ Enter.
   ═══════════════════════════════════════════════════════════════════════ */
function hl(txt,q){
  var t=String(txt||"");
  if(!q) return esc(t);
  var i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function noAcc(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
}
/* items: [{v, label, meta, raw}] */
function combo(inputId,getItems,onPick,ph){
  var el=$(inputId); if(!el||el._combo) return; el._combo=1;
  var box=document.createElement("div");
  box.className="cbo"; box.id=inputId+"_cbo";
  el.parentNode.appendChild(box);
  var cur=[], idx=-1, open=false;
  function close(){ box.classList.remove("on"); open=false; idx=-1; }
  function draw(){
    var q=el.value.trim(), nq=noAcc(q);
    var all=getItems()||[];
    cur=(nq?all.filter(function(it){ return noAcc(it.label+" "+(it.meta||"")).indexOf(nq)>=0; }):all).slice(0,60);
    if(!cur.length){
      box.innerHTML='<div class="cbo-e">Không khớp mục nào'+(q?' với “'+esc(q)+'”':'')+'</div>';
    }else{
      box.innerHTML='<div class="cbo-h">'+cur.length+(cur.length>=60?"+":"")+' kết quả'+(q?'':' · bấm chọn hoặc gõ để lọc')+'</div>'
        +cur.map(function(it,i){
          return '<div class="cbo-i'+(i===idx?" on":"")+'" data-i="'+i+'"><b>'+hl(it.label,q)+'</b>'
            +(it.meta?'<span>'+hl(it.meta,q)+'</span>':"")+'</div>';
        }).join("");
      Array.prototype.forEach.call(box.querySelectorAll("[data-i]"),function(nd){
        nd.onmousedown=function(ev){ ev.preventDefault(); pick(+nd.getAttribute("data-i")); };
      });
    }
    box.classList.add("on"); open=true;
  }
  function pick(i){
    var it=cur[i]; if(!it) return;
    el.value=it.v!==undefined?it.v:it.label;
    close(); if(onPick) onPick(it.raw!==undefined?it.raw:it, it);
  }
  el.setAttribute("autocomplete","off");
  if(ph) el.setAttribute("placeholder",ph);
  el.addEventListener("focus",draw);
  el.addEventListener("input",function(){ idx=-1; draw(); });
  el.addEventListener("keydown",function(e){
    if(!open) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); idx=Math.min(cur.length-1,idx+1); draw(); scrollTo_(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); idx=Math.max(0,idx-1); draw(); scrollTo_(); }
    else if(e.key==="Enter"){ if(idx>=0){ e.preventDefault(); pick(idx); } }
    else if(e.key==="Escape"){ close(); }
  });
  el.addEventListener("blur",function(){ setTimeout(close,120); });
  function scrollTo_(){ var nd=box.querySelector(".cbo-i.on"); if(nd&&nd.scrollIntoView) nd.scrollIntoView({block:"nearest"}); }
}
/* Combobox chọn account — dùng chung cho mọi form */
function accountCombo(inputId,hiddenId,onPick){
  combo(inputId,function(){
    var pool=(S.user.role==="manager"||!S.filt.pic)?S.custIndex:S.custIndex.filter(function(c){return c.pic===S.user.pic;});
    if(!pool.length) pool=S.custIndex;
    return pool.map(function(c){
      return { v:c.name, label:c.name, meta:[c.code,c.type,c.province,c.area,"PIC "+(c.pic||"—")].filter(Boolean).join(" · "), raw:c };
    });
  },function(c){
    if($(hiddenId)) $(hiddenId).value=mkAcc(c);
    if(onPick) onPick(c);
  },"Bấm để xem danh sách · gõ để lọc");
}

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v3 — ĐI ĐỊA BÀN: thống kê & biểu đồ
   ═══════════════════════════════════════════════════════════════════════ */
var VRANGE=[["day","Ngày"],["week","Tuần"],["month","Tháng"],["quarter","Quý"],["fy","Cả FY"],["range","Khoảng ngày"]];
/* ⭐ v5 — chế độ "Khoảng ngày": tự do chọn từ ngày … đến ngày … */
function vRangeDefaults(){
  if(!S.vFrom) S.vFrom=addDays(todayISO(),-29);
  if(!S.vTo)   S.vTo=todayISO();
  if(S.vFrom>S.vTo){ var t=S.vFrom; S.vFrom=S.vTo; S.vTo=t; }
}
function vSetRange(which,val){
  if(!val) return;
  if(which==="from") S.vFrom=val; else S.vTo=val;
  S.vMode="range"; vRangeDefaults();
  if(S.wkTab==="other") renderOther(); else renderTerritory();
}
function vQuickRange(days){
  S.vMode="range"; S.vTo=todayISO(); S.vFrom=addDays(S.vTo,-(days-1));
  if(S.wkTab==="other") renderOther(); else renderTerritory();
}
function vRangeCalc(){
  var mode=S.vMode||"week";
  if(mode==="range"){
    vRangeDefaults();
    var nd=Math.round((new Date(S.vTo)-new Date(S.vFrom))/86400000)+1;
    return { from:S.vFrom, to:S.vTo, label:fmtVN(S.vFrom)+" – "+fmtVN(S.vTo)+" · "+nd+" ngày",
             step:(nd>92?"month":nd>31?"week":"day") };
  }
  if(mode==="day"){
    var d0=S.vAnchor||todayISO();
    return {from:d0,to:d0,label:wdOf(d0)+", "+fmtVN(d0)+(d0===todayISO()?" · HÔM NAY":""),step:"day"};
  }
  if(mode==="week"){
    if(!S.wkFrom){ S.wkFrom=mondayOf(todayISO()); S.wkTo=addDays(S.wkFrom,6); }
    return {from:S.wkFrom,to:S.wkTo,label:"Tuần "+fmtVN(S.wkFrom)+" – "+fmtVN(S.wkTo),step:"day"};
  }
  if(mode==="month"){
    var b=S.vAnchor||todayISO(), y=+b.slice(0,4), m=+b.slice(5,7);
    var f=y+"-"+("0"+m).slice(-2)+"-01";
    var last=new Date(y,m,0).getDate();
    return {from:f,to:y+"-"+("0"+m).slice(-2)+"-"+("0"+last).slice(-2),label:"Tháng "+("0"+m).slice(-2)+"/"+y,step:"day"};
  }
  if(mode==="quarter"){
    var b2=S.vAnchor||todayISO(), y2=+b2.slice(0,4), m2=+b2.slice(5,7);
    var q0=Math.floor((m2-1)/3)*3+1, q1=q0+2;
    var lastd=new Date(y2,q1,0).getDate();
    return {from:y2+"-"+("0"+q0).slice(-2)+"-01",to:y2+"-"+("0"+q1).slice(-2)+"-"+("0"+lastd).slice(-2),
            label:"Quý "+(Math.floor((m2-1)/3)+1)+"/"+y2,step:"week"};
  }
  var ms=fyMonths(S.fy);
  return {from:ms[0].slice(0,4)+"-"+ms[0].slice(4,6)+"-01",
          to:ms[11].slice(0,4)+"-"+ms[11].slice(4,6)+"-28",label:"Năm tài chính "+S.fy,step:"month"};
}
function vShift(k){
  var mode=S.vMode||"week";
  if(mode==="day"){ S.vAnchor=addDays(S.vAnchor||todayISO(),k); }
  else if(mode==="week"){ S.wkFrom=addDays(S.wkFrom,7*k); S.wkTo=addDays(S.wkTo,7*k); }
  else if(mode==="month"||mode==="quarter"){
    var b=S.vAnchor||todayISO(), y=+b.slice(0,4), m=+b.slice(5,7);
    m+=(mode==="month"?1:3)*k;
    while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
    S.vAnchor=y+"-"+("0"+m).slice(-2)+"-01";
  }
  else if(mode==="range"){                     /* dịch cả cửa sổ, giữ nguyên độ dài */
    vRangeDefaults();
    var len=Math.round((new Date(S.vTo)-new Date(S.vFrom))/86400000)+1;
    S.vFrom=addDays(S.vFrom,len*k); S.vTo=addDays(S.vTo,len*k);
  }
  if(S.tab==="weekly"&&S.wkTab==="other") return renderOther();
  if(S.tab==="weekly"&&S.cache.weekly) renderTerritory(); else pgWeekly();
}
function vSetMode(m){ S.vMode=m; S.vAnchor=S.vAnchor||todayISO();
  if(m==="range") vRangeDefaults();
  if(S.tab==="weekly"&&S.wkTab==="other") return renderOther();
  if(S.tab==="weekly"&&S.cache.weekly) renderTerritory(); else pgWeekly(); }

/* nhóm theo bucket thời gian để vẽ tần suất */
function vBuckets(rows,r){
  var keys=[],map={};
  function add(k,lb){ if(!map[k]){ map[k]={n:0,acc:{},lb:lb}; keys.push(k); } return map[k]; }
  if(r.step==="day"){
    for(var d=r.from; d<=r.to; d=addDays(d,1)) add(d,fmtVN(d).slice(0,5));
  }else if(r.step==="week"){
    for(var w=mondayOf(r.from); w<=r.to; w=addDays(w,7)) add(w,fmtVN(w).slice(0,5));
  }else{
    fyMonths(S.fy).forEach(function(m){ add(m,m.slice(4)+"/"+m.slice(2,4)); });
  }
  rows.forEach(function(x){
    var d=String(x.start).slice(0,10); if(!d) return;
    var k=(r.step==="day")?d:(r.step==="week"?mondayOf(d):ymOf(d));
    var b=map[k]; if(!b) return;
    b.n++; var a=parseAcc(x.account).name; if(a) b.acc[a]=1;
  });
  return { labels:keys.map(function(k){return map[k].lb;}),
           counts:keys.map(function(k){return map[k].n;}),
           accs  :keys.map(function(k){return Object.keys(map[k].acc).length;}) };
}
function cnt(rows,fn){
  var m={},out=[];
  rows.forEach(function(r){ var k=fn(r)||"(chưa ghi)"; m[k]=(m[k]||0)+1; });
  Object.keys(m).forEach(function(k){ out.push([k,m[k]]); });
  return out.sort(function(a,b){ return b[1]-a[1]; });
}

            var mx=top[0][1]||1;
            return '<div style="cursor:pointer" onclick="rAcc(\''+reg({name:e[0]})+'\')"><div class="hbar-t">'
              +'<span class="n">'+esc(e[0])+'</span><span class="v" style="color:'+avColor(e[0])+'">'+e[1]+' lượt</span></div>'
              +'<div class="hbar-tr"><div class="hbar-f" style="width:'+Math.round(e[1]/mx*100)+'%;background:'+avColor(e[0])+'"></div></div></div>';
          }).join("")+'</div>':'<div class="empty" style="padding:18px 0"><p style="font-size:12.5px">Chưa có dữ liệu</p></div>')
      +'</div>'
    +'</div>';
}

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v3 — HỘP THOẠI XÁC NHẬN GỬI BÁO CÁO
   ═══════════════════════════════════════════════════════════════════════ */
var SENDLB={ self:{t:"Gửi thử cho chính bạn",d:"Email chỉ vào hộp thư của bạn để kiểm tra bố cục. Không ai khác nhận được.",c:"gho"},
             team:{t:"Gửi chính thức tới team",d:"Gửi theo đúng danh sách người nhận của nhóm bên dưới.",c:"pri"},
             pic :{t:"Gửi thay cho PIC",d:"Gửi báo cáo của một PIC khác dưới danh nghĩa của họ.",c:"pri"},
             all :{t:"Gửi toàn bộ team",d:"Gửi lần lượt báo cáo của tất cả PIC trong nhóm.",c:"pri"},
             download:{t:"Tải PDF",d:"Không gửi email, chỉ tải file PDF về máy.",c:"gho"} };
/* ⭐ v9 — NGƯỜI NHẬN BÁO CÁO TÁCH THEO NHÓM
   Dental   · To = cả Dental Sales Team          · Cc = Tuyen, Nguyen Ha, Hoa
   Surgical · To = Tuyen, Nguyen Ha, Giang, Hoa  · Cc = PIC Surgical còn lại
   (nhóm Surgical chỉ có 2 PIC nên báo cáo gửi thẳng lên quản lý,
    người cùng nhóm vẫn được Cc để nắm việc của nhau) */
var MAIL_TUYEN="tt.tuyen@manimedicalhanoi.com", MAIL_HA="nt.ha@manimedicalhanoi.com",
    MAIL_PROD ="mmh.product@manimedicalhanoi.com", MAIL_HR="vtt.hoa@manimedicalhanoi.com";
var MAIL_RULE={
  dental  : { team:"Dental Sales Team",   toTeam:true,  fixed:[MAIL_TUYEN,MAIL_HA,MAIL_HR] },
  surgical: { team:"Surgical Sales Team", toTeam:false, fixed:[MAIL_TUYEN,MAIL_HA,MAIL_PROD,MAIL_HR] }
};
function mailRule(){ return MAIL_RULE[curTeamKey()]||MAIL_RULE.dental; }
function teamMails(){
  var k=curTeamKey(), out=[];
  Object.keys(ROLES).forEach(function(nm){
    var r=ROLES[nm];
    if(r.team===k && r.email && out.indexOf(r.email)<0) out.push(r.email);
  });
  return out;
}
function mailTargets(){
  var r=mailRule(), tm=teamMails();
  var to=(r.toTeam?tm:r.fixed).slice().filter(Boolean);
  var cc=(r.toTeam?r.fixed:tm).slice().filter(function(e){ return e && to.indexOf(e)<0; });
  return { to:to, cc:cc };
}
var CC_LIST=[MAIL_TUYEN,MAIL_HA,MAIL_HR];
function askSend(option){
  var kind=S.rpKind, who=(S.rpPic||S.user.pic), m=SENDLB[option]||SENDLB.self;
  var to=[],cc=[];
  if(option==="self"){ to=[(ROLES[S.user.pic]||{}).email||S.user.email||"(email của bạn)"]; }
  else{ var mt=mailTargets(); to=mt.to; cc=mt.cc; }
  var period=kind==="week"?("Tuần "+fmtVN(S.rpFrom)+" – "+fmtVN(S.rpTo)):("Tháng "+String(S.rpMonth).slice(4)+"/"+String(S.rpMonth).slice(0,4));
  var body='<div class="card pad" style="margin-bottom:12px;background:var(--pale);border-color:var(--lb1)">'
    +'<div style="font-size:15px;font-weight:800;color:var(--navy);margin-bottom:4px">'+esc(m.t)+'</div>'
    +'<div style="font-size:13px;color:var(--sub);line-height:1.55">'+esc(m.d)+'</div></div>'
    +'<dl class="kv">'
    +'<dt>Loại báo cáo</dt><dd><b>'+(kind==="week"?"Báo cáo tuần":"Báo cáo tháng")+'</b></dd>'
    +'<dt>Kỳ báo cáo</dt><dd>'+esc(period)+'</dd>'
    +'<dt>Người báo cáo</dt><dd>'+esc(who)+'</dd>'
    +(option!=="download"?'<dt>Gửi tới (To)</dt><dd style="font-size:12.5px">'+(to.length?to.map(esc).join("<br>"):"—")+'</dd>':"")
    +(cc.length&&option!=="download"?'<dt>Đồng gửi (Cc)</dt><dd style="font-size:12.5px">'+cc.map(esc).join("<br>")+'</dd>':"")
    +'<dt>Đính kèm</dt><dd>PDF báo cáo (A4)</dd></dl>'
    +(option==="pic"?'<div class="fld" style="margin-top:12px"><label>Chọn PIC</label><select class="inp" id="sd_pic">'
        +opts((S.master.pic||[]),who)+'</select></div>':"");
  openModal((kind==="week"?"Gửi báo cáo tuần":"Gửi báo cáo tháng"),body,
    '<button class="btn" onclick="closeModal()">Huỷ</button><div style="flex:1"></div>'
    +'<button class="btn '+m.c+'" onclick="doSend(\''+option+'\')">'+(option==="download"?"⤓ Tải PDF":"✉ Gửi ngay")+'</button>');
}
function doSend(option){
  if(option==="pic"&&$("sd_pic")) S.rpPic=$("sd_pic").value;
  closeModal();
  sendReport(option,true);
}

</script>
