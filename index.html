<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>MMH Surgical CRM</title>
<style>
:root{
  --navy:#003047; --navy-2:#00436A; --blue:#3A5CAA; --blue-2:#5B7FD0; --yellow:#FFE100;
  --paper:#F4F6FA; --ink:#16202E; --sub:#63708A; --faint:#98A2B6;
  --line:#E6EAF1; --line-2:#D6DDE9; --pale:#F0F5FC; --tint:#E7EEFB;
  --gA:#1E9E5A; --gB:#E5B300; --gC:#3A5CAA; --gD:#98A2B6;
  --ok:#1E9E5A; --warn:#E8833A; --bad:#D9433F;
  --r:10px; --r-l:14px; --r-xl:20px; --rail:242px; --ease:cubic-bezier(.32,.72,0,1);
  --sh:0 1px 2px rgba(0,48,71,.05),0 1px 3px rgba(0,48,71,.04);
  --sh-m:0 4px 14px rgba(0,48,71,.08); --sh-l:0 18px 44px rgba(0,48,71,.16);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Aptos','Aptos Display','Segoe UI Variable',-apple-system,'Segoe UI',system-ui,sans-serif;
  background:var(--paper);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C6D0E0;border-radius:6px;border:2px solid transparent;background-clip:content-box}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}

#shell{display:flex;height:100vh;overflow:hidden}
#rail{width:var(--rail);flex:0 0 var(--rail);background:var(--navy);display:flex;flex-direction:column;
  padding:16px 12px;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
.brand .mk{width:38px;height:38px;border-radius:11px;background:var(--yellow);display:grid;place-items:center;
  font-weight:800;font-size:13px;color:var(--navy);flex:0 0 auto}
.brand .t1{font-size:14px;font-weight:700;color:#fff;line-height:1.15}
.brand .t2{font-size:10px;letter-spacing:.11em;color:rgba(255,255,255,.5);text-transform:uppercase;margin-top:2px}
.rail-grp{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.34);padding:16px 10px 6px}
.rail-b{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:var(--r);width:100%;
  color:rgba(255,255,255,.74);font-size:13.5px;font-weight:500;text-align:left;position:relative;transition:.14s}
.rail-b svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.rail-b:hover{background:rgba(255,255,255,.08);color:#fff}
.rail-b.on{background:rgba(255,255,255,.13);color:#fff;font-weight:650}
.rail-b.on::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--yellow);border-radius:0 3px 3px 0}
.rail-b .bdg{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.15);padding:1px 7px;border-radius:9px}
.rail-b.on .bdg{background:var(--yellow);color:var(--navy)}
.rail-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.who{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);width:100%;text-align:left}
.who:hover{background:rgba(255,255,255,.07)}
.who .av{width:32px;height:32px;border-radius:9px;background:var(--blue);display:grid;place-items:center;color:#fff;font-size:11.5px;font-weight:700;flex:0 0 auto}
.who .n{font-size:12.5px;font-weight:650;color:#fff}
.who .r{font-size:10.5px;color:rgba(255,255,255,.5)}

#main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{min-height:58px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:9px 22px;flex-wrap:wrap}
#top h1{font-size:16.5px;font-weight:700;letter-spacing:-.015em;color:var(--navy)}
#top .sub{font-size:12px;color:var(--sub)}
.picsw{display:inline-flex;background:var(--paper);border-radius:9px;padding:3px;gap:2px;margin-left:auto}
.picsw button{padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:650;color:var(--sub)}
.picsw button.on{background:#fff;color:var(--blue);box-shadow:var(--sh)}
#stage{flex:1;overflow-y:auto;padding:18px 22px 44px}
.page{display:none}.page.on{display:block;animation:up .26s var(--ease)}
@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

/* period bar */
.pbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
  border-radius:var(--r-l);padding:10px 13px;box-shadow:var(--sh);margin-bottom:16px}
.pbar .seg{display:inline-flex;background:var(--paper);border-radius:9px;padding:3px;gap:2px}
.pbar .seg button{padding:7px 13px;border-radius:7px;font-size:12.5px;font-weight:650;color:var(--sub)}
.pbar .seg button.on{background:#fff;color:var(--blue);box-shadow:var(--sh)}
.pbar .nav{display:inline-flex;gap:4px}
.pbar .nav button{width:30px;height:30px;border-radius:8px;background:var(--paper);color:var(--sub);font-size:14px;display:grid;place-items:center}
.pbar .nav button:hover{background:var(--tint);color:var(--blue)}
.pbar .rng{font-size:13px;font-weight:700;color:var(--navy);min-width:170px}
.pbar .rng small{display:block;font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.pbar input[type=date]{padding:7px 9px;border:1.5px solid var(--line-2);border-radius:8px;font-size:12.5px;background:#fff}
.pbar .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:13.5px;font-weight:700;color:var(--navy)}
.card-h .hs{font-size:11.5px;color:var(--faint);margin-left:auto}
.card-b{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2.5px 9px;border-radius:7px;white-space:nowrap}
.pill.b{background:var(--tint);color:#22447F}
.pill.g{background:#E6F6ED;color:#15803D}
.pill.y{background:#FDF4D3;color:#8A6D00}
.pill.o{background:#FDEEE2;color:#9A4E12}
.pill.r{background:#FDEBEC;color:#B3282E}
.pill.n{background:#EFF2F7;color:var(--sub)}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r);border:1.5px solid var(--line-2);
  background:#fff;font-size:13px;font-weight:650;color:var(--sub);transition:.14s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--navy);border-color:var(--navy)}
.btn.sm{padding:5.5px 10px;font-size:12px}
.inp{width:100%;padding:9px 12px;border:1.5px solid var(--line-2);border-radius:var(--r);font-size:13.5px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue)}
.bar{height:5px;background:var(--pale);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .45s var(--ease)}
.empty{text-align:center;padding:44px 20px;color:var(--sub)}
.empty .ic{font-size:32px;opacity:.4;margin-bottom:10px}
.empty p{font-size:13px;line-height:1.65;max-width:430px;margin:0 auto}
.stat4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);padding:15px 17px}
.stat .v{font-size:27px;font-weight:750;letter-spacing:-.025em;color:var(--navy);line-height:1.05}
.stat .m{font-size:11.5px;color:var(--sub);margin-top:6px}

/* grade */
.gbadge{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:800;color:#fff}
.gA{background:var(--gA)}.gB{background:var(--gB)}.gC{background:var(--gC)}.gD{background:var(--gD)}
.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut{flex:0 0 auto}
.dlegend{flex:1;min-width:212px;display:flex;flex-direction:column;gap:9px}
.dl{display:flex;align-items:center;gap:10px}
.dl .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.dl .dn{font-size:12.5px;font-weight:700;flex:0 0 18px}
.dl .dx{font-size:11.5px;color:var(--sub);flex:1;line-height:1.35}
.dl .dv{font-size:13.5px;font-weight:750}
.matrix{display:grid;grid-template-columns:74px 1fr 1fr;gap:2px;margin-top:6px}
.mx{padding:11px 10px;font-size:11.5px;text-align:center;border-radius:7px;background:var(--paper)}
.mx.h{font-weight:700;color:var(--sub);background:transparent;display:flex;align-items:center;justify-content:center}
.mx.c{color:#fff;font-weight:750;font-size:15px;cursor:default}
.mx.c small{display:block;font-size:9.5px;font-weight:600;opacity:.9;margin-top:2px}

/* accounts split */
.split{display:grid;grid-template-columns:344px 1fr;gap:14px;align-items:start}
.alist{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);overflow:hidden;position:sticky;top:0}
.al-top{padding:12px 13px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.al-f{display:flex;gap:5px;flex-wrap:wrap}
.al-f button{font-size:11px;font-weight:650;padding:4.5px 9px;border-radius:7px;color:var(--sub);background:var(--paper)}
.al-f button.on{background:var(--navy);color:#fff}
.al-scroll{max-height:calc(100vh - 236px);overflow-y:auto}
.arow{display:flex;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.arow:hover{background:var(--pale)}
.arow.on{background:var(--tint);box-shadow:inset 3px 0 0 var(--blue)}
.arow .am{flex:1;min-width:0}
.arow .an{font-size:13px;font-weight:650;line-height:1.3}
.arow .as{font-size:11px;color:var(--faint);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gstack{display:flex;gap:3px;flex:0 0 auto}
.gstack i{width:18px;height:18px;border-radius:5px;font-size:10px;font-weight:800;color:#fff;display:grid;place-items:center;font-style:normal}

.hero{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.hero-top{padding:18px 20px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hero-mk{width:52px;height:52px;border-radius:14px;background:var(--navy);color:var(--yellow);display:grid;place-items:center;font-size:16px;font-weight:800;flex:0 0 auto}
.hero-id{flex:1;min-width:210px}
.hero-id h2{font-size:19px;font-weight:750;letter-spacing:-.02em;color:var(--navy);line-height:1.2}
.hero-id .vn{font-size:12.5px;color:var(--sub);margin-top:4px}
.hero-id .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.hero-st{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
.hsc{padding:13px 16px;border-right:1px solid var(--line)}
.hsc:last-child{border-right:none}
.hsc .v{font-size:19px;font-weight:750;color:var(--navy);line-height:1.1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 14px;overflow-x:auto}
.tabs button{padding:12px 13px;font-size:13px;font-weight:650;color:var(--sub);white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

.stage-track{display:flex;gap:3px;margin-top:10px}
.stg{flex:1;padding:7px 8px;border-radius:6px;background:var(--paper);font-size:11px;font-weight:700;color:var(--faint);text-align:center}
.stg.on{background:var(--blue);color:#fff}
.stg.past{background:var(--tint);color:#22447F}

.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-i{position:relative;padding:0 0 18px}
.tl-i::before{content:'';position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--blue)}
.tl-i.done::before{background:var(--ok);border-color:var(--ok)}
.tl-d{font-size:11px;font-weight:700;color:var(--blue)}
.tl-t{font-size:13.5px;font-weight:650;margin:3px 0 5px;line-height:1.4}
.tl-x{font-size:12.5px;color:var(--sub);line-height:1.6;white-space:pre-wrap}
.tl-m{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.thumb{width:58px;height:58px;object-fit:cover;border-radius:9px;border:1px solid var(--line-2);cursor:pointer}

.stake{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sk{border:1px solid var(--line);border-radius:var(--r-l);padding:14px}
.sk-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.sk-av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;background:var(--blue)}
.sk-n{font-size:13.5px;font-weight:700;line-height:1.25}
.sk-j{font-size:11.5px;color:var(--sub);margin-top:2px}
.sk-sc{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:5px 0}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--line-2)}
.dots i.on{background:var(--blue)}

.gtb{width:100%;border-collapse:collapse;font-size:12.5px}
.gtb th{text-align:left;padding:9px 11px;background:var(--paper);font-size:10.5px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
.gtb td{padding:10px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
.gtb tr:hover td{background:var(--pale)}

/* gantt */
.gwrap{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);overflow-x:auto}
.ggrid{min-width:1060px}
.ghead,.gkey,.gsub{display:grid;grid-template-columns:296px 206px 1fr}
.ghead{border-bottom:1.5px solid var(--line-2);position:sticky;top:0;background:#fff;z-index:2}
.ghl,.ghr{padding:11px 14px}
.ghr{border-left:1px solid var(--line);border-right:1px solid var(--line)}
.gdays{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative}
.gd{padding:6px 2px;text-align:center;border-left:1px solid var(--line);display:flex;flex-direction:column;line-height:1.1}
.gd .w{font-size:8px;font-weight:600;color:var(--faint)}
.gd .n{font-size:11px;font-weight:700}
.gd.we{background:#F8F9FC}
.gd.td{background:var(--blue)}.gd.td .w,.gd.td .n{color:#fff}
.gkey{border-bottom:1.5px solid var(--line-2);background:#FAFCFE;min-height:50px;align-items:flex-start}
.gkey:hover,.gsub:hover{background:var(--pale)}
.gsub{border-bottom:1px solid var(--line);min-height:42px;align-items:center}
.glbl{padding:10px 14px;display:flex;gap:8px;align-items:flex-start;overflow:hidden;font-size:12.5px}
.glbl.k{font-weight:700;cursor:pointer}
.glbl.s{padding-left:32px;font-size:12px;color:var(--sub);cursor:pointer;align-items:center}
.gcar{width:13px;height:13px;stroke:var(--sub);fill:none;stroke-width:2.6;transition:.2s;flex:0 0 auto;margin-top:3px}
.gkey.open .gcar{transform:rotate(90deg)}
.gnm{flex:1;min-width:0;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gpc{margin-left:auto;font-size:11px;font-weight:800;background:var(--pale);padding:2px 8px;border-radius:8px;flex:0 0 auto}
.gdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;margin-top:5px}
.glbl.s .gdot{margin-top:0}
.gres{padding:9px 12px;font-size:11.5px;color:var(--sub);line-height:1.45;border-left:1px solid var(--line);border-right:1px solid var(--line);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;align-self:center}
.gtrack{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;min-height:42px}
.gc{border-left:1px solid var(--line)}.gc.we{background:#F8F9FC}
.gbar{position:absolute;top:9px;height:24px;border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:10px;
  font-weight:700;color:#fff;overflow:hidden;box-shadow:var(--sh);min-width:22px;cursor:pointer}
.gbar.sb{height:20px;top:11px}
.gbar>i{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.32);border-radius:6px 0 0 6px}
.gbar span{position:relative;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:#E5484D;z-index:3}
.gnow span{position:absolute;top:-14px;left:-11px;font-size:8.5px;font-weight:800;color:#E5484D;white-space:nowrap}
.od{display:inline-block;background:#FDEBEC;color:#B3282E;border:1px solid #F5C6C8;border-radius:5px;font-size:9px;font-weight:800;padding:0 5px;margin-left:4px}
.gkey.late,.gsub.late{background:#FFF6F6}
.gresrow{grid-column:1/-1;background:#FBFCFE;border-bottom:1px solid var(--line);padding:13px 16px 15px 44px}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(212px,1fr));gap:13px;align-items:start}
.bcol{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh)}
.bch{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.bch .bn{font-size:12.5px;font-weight:700}
.bch .bc{margin-left:auto;font-size:11px;font-weight:700;background:var(--paper);padding:1px 8px;border-radius:8px;color:var(--sub)}
.bcb{padding:10px;display:flex;flex-direction:column;gap:9px;max-height:64vh;overflow-y:auto}
.bcard{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;text-align:left;width:100%;transition:.14s}
.bcard:hover{border-color:var(--blue);box-shadow:var(--sh-m)}
.bcard .bt{font-size:12.5px;font-weight:650;line-height:1.35}
.bcard .bm{font-size:11px;color:var(--faint);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}

/* kpi */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(266px,1fr));gap:14px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh);padding:16px 17px}
.kcard.behind{border-color:#F3C9CB}
.k-nm{font-size:13.5px;font-weight:700;color:var(--navy);line-height:1.25}
.k-sc{font-size:11px;color:var(--faint);margin-top:3px}
.k-fig{display:flex;align-items:baseline;gap:7px;margin:12px 0 4px}
.k-a{font-size:28px;font-weight:750;letter-spacing:-.02em;line-height:1}
.k-t{font-size:12.5px;color:var(--sub);font-weight:600}
.k-track{position:relative;height:7px;background:var(--pale);border-radius:99px;margin-top:6px}
.k-track>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.k-track>b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy);opacity:.55}
.k-pace{display:flex;justify-content:space-between;font-size:11px;margin-top:8px;color:var(--sub)}
.spark{display:flex;align-items:flex-end;gap:3px;height:42px;margin-top:12px}
.spark i{flex:1;background:var(--tint);border-radius:2px}
.spark i.f{background:var(--blue)}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;background:#fff;box-shadow:var(--sh);text-align:left;width:100%}
.ph:hover{box-shadow:var(--sh-m)}
.ph .im{aspect-ratio:4/3;background:var(--pale);display:block;width:100%;object-fit:cover}
.ph .cap{padding:9px 11px}
.ph .cn{font-size:12px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ph .cd{font-size:10.5px;color:var(--faint);margin-top:4px}

.mbg{position:fixed;inset:0;background:rgba(0,32,48,.5);backdrop-filter:blur(3px);z-index:900;display:none;align-items:center;justify-content:center;padding:20px}
.mbg.on{display:flex;animation:up .2s}
.mcard{background:#fff;border-radius:var(--r-xl);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-l)}
.mh{padding:17px 21px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mh h3{font-size:15.5px;font-weight:700;color:var(--navy)}
.mh button{margin-left:auto;width:32px;height:32px;border-radius:9px;background:var(--paper);color:var(--sub);font-size:16px}
.mb{padding:19px 21px}
.mf{padding:14px 21px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.fld{margin-bottom:14px}
.fld>label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{background:var(--pale);border:1px solid #D9E5F5;border-radius:var(--r);padding:11px 13px;font-size:12px;line-height:1.55;color:var(--navy)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{padding:11px;border-radius:var(--r);border:1.5px solid var(--line-2);font-size:13px;font-weight:650;color:var(--sub);background:#fff}
.choice button.on{border-color:var(--blue);background:var(--tint);color:var(--blue)}
.gpreview{display:flex;align-items:center;gap:12px;padding:13px;border-radius:var(--r);background:var(--paper);margin-top:6px}
.gpreview .gb{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;font-weight:800;color:#fff}

#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--navy);color:#fff;padding:11px 20px;
  border-radius:99px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:.3s var(--ease);box-shadow:var(--sh-l);pointer-events:none;max-width:88vw;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1}
#busy{position:fixed;inset:0;background:rgba(244,246,250,.82);backdrop-filter:blur(2px);z-index:950;display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:14px}
#busy.on{display:flex}
.spin{width:34px;height:34px;border:3px solid var(--line-2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#busy .bt{font-size:13.5px;font-weight:650;color:var(--navy)}
#busy .bs{font-size:12px;color:var(--sub)}

.menu-b{display:none;width:36px;height:36px;border-radius:9px;background:var(--paper);place-items:center}
@media(max-width:1100px){
  .split{grid-template-columns:1fr}
  .alist{position:static}.al-scroll{max-height:300px}
  .board{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
}
@media(max-width:780px){
  :root{--rail:0px}
  #rail{position:fixed;left:0;top:0;bottom:0;width:242px;z-index:800;transform:translateX(-100%);transition:transform .28s var(--ease)}
  #rail.open{transform:none}
  #stage{padding:14px 13px 80px}
  #top{padding:9px 13px}
  .board{grid-template-columns:1fr}
  .hero-st{grid-template-columns:repeat(2,1fr)}
  .hsc:nth-child(2){border-right:none}
  .hsc:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .menu-b{display:grid}
  .picsw{margin-left:0;order:9;width:100%;justify-content:center}
  .f2,.choice{grid-template-columns:1fr}
}
</style>
</head>

      <span>Field photos</span><span class="bdg" id="bdg-photo">0</span></button>

    <div class="rail-foot">
      <button class="who" onclick="switchUser()">

      </button>
    </div>
  </aside>

  <div id="main">
    <header id="top">
      <button class="menu-b" onclick="document.getElementById('rail').classList.toggle('open')">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#63708A" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div><h1 id="tt">Accounts</h1><div class="sub" id="ts">Account records, contacts, activity and grading</div></div>

    <div id="stage">
      <!-- ACCOUNTS -->

          <div class="alist">

              <input class="inp" id="aq" placeholder="Search account, province, type…" oninput="renderAccList()"/>

</div>

<!-- MODAL: grade account -->
<div class="mbg" id="m-grade"><div class="mcard">
  <div class="mh"><h3 id="mg-title">Grade account</h3><button onclick="closeM('m-grade')">✕</button></div>
  <div class="mb">
    <div class="fld"><label>Account</label><input class="inp" id="mg-acc" readonly/></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   MMH SURGICAL CRM — v2.0
   Live client for the Apps Script backend.
   Requires: Code.gs (existing) + Code_CRM.gs + Code_CRM_Grading.gs
   ═══════════════════════════════════════════════════════════════════════════ */

var GAS_URL = "https://script.google.com/macros/s/AKfycbwwGhYaN5sOF3bJWI-3LYDYaHCuIeWmSF43SPUg-VYD5KjMn6bG9YlNKdfDWGAHhZKn/exec";

/* ── helpers ── */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function jsq(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function parseDMY(s){
  if(s instanceof Date) return s;
  var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s||"").trim());
  return m?new Date(+m[3],+m[2]-1,+m[1]):null;
}
function dmy(d){ return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2)+"/"+d.getFullYear(); }
function ymd(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function mondayOf(d){ var x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function accShort(n){ return String(n||"").split("/")[0].trim(); }
function initialsOf(n){
  return String(n||"?").replace(/^(BV|PK|ĐH|TT)\s+/i,"").split(/\s+/).slice(0,2)
    .map(function(w){return w[0]||"";}).join("").toUpperCase()||"?";
}
function toast(m,ms){ var t=$("toast"); t.textContent=m; t.classList.add("on");
  clearTimeout(window._tt); window._tt=setTimeout(function(){t.classList.remove("on");},ms||3000); }
function busy(on,t,s){ $("busy").classList.toggle("on",!!on);
  if(t)$("busy-t").textContent=t; $("busy-s").textContent=s||""; }
function openM(id){ $(id).classList.add("on"); }
function closeM(id){ $(id).classList.remove("on"); }
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){ var m=document.querySelector(".mbg.on"); if(m) m.classList.remove("on"); } });

/* ── API transport (fetch first, JSONP fallback) ── */
var _cbId=0;
function qs(p){ return Object.keys(p).map(function(k){
  return encodeURIComponent(k)+"="+encodeURIComponent(p[k]); }).join("&"); }
function jsonp(p,ms){
  return new Promise(function(res,rej){
    var cb="__mmh_"+(++_cbId)+"_"+Date.now(), s=document.createElement("script"), done=false;
    var t=setTimeout(function(){ if(!done){clean();rej(new Error("Server timed out"));} },ms||40000);
    function clean(){ done=true; clearTimeout(t); try{delete window[cb];}catch(e){window[cb]=undefined;}
      if(s.parentNode)s.parentNode.removeChild(s); }
    window[cb]=function(d){ clean(); res(d); };
    s.src=GAS_URL+"?"+qs(p)+"&callback="+cb;
    s.onerror=function(){ if(!done){clean();rej(new Error("Could not reach the web app"));} };
    document.body.appendChild(s);
  });
}
function getFetch(p,ms){
  var c=("AbortController" in window)?new AbortController():null;
  var t=c?setTimeout(function(){c.abort();},ms||45000):0;
  return fetch(GAS_URL+"?"+qs(p),{method:"GET",redirect:"follow",cache:"no-store",
    signal:c?c.signal:undefined}).then(function(r){return r.text();}).then(function(txt){
      if(t)clearTimeout(t);
      try{ return JSON.parse(txt); }
      catch(e){ var er=new Error("The web app returned HTML instead of JSON. Set deployment access to Anyone, then redeploy.");
        er.code="NOT_JSON"; throw er; }
    },function(e){ if(t)clearTimeout(t);
      if(e&&e.code==="NOT_JSON") throw e;
      throw new Error(e&&e.name==="AbortError"?"Server timed out":("Network error: "+(e&&e.message||"unknown"))); });
}
function api(action,extra,payload){
  var p={action:action,pic:S.pic||""};
  if(extra) Object.keys(extra).forEach(function(k){p[k]=extra[k];});
  if(payload) p.p=JSON.stringify(payload);
  function ok(r){ if(r&&r.ok===false) throw new Error(r.error||"Request failed"); return r; }
  return getFetch(p).then(ok).catch(function(e1){
    if(e1&&e1.code==="NOT_JSON") throw e1;
    return jsonp(p).then(ok).catch(function(){ throw e1; });
  });
}

/* ── state ── */
var S = {
  page:"accounts", pic:"", user:null, lists:{}, rows:[], accounts:[], grades:[],
  productTypes:[], stakeholders:{}, crmKeys:[], gradeMeaning:{},
  acc:null, accTab:"profile", accQ:"", fStage:"", fGrade:"",
  ptFilter:"", open:{}, openSub:{}, gradeDraft:{demand:"High",share:"Low"},
  period:{ overview:{mode:"month",anchor:new Date()}, progress:{mode:"week",anchor:new Date()},
           board:{mode:"month",anchor:new Date()}, kpi:{mode:"month",anchor:new Date()},
           photos:{mode:"month",anchor:new Date()} },
  booted:false,
};
var STAGES=["Identify","Engage","Convert","Maintain"];
var STAGE_C={Identify:"#98A2B6",Engage:"#5B7FD0",Convert:"#E5B300",Maintain:"#1E9E5A"};
var GRADES=["A","B","C","D"];
var GRADE_C={A:"#1E9E5A",B:"#E5B300",C:"#3A5CAA",D:"#98A2B6"};
var GRADE_TXT={
  A:"High demand · High MANI share",
  B:"High demand · Low MANI share",
  C:"Low demand · High MANI share",
  D:"Low demand · Low MANI share"};
var GRADE_ACT={
  A:"Defend the position and grow volume",
  B:"Highest conversion priority — displace the incumbent",
  C:"Maintain with low effort, protect margin",
  D:"Qualify demand before investing further time"};
var ST_C={Completed:"#1E9E5A","In Progress":"#3A5CAA","To Do":"#98A2B6",Cancelled:"#B8B2C2"};
var ST_P={Completed:"g","In Progress":"b","To Do":"n",Cancelled:"n"};

function gradeOf(demand,share){
  var d=/high/i.test(demand||"")?"High":"Low", s=/high/i.test(share||"")?"High":"Low";
  if(d==="High"&&s==="High")return "A";
  if(d==="High"&&s==="Low") return "B";
  if(d==="Low" &&s==="High")return "C";
  return "D";
}
function pctColor(p){ p=Math.max(0,Math.min(100,Math.round(p||0)));
  if(p>=100)return "#1E9E5A"; if(p>=75)return "#3FA64B";
  if(p>=50)return "#E5B300"; if(p>=25)return "#E8833A"; return "#D9433F"; }
function subPct(s){
  if(/complet/i.test(s.status||""))return 100;
  if(/cancel/i.test(s.status||""))return 0;
  var p=parseInt(s.progress,10)||0;
  if(/progress/i.test(s.status||"")&&p<25)p=25;
  return Math.max(0,Math.min(100,p));
}
function keyPct(k){
  var subs=(k.subs||[]).filter(function(s){return !/cancel/i.test(s.status||"");});
  if(!subs.length) return subPct(k);
  return Math.round(subs.reduce(function(a,s){return a+subPct(s);},0)/subs.length);
}
function isLate(o){
  if(!o||/complet|cancel/i.test(o.status||"")) return false;
  var d=parseDMY(o.revisedDate)||parseDMY(o.dueDate); if(!d) return false;
  var t=new Date(); t.setHours(0,0,0,0); return d<t;
}

/* ═══ PERIOD ENGINE ═══ */
function periodRange(p){
  var a=new Date(p.anchor); a.setHours(0,0,0,0);
  if(p.mode==="custom"){
    return { from:new Date(p.from+"T00:00:00"), to:new Date(p.to+"T00:00:00"),
             label:"Custom range", sub:"" };
  }
  if(p.mode==="week"){
    var m=mondayOf(a), s=new Date(m); s.setDate(m.getDate()+6);
    var wk=Math.ceil(((m-new Date(m.getFullYear(),0,1))/864e5+new Date(m.getFullYear(),0,1).getDay()+1)/7);
    return { from:m, to:s, label:dmy(m)+" – "+dmy(s), sub:"Week "+wk+", "+m.getFullYear() };
  }
  if(p.mode==="quarter"){
    var q=Math.floor(a.getMonth()/3), f=new Date(a.getFullYear(),q*3,1), t=new Date(a.getFullYear(),q*3+3,0);
    return { from:f, to:t, label:"Q"+(q+1)+" "+a.getFullYear(), sub:dmy(f)+" – "+dmy(t) };
  }
  var f=new Date(a.getFullYear(),a.getMonth(),1), t=new Date(a.getFullYear(),a.getMonth()+1,0);
  var MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return { from:f, to:t, label:MN[a.getMonth()]+" "+a.getFullYear(), sub:dmy(f)+" – "+dmy(t) };
}
function shiftPeriod(page,dir){
  var p=S.period[page], a=new Date(p.anchor);
  if(p.mode==="week") a.setDate(a.getDate()+7*dir);
  else if(p.mode==="quarter") a.setMonth(a.getMonth()+3*dir);
  else if(p.mode==="month") a.setMonth(a.getMonth()+dir);
  else return;
  p.anchor=a; renderPage(page);
}
function setPeriodMode(page,mode){
  var p=S.period[page]; p.mode=mode;
  if(mode==="custom"&&!p.from){
    var r=periodRange({mode:"month",anchor:p.anchor});
    p.from=ymd(r.from); p.to=ymd(r.to);
  }
  renderPage(page);
}
function setCustom(page){
  var p=S.period[page];
  p.from=$("pc-from-"+page).value; p.to=$("pc-to-"+page).value;
  if(p.from>p.to){ var x=p.from; p.from=p.to; p.to=x; }
  renderPage(page);
}
function periodBarHTML(page,extra){
  var p=S.period[page], r=periodRange(p);
  var modes=[["week","Week"],["month","Month"],["quarter","Quarter"],["custom","Custom"]];
  var h='<div class="seg">'+modes.map(function(m){
      return '<button class="'+(p.mode===m[0]?"on":"")+'" onclick="setPeriodMode(\''+page+'\',\''+m[0]+'\')">'+m[1]+"</button>";
    }).join("")+"</div>";
  if(p.mode==="custom"){
    h+='<input type="date" id="pc-from-'+page+'" value="'+esc(p.from||"")+'" onchange="setCustom(\''+page+'\')"/>'
      +'<span style="color:var(--faint)">to</span>'
      +'<input type="date" id="pc-to-'+page+'" value="'+esc(p.to||"")+'" onchange="setCustom(\''+page+'\')"/>';
  } else {
    h+='<div class="nav"><button onclick="shiftPeriod(\''+page+'\',-1)" aria-label="Previous">‹</button>'
      +'<button onclick="shiftPeriod(\''+page+'\',1)" aria-label="Next">›</button></div>'
      +'<div class="rng">'+esc(r.label)+"<small>"+esc(r.sub)+"</small></div>";
  }
  return h+'<div class="sp">'+(extra||"")+"</div>";
}
function inRange(dateStr,r){
  var d=parseDMY(dateStr); if(!d) return false;
  return d>=r.from && d<=r.to;
}

function gradesOf(acc){

  return String(r.photo||"").split(/\s+/).filter(function(u){ return /^https?:\/\//.test(u); });

}

function loadAll(force){

  Promise.all([
    api("boot",extra),

    api("gradeBoot",extra).catch(function(e){ return {__err:"grade",error:e.message,grades:[],accounts:[],productTypes:[]}; })
  ]).then(function(res){

    S.stakeholders=b.stakeholders||{}; S.influenceScale=b.influenceScale||[]; S.trustScale=b.trustScale||[];
    S.crmKeys=crm.keys||[];
    S.grades=gr.grades||[]; S.accounts=gr.accounts||[];
    S.productTypes=(gr.productTypes&&gr.productTypes.length?gr.productTypes:(S.lists.productGroup||[]));
    S.gradeMeaning=gr.gradeMeaning||{};
    S.backendWarn=[];
    if(crm.__err) S.backendWarn.push("Task module not deployed: "+crm.error);
    if(gr.__err)  S.backendWarn.push("Grading module not deployed: "+gr.error);
    S.booted=true;
    $("me-av").textContent=initialsOf(S.pic);

    $("me-r").textContent=(S.user.role==="admin"?"Admin · all PICs":"Sales PIC");

    renderPicSw(); badges(); busy(false);
    renderPage(S.page);
    if(S.backendWarn.length) toast(S.backendWarn[0],6000);
  }).catch(function(e){
    busy(false);

      +'<p><b>'+esc(e.message)+'</b><br><br>Check that the web app is deployed with access set to Anyone, '

      +' <button class="btn" onclick="switchUser()">Change PIC</button></p></div></div>';
  });
}

/* ═══ SHARED: DONUT ═══ */
function donutHTML(parts,total,size){
  size=size||156;
  var r=size/2-14, cx=size/2, cy=size/2, C=2*Math.PI*r, off=0, segs="";
  parts.forEach(function(p){
    if(!p.v) return;
    var len=p.v/total*C;
    segs+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+p.c+'" stroke-width="20"'
      +' stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"'
      +' transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(p.k)+": "+p.v+"</title></circle>";
    off+=len;
  });
  if(!total) segs='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#E6EAF1" stroke-width="20"/>';
  return '<svg class="donut" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+segs
    +'<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-size="26" font-weight="750" fill="#003047">'+total+"</text>"
    +'<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#98A2B6" letter-spacing="1">RECORDS</text></svg>';
}

function openGrade(acc,pt){
  S.gradeDraft={account:acc,demand:"High",share:"Low",productType:pt||""};

  if(ex){ S.gradeDraft.demand=ex.demand; S.gradeDraft.share=ex.share; }
  $("mg-title").textContent=ex?"Edit grade":"Grade account";
  $("mg-acc").value=acc;
  var pts=S.productTypes||[];
  $("mg-pt").innerHTML=pts.map(function(x){return "<option>"+esc(x)+"</option>";}).join("");
  if(pt) $("mg-pt").value=pt;
  $("mg-note").value=ex?ex.note:"";
  paintChoice(); openM("m-grade");
}
function setChoice(k,v){ S.gradeDraft[k]=v; paintChoice(); }
function paintChoice(){
  var d=S.gradeDraft;

/* ═══ 3. PROGRESS (GANTT) ═══ */
function toggleKey(id){ S.open[id]=!S.open[id]; renderProgress(); }
function toggleSub(id){ S.openSub[id]=!S.openSub[id]; renderProgress(); }
function toggleAllKeys(){
  var ks=progressKeys(), any=ks.some(function(k){ return !S.open[k.id]; });
  ks.forEach(function(k){ S.open[k.id]=any; }); renderProgress();
}
function progressKeys(){
  var r=periodRange(S.period.progress);
  var q=(S.pgQ||"").toLowerCase().trim();
  return (S.crmKeys||[]).filter(function(k){
    if(q){
      var hay=(k.taskName||"")+" "+(k.pic||"")+" "+(k.subs||[]).map(function(s){
        return (s.taskName||"")+" "+(s.account||""); }).join(" ");
      if(hay.toLowerCase().indexOf(q)<0) return false;
    }
    if(inRange(k.startDate,r)||inRange(k.revisedDate||k.dueDate,r)) return true;
    return (k.subs||[]).some(function(s){ return inRange(s.startDate,r)||inRange(s.revisedDate||s.dueDate,r); });
  });
}
function renderProgress(){
  var extra='<input class="inp" style="width:auto;min-width:180px;padding:7px 10px;font-size:12.5px" placeholder="Search key task or account"'
    +' value="'+esc(S.pgQ||"")+'" oninput="S.pgQ=this.value;clearTimeout(window._pq);window._pq=setTimeout(renderProgress,220)"/>'
    +'<button class="btn sm" onclick="toggleAllKeys()">Expand / collapse</button>'
    +'<button class="btn sm" onclick="loadAll(true)">Refresh</button>';
  $("pbar-progress").innerHTML=periodBarHTML("progress",extra);

  if(S.backendWarn&&S.backendWarn.some(function(w){return /Task module/.test(w);})){
    $("pg-body").innerHTML='<div class="card"><div class="empty"><div class="ic">⚙️</div>'
      +'<p><b>The task module is not deployed yet.</b><br><br>Add <b>Code_CRM.gs</b> to the Apps Script project, paste the doGet and doPost case blocks, then deploy a new version.'
      +'<br><br><button class="btn pri" onclick="loadAll(true)">Check again</button></p></div></div>';
    return;
  }
  var keys=progressKeys();
  if(!keys.length){ $("pg-body").innerHTML='<div class="card"><div class="empty"><div class="ic">🗓</div>'
    +'<p>No key task falls in this period. Move to another week or switch the period to Month.</p></div></div>'; return; }

  var r=periodRange(S.period.progress), cols=[], DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var span=Math.round((r.to-r.from)/864e5)+1;
  var unit=span<=45?"day":(span<=200?"week":"month");
  if(unit==="day"){
    var d=new Date(r.from);
    while(d<=r.to){ cols.push({f:ymd(d),t:ymd(d),n:String(d.getDate()),w:DOW[d.getDay()],we:d.getDay()===0||d.getDay()===6});
      d=new Date(d); d.setDate(d.getDate()+1); }
  } else if(unit==="week"){
    var w=mondayOf(r.from);
    while(w<=r.to){ var we=new Date(w); we.setDate(w.getDate()+6);
      cols.push({f:ymd(w),t:ymd(we),n:w.getDate()+"/"+(w.getMonth()+1),w:"Wk",we:false});
      w=new Date(w); w.setDate(w.getDate()+7); }
  } else {
    var m=new Date(r.from.getFullYear(),r.from.getMonth(),1);
    while(m<=r.to){ cols.push({f:ymd(new Date(m.getFullYear(),m.getMonth(),1)),
      t:ymd(new Date(m.getFullYear(),m.getMonth()+1,0)),n:String(m.getMonth()+1),w:String(m.getFullYear()).slice(2),we:false});
      m=new Date(m.getFullYear(),m.getMonth()+1,1); }
  }
  var n=cols.length, todayISO=ymd(new Date());
  function pos(ds){ var d=parseDMY(ds); if(!d) return -1; var s=ymd(d);
    for(var i=0;i<n;i++) if(s>=cols[i].f&&s<=cols[i].t) return i;
    return s<cols[0].f?0:n-1; }
  function bar(s1,s2,c){
    var a=pos(s1),b=pos(s2); if(a<0&&b<0) return "";
    if(a<0)a=b; if(b<0)b=a; if(b<a){var x=a;a=b;b=x;}
    var l=a/n*100, w=(b-a+1)/n*100; if(l+w>100)w=100-l;
    return "left:"+l+"%;width:"+Math.max(w,1.4)+"%;background:"+c;
  }
  var track=cols.map(function(c){ return '<div class="gc'+(c.we?" we":"")+'"></div>'; }).join("");
  var head=cols.map(function(c){ var t=(todayISO>=c.f&&todayISO<=c.t);
    return '<div class="gd'+(t?" td":"")+(c.we?" we":"")+'"><span class="w">'+esc(c.w)+'</span><span class="n">'+esc(c.n)+"</span></div>"; }).join("");
  var nowL=(todayISO>=cols[0].f&&todayISO<=cols[n-1].t)?((pos(dmy(new Date()))+0.5)/n*100):-1;

  var body="";
  keys.forEach(function(k){
    var subs=k.subs||[], open=!!S.open[k.id], p=keyPct(k), late=subs.some(isLate)||(!subs.length&&isLate(k));
    body+='<div class="gkey'+(open?" open":"")+(late?" late":"")+'">'
      +'<div class="glbl k" onclick="toggleKey(\''+jsq(k.id)+'\')">'
        +'<svg class="gcar" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>'
        +'<span class="gdot" style="background:'+pctColor(p)+'"></span>'
        +'<span class="gnm">'+esc(k.taskName)+(late?'<span class="od">OVERDUE</span>':"")+"</span>"
        +'<span class="gpc" style="color:'+pctColor(p)+'">'+p+"%</span></div>"
      +'<div class="gres">'+esc(k.pic||"—")+" · "+subs.length+" sub task"+(subs.length===1?"":"s")+" · "
        +subs.filter(function(s){return /complet/i.test(s.status||"");}).length+" done</div>"
      +'<div class="gtrack">'+track
        +(function(){ var b=bar(k.startDate,k.revisedDate||k.dueDate,late?"#D9433F":"#3A5CAA");
          return b?'<div class="gbar" style="'+b+'" onclick="toggleKey(\''+jsq(k.id)+'\')"><i style="width:'+p+'%"></i><span>'+p+"%</span></div>":""; })()
      +"</div></div>";
    if(!open) return;
    subs.forEach(function(s){
      var sp=subPct(s), lt=isLate(s), nm=accShort(s.account)||s.taskName||"Sub task";
      body+='<div class="gsub'+(lt?" late":"")+'">'
        +'<div class="glbl s" onclick="toggleSub(\''+jsq(s.id)+'\')">'
          +'<span class="gdot" style="background:'+(ST_C[s.status]||"#98A2B6")+'"></span>'
          +'<span class="gnm">'+esc(nm)+(lt?'<span class="od">OVERDUE</span>':"")+"</span></div>"
        +'<div class="gres">'+esc(String(s.result||s.plan||"—").slice(0,90))+"</div>"
        +'<div class="gtrack">'+track
          +(function(){ var b=bar(s.startDate,s.revisedDate||s.dueDate,lt?"#D9433F":pctColor(sp));
            return b?'<div class="gbar sb" style="'+b+'" onclick="toggleSub(\''+jsq(s.id)+'\')"><i style="width:'+sp+'%"></i><span>'+sp+"%</span></div>":""; })()
        +"</div></div>";
      if(S.openSub[s.id]) body+='<div class="gresrow">'+subPanel(s,k)+"</div>";
    });
  });

  $("pg-body").innerHTML='<div class="gwrap"><div class="ggrid">'
    +'<div class="ghead"><div class="ghl lbl">Key task · click to expand sub tasks</div>'
    +'<div class="ghr lbl">Owner and result</div>'
    +'<div class="gdays">'+head+(nowL>=0?'<div class="gnow" style="left:'+nowL+'%"><span>Today</span></div>':"")+"</div></div>"
    +body+"</div></div>"
    +'<div style="display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)">'
    +[["#D9433F","0–25%"],["#E8833A","25–50%"],["#E5B300","50–75%"],["#3FA64B","75–99%"],["#1E9E5A","100%"]]
      .map(function(x){ return '<span><b style="display:inline-block;width:11px;height:11px;border-radius:3px;background:'+x[0]+'"></b> '+x[1]+"</span>"; }).join("")
    +"</div>";
}

/* ═══ 5. KPI ═══ */
function renderKpi(){
  $("pbar-kpi").innerHTML=periodBarHTML("kpi","");
  var r=periodRange(S.period.kpi), p=S.period.kpi;
  var accs=scopeAccounts();
  var rows=scopeRows().filter(function(x){ return inRange(x.startDate,r); });
  var done=rows.filter(function(x){ return /complet/i.test(x.taskStatus||""); });
  var pres=rows.filter(function(x){ return /present/i.test((x.typeAction||"")+" "+(x.typeTask||"")); });
  var accSet={}; rows.forEach(function(x){ var k=accShort(x.account).toLowerCase(); if(k&&k!=="mmh") accSet[k]=1; });

  // annual targets scaled to the selected period length
  var FY_T={visiting:270,presentation:30,newAccount:12};
  var days=Math.round((r.to-r.from)/864e5)+1;
  var factor=days/365;
  var elapsed=Math.min(1,Math.max(0,(Math.min(new Date(),r.to)-r.from)/(r.to-r.from||1)));
  var pace=Math.round(elapsed*100);

  var cards=[
    {n:"Field visits",a:rows.length,t:Math.round(FY_T.visiting*factor),u:"visits",
     s:"Weekly Report rows with a start date inside the period"},
    {n:"Product presentations",a:pres.length,t:Math.max(1,Math.round(FY_T.presentation*factor)),u:"sessions",
     s:"Rows where type action or type task mentions presentation"},
    {n:"Account coverage",a:Object.keys(accSet).length,t:Math.max(1,accs.length),u:"accounts in scope",
     s:"Distinct accounts visited at least once in the period"},
    {n:"Completion rate",a:rows.length?Math.round(done.length/rows.length*100):0,t:100,u:"%",
     s:"Share of visits in the period marked Completed"}];

  var series=kpiSeries(r);
  $("kpi-body").innerHTML='<div class="kgrid">'+cards.map(function(c){
    var pct=c.t?Math.min(100,Math.round(c.a/c.t*100)):0, behind=pct<pace-8;
    return '<div class="kcard'+(behind?" behind":"")+'">'
      +'<div style="display:flex;align-items:flex-start;gap:10px"><div style="flex:1">'
      +'<div class="k-nm">'+esc(c.n)+'</div><div class="k-sc">'+esc(c.s)+"</div></div>"
      +(behind?'<span class="pill r">Behind pace</span>':'<span class="pill g">On pace</span>')+"</div>"
      +'<div class="k-fig"><span class="k-a" style="color:'+pctColor(pct)+'">'+c.a.toLocaleString("en-US")+"</span>"
      +'<span class="k-t">/ '+c.t.toLocaleString("en-US")+" "+esc(c.u)+"</span></div>"
      +'<div class="k-track"><i style="width:'+pct+"%;background:"+pctColor(pct)+'"></i><b style="left:'+pace+'%"></b></div>'
      +'<div class="k-pace"><span>Achieved <b style="color:'+pctColor(pct)+'">'+pct+"%</b></span><span>Period elapsed "+pace+"%</span></div>"
      +"</div>"; }).join("")+"</div>"

    +'<div class="card" style="margin-top:16px"><div class="card-h"><h3>Visit volume by '+(series.unit)+"</h3>"
      +'<span class="hs">'+esc(periodRange(p).label)+"</span></div><div class=\"card-b\">"
      +'<div class="spark" style="height:96px">'+series.data.map(function(d){
          var mx=Math.max(1,Math.max.apply(null,series.data.map(function(x){return x.v;})));
          return '<i class="'+(d.v?"f":"")+'" style="height:'+(d.v?Math.max(8,d.v/mx*100):3)+'%" title="'+esc(d.l)+": "+d.v+'"></i>'; }).join("")+"</div>"
      +'<div style="display:flex;gap:3px;margin-top:6px">'+series.data.map(function(d){
          return '<span style="flex:1;text-align:center;font-size:9px;color:var(--faint);font-weight:600">'+esc(d.l)+"</span>"; }).join("")+"</div>"
      +'<div style="font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.55">Targets are the FY67 annual figures held in the backend (270 visits, 30 presentations, 12 new accounts), pro-rated to the length of the selected period.</div>'
      +"</div></div>"

    +'<div class="card" style="margin-top:16px"><div class="card-h"><h3>Visits by PIC</h3></div><div class="card-b">'
    +(function(){
      var byPic={}; rows.forEach(function(x){ byPic[x.pic||"—"]=(byPic[x.pic||"—"]||0)+1; });
      var ks=Object.keys(byPic).sort(function(a,b){return byPic[b]-byPic[a];});
      if(!ks.length) return '<div class="empty"><div class="ic">📊</div><p>No visit logged in this period.</p></div>';
      var mx=byPic[ks[0]]||1;
      return ks.map(function(k){
        return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12.5px;font-weight:650;margin-bottom:5px">'
          +"<span>"+esc(k)+"</span><span>"+byPic[k]+"</span></div>"
          +'<div style="height:20px;background:var(--pale);border-radius:6px;overflow:hidden">'
          +'<div style="height:100%;width:'+(byPic[k]/mx*100)+'%;background:var(--blue);border-radius:6px"></div></div></div>'; }).join("");
    })()+"</div></div>";
}
function kpiSeries(r){
  var days=Math.round((r.to-r.from)/864e5)+1, rows=scopeRows(), out=[], unit;
  if(days<=31){ unit="day"; var d=new Date(r.from);
    while(d<=r.to){ var s=dmy(d);
      out.push({l:String(d.getDate()),v:rows.filter(function(x){return x.startDate===s;}).length});
      d=new Date(d); d.setDate(d.getDate()+1); }
    if(out.length>16) out=out.filter(function(_,i){return i%2===0;});
  } else if(days<=120){ unit="week"; var w=mondayOf(r.from);
    while(w<=r.to){ var we=new Date(w); we.setDate(w.getDate()+6);
      out.push({l:w.getDate()+"/"+(w.getMonth()+1),
        v:rows.filter(function(x){ var p=parseDMY(x.startDate); return p&&p>=w&&p<=we; }).length});
      w=new Date(w); w.setDate(w.getDate()+7); }
  } else { unit="month"; var m=new Date(r.from.getFullYear(),r.from.getMonth(),1);
    while(m<=r.to){ var me=new Date(m.getFullYear(),m.getMonth()+1,0), mm=new Date(m);
      out.push({l:String(m.getMonth()+1),
        v:rows.filter(function(x){ var p=parseDMY(x.startDate); return p&&p>=mm&&p<=me; }).length});
      m=new Date(m.getFullYear(),m.getMonth()+1,1); }
  }
  return {unit:unit,data:out};
}

/* ═══ 6. PHOTOS ═══ */
function renderPhotos(){
  $("pbar-photos").innerHTML=periodBarHTML("photos","");
  var r=periodRange(S.period.photos);
  var rows=scopeRows().filter(function(x){ return inRange(x.startDate,r)&&photosOf(x).length; })
    .sort(function(a,b){ return (parseDMY(b.startDate)||0)-(parseDMY(a.startDate)||0); });
  var total=rows.reduce(function(n,x){ return n+photosOf(x).length; },0);
  if(!total){ $("ph-body").innerHTML='<div class="card"><div class="empty"><div class="ic">📷</div>'
    +'<p>No photo was captured in this period.</p></div></div>'; return; }
  var byDate={}; rows.forEach(function(x){ (byDate[x.startDate]=byDate[x.startDate]||[]).push(x); });
  var dates=Object.keys(byDate).sort(function(a,b){ return (parseDMY(b)||0)-(parseDMY(a)||0); });
  $("ph-body").innerHTML='<div style="font-size:12.5px;color:var(--sub);margin-bottom:14px">'
    +total+" photos · "+rows.length+" visits · "+dates.length+" field days</div>"
    +dates.map(function(d){
      var list=byDate[d], nn=list.reduce(function(a,x){return a+photosOf(x).length;},0);
      return '<div class="card" style="margin-bottom:14px"><div class="card-h"><h3>'+esc(d)+"</h3>"
        +'<span class="hs">'+list.length+" visits · "+nn+" photos</span></div><div class=\"card-b\"><div class=\"gal\">"
        +list.map(function(x){ return photosOf(x).map(function(u){
            return '<button class="ph" onclick="window.open(\''+jsq(u)+'\',\'_blank\')">'
              +'<img class="im" src="'+esc(thumbOf(u))+'" loading="lazy"/>'
              +'<div class="cap"><div class="cn">'+esc(accShort(x.account)||"—")+"</div>"
              +'<div class="cd">'+esc(x.pic)+(x.typeAction?" · "+esc(x.typeAction):"")+"</div></div></button>"; }).join(""); }).join("")
        +"</div></div></div>"; }).join("");
}
