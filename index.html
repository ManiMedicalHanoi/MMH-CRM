/* ⭐ v4.4 — GPS 2 tầng: thử độ chính xác cao trước, hỏng thì hạ xuống định vị
   thường (wifi/cell) với thời gian chờ dài hơn, cuối cùng mới dùng vị trí đã
   lấy được gần đây. Trên điện thoại, GPS chính xác cao thường cần >8 giây. */
function gpsFrom(p){ return {lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}; }
function warmGps(){                       /* làm nóng sẵn để lần chụp đầu có ngay */
  if(!("geolocation" in navigator)) return;
  try{
    navigator.geolocation.getCurrentPosition(
      function(p){ S._gps={g:gpsFrom(p),at:Date.now()}; }, function(){},
      {enableHighAccuracy:false,timeout:20000,maximumAge:300000});
  }catch(e){}
}
function getGps(){
  return new Promise(function(res){
    if(!("geolocation" in navigator)) return res(null);
    var done=false;
    function ok(p){ if(done)return; done=true; var g=gpsFrom(p); S._gps={g:g,at:Date.now()}; res(g); }
    function fallback(){
      if(done)return;
      navigator.geolocation.getCurrentPosition(ok,function(){
        if(done)return; done=true;
        var c=S._gps;                      /* dùng lại vị trí lấy được trong 10 phút */
        res((c&&Date.now()-c.at<600000)?c.g:null);
      },{enableHighAccuracy:false,timeout:15000,maximumAge:300000});
    }
    try{
      navigator.geolocation.getCurrentPosition(ok,fallback,{enableHighAccuracy:true,timeout:10000,maximumAge:0});
    }catch(e){ fallback(); }
  });
}
function retryGps(which){
  busy(true,"Đang lấy vị trí GPS…");
  getGps().then(function(g){
    busy(false);
    if(!g) return toast("Vẫn chưa lấy được vị trí. Kiểm tra: đã BẬT Vị trí (Location) của điện thoại, và cho phép trang này truy cập vị trí.","warn",7000);
    if(which==="nt"){ if(S.ntPhoto){ S.ntPhoto.gps=g; ntDraw(); } }
    else if(S.pending){ S.pending.gps=g; renderPending(); }
    toast("✓ Đã lấy được vị trí","ok");
  });
}
function compress(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var mx=1600,w=img.width,h=img.height;
      if(w>mx||h>mx){ if(w>h){ h=Math.round(h*mx/w); w=mx; } else { w=Math.round(w*mx/h); h=mx; } }
      var c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",.82));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("Không đọc được ảnh")); };
    img.src=url;
  });
}

/* ═══════════ ⭐ v5 — QUY TẮC ẢNH ĐI ĐỊA BÀN ═══════════
   Yêu cầu: "Up ảnh tại địa chỉ khi đến địa bàn, không up sau, không dùng lại ảnh cũ."
   Ép bằng 3 lớp:
     1) chỉ còn 1 nút mở camera (capture="environment") — đã bỏ nút chọn từ thư viện;
     2) kiểm tra lastModified của tệp — ảnh vừa chụp luôn có mốc thời gian cách
        hiện tại vài giây, ảnh cũ trong máy bị chặn ngay tại trình duyệt;
     3) chặn dán ảnh từ clipboard. */
var PHOTO_MAX_AGE_MIN = 10;
function photoFresh(file){
  if(!file) return { ok:false, why:"Không đọc được tệp ảnh" };
  var lm = file.lastModified || (file.lastModifiedDate && +file.lastModifiedDate) || 0;
  if(!lm) return { ok:true };            /* máy không cung cấp mốc thời gian ⇒ cho qua */
  var ageMin = (Date.now() - lm) / 60000;
  if(ageMin > PHOTO_MAX_AGE_MIN){
    var d = new Date(lm);
    return { ok:false, why:"Ảnh này chụp lúc " +
      ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+" ngày "+
      fmtVN(d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2))+
      " — không phải ảnh vừa chụp. Quy định: chụp ngay tại địa bàn, không dùng ảnh cũ." };
  }
  if(ageMin < -5) return { ok:false, why:"Đồng hồ máy đang lệch giờ — chỉnh lại rồi chụp lại" };
  return { ok:true };
}
function photoGate(file){
  var r=photoFresh(file);
  if(!r.ok) toast("⛔ "+r.why,"err",9000);
  return r.ok;
}
function handleFiles(files){
  if(!files||!files.length) return;
  if(!photoGate(files[0])){ try{$("tk-cam").value="";}catch(e){} return; }
  var w=S.task||{}, had=(w.photos||[]).length>0;   /* mọi lần tải lên đều ĐÈ ⇒ luôn đúng 1 ảnh */
  if(had && !confirm("Task này đã có ảnh đi địa bàn.\nẢnh mới sẽ ĐÈ LÊN ảnh cũ (ảnh cũ bị xoá khỏi Drive). Tiếp tục?")){
    try{$("tk-cam").value="";}catch(e){} return;
  }
  var arr=Array.prototype.slice.call(files);
  if(arr.length>1){ arr=[arr[arr.length-1]]; toast("Mỗi task chỉ 1 ảnh — đã lấy ảnh cuối","warn"); }
  busy(true,"Đang nén ảnh & lấy vị trí GPS…");
  Promise.all([compress(arr[0]),getGps()]).then(function(o){
    S.pending={ dataUrl:o[0], gps:o[1], replace:had };
    busy(false); renderPending();
    try{$("tk-cam").value="";}catch(e){}
  }).catch(function(e){ busy(false); toast(e.message,"err"); });
}
document.addEventListener("paste",function(e){
  if(!$("drw").classList.contains("on")||!S.taskRow) return;
  var it=(e.clipboardData||{}).items||[];
  for(var i=0;i<it.length;i++) if(it[i].type.indexOf("image")===0){
    e.preventDefault();
    toast("⛔ Ảnh đi địa bàn phải chụp trực tiếp bằng camera — không dán từ clipboard","err",8000);
    return;
  }
});
function renderPending(){
  var z=$("tk-pend"); if(!z) return;
  if(!S.pending){ z.innerHTML=""; return; }
  var g=S.pending.gps;
  z.innerHTML='<div class="pend"><div class="pt">⏳ Ảnh chờ gửi · '+(g?("📍 "+g.lat.toFixed(5)+", "+g.lng.toFixed(5)+" (±"+g.acc+"m)"):"⚠ không lấy được GPS")+'</div>'
    +'<img src="'+S.pending.dataUrl+'" alt="">'
    +'<div class="rw"><button class="ok" onclick="uploadPending()">✓ Gửi ảnh ngay</button><button class="no" onclick="S.pending=null;renderPending()">Huỷ</button></div>'
    +(g?"":'<button class="retrygps" onclick="retryGps()">📍 Lấy lại vị trí GPS</button>')
    +'<div style="font-size:11px;color:var(--sub);margin-top:7px">Ảnh cũng được gửi tự động khi bấm <b>Cập nhật vào Sheet</b>.</div></div>';
}
function uploadPending(silent){
  if(!S.pending) return Promise.resolve();
  var p=S.pending, w=S.task||{};
  if(!silent) busy(true,"Đang tải ảnh lên Drive…");
  var body={ action:"uploadPhoto", b64:p.dataUrl, mime:"image/jpeg", row:S.taskRow,
             account:w.account, date:String(w.start).slice(0,10), pic:w.pic||S.user.pic, replace:1 };
  if(p.gps){ body.lat=p.gps.lat; body.lng=p.gps.lng; body.acc=p.gps.acc; }
  return apiPost(body).then(function(r){
    S.pending=null;
    if(S.task){
      S.task.photos=[{id:r.id,thumb:r.thumb,full:r.thumb,open:r.url}];
      S.task.photo=r.url; S.task.gps=r.gps||""; S.task.gpsAddr=r.gpsAddr||"";
    }
    if(!silent){ busy(false); toast("✓ Đã tải ảnh lên Drive"+(r.gpsAddr?" · "+r.gpsAddr:""),"ok",4200);
      openTaskAfterSync(); }
    return r;
  }).catch(function(e){ if(!silent) busy(false); throw e; });
}
function openTaskAfterSync(){
  var row=S.taskRow;
  if(S.task && row){                       /* vá tại chỗ ⇒ drawer mở lại tức thì */
    terrRows().forEach(function(w,i){ if(w._row===row) S.cache.weekly.rows[i]=S.task; });
    terrSave(terrRows());
  }
  if(S.cache.weekly) S.cache.weekly.at=0;
  if($("drw").classList.contains("on")&&row) openTask(row);
  loadTerritoryAll(true);
}
function deleteTaskPhoto(fileId){
  if(!confirm("Xoá ảnh này khỏi Drive và khỏi sheet?")) return;
  busy(true,"Đang xoá ảnh…");
  apiPost({action:"deletePhoto",row:S.taskRow,fileId:fileId||""}).then(function(r){
    busy(false); toast(r.message||"Đã xoá ảnh","ok");
    if(S.task){ S.task.photos=[]; S.task.photo=""; S.task.gps=""; S.task.gpsAddr=""; }
    openTaskAfterSync();
  }).catch(function(e){ busy(false); toast(e.message,"err",5000); });
}

/* ───────── LƯU TASK ───────── */
function saveTask(){
  var w=S.task||{};
  var typeAction=curV("tk-ta","typeAction"), status=curV("tk-status","status");
  var result=curV("tk-result","result"), next=curV("tk-next","nextAction");
  var bad=[];
  function mark(id,ok,lb){ var el=$(id); if(el) el.classList.toggle("bad",!ok); if(!ok) bad.push(lb); }
  /* ⭐ v8.1 — việc mới lên kế hoạch (chưa có CBC trong kết quả) thì Next action,
     Customer feedback, kết quả và ảnh đều CHƯA bắt buộc. Chỉ siết khi đã đi gặp thật
     hoặc khi đã đặt trạng thái Completed. */
  var hasCbc=MEET_RE.test(String(result||""));
  var isDone=/complet/i.test(String(status||""));
  mark("tk-status",!!String(status).trim(),"Task Status");
  mark("tk-ta",!!String(typeAction).trim(),"Type action");
  mark("tk-tt",!!String(curV("tk-tt","typeTask")).trim(),"Type task");
  mark("tk-next",hasCbc?!!String(next).trim():true,"Next action");
  mark("tk-fb",hasCbc?!!String(curV("tk-fb","feedback")).trim():true,"Customer feedback");
  mark("tk-result",isDone?!!String(result).trim():true,"Task Result");
  if(String(result).trim() && !hasCbc) bad.push("CBC (dòng “Người gặp:” trong Task Result)");
  if(next==="Dừng lại" && !String(curV("tk-stop","stopReason")).trim()){ mark("tk-stop",false,"Lý do dừng chăm sóc"); }
  if(isDone && typeAction==="Visiting" && !S.pending && !(w.photos||[]).length) bad.push("ảnh đi địa bàn (bắt buộc với Visiting đã hoàn thành)");
  if(bad.length){ toast("⚠️ Cần bổ sung: "+bad.join(", "),"warn",6000); return; }

  var hasData=Object.keys(S.dirty).length>0, hasPh=!!S.pending;
  if(!hasData&&!hasPh) return toast("Chưa có thay đổi nào");

  var btn=$("tk-save"); if(btn) btn.disabled=true;
  busy(true,"Đang ghi vào Google Sheet…");
  var chain=Promise.resolve();
  if(hasData){
    var d={_row:S.taskRow};
    ["plan","result","status","nextAction","stopReason","feedback","process","typeTask","typeAction","product","start"].forEach(function(f){
      if(f in S.dirty) d[f]=S.dirty[f];
    });
    if(d.start) d.finish=d.start;
    if(("nextAction" in d)&&d.nextAction!=="Dừng lại") d.stopReason="";
    chain=chain.then(function(){ return apiPost({action:"saveWeekly",data:d}); });
  }
  chain.then(function(){ if(hasPh){ busy(true,"Đang tải ảnh kèm GPS…"); return uploadPending(true); } })
  .then(function(){
    busy(false); if(btn) btn.disabled=false;
    toast("✓ Đã cập nhật task vào Sheet","ok",3800);
    closeDrw();
    afterWrite("weekly", S.taskRow, null);
    S.taskRow=0; terrRefresh();
  }).catch(function(e){ busy(false); if(btn) btn.disabled=false; toast(e.message,"err",6000); });
}
function deleteTaskFlow(){
  var b=$("tk-del"); if(!b) return;
  if(!S._delArmed){
    S._delArmed=true; b.textContent="⚠️ Bấm lần nữa để XÁC NHẬN xoá";
    setTimeout(function(){ if(S._delArmed&&$("tk-del")){ S._delArmed=false; $("tk-del").textContent="🗑 Xoá task"; } },4000);
    return;
  }
  S._delArmed=false; b.disabled=true;
  busy(true,"Đang xoá task…");
  apiPost({action:"deleteRow",tab:"weekly",row:S.taskRow}).then(function(r){
    busy(false); toast(r.message||"Đã xoá task","ok");
    closeDrw(); afterWrite("weekly",S.taskRow,null,true);
    S.taskRow=0; terrRefresh();
  }).catch(function(e){ busy(false); b.disabled=false; toast(e.message,"err",5000); });
}

/* ───────── VOICE ───────── */
var _rec=null,_recT=null,_recB=null;
function toggleVoice(id,btn){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return toast("Trình duyệt không hỗ trợ nhập bằng giọng nói","warn");
  if(_rec) return stopVoice();
  _rec=new SR(); _rec.lang="vi-VN"; _rec.continuous=true; _rec.interimResults=true;
  _recT=$(id); _recB=btn; if(!_recT) return;
  var base=_recT.value?(_recT.value+" "):"";
  btn.classList.add("listening"); btn.innerHTML="⏺ Đang nghe…";
  _rec.onresult=function(e){
    var t=""; for(var i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript;
    _recT.value=base+t;
    var f={"tk-plan":"plan","tk-result":"result","tk-stop":"stopReason","nt_result":null}[_recT.id];
    if(f) markDirty(f,_recT.value);
  };
  _rec.onend=stopVoice; _rec.onerror=stopVoice;
  try{_rec.start();}catch(e){}
}
function stopVoice(){ if(_rec){try{_rec.stop();}catch(e){} _rec=null;} if(_recB){_recB.classList.remove("listening");_recB.innerHTML="🎤 Nói";_recB=null;} _recT=null; }

function ntTbdProv(){

          : (v.trim() ? v.replace(/\s+$/,"")+"\n"+line : TBD_PLAN_PH.split("\n").slice(0,2).join("\n")+"\n"+line);

/* ⭐ v4.4 — Account type ở tab "2. CBC" quyết định Type task
   (Clinic ⇒ Sale-Clinics, Dealer ⇒ Sale-Dealers, Hospital ⇒ Sale-Hospitals…) */
function typeTaskForAcc(t){
  var list=S.master.typeTask||[], key=noAcc(String(t||"")).replace(/[^a-z0-9]/g,"");
  if(!key) return "";
  var k1=key, k2=key.replace(/s$/,"");
  for(var i=0;i<list.length;i++){
    var k=noAcc(list[i]).replace(/[^a-z0-9]/g,"");
    if(k.indexOf(k1)>=0||k.indexOf(k2)>=0) return list[i];
  }
  return "";
}
/* ⭐ v8.1 — dò đúng chữ trong Master của sheet, tránh hardcode sai chính tả */
function stFind(re,fb){
  var l=S.master.status||[], i;
  for(i=0;i<l.length;i++) if(re.test(String(l[i]))) return l[i];
  return fb;
}
function stTodo(){ return stFind(/to\s*-?\s*do|not\s*start|chưa|plan/i,"To do"); }
function stDone(){ return stFind(/complet|hoàn\s*thành/i,"Completed"); }
function stHas(v){ return (S.master.status||[]).indexOf(v)>=0; }
/* đủ dữ liệu ⇒ coi như đã làm xong: có CBC trong kết quả + có ảnh nếu Visiting + có Next action */
function ntReady(){
  var res=$("nt_result")?$("nt_result").value:"";
  if(!MEET_RE.test(res||"")) return false;
  if(($("nt_typeAction")||{}).value==="Visiting" && !S.ntPhoto) return false;
  return !!String((($("nt_next")||{}).value)||"").trim();
}
function ntAutoStatus(){
  var s=$("nt_status"); if(!s||S.ntStatusManual) return;
  var ready=ntReady(), want=ready?stDone():stTodo();
  if(want && stHas(want) && s.value!==want) s.value=want;
  var h=$("nt_stHint");
  if(h) h.textContent=ready
    ? "✓ Đã đủ CBC · ảnh · next action — tự chuyển Completed"
    : "Mới lên kế hoạch — để To Do; điền đủ CBC · ảnh · next action sẽ tự chuyển Completed";
}
function ntPhotoHint(){
  var v=$("nt_typeAction")?$("nt_typeAction").value:"";
  var h=$("nt_phHint"); if(h) h.innerHTML=(v==="Visiting")?'<b style="color:#A82F2C">Bắt buộc</b> với Visiting · 1 ảnh · kèm GPS':'Không bắt buộc với hình thức này';
}
function ntStopToggle(){ var w=$("nt_stopWrap"); if(w) w.style.display=($("nt_next").value==="Dừng lại")?"":"none"; }
function ntFiles(files){
  if(!files||!files.length) return;
  if(!photoGate(files[0])){ try{$("nt_file").value="";}catch(e){} return; }
  busy(true,"Đang nén ảnh & lấy GPS…");
  Promise.all([compress(files[0]),getGps()]).then(function(o){
    S.ntPhoto={dataUrl:o[0],gps:o[1]}; busy(false); ntDraw();
    try{$("nt_file").value="";}catch(e){}
  }).catch(function(e){ busy(false); toast(e.message,"err"); });
}
function ntDraw(){
  var b=$("nt_phBox"); if(!b) return;
  ntAutoStatus();
  if(!S.ntPhoto){ b.innerHTML=""; return; }
  var g=S.ntPhoto.gps;
  b.innerHTML='<div class="pp-cur" style="margin-bottom:9px"><img src="'+S.ntPhoto.dataUrl+'" alt="">'
    +'<button class="del" onclick="S.ntPhoto=null;ntDraw()">🗑</button></div>'
    +'<div class="gpsline" style="margin-bottom:9px">'+(g?("📍 "+g.lat.toFixed(5)+", "+g.lng.toFixed(5)+" (±"+g.acc+"m)"):"⚠ Chưa lấy được vị trí — bật Location rồi bấm lấy lại")+'</div>'
    +(g?"":'<button class="retrygps" style="margin-bottom:9px" onclick="retryGps(\'nt\')">📍 Lấy lại vị trí GPS</button>');
}
function ntMeetPicker(){
  var accName=String($("nt_accName")?$("nt_accName").value:"").trim();
  if(!accName) return toast("Chọn Account trước đã","warn");
  /* ⭐ v4.7 — truyền account trực tiếp, KHÔNG ghi đè S.task của form chi tiết */
  openMeetPicker("nt_result", ($("nt_account")&&$("nt_account").value)||mkAcc({name:accName}));
}
/* ⭐ v4.7 — đèn báo trạng thái dòng "Người gặp:" ngay trong form Thêm task */
function ntMeetFlag(){
  var t=$("nt_result"), f=$("nt_meetflag"); if(!t||!f) return;
  /* ⭐ v7.1 — để trống thì được (PIC lên kế hoạch trước, ghi kết quả sau).
     Nhưng đã viết kết quả thì bắt buộc có dòng "Người gặp:". */
  var has=!!String(t.value||"").trim();
  var ok=MEET_RE.test(t.value||"");
  if(!has){
    f.style.color="var(--mute)";
    f.textContent="Có thể để trống nếu mới lên kế hoạch — ghi kết quả sau khi đi";
  }else{
    f.style.color=ok?"var(--ok)":"var(--dang)";
    f.textContent=ok?"✓ Đã ghi CBC (người gặp) — có thể lưu"
                    :"⚠️ Đã có nội dung thì bắt buộc dòng “Người gặp:” — bấm nút CBC ở trên";
  }
  ntAutoStatus();
}
function submitNewTask(){
  var accName=$("nt_accName").value.trim();
  /* ⭐ v10 — TBD: Plan bắt buộc, Result/ảnh/next action thì không.
     Kỳ ép về trọn tuần; Task Result do Code.gs điền công thức tự tổng hợp. */
  if(isTbdName(accName)){
    var plan=String(($("nt_plan")||{}).value||"").trim();
    if(!plan) return toast("⚠️ Chọn TBD thì bắt buộc ghi Plan — dự tính tiếp cận nhóm khách hàng nào","warn",6500);
    var t=tbdRow($("nt_start").value, plan, ($("nt_prov")||{}).value||"", $("nt_pic").value);
    t.typeTask=$("nt_typeTask").value||t.typeTask;
    if(!t.typeTask) return toast("⚠️ Cần bổ sung: Type task","warn",5000);
    busy(true,"Đang ghi kế hoạch TBD vào Google Sheet…");
    return apiPost({action:"saveWeekly",data:t}).then(function(r){
      busy(false); closeModal(); S.ntDraft=""; S.ntTbd=false;
      toast("✓ Đã tạo kế hoạch đi địa bàn (chưa xác định account) cho tuần "+fmtVN(t.start)+" – "+fmtVN(t.finish),"ok",5600);
      afterWrite("weekly", r.row||0, t);
      S.vMode="week"; S.wkFrom=t.start; S.wkTo=t.finish; S.vAnchor=t.start;
      terrRefresh();
    }).catch(function(e){ busy(false); toast(e.message,"err",6000); });
  }
  var d={ _row:0,
    account:$("nt_account").value||mkAcc({name:accName}),
    start:$("nt_start").value, finish:$("nt_start").value, pic:$("nt_pic").value,
    typeTask:$("nt_typeTask").value, typeAction:$("nt_typeAction").value,
    process:$("nt_process").value, product:$("nt_product").value,
    plan:$("nt_plan").value,
    /* ⭐ v7.1 — lấy từ ô nhập; nếu ô vừa bị dựng lại và rỗng thì dùng bản nháp đã gõ */
    result:(String($("nt_result").value||"").trim() ? $("nt_result").value : (S.ntDraft||"")),
    status:$("nt_status").value,
    feedback:$("nt_feedback").value, nextAction:$("nt_next").value,
    stopReason:($("nt_next").value==="Dừng lại")?$("nt_stop").value:"" };
  var bad=[];
  if(!accName) bad.push("Account");
  if(!d.start) bad.push("Ngày");
  if(!d.typeTask) bad.push("Type task");
  if(!d.typeAction) bad.push("Type action");
  if(!d.status) bad.push("Task Status");
  /* ⭐ v8.1 — Next action & Customer feedback CHỈ bắt buộc khi Task Result đã có CBC
     (tức là đã đi gặp thật). Còn đang lên kế hoạch thì để trống thoải mái. */
  if(MEET_RE.test(String(d.result||""))){
    if(!d.nextAction) bad.push("Next action");
  if(!d.process) bad.push("Sales Process");
  if(!d.product) bad.push("Product group");
    if(!String(d.feedback||"").trim()) bad.push("Customer feedback");
  }
  /* ⭐ v7.1 — Task Result KHÔNG bắt buộc (PIC lên kế hoạch trước, ghi kết quả sau);
     nhưng đã viết kết quả thì buộc phải có dòng "Người gặp:".
     Ảnh Visiting cũng không bắt buộc lúc tạo — bổ sung sau khi đi thực địa. */
  if(String(d.result).trim() && !MEET_RE.test(d.result))
    bad.push("CBC — dòng “Người gặp:” trong Task Result");
  if(d.nextAction==="Dừng lại"&&!String(d.stopReason).trim()) bad.push("Lý do dừng");
  if(bad.length) return toast("⚠️ Cần bổ sung: "+bad.join(", "),"warn",6000);

  var later=[];
  if(!String(d.result).trim()) later.push("kết quả");
  if(d.typeAction==="Visiting"&&!S.ntPhoto) later.push("ảnh chụp tại địa bàn");

  busy(true,"Đang ghi vào Google Sheet…");
  apiPost({action:"saveWeekly",data:d}).then(function(r){
    var row=r.row||0;
    if(!S.ntPhoto||!row) return r;
    busy(true,"Đang tải ảnh kèm GPS…");
    var body={ action:"uploadPhoto", b64:S.ntPhoto.dataUrl, mime:"image/jpeg", row:row,
               account:d.account, date:d.start, pic:d.pic, replace:1 };
    if(S.ntPhoto.gps){ body.lat=S.ntPhoto.gps.lat; body.lng=S.ntPhoto.gps.lng; body.acc=S.ntPhoto.gps.acc; }
    return apiPost(body).then(function(){ return r; });
  }).then(function(r){
    busy(false); closeModal(); S.ntPhoto=null; S.ntDraft="";
    toast(later.length
      ? ("✓ Đã lưu kế hoạch cho "+accName+" — nhớ bổ sung "+later.join(" và ")+" sau khi đi")
      : ("✓ Đã thêm task cho "+accName),"ok",5200);
    afterWrite("weekly", r.row||0, d);
    S.vMode="day"; S.vAnchor=d.start; S.wkFrom=mondayOf(d.start); S.wkTo=addDays(S.wkFrom,6);
    terrRefresh();
  }).catch(function(e){ busy(false); toast(e.message,"err",6000); });
}

/* xoá dòng chung cho các tab khác */
function delRow(tab,row){
  if(!confirm("Xoá dòng này khỏi Google Sheet? Thao tác không hoàn tác được.")) return;
  busy(true,"Đang xoá…");
  apiPost({action:"deleteRow",tab:tab,row:row}).then(function(r){
    busy(false); closeModal(); toast(r.message||"Đã xoá","ok");
    afterWrite(tab, row, null, true);
    go(S.tab);
  }).catch(function(e){ busy(false); toast(e.message,"err",5000); });
}

</script>

<script>
/* ═══════════════════════ ĐƠN HÀNG ═══════════════════════ */
function pgOrder(){
  /* ⭐ v3: vẽ NGAY từ bộ nhớ nếu đã có; chỉ hiện khung xương ở lần đầu */
  ensureTab("order",{},function(rows,ready,err){
    if(err){ $("main").innerHTML='<div class="pg"><div class="card pad"><b style="color:#A82F2C">Lỗi:</b> '+esc(err.message)+'</div></div>'; return; }
    if(!ready&&!rows){ skeleton('<div class="ph"><div><h2>Đơn hàng</h2><p>Đang nạp dữ liệu…</p></div></div>'+skRows(8,true)); return; }
    S.cache.order={rows:rows||[]};
    if(S.tab==="order") renderOrder();
  });
  if(!S.custIndex.length) loadCustomerIndex();
}
function renderOrder(){
  var data=S.cache.order||{rows:[]}, rows=data.rows.slice();
  if(S.filt.month) rows=rows.filter(function(o){return o.month===S.filt.month;});
  if(S.filt.q){ var q=S.filt.q.toLowerCase(); rows=rows.filter(function(o){ return (o.name+" "+o.code+" "+o.detail+" "+o.orderNo).toLowerCase().indexOf(q)>=0; }); }
  var tot=rows.reduce(function(s,o){return s+n(o.amount);},0);
  var months=fyMonths(S.fy);

  $("main").innerHTML='<div class="pg">'+
    '<div class="ph"><div><h2>Đơn hàng '+esc(S.fy)+'</h2><p><b>'+fmtN(rows.length)+'</b> đơn · Tổng <b>'+fmtVND(tot)+'</b></p></div>'+
      '<div class="sp"></div><button class="btn pri sm" onclick="formOrder(null)">＋ Đơn hàng mới</button></div>'+
    '<div class="card pad" style="margin-bottom:12px">'+
      '<div class="row" style="margin-bottom:10px">'+
        '<div style="flex:2"><input class="inp" id="ord_q" autocomplete="off" placeholder="🔍 Tìm theo account, mã, sản phẩm…" value="'+esc(S.filt.q)+'" oninput="S.filt.q=this.value;debOrd()"></div>'+
        (isMgmt()?'<div><select class="inp" onchange="S.filt.pic=this.value;renderOrder()">'+opts(S.master.pic,S.filt.pic,"Mọi PIC")+'</select></div>':"")+
      '</div>'+
      '<div class="chipbar"><div class="chip'+(S.filt.month?"":" on")+'" onclick="S.filt.month=\'\';renderOrder()">Cả FY</div>'+
        months.map(function(m){ return '<div class="chip'+(S.filt.month===m?" on":"")+'" onclick="S.filt.month=\''+m+'\';renderOrder()">T'+parseInt(m.slice(4),10)+'</div>'; }).join("")+'</div>'+
    '</div>'+
    (rows.length?'<div class="tbwrap"><table class="tb"><thead><tr>'+
      '<th style="width:74px">Tháng</th><th style="width:64px">Order</th><th>Account</th><th style="width:88px">Kênh</th>'+
      '<th>Sản phẩm</th><th style="width:84px">Nhóm</th><th class="num" style="width:52px">SL</th>'+
      '<th class="num" style="width:96px">Amount</th><th style="width:74px">PIC</th></tr></thead><tbody>'+
      rows.map(function(o){ return '<tr onclick="rOrder(\''+reg(o)+'\')" style="cursor:pointer">'+
        '<td class="mono">'+esc(o.month)+'</td><td>'+esc(o.orderNo)+'</td>'+
        '<td><b>'+esc(o.name)+'</b><div style="font-size:11px;color:var(--mute)">'+esc(o.code)+' · '+esc(o.province)+'</div></td>'+
        '<td><span class="tag '+(o.channel==="Online"?"t-b":"t-n")+'">'+esc(o.channel)+'</span></td>'+
        '<td style="max-width:240px;font-size:12px;white-space:pre-wrap">'+nl2br(String(o.detail).slice(0,120))+'</td>'+
        '<td><span class="tag t-n">'+esc(o.ptype)+'</span></td><td class="num">'+fmtN(o.qty)+'</td>'+
        '<td class="num"><b>'+fmtVND(o.amount)+'</b></td><td>'+esc(o.pic)+'</td></tr>'; }).join("")+
      '</tbody></table></div>'
      :'<div class="card pad"><div class="empty"><div class="e">🧾</div><p>Chưa có đơn hàng khớp bộ lọc</p></div></div>')+
  '</div>';
}
var _dbo; function debOrd(){ clearTimeout(_dbo); _dbo=setTimeout(function(){ keepCaret("ord_q",renderOrder); },140); }

/* ═══════════ ⭐ v8 — DIALOG ĐƠN HÀNG DỰNG LẠI ═══════════
   · Order No. tự đếm tiếp số lớn nhất đang có trong sheet
   · Account → Người liên lạc lọc theo CBC của chính account đó
   · Chức danh / SĐT lấy thẳng từ CBC, không sửa ở đây
   · thêm Account / CBC ngay trong dialog mà KHÔNG đóng dialog đơn hàng
   · một đơn nhiều sản phẩm · Amount tự tính · xoá được đơn
   ═══════════════════════════════════════════════════════════ */
function nextOrderNo(){
  var rows=(((S.cache.order||{}).rows)||[]).concat(tGet("order")||[]);
  var mx=0, pre="No. ";
  rows.forEach(function(o){
    var s=String(o.orderNo||""); var m=/(\d+)\s*$/.exec(s.trim()); if(!m) return;
    var v=parseInt(m[1],10); if(!isFinite(v)) return;
    if(v>mx){ mx=v; var p=s.trim().slice(0,s.trim().length-m[1].length); pre=p; }
  });
  return mx?(pre+(mx+1)):"";
}
function ordProds(){ if(!S.ordProds||!S.ordProds.length) S.ordProds=[{ptype:"",detail:"",price:"",qty:""}]; return S.ordProds; }
function ordSync(){
  ordProds().forEach(function(p,i){
    var t=$("op_t"+i), d=$("op_d"+i), u=$("op_u"+i), q=$("op_q"+i);
    if(t) p.ptype=t.value; if(d) p.detail=d.value;
    if(u) p.price=u.value;  if(q) p.qty=q.value;
  });
}
function ordRowHtml(p,i,single){
  return '<div class="oprow">'+
    '<div class="opc t"><span class="oplb">Product type</span>'+
      '<select class="inp" id="op_t'+i+'">'+opts(S.master.product,p.ptype,"— chọn —")+'</select></div>'+
    '<div class="opc d"><span class="oplb">Detail</span>'+
      '<input class="inp" id="op_d'+i+'" value="'+esc(p.detail||"")+'" placeholder="VD: 025 06 21mm 2 vỉ"></div>'+
    '<div class="opc n"><span class="oplb">Unit price</span>'+
      '<input class="inp num" id="op_u'+i+'" inputmode="numeric" value="'+esc(p.price||"")+'" oninput="ordNum(this)"></div>'+
    '<div class="opc n"><span class="oplb">SL</span>'+
      '<input class="inp num" id="op_q'+i+'" inputmode="numeric" value="'+esc(p.qty||"")+'" oninput="ordNum(this)"></div>'+
    '<div class="opc n"><span class="oplb">Amount</span>'+
      '<input class="inp num piclock" id="op_a'+i+'" readonly value="'+(n(p.price)*n(p.qty)?fmtN(n(p.price)*n(p.qty)):"")+'"></div>'+
    '<button class="opdel" type="button" title="Bỏ dòng này"'+(single?' disabled':'')+' onclick="ordDelProd('+i+')">✕</button>'+
  '</div>';
}
function ordDraw(){
  var w=$("o_prodWrap"); if(!w) return;
  var list=ordProds();
  w.innerHTML=list.map(function(p,i){ return ordRowHtml(p,i,list.length<2); }).join("");
  ordCalc();
}
function ordAddProd(){ ordSync(); ordProds().push({ptype:"",detail:"",price:"",qty:""}); ordDraw(); }
function ordDelProd(i){ ordSync(); var l=ordProds(); if(l.length<2) return; l.splice(i,1); ordDraw(); }
function ordNum(el){ var v=String(el.value||"").replace(/[^\d]/g,""); if(v!==el.value) el.value=v; ordCalc(); }
/* chỉ cho gõ chữ số — dùng cho các ô số ngoài dialog đơn hàng */
function numOnly(el){ var v=String(el.value||"").replace(/[^\d]/g,""); if(v!==el.value) el.value=v; }
function ordCalc(){
  ordSync(); var tot=0;
  ordProds().forEach(function(p,i){ var a=n(p.price)*n(p.qty); tot+=a; var el=$("op_a"+i); if(el) el.value=a?fmtN(a):""; });
  var t=$("o_total"); if(t) t.textContent=fmtVND(tot);
}
/* ── người liên lạc: chỉ lấy CBC của đúng account đang chọn ── */
function ordDrawCbc(sel){
  var wrap=$("o_cbcWrap"); if(!wrap) return;
  var acc=(S.editing&&S.editing.ctx&&S.editing.ctx.name)||($("o_accName")?$("o_accName").value:"");
  var list=stakeOf(acc);
  if(!acc){
    wrap.innerHTML='<input class="inp piclock" value="Chọn Account trước" readonly>';
  }else if(!S.cbcRows){
    /* ⭐ v7.3 — danh bạ chưa tải mà đã kết luận "chưa có CBC nào" là sai.
       Nạp xong thì vẽ lại đúng danh sách. */
    wrap.innerHTML='<input class="inp piclock" value="Đang nạp danh bạ CBC…" readonly>';
    if(!S._cbcLoading) reloadCbc(function(){ if($("o_cbcWrap")) ordDrawCbc(sel); });
    return;
  }else if(!list.length){
    wrap.innerHTML='<div style="display:flex;gap:7px">'+
      '<input class="inp piclock" style="flex:1" value="Account này chưa có CBC nào" readonly>'+
      '<button class="btn sm" style="flex:none" onclick="reloadCbc(function(){ ordDrawCbc(); })">↻</button></div>';
  }else{
    wrap.innerHTML='<select class="inp" id="o_contact" onchange="ordPickCbc()">'+
      opts(list.map(function(b){return b.contact;}),sel||"","— chọn người liên lạc —")+'</select>';
  }
  ordPickCbc();
}
function ordPickCbc(){
  var acc=(S.editing&&S.editing.ctx&&S.editing.ctx.name)||"";
  var v=$("o_contact")?$("o_contact").value:"";
  var b=stakeOf(acc).filter(function(x){ return String(x.contact||"")===v; })[0]||{};
  if($("o_jobTitle")) $("o_jobTitle").value=b.jobTitle||"";
  if($("o_phone"))    $("o_phone").value=b.phone||"";
  if(S.editing&&S.editing.ctx) S.editing.ctx.cbcCode=b.cbcCode||"";
}
function ordNewAcc(){
  ordSync();
  subReturn(function(c){
    if($("o_accName")) $("o_accName").value=c.name||"";
    ordSetAcc(c); toast("Đã thêm account — điền tiếp đơn hàng","ok");
  });
  formCustomer(null);
}
function ordNewCbc(){
  var ctx=(S.editing&&S.editing.ctx)||{};
  if(!ctx.code) return toast("Chọn Account trước khi thêm người liên lạc","warn");
  ordSync();
  subReturn(function(d){ reloadCbc(function(){ ordDrawCbc(d&&d.contact); }); ordDrawCbc(d&&d.contact); });
  formCBC(null,ctx.code);
}
function ordSetAcc(c){
  S.editing.ctx=Object.assign({},S.editing.ctx,{ code:c.code, type:c.type, province:c.province, area:c.area, name:c.name, address:c.address||"" });
  var h=$("o_hint"); if(h) h.textContent=[c.code,c.type,c.province,c.area].filter(String).join(" · ")||"—";
  if(c.pic&&$("o_pic")) $("o_pic").value=c.pic;
  ordDrawCbc("");
}
function o_syncMonth(){
  var m=ymOf($("o_day").value);
  if($("o_month")) $("o_month").value=m;
  if($("o_fy")) $("o_fy").value=fyOfMonth(m);
}
function formOrder(o){
  if(typeof o==="number"){
    var pool=((S.acc&&S.acc.orders)||[]).concat(((S.cache.order||{}).rows)||[]).concat((S.detail&&S.detail.orders)||[]);
    o=pool.filter(function(x){return x._row===o;})[0]||{_row:o};
  }
  o=o||{};
  var isNew=!o._row;
  ensureCbc();
  S.ordProds=[{ ptype:o.ptype||"", detail:o.detail||"", price:o.price||"", qty:o.qty||"" }];
  var day=o.day||todayISO(), mon=o.month||ymOf(day);
  var ono=o.orderNo||nextOrderNo();

  var h='<div class="row">'+
      '<div class="fld"><label>Order No.</label><input class="inp piclock" id="o_orderNo" value="'+esc(ono)+'" readonly>'+
        '<div class="hint">'+(isNew?"Tự đếm tiếp số lớn nhất trong sheet":"Số của đơn đang sửa")+'</div></div>'+
      '<div class="fld"><label>Ngày đặt <span class="rq">*</span></label><input class="inp" type="date" id="o_day" value="'+esc(day)+'" onchange="o_syncMonth()"></div>'+
      '<div class="fld"><label>Month</label><input class="inp piclock" id="o_month" value="'+esc(mon)+'" readonly></div>'+
      '<div class="fld"><label>FY</label><input class="inp piclock" id="o_fy" value="'+esc(o.fy||fyOfMonth(mon))+'" readonly></div>'+
    '</div>'+

    '<div class="fld sbox"><label>Account <span class="rq">*</span></label>'+
      '<div class="pairbtn"><input class="inp" id="o_accName" placeholder="Bấm để xem danh sách · gõ để lọc" value="'+esc(o.name||"")+'" autocomplete="off">'+
        '<button class="btn sm" type="button" onclick="ordNewAcc()">＋ Account mới</button></div>'+
      '<input type="hidden" id="o_account" value="">'+

function delOrder(row){
  if(!confirm("Xoá đơn hàng này khỏi sheet Sale Order? Thao tác không hoàn tác được.")) return;
  busy(true,"Đang xoá đơn hàng…");
  apiPost({action:"deleteRow",tab:"order",row:row}).then(function(r){
    busy(false); closeAllModals(); toast(r.message||"Đã xoá đơn hàng","ok");
    afterWrite("order", row, null, true);
    if(S.cache.order&&S.cache.order.rows) S.cache.order.rows=S.cache.order.rows.filter(function(x){return x._row!==row;});
    if(S.tab==="order") renderOrder();
  }).catch(function(e){ busy(false); toast(e.message,"err",5000); });
}
function saveOrder(){
  ordSync();
  var c=S.editing.ctx||{};
  var accName=$("o_accName").value.trim();
  if(!accName) return toast("Cần chọn Account","warn");
  if(!$("o_day").value) return toast("Cần chọn ngày đặt","warn");
  var list=ordProds().filter(function(p){ return String(p.ptype||"").trim()||String(p.detail||"").trim()||n(p.qty)||n(p.price); });
  if(!list.length) return toast("Cần nhập ít nhất một sản phẩm","warn");

  var base={ code:c.code||"", cbcCode:c.cbcCode||"", channel:$("o_channel").value,
    fy:$("o_fy").value, month:$("o_month").value, day:$("o_day").value, orderNo:$("o_orderNo").value,
    type:c.type||"", name:accName, address:c.address||"", province:c.province||"", area:c.area||"",
    contact:($("o_contact")?$("o_contact").value:""), jobTitle:$("o_jobTitle").value, phone:$("o_phone").value,
    pic:$("o_pic").value, partner:$("o_partner").value, partnerType:$("o_partnerType").value,
    source:$("o_source").value, note:$("o_note").value };

  var q=list.slice(), k=0, first=S.editing.row||0;
  busy(true,"Đang lưu đơn hàng…");
  function next(){
    if(!q.length) return Promise.resolve();
    var p=q.shift(); k++;
    var amt=n(p.price)*n(p.qty);
    var d=Object.assign({},base,{ _row:(k===1?first:0), ptype:p.ptype, detail:p.detail,
      qty:p.qty, price:p.price, amount:amt?String(amt):"" });
    busy(true,"Đang lưu sản phẩm "+k+"/"+(k+q.length)+"…");
    return apiPost({action:"saveOrder",data:d}).then(function(r){
      afterWrite("order", r.row||d._row, d);
      return next();
    });
  }
  next().then(function(){
    busy(false); closeAllModals();
    toast("✓ Đã lưu "+k+" dòng sản phẩm cho đơn "+base.orderNo,"ok",4200);
    if(S.tab==="order") renderOrder();
  }).catch(function(e){ busy(false); toast(e.message,"err",5500); });
}

function pgMonthly(){

  var nowYm=ymOf(todayISO()), ms=fyMonths(S.fy);
  if(!S.mnMonth || ms.indexOf(S.mnMonth)<0) S.mnMonth=(ms.indexOf(nowYm)>=0)?nowYm:ms[0];
  ensureTab("monthly",{},function(rows,ready,err){
    if(err){ $("main").innerHTML='<div class="pg"><div class="card pad"><b style="color:#A82F2C">Lỗi:</b> '+esc(err.message)+'</div></div>'; return; }
    if(!ready&&!rows){ skeleton('<div class="ph"><div><h2>Công việc trong tháng</h2><p>Đang nạp dữ liệu…</p></div></div>'+skRows(7,true)); return; }
    S.cache.monthly={rows:rows||[]};

  });
  if(!S.custIndex.length) loadCustomerIndex();
}
function mnRows(){ return ((S.cache.monthly||{rows:[]}).rows)||[]; }
/* ⭐ v5.9 — cột "Kỳ" có thể là số hoặc chuỗi ⇒ luôn quy về "YYYYMM" trước khi so */
function mnPer(r){ return String((r&&r.period)||"").replace(/\D/g,"").slice(0,6); }
function mnPic(){ return (S.user.role==="manager")?(S.mnPic||""):S.user.pic; }
/* ═══════════ ⭐ v8 — TAB "SO SÁNH" TRONG CÔNG VIỆC THÁNG ═══════════
   · PIC: so cùng một Type task giữa tối đa 3 tháng, xem theo Kết quả hoặc Kế hoạch
   · Quản lý: thêm chế độ so giữa các PIC trong cùng một tháng
   ══════════════════════════════════════════════════════════════════ */
function mnTabBar(){
  var t=S.mnTab||"list";
  return '<div class="shtabs">'+
    '<button class="'+(t==="list"?"on":"")+'" onclick="setMnTab(\'list\')">🗓 Công việc trong tháng</button>'+
    '<button class="'+(t==="cmp"?"on":"")+'" onclick="setMnTab(\'cmp\')">⚖️ So sánh</button>'+
  '</div>';
}
function setMnTab(t){ S.mnTab=t; renderMonthly(); }
function mnTypes(){
  var pic=mnPic(), seen={}, out=[];
  mnRows().forEach(function(r){
    if(pic && !picMatch(r.pic,pic)) return;
    var t=String(r.typeTask||"").trim(); if(!t||seen[t]) return; seen[t]=1; out.push(t);
  });
  out.sort(function(a,b){ var x=mnTypeOrder(a),y=mnTypeOrder(b); return x!==y?x-y:a.localeCompare(b); });
  return out;
}
function cmpS(){
  S.mnCmp=S.mnCmp||{ mode:"month", field:"result", type:"", months:[], pics:[], month:"" };
  return S.mnCmp;
}
function setCmp(k,v){ cmpS()[k]=v; renderMonthly(); }
function toggleCmpMonth(m){
  var c=cmpS(), i=c.months.indexOf(m);
  if(i>=0) c.months.splice(i,1);
  else { if(c.months.length>=3) return toast("Tối đa 3 tháng một lần","warn"); c.months.push(m); c.months.sort(); }
  renderMonthly();
}
function toggleCmpPic(p){
  var c=cmpS(), i=c.pics.indexOf(p);
  if(i>=0) c.pics.splice(i,1);
  else { if(c.pics.length>=3) return toast("Tối đa 3 PIC một lần","warn"); c.pics.push(p); }
  renderMonthly();
}
function mnFindCell(type,period,pic){
  var list=mnRows().filter(function(r){
    return String(r.typeTask||"").trim()===type && mnPer(r)===String(period) && (!pic||picMatch(r.pic,pic));
  });
  return list[0]||null;
}

        '<option value="result"'+(c.field==="result"?" selected":"")+'>Kết quả (Result)</option>'+
        '<option value="plan"'+(c.field==="plan"?" selected":"")+'>Kế hoạch (Plan)</option></select></div>'+
      (c.mode==="pic"?'<div class="fld" style="margin:0"><label>Tháng</label><select class="inp" onchange="setCmp(\'month\',this.value)">'+

      ? '<div class="hint" style="margin-bottom:6px">Chọn tối đa <b>3 PIC</b> để đặt cạnh nhau</div><div class="chipbar">'+
        picPool.map(function(p){ return '<div class="chip'+(c.pics.indexOf(p)>=0?" on":"")+'" onclick="toggleCmpPic(\''+esc(p)+'\')">'+esc(p)+'</div>'; }).join("")+'</div>'
      : '<div class="hint" style="margin-bottom:6px">Chọn tối đa <b>3 tháng</b> để đặt cạnh nhau</div><div class="chipbar">'+
        months.map(function(m){ return '<div class="chip'+(c.months.indexOf(m)>=0?" on":"")+'" onclick="toggleCmpMonth(\''+m+'\')">'+m.slice(4)+"/"+m.slice(2,4)+'</div>'; }).join("")+'</div>')+
  '</div>';

  var board = cols.length
    ? '<div class="cmpgrid c'+cols.length+'">'+cols.map(function(x){
        var txt=x.row?String((c.field==="result")?(x.row.result||""):(x.row.plan||"")).trim():"";
        return '<div class="cmpcol">'+
          '<div class="cmph"><b>'+esc(x.lb)+'</b><span>'+esc(x.sub)+'</span></div>'+

          '<div class="cmpf">'+(x.row?('<button class="btn xs" onclick="openMonthly('+x.row._row+')">✎ Mở hạng mục</button>'):'<span style="color:var(--mute);font-size:11.5px">Kỳ này chưa tạo hạng mục</span>')+'</div>'+
        '</div>'; }).join("")+'</div>'
    : '<div class="card pad"><div class="empty"><div class="e">⚖️</div><p>Chọn '+(c.mode==="pic"?"ít nhất 2 PIC":"ít nhất 2 tháng")+' ở trên để bắt đầu so sánh</p></div></div>';

  $("main").innerHTML='<div class="pg">'+

    mnTabBar()+ctrl+board+'</div>';

function renderMonthly(){
  if(S.mnTab==="cmp") return renderMnCompare();
  var all=mnRows();
  var mn=S.mnMonth||ymOf(todayISO());
  var months=fyMonths(S.fy);
  if(months.indexOf(mn)<0) mn=months[0];
  var pic=mnPic();
  var cntBy={}; all.forEach(function(r){ if(!pic||picMatch(r.pic,pic)) cntBy[mnPer(r)]=(cntBy[mnPer(r)]||0)+1; });

  var cur=all.filter(function(r){ return mnPer(r)===String(mn) && (!pic||picMatch(r.pic,pic)); });
  var done=cur.filter(function(r){ return String(r.result||"").trim(); }).length;
  var pct=cur.length?done/cur.length:0;

  var byType={},order=[];
  cur.forEach(function(r){ var t=r.typeTask||"— chưa phân loại —"; if(!byType[t]){byType[t]=[];order.push(t);} byType[t].push(r); });
  /* ⭐ v5 — đúng thứ tự Turnover → Distributor → Dealer → University → Clinics → Hospital → KPI → Event */
  order.sort(function(a,b){ var x=mnTypeOrder(a), y=mnTypeOrder(b); return x!==y?x-y:String(a).localeCompare(String(b)); });

  var picBar=S.user.role==="manager"
    ? '<div class="chipbar" style="margin-top:9px"><div class="chip'+(S.mnPic?"":" on")+'" onclick="S.mnPic=\'\';renderMonthly()">Tất cả PIC</div>'
      +(S.master.pic||[]).map(function(p){ return '<div class="chip'+(S.mnPic===p?" on":"")+'" onclick="S.mnPic=\''+esc(p)+'\';renderMonthly()">'+esc(p)+'</div>'; }).join("")+'</div>'
    : "";

  $("main").innerHTML='<div class="pg">'+
    '<div class="ph"><div><h2>Công việc trong tháng</h2><p>Kỳ <b>'+mn.slice(4)+"/"+mn.slice(0,4)+'</b> · '+cur.length+' hạng mục · '+done+' đã có kết quả</p></div>'+
      '<div class="sp"></div>'+
      '<button class="btn sm" onclick="mnScaffold()">🧩 Tạo đủ khung tháng này</button>'+
      '<button class="btn sm" onclick="mnSeed()">⧉ Lấy kế hoạch tháng trước</button>'+
      '<button class="btn sm" onclick="go(\'report\')">📧 Gửi báo cáo</button>'+
      '<button class="btn pri sm" onclick="formMonthly(null)">＋ Thêm hạng mục</button></div>'+
    mnTabBar()+
    '<div class="card pad" style="margin-bottom:12px"><div class="chipbar">'+
      months.map(function(m){
        var c=cntBy[m]||0;
        return '<div class="chip'+(mn===m?" on":"")+'" onclick="S.mnMonth=\''+m+'\';renderMonthly()">'+m.slice(4)+"/"+m.slice(2,4)+
          (c?'<span style="margin-left:5px;opacity:.7">'+c+'</span>':"")+'</div>'; }).join("")+
      '</div>'+picBar+'</div>'+

    '<div class="grid g4" style="margin-bottom:12px">'+

      '<div class="kpi"><div class="lb">Đã có kết quả</div><div class="vl" style="color:#1E9E5A">'+done+'</div><div class="sb">'+Math.round(pct*100)+'% hoàn thành</div></div>'+
      '<div class="kpi"><div class="lb">Chưa ghi kết quả</div><div class="vl" style="color:'+((cur.length-done)?"#E08A00":"#1E9E5A")+'">'+(cur.length-done)+'</div><div class="sb">cần cập nhật trước khi gửi</div></div>'+
      '<div class="kpi"><div class="lb">Nhóm công việc</div><div class="vl">'+order.length+'</div><div class="sb">'+esc(order.slice(0,2).join(" · ")||"—")+'</div></div>'+
    '</div>'+

    (cur.length?'<div class="card pad" style="margin-bottom:12px"><div class="ct"><span class="dot"></span>Tiến độ PLAN → RESULT<span class="sp"></span><small>'+done+'/'+cur.length+'</small></div>'
      +pb(pct)+'</div>':"")+

    (order.length? order.map(function(t){
      var g=byType[t], gd=g.filter(function(r){return String(r.result||"").trim();}).length;
      return '<div class="card pad" style="margin-bottom:11px"><div class="ct"><span class="dot"></span>'+esc(t)+
        '<small>'+g.length+' hạng mục · '+gd+' có kết quả</small></div>'+
        g.map(mnCard).join("")+'</div>'; }).join("")
      : '<div class="card pad"><div class="empty"><div class="e">🗓</div><p>Chưa có hạng mục nào cho kỳ này</p>'+
        '<div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">'+
        '<button class="btn pri sm" onclick="mnScaffold()">🧩 Tạo đủ khung tháng này</button>'+
        '<button class="btn sm" onclick="mnSeed()">⧉ Lấy kế hoạch tháng trước</button>'+
        '<button class="btn sm" onclick="formMonthly(null)">＋ Thêm hạng mục</button></div></div></div>')+

function mnTplFor(typeTask){
  var k=noAcc(String(typeTask||"")).replace(/[^a-z0-9]/g,"");
  if(!k) return null;
  for(var i=0;i<MN_TPL.length;i++){
    for(var j=0;j<MN_TPL[i].match.length;j++)
      if(k.indexOf(MN_TPL[i].match[j])>=0) return MN_TPL[i];
  }
  return null;
}
function mnTplText(typeTask){ var t=mnTplFor(typeTask); return t?t.text:""; }
/* thứ tự hiển thị các nhóm — đúng như file Monthly Report đang dùng */
function mnTypeOrder(t){
  var x=mnTplFor(t); if(!x) return 99;
  return ["turnover","distributor","dealer","university","clinic","hospital","kpi","event"].indexOf(x.key);
}
/* chèn khung vào ô đang soạn, không đè nội dung đã gõ */
function mnInsertTpl(id,typeTaskId,field){
  var ta=$(id); if(!ta) return;
  var tt=$(typeTaskId)?$(typeTaskId).value:"";
  var tpl=mnTplText(tt);
  if(!tpl) return toast("Type task này chưa có khung mẫu — chọn Type task trước","warn",5000);
  var cur=String(ta.value||"").trim();
  if(cur && cur.indexOf(tpl.split("\n")[0])>=0) return toast("Ô này đã có khung rồi","warn");
  ta.value = cur ? (tpl+"\n\n— Nội dung cũ —\n"+cur) : tpl;
  try{ ta.dispatchEvent(new Event("input",{bubbles:true})); }catch(e){}
  if(field) markDirtyM(field,ta.value);
  try{ ta.focus(); ta.setSelectionRange(0,0); ta.scrollTop=0; }catch(e){}
  toast("✓ Đã chèn khung "+(mnTplFor(tt).label),"ok");
}

function mnSyncTplPh(typeTaskId,planId,resId){

/* ⭐ v5 — tạo sẵn đủ bộ hạng mục theo khung Type task cho kỳ đang xem.
   Sales chỉ việc mở từng hạng mục lên điền, không phải tự nhớ có bao nhiêu mục. */
function mnScaffold(){
  var mn=S.mnMonth||ymOf(todayISO());
  var pic=(isMgmt()? (S.mnPic||S.user.pic) : S.user.pic);
  if(!pic) return toast("Chọn PIC trước khi tạo khung","warn");
  var have={}; mnRows().forEach(function(r){
    if(mnPer(r)===String(mn) && picMatch(r.pic,pic)) have[String(r.typeTask||"").toLowerCase()]=1; });
  var master=S.master.typeTask||[];
  /* ⭐ v7.1 — chỉ tạo Type task CHƯA có trong kỳ này của PIC đó ⇒ bấm nhiều lần
     cũng không sinh hạng mục trùng. */
  var todo=master.filter(function(t){ return mnTplFor(t) && !have[String(t).toLowerCase()]; })
                 .sort(function(a,b){ return mnTypeOrder(a)-mnTypeOrder(b); });
  var dup=master.filter(function(t){ return mnTplFor(t) && have[String(t).toLowerCase()]; });
  if(!todo.length) return toast("Kỳ "+mn.slice(4)+"/"+mn.slice(0,4)+" của "+pic+" đã có đủ "+dup.length+" hạng mục — không tạo trùng","ok",4800);
  if(!confirm("Tạo "+todo.length+" hạng mục cho "+pic+" — kỳ "+mn.slice(4)+"/"+mn.slice(0,4)+"?\n\n"+
              todo.join("\n")+"\n\nMỗi hạng mục sẽ có sẵn khung nội dung để điền.")) return;
  var area=PIC_AREA[pic]||"", i=0, okN=0;
  busy(true,"Đang tạo khung 0/"+todo.length+"…");
  (function next(){
    if(i>=todo.length){
      busy(false); toast("✓ Đã tạo "+okN+" hạng mục có sẵn khung","ok",4500);
      /* renderMonthly() đọc S.cache.monthly, còn fetchTab chỉ ghi vào TSTORE ⇒
         phải nạp lại qua pgMonthly() thì màn hình mới thấy hạng mục vừa tạo. */
      afterWrite("monthly",0,null);
      if(S.tab==="monthly") pgMonthly();
      return;
    }
    var t=todo[i++];
    busy(true,"Đang tạo khung "+i+"/"+todo.length+" — "+t+"…");
    apiPost({action:"saveMonthly",data:{ _row:0, typeTask:t, pic:pic, area:area,
      fy:fyOfMonth(mn), period:mn, plan:mnTplText(t), result:"" }})
      .then(function(){ okN++; next(); })
      .catch(function(e){ busy(false); toast("Dừng ở \""+t+"\": "+e.message,"err",6000); });
  })();
}

function selM(id,field,label,options,cur){

    var el=$("mn-ar"); if(el) el.value=PIC_AREA[v];

function mnSeed(){
  var months=fyMonths(S.fy), mn=S.mnMonth||ymOf(todayISO());
  var i=months.indexOf(mn);
  if(i<=0) return toast("Không có tháng trước trong FY này","warn");
  var prev=months[i-1], pic=mnPic();
  var src=mnRows().filter(function(r){ return mnPer(r)===String(prev) && (!pic||picMatch(r.pic,pic)); });
  if(!src.length) return toast("Tháng "+prev.slice(4)+"/"+prev.slice(0,4)+" chưa có hạng mục nào","warn");
  var have={}; mnRows().filter(function(r){return mnPer(r)===String(mn);}).forEach(function(r){ have[(r.typeTask||"")+"|"+(r.pic||"")]=1; });
  var todo=src.filter(function(r){ return !have[(r.typeTask||"")+"|"+(r.pic||"")]; });
  if(!todo.length) return toast("Tháng này đã có đủ hạng mục của tháng trước","ok");

    +'Sẽ tạo <b>'+todo.length+'</b> hạng mục cho kỳ <b>'+mn.slice(4)+"/"+mn.slice(0,4)+'</b>, lấy Type task / PIC / Area từ kỳ '

    '<button class="btn" onclick="closeModal()">Huỷ</button><button class="btn pri" onclick="mnSeedRun()">Tạo '+todo.length+' hạng mục</button>');

function mnSeedRun(){
  var x=S._mnSeed||{}; if(!x.list||!x.list.length) return closeModal();

      fy:S.fy, period:x.period, plan:r.plan||"", result:"" }}).then(next);

/* ═══════════ ⭐ v8 — ADP TARGET TÁCH THEO PRODUCT TYPE ═══════════
   Ô "FY Target sales" trong sheet giờ chứa 2 dữ liệu gộp lại: "<Product type> | <số tiền>".
   Actual sales KHÔNG nhập tay nữa — cộng từ sheet Sale Order của chính account đó,
   chỉ tính những đơn có product type nằm trong phạm vi của target:
     · All dental → tính tất cả      · All file → Hand files + Jizai
     · All MMG    → Composite, Tẩy trắng, Nhựa …
     · còn lại    → đúng product type đó
   ══════════════════════════════════════════════════════════════ */
function adpParseTarget(v){
  var s=String(v==null?"":v);
  var m=/^\s*(.*?)\s*[|\uFF5C]\s*([\d.,\s]+)\s*$/.exec(s);
  if(m) return { ptype:m[1].trim(), amt:n(m[2]) };
  return { ptype:"", amt:n(s) };
}
function adpMergeTarget(ptype,amt){
  var a=String(amt||"").replace(/[^\d]/g,"");
  return ptype ? (ptype+" | "+a) : a;
}
/* ⭐ v7.3 — chuẩn hoá tên nhóm sản phẩm trước khi so.
   MASTER LIST ghi "All - MMG" (có gạch nối) nên chuỗi so cũ "all mmg" không bao giờ
   khớp, khiến chọn All - MMG ra 0 đồng dù account có đơn Composite và Bond. */
function adpNorm(v){ return noAcc(v).replace(/[^a-z0-9]+/g," ").trim(); }
function adpScopeMatch(scope,p){
  var s=adpNorm(scope), x=adpNorm(p);
  if(!s) return true;
  if(/^all$/.test(s) || /^all dental$/.test(s) || /tat ca/.test(s)) return true;
  if(/^all (file|files)$/.test(s))  return /file|jizai|tram|nong dua|nong rua/.test(x);
  if(/^all (bur|burs)$/.test(s))    return /bur|khoan|dia|carbide|ipr/.test(x);
  if(/^all mmg$/.test(s))           return /composite|comp|tay trang|bleach|whiten|nhua|resin|acrylic|bond|mmg/.test(x);
  if(!x) return false;
  return x.indexOf(s)>=0 || s.indexOf(x)>=0;
}
function adpOrderRows(){
  var a=(tGet("order")||[]), b=((S.cache.order||{}).rows)||[];
  if(a.length>=b.length) return a;
  return b;
}
var _adpAct={}, _adpActKey="";
function adpActualOf(accName,scope){
  var k=noAcc(accName||"").trim(); if(!k) return 0;
  /* bộ nhớ đệm — tránh quét lại toàn bộ đơn hàng cho từng thẻ ADP mỗi lần vẽ */
  var ck=S.fy+"|"+adpOrderRows().length;
  if(_adpActKey!==ck){ _adpAct={}; _adpActKey=ck; }
  var ik=k+"\u0001"+noAcc(scope||"");
  if(ik in _adpAct) return _adpAct[ik];
  var fym={}; fyMonths(S.fy).forEach(function(m){ fym[String(m)]=1; });
  var sum=0;
  adpOrderRows().forEach(function(o){
    if(!fym[String(o.month||"")]) return;
    if(noAcc(o.name||"").trim()!==k) return;
    if(!adpScopeMatch(scope,o.ptype)) return;
    sum+=n(o.amount);
  });
  _adpAct[ik]=sum;
  return sum;
}
/* target + actual đã chuẩn hoá cho một dòng ADP */
function adpNums(r){
  var t=adpParseTarget(r.targetAmt);
  var acc=parseAcc(r.account||"").name||"";
  var hasOrd=adpOrderRows().length>0;
  return { ptype:t.ptype, tg:t.amt, ac:(hasOrd?adpActualOf(acc,t.ptype):n(r.actualAmt)), live:hasOrd };
}

}

function adpCard(r,g){
  var a=parseAcc(r.account);
  var lv=lastVisitOf(a.name);
  var N=adpNums(r), tg=N.tg, ac=N.ac;
  var p=tg?ac/tg:null;
  /* ⭐ v5.2 — chỉ cảnh báo khi thật sự lệch bậc đơn vị (Actual gấp >50 lần Target).
     Ô có lẫn chữ giờ đã đọc đúng số tiền nên không còn báo nhầm. */
  var odd=(p!=null&&p>50);
  var msgT=false, msgA=false;
  var days=lv?Math.round((new Date(todayISO())-new Date(lv.date))/86400000):null;
  var vt = lv
    ? '<div class="adpv'+(days>60?" old":days>30?" mid":"")+'">🕑 Gặp gần nhất <b>'+fmtVN(lv.date)+'</b>'
      +(days!=null?' <span>('+(days===0?"hôm nay":days+" ngày trước")+')</span>':"")
      +' · <b>'+esc(lv.pic||"—")+'</b></div>'
    : '<div class="adpv none">⚠️ Chưa có buổi gặp nào trong '+esc(S.fy)+'</div>';
  var big=(S.adpView==="list");
  var accKey=reg({name:a.name,code:""});

  return '<div class="adpc" style="border-left-color:'+g.c+'">'+

    '<div class="adpc-m">'+[a.type,a.province,a.area].filter(Boolean).map(esc).join(" · ")+
      (N.ptype?' <span class="tag t-y">🎯 '+esc(N.ptype)+'</span>':"")+'</div>'+

      '<div class="adpc-kv">'+

          : pb(p)+'<div class="pbl"><span>'+fmtVND(ac)+' / '+fmtVND(tg)+'</span><span style="color:'+pctColor(p)+'">'+Math.round(p*100)+'%</span></div>')

    ((msgT||msgA)
      ? '<div class="adpc-note">ℹ️ Ô trong sheet có lẫn chữ, app đọc là '+
        (msgT?('Target <b>'+fmtVND(tg)+'</b>'):"")+(msgT&&msgA?" · ":"")+

}
function setAdpView(v){ S.adpView=v; renderADP(); }

/* ⭐ v7.2 — MASTER LIST đã có sẵn các mục "All - Dental", "All - MMG"…
   Trước đây app còn thêm bộ "All dental / All file / All MMG" của riêng mình nên
   danh sách hiện hai lần. Nay chỉ giữ dạng có gạch nối lấy từ MASTER LIST;
   thiếu mục nào mới bổ sung. */
function ADP_ALL_CANON(){ return ["All - Dental","All - Files","All - Burs","All - MMG"]; }
function adpIsAll(p){ return /^all\b/i.test(String(p||"").trim()); }
function ADP_PTYPES(){
  var master=(S.master.product||[]).map(function(x){ return String(x).trim(); }).filter(Boolean);
  var alls=[], others=[], seen={};
  master.forEach(function(p){
    var k=noAcc(p).replace(/[^a-z]/g,"");
    if(seen[k]) return; seen[k]=1;
    (adpIsAll(p)?alls:others).push(p);
  });
  /* mục "All" nào chưa có trong MASTER LIST thì thêm theo dạng chuẩn có gạch nối */
  ADP_ALL_CANON().forEach(function(p){
    var k=noAcc(p).replace(/[^a-z]/g,"");
    if(!seen[k]){ seen[k]=1; alls.push(p); }
  });
  return alls.concat(others);
}
function formADP(r,presetAcc){
  r=r||{};
  /* nếu mở form THÊM mà account đã có ADP trong FY này thì mở thẳng bản cũ ra sửa */
  if(!r._row && presetAcc){
    var nm0=parseAcc(presetAcc).name;
    var dup0=adpFindDup(nm0,S.fy,0);
    if(dup0>0){
      var rows0=((S.cache.adp||{rows:null}).rows)||tGet("adp")||[];
      var old0=rows0.filter(function(x){ return x._row===dup0; })[0];
      if(old0){ toast(nm0+" đã có ADP trong "+S.fy+" — mở bản hiện có để sửa","warn",6000); r=old0; }
    }
  }
  var a=parseAcc(r.account||presetAcc||"");
  var _tg0=adpParseTarget(r.targetAmt);
  var Q=[["rQ1","Review Q1 (T9-T11)"],["rQ2","Review Q2 (T12-T2)"],["rQ3","Review Q3 (T3-T5)"],["rQ4","Review Q4 (T6-T8)"]];
  var h='<div class="fld sbox"><label>Account <span class="rq">*</span></label>'+
      '<input class="inp" id="a_accName" placeholder="Gõ ≥2 ký tự…" value="'+esc(a.name||"")+'" autocomplete="off">'+
      '<input type="hidden" id="a_account" value="'+esc(r.account||presetAcc||"")+'"><div class="hint" id="a_hint"></div></div>'+
    '<div class="row">'+
      '<div class="fld"><label>SALE PIC</label><select class="inp" id="a_pic">'+opts(S.master.pic,r.pic||S.user.pic,"— chọn —")+'</select></div>'+
      '<div class="fld"><label>FY</label><select class="inp" id="a_fy">'+opts(S.fyList,r.fy||S.fy,"—")+'</select></div>'+
      '<div class="fld"><label>ABCD focus</label><select class="inp" id="a_abcd">'+opts(S.master.abcd,r.abcd,"— chọn —")+'</select></div>'+
    '</div>'+
    '<div class="row">'+
      '<div class="fld"><label>Target theo Product type</label><select class="inp" id="a_tptype" onchange="adpSyncActual()">'+
        opts(ADP_PTYPES(),_tg0.ptype,"— chọn nhóm sản phẩm —")+'</select>'+
        '<div class="hint">All dental tính tất cả · All file gộp Hand files + Jizai · All MMG gộp Composite, Tẩy trắng, Nhựa</div></div>'+
      '<div class="fld"><label>FY Target sales (VND)</label><input class="inp num" id="a_targetAmt" inputmode="numeric" value="'+esc(_tg0.amt||"")+'" oninput="numOnly(this)"></div>'+
      '<div class="fld"><label>FY Actual sales (VND)</label><input class="inp num piclock" id="a_actualAmt" readonly value="">'+
        '<div class="hint" id="a_actualHint">—</div></div>'+
    '</div>'+
    '<div class="fld"><label>Case info — thông tin cơ bản</label><textarea class="inp" id="a_caseInfo" style="min-height:96px">'+esc(r.caseInfo||"")+'</textarea></div>'+
    '<div class="fld"><label>Case analysis (SWOT / Company · Competitor · Customer)</label><textarea class="inp" id="a_analysis" style="min-height:96px">'+esc(r.analysis||"")+'</textarea></div>'+
    '<div class="row">'+
      '<div class="fld"><label>Objective</label><textarea class="inp" id="a_objective" style="min-height:82px">'+esc(r.objective||"")+'</textarea></div>'+
      '<div class="fld"><label>Tactic</label><textarea class="inp" id="a_tactic" style="min-height:82px">'+esc(r.tactic||"")+'</textarea></div>'+
    '</div>'+
    '<div class="fld"><label>Key action</label><textarea class="inp" id="a_keyAction" style="min-height:96px">'+esc(r.keyAction||"")+'</textarea></div>'+
    '<div class="sect"><div class="ct"><span class="dot"></span>Review theo quý</div>'+
      Q.map(function(q){ return '<div class="fld"><label>'+q[1]+'</label><textarea class="inp" id="a_'+q[0]+'" style="min-height:70px">'+esc(r[q[0]]||"")+'</textarea></div>'; }).join("")+
      '<div class="fld"><label>Review FY</label><textarea class="inp" id="a_rFY" style="min-height:70px">'+esc(r.rFY||"")+'</textarea></div></div>';
  S.editing={ tab:"adp", row:r._row||0 };
  openModal(r._row?"Sửa ADP":"Thêm ADP key account", h,
    (r._row&&S.user.role==="manager"?'<button class="btn dg" onclick="delRow(\'adp\','+r._row+')">Xoá</button>':"")+
    '<button class="btn" onclick="closeModal()">Huỷ</button><button class="btn pri" onclick="saveADP()">Lưu</button>', true);
  accountCombo("a_accName","a_account",function(c){
    $("a_hint").textContent=[c.code,c.type,c.province,c.area].filter(String).join(" · ");
    if(c.pic) $("a_pic").value=c.pic;
    adpSyncActual();
  });
  adpSyncActual();
  S.modalRewire=function(){ adpSyncActual(); };
}
/* tìm bản ADP đã có của cùng account + FY (bỏ qua chính dòng đang sửa) */
function adpFindDup(accName,fy,selfRow){
  var key=accKeyOf(accName), rows=((S.cache.adp||{rows:null}).rows)||tGet("adp")||[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(selfRow && r._row===selfRow) continue;
    if(String(r.fy||"")!==String(fy||"")) continue;
    if(accKeyOf(parseAcc(r.account).name)===key) return r._row||-1;
  }
  return 0;
}
function saveADP(){
  var d={ _row:S.editing.row, account:$("a_account").value||mkAcc({name:$("a_accName").value.trim()}),
    pic:$("a_pic").value, fy:$("a_fy").value, abcd:$("a_abcd").value,
    caseInfo:$("a_caseInfo").value, analysis:$("a_analysis").value, objective:$("a_objective").value,
    tactic:$("a_tactic").value, keyAction:$("a_keyAction").value,
    targetAmt:adpMergeTarget($("a_tptype").value,$("a_targetAmt").value),
    actualAmt:String(adpActualOf($("a_accName").value.trim(),$("a_tptype").value)||""),
    rQ1:$("a_rQ1").value, rQ2:$("a_rQ2").value, rQ3:$("a_rQ3").value, rQ4:$("a_rQ4").value, rFY:$("a_rFY").value };
  var accNm=$("a_accName").value.trim();
  if(!accNm) return toast("Cần chọn Account","warn");
  /* ⭐ v7.2 — mỗi địa bàn chỉ có MỘT bản ADP trong một FY.
     Trước đây thêm hai lần thì bảng ABCD hiện account hai chỗ, số liệu cộng đôi. */
  var dupRow=adpFindDup(accNm,d.fy,d._row);
  if(dupRow){
    return toast("⚠️ "+accNm+" đã có ADP trong "+d.fy+" — mở bản đó ra sửa thay vì tạo thêm","warn",7000);
  }
  busy(true,"Đang lưu ADP…");
  apiPost({action:"saveADP",data:d}).then(function(r){
    busy(false); closeModal(); toast(r.message||"Đã lưu","ok");
    afterWrite("adp", r.row||d._row, d);
    if(S.tab==="adp") renderADP();
  }).catch(function(e){ busy(false); toast(e.message,"err",5000); });
}
</script>

<script>
/* ═══════════════════════ GỬI BÁO CÁO ═══════════════════════ */
/* ═══════════════════════ ⭐ v4.3 — GỬI BÁO CÁO ═══════════════════════
   · không gọi API nữa: lấy thẳng từ kho địa bàn FY + tab Báo cáo tháng
   · bỏ khối "Người nhận" (email cấu hình trong Code.gs, không cần xem ở đây)
   · xem kết quả công việc theo từng PIC, kèm ảnh đi địa bàn
   ═══════════════════════════════════════════════════════════════════════ */
/* ═══════════════════════ ⭐ v4.3 — XEM ẢNH ĐI ĐỊA BÀN ═══════════════════════
   Chỉ 4 tài khoản dưới đây mở được tab này. Xem theo tháng, lọc theo PIC,
   ảnh hiện thẳng trong app, và tải được file Excel thống kê.
   ═══════════════════════════════════════════════════════════════════════════ */
/* quyền xem ảnh: dùng canSeeGallery() khai báo ở khối đăng nhập (nhóm Management) */
function pgGallery(){
  if(!canSeeGallery()){
    $("main").innerHTML='<div class="pg"><div class="card pad"><div class="empty"><div class="e">🔒</div>'+
      '<p>Mục này chỉ dành cho nhóm Management (Nguyen Ha · Tuyen · Hoa · Giang).</p>'+
      '<p style="font-size:12px;color:var(--mute);margin-top:6px">Tài khoản đang đăng nhập: '+esc(S.user.email||S.user.pic||"—")+'</p>'+
      '</div></div></div>';
    return;
  }
  if(!S.galMonth) S.galMonth=ymOf(todayISO());
  if(S.galRows && S.galRows._fy===S.fy){ renderGallery(); return; }
  skeleton('<div class="ph"><div><h2>Xem ảnh đi địa bàn</h2><p>Đang nạp ảnh '+esc(S.fy)+'…</p></div></div>'+skRows(6));
  loadGallery();
}
function loadGallery(){
  var fr=fyRange();
  return apiGet("visitFeed",{pic:"",from:fr.from,to:fr.to}).then(function(x){
    var rows=(x.rows||[]).filter(function(w){ return (w.photos&&w.photos.length); });
    rows._fy=S.fy; S.galRows=rows;
    if(S.tab==="photos") renderGallery();
    return rows;
  }).catch(function(e){
    $("main").innerHTML='<div class="pg"><div class="card pad"><b style="color:#A82F2C">Lỗi:</b> '+esc(e.message)+
      '<div style="margin-top:10px"><button class="btn sm" onclick="S.galRows=null;pgGallery()">Thử lại</button></div></div></div>';
  });
}
function galFiltered(){
  var all=S.galRows||[];
  var m=S.galMonth||"", pic=S.galPic||"";
  return all.filter(function(w){
    if(pic && w.pic!==pic) return false;
    if(m!=="ALL" && ymOf(String(w.start).slice(0,10))!==m) return false;
    return true;
  }).sort(function(a,b){ return String(b.start).localeCompare(String(a.start)); });
}
function renderGallery(){
  var all=S.galRows||[], rows=galFiltered();
  var ms=fyMonths(S.fy);
  var cntM={}; all.forEach(function(w){ var m=ymOf(String(w.start).slice(0,10)); cntM[m]=(cntM[m]||0)+1; });
  var pics=[]; all.forEach(function(w){ if(w.pic&&pics.indexOf(w.pic)<0) pics.push(w.pic); }); pics.sort();

  /* bảng PIC × tháng */
  var byPic={}; all.forEach(function(w){
    var p=w.pic||"—", m=ymOf(String(w.start).slice(0,10));
    byPic[p]=byPic[p]||{}; byPic[p][m]=(byPic[p][m]||0)+1; byPic[p].total=(byPic[p].total||0)+1;
  });
  var mUsed=ms.filter(function(m){ return cntM[m]; });
  var tbl=Object.keys(byPic).length
    ? '<div class="tbwrap" style="max-height:none"><table class="tb"><thead><tr><th>PIC \\ Tháng</th>'
      +mUsed.map(function(m){return '<th class="num">'+m.slice(4)+"/"+m.slice(2,4)+'</th>';}).join("")
      +'<th class="num">Tổng</th></tr></thead><tbody>'
      +Object.keys(byPic).sort().map(function(p){
        return '<tr><td><b>'+esc(p)+'</b></td>'
          +mUsed.map(function(m){ var c=byPic[p][m]||0;
            return '<td class="num"'+(c?' style="cursor:pointer" onclick="S.galPic=\''+esc(p)+'\';S.galMonth=\''+m+'\';renderGallery()"':'')+'>'
              +(c?'<b>'+c+'</b>':'<span style="color:#D5DDEC">·</span>')+'</td>'; }).join("")
          +'<td class="num"><b>'+(byPic[p].total||0)+'</b></td></tr>'; }).join("")
      +'<tr style="background:var(--pale)"><td><b>TỔNG</b></td>'
      +mUsed.map(function(m){ return '<td class="num"><b>'+(cntM[m]||0)+'</b></td>'; }).join("")
      +'<td class="num"><b>'+all.length+'</b></td></tr></tbody></table></div>'
    : '';

  var accSet={}; rows.forEach(function(w){ var a=parseAcc(w.account).name; if(a) accSet[a]=1; });
  var nPhoto=rows.reduce(function(s,w){ return s+((w.photos||[]).length); },0);
  var withGps=rows.filter(function(w){ return String(w.gps||"").trim(); }).length;

  $("main").innerHTML='<div class="pg">'+
    '<div class="ph"><div><h2>Xem ảnh đi địa bàn</h2>'+
      '<p>'+(S.galMonth==="ALL"?"Cả "+esc(S.fy):"Tháng "+S.galMonth.slice(4)+"/"+S.galMonth.slice(0,4))+
      (S.galPic?' · PIC <b>'+esc(S.galPic)+'</b>':' · toàn nhóm')+' · <b>'+nPhoto+'</b> ảnh</p></div>'+
      '<div class="sp"></div>'+
      '<button class="btn sm" onclick="S.galRows=null;pgGallery()">⟳ Làm mới</button>'+
      '<button class="btn pri sm" onclick="galExcel()">⬇️ Tải Excel thống kê</button></div>'+

    '<div class="card pad" style="margin-bottom:12px">'+
      '<div class="chipbar" style="margin-bottom:9px">'+
        '<div class="chip'+(S.galMonth==="ALL"?" on":"")+'" onclick="S.galMonth=\'ALL\';renderGallery()">Cả FY</div>'+
        ms.map(function(m){ var c=cntM[m]||0;
          return '<div class="chip'+(S.galMonth===m?" on":"")+'" onclick="S.galMonth=\''+m+'\';renderGallery()">'+
            m.slice(4)+"/"+m.slice(2,4)+(c?' <span style="opacity:.65">'+c+'</span>':"")+'</div>'; }).join("")+'</div>'+
      '<div class="chipbar"><div class="chip'+(S.galPic?"":" on")+'" onclick="S.galPic=\'\';renderGallery()">Tất cả PIC</div>'+
        pics.map(function(p){ return '<div class="chip'+(S.galPic===p?" on":"")+'" onclick="S.galPic=\''+esc(p)+'\';renderGallery()">'+esc(p)+'</div>'; }).join("")+'</div>'+
    '</div>'+

    '<div class="grid g4" style="margin-bottom:12px">'+
      '<div class="kpi"><div class="lb">Ảnh trong kỳ</div><div class="vl">'+nPhoto+'</div><div class="sb">'+rows.length+' buổi có ảnh</div></div>'+
      '<div class="kpi"><div class="lb">Địa bàn đã chụp</div><div class="vl">'+Object.keys(accSet).length+'</div><div class="sb">account khác nhau</div></div>'+
      '<div class="kpi"><div class="lb">Có toạ độ GPS</div><div class="vl">'+withGps+'</div><div class="sb">'+(rows.length?Math.round(withGps/rows.length*100):0)+'% số ảnh</div></div>'+
      '<div class="kpi"><div class="lb">Sales có ảnh</div><div class="vl">'+pics.length+'</div><div class="sb">'+esc(pics.slice(0,3).join(" · ")||"—")+'</div></div>'+
    '</div>'+

    (tbl?'<div class="card pad" style="margin-bottom:12px"><div class="ct"><span class="dot"></span>Số ảnh theo PIC × tháng<small>bấm vào ô để lọc</small></div>'+tbl+'</div>':"")+

    (rows.length
      ? '<div class="galgrid">'+rows.map(galCard).join("")+'</div>'
      : '<div class="card pad"><div class="empty"><div class="e">📷</div><p>Chưa có ảnh nào trong kỳ này</p></div></div>')+
  '</div>';
}
function galCard(w){
  var a=parseAcc(w.account), ph=(w.photos||[])[0]; if(!ph) return "";
  return '<div class="galc">'+
    '<div class="galc-img"><img loading="lazy" src="'+esc(ph.thumb||ph.full)+'" alt="" onclick="openLb('+JSON.stringify([ph]).replace(/"/g,"&quot;")+',0)"></div>'+
    '<div class="galc-b">'+
      '<b>'+esc(a.name||"—")+'</b>'+
      '<div class="m"><span>'+esc(fmtVN(w.start))+'</span><span>·</span><span>'+esc(w.pic||"")+'</span>'+
        (w.typeAction?'<span>·</span><span>'+esc(w.typeAction)+'</span>':"")+'</div>'+
      (w.gpsAddr?'<div class="g">📍 '+esc(w.gpsAddr)+'</div>':(w.gps?'<div class="g">📍 '+esc(w.gps)+'</div>':""))+
      (w.result?'<div class="r">'+esc(String(w.result).slice(0,140))+'</div>':"")+
      '<button class="linkbtn" onclick="openTask('+w._row+')">Mở task →</button>'+
    '</div></div>';
}
/* ── xuất Excel thống kê (dựng ngay trên máy, không cần server) ── */
var _xlsxQ=null;
function ensureXLSX(cb){
  if(window.XLSX) return cb(window.XLSX);
  if(_xlsxQ){ _xlsxQ.push(cb); return; }
  _xlsxQ=[cb];
  var s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload=function(){ var q=_xlsxQ; _xlsxQ=null; q.forEach(function(f){ f(window.XLSX); }); };
  s.onerror=function(){ _xlsxQ=null; busy(false); toast("Không tải được thư viện Excel","err"); };
  document.head.appendChild(s);
}
function galExcel(){
  var rows=galFiltered();
  if(!rows.length) return toast("Kỳ này chưa có ảnh để xuất","warn");
  busy(true,"Đang dựng file Excel…");
  ensureXLSX(function(XLSX){
    try{
      var head=["Ngày","Thứ","PIC","Account","Loại địa bàn","Tỉnh thành","Khu vực",
                "Type action","Type task","Sales Process","Nhóm sản phẩm","Trạng thái",
                "Next action","Kết quả","Toạ độ GPS","Địa chỉ nơi chụp","Link ảnh Drive"];
      var aoa=[head];
      rows.forEach(function(w){
        var a=parseAcc(w.account), ph=(w.photos||[])[0]||{};
        aoa.push([ fmtVN(w.start), wdOf(w.start), w.pic||"", a.name||"", a.type||"", a.province||"", a.area||"",
                   w.typeAction||"", w.typeTask||"", w.process||"", w.product||"", w.status||"",
                   w.nextAction||"", String(w.result||"").replace(/\s+/g," ").slice(0,900),
                   w.gps||"", w.gpsAddr||"", ph.open||ph.full||"" ]);
      });

/* ⭐ v5.8 — XEM NHANH TOÀN BỘ CÔNG VIỆC TRONG TUẦN TRƯỚC KHI GỬI MAIL.
   Gộp cả hai nguồn: hoạt động đi địa bàn (tab 6. WEEKLY REPORT) và Công việc khác
   (Key task / đầu việc con bên WEEKYLY new), hiển thị đúng các cột anh cần:
   Key task · Sub task · Ngày bắt đầu · Kế hoạch · Tiến độ · Kết quả · Deadline. */
function rpPreviewRows(from,to){
  var pics=rpPics(), inPic={};
  pics.forEach(function(p){ inPic[noAcc(p).trim()]=1; });
  var rows=[];

  /* nguồn 1 — đi địa bàn */
  terrRows().forEach(function(w){
    if(!inPic[noAcc(w.pic||"").trim()]) return;
    if(!inRp(w,from,to)) return;
    var pct=/complet/i.test(String(w.status||"")) ? 100
          : /75/.test(String(w.status||"")) ? 75
          : /50/.test(String(w.status||"")) ? 50
          : /25/.test(String(w.status||"")) ? 25 : 0;
    rows.push({ src:"Đi địa bàn", pic:w.pic, key:w.typeTask||"Đi địa bàn",
      sub:parseAcc(w.account).name||w.account, start:String(w.start||"").slice(0,10),
      plan:w.plan||"", pct:pct, status:w.status||"", result:w.result||"",
      due:String(w.finish||"").slice(0,10), row:w._row });
  });

  /* nguồn 2 — công việc khác (bỏ key Customer visiting vì đã đếm ở nguồn 1) */
  ((S.other&&S.other.keys)||[]).forEach(function(k){
    if(String(k.fy||"") && String(k.fy)!==S.fy) return;
    if(!OTHER_TYPE_RE.test(String(k.type||""))) return;
    if(isVisitingKey(k)) return;
    var subs=(k.subs||[]);
    function push(x,isKey){
      if(!inPic[noAcc(x.pic||"").trim()]) return;
      var a=String(x.start||"").slice(0,10);
      var b=String(x.planned||x.revised||x.actual||"").slice(0,10)||a;
      if(!a&&!b) return;
      if(!a) a=b; if(!b) b=a;
      if(a>b){ var t=a; a=b; b=t; }
      if(b<from || a>to) return;
      rows.push({ src:"Công việc khác", pic:x.pic, key:k.keyTask||"—",
        sub:isKey?"(key task)":(x.subTask||"—"), start:String(x.start||"").slice(0,10),
        plan:"", pct:otherPct(x), status:x.status||"To Do", result:x.result||"",
        due:String(x.planned||"").slice(0,10), no:x.no });
    }
    if(subs.length) subs.forEach(function(x){ push(x,false); });
    else push(k,true);
  });

  rows.sort(function(a,b){ return String(a.start).localeCompare(String(b.start)) ||
                                  String(a.key).localeCompare(String(b.key)); });
  return rows;
}

function inRp(r,f,t){
  var a=String(r.start).slice(0,10), b=String(r.finish||"").slice(0,10)||a;

/* ═══════════ ⭐ v8 — OTHER TASK TRONG BÁO CÁO TUẦN ═══════════
   Trước đây báo cáo tuần chỉ lấy hoạt động đi địa bàn. Nay gộp thêm Key task /
   đầu việc con bên "Công việc khác", đúng như bảng Report Hub, và gửi kèm dữ liệu
   này trong yêu cầu gửi mail để Code.gs dựng đúng phần Other task.
   ══════════════════════════════════════════════════════════════ */
function rpFit(x,from,to){
  var a=String(x.start||"").slice(0,10);
  var b=String(x.planned||x.revised||x.actual||"").slice(0,10)||a;
  if(!a&&!b) return false;
  if(!a) a=b; if(!b) b=a;
  if(a>b){ var t=a; a=b; b=t; }
  return !(b<from || a>to);
}
function rpOtherFor(pic,from,to){
  var out=[];
  ((S.other&&S.other.keys)||[]).forEach(function(k){
    if(String(k.fy||"") && String(k.fy)!==S.fy) return;
    if(!OTHER_TYPE_RE.test(String(k.type||""))) return;
    if(isVisitingKey(k)) return;
    var subs=(k.subs||[]);
    var mine=subs.filter(function(x){ return (!pic||picEq(x.pic,pic)) && rpFit(x,from,to); });
    if(mine.length) out.push({ key:k, subs:mine });
    else if((!pic||picEq(k.pic,pic)) && !subs.length && rpFit(k,from,to)) out.push({ key:k, subs:[] });
  });
  return out;
}

            (w.typeAction?'<span class="ttag" style="background:var(--info-bg);color:var(--blue-d)">'+esc(w.typeAction)+'</span>':"")+
            statusTag(w.status)+'</div>'+
          (txt?'<div class="rp-t">'+nl2br(String(txt).slice(0,700))+'</div>':"")+
          (w.nextAction?'<div class="rp-n">→ '+esc(w.nextAction)+(w.stopReason?': '+esc(w.stopReason):"")+'</div>':"")+
          (ph.length?'<div class="rp-ph">'+ph.map(function(x){
             return '<img loading="lazy" src="'+esc(x.thumb||x.full)+'" alt="" onclick="event.stopPropagation();openLb('+JSON.stringify([x]).replace(/"/g,"&quot;")+',0)">'; }).join("")+
             (w.gpsAddr?'<span class="rp-gps">📍 '+esc(w.gpsAddr)+'</span>':"")+'</div>':"")+
        '</div>'; }).join("")+'</div>';
  }).join("");
}
/* ── báo cáo tháng: gom theo PIC ── */
function rpMonthBody(){
  var pics=rpPics(), nMon=nextMonthStr(S.rpMonth);
  var all=tGet("monthly")||[];
  var out=pics.map(function(p){
    var cur=all.filter(function(r){ return mnPer(r)===String(S.rpMonth) && (!r.pic||r.pic===p); });
    var nxt=all.filter(function(r){ return mnPer(r)===String(nMon)       && (!r.pic||r.pic===p); });
    if(!cur.length&&!nxt.length) return "";
    return '<div class="card pad" style="margin-bottom:12px">'+
      '<div class="ct"><span class="av-sm" style="background:'+avColor(p)+'">'+esc(initials(p))+'</span>'+esc(p)+
        '<small>'+cur.length+' hạng mục · '+nxt.length+' kế hoạch tháng sau</small></div>'+
      mnTable(cur,false)+
      (nxt.length?'<div class="rp-next"><div class="rp-nh">📘 Kế hoạch tháng '+nMon.slice(4)+"/"+nMon.slice(0,4)+'</div>'+mnTable(nxt,true)+'</div>':"")+
    '</div>';
  }).join("");
  return out || '<div class="card pad"><div class="empty"><div class="e">📄</div><p>Chưa có hạng mục nào cho kỳ '+S.rpMonth.slice(4)+"/"+S.rpMonth.slice(0,4)+'</p></div></div>';
}

function nextMonthStr(m){ var y=parseInt(String(m).slice(0,4),10), k=parseInt(String(m).slice(4,6),10); k++; if(k>12){k=1;y++;} return y+("0"+k).slice(-2); }
function recipientPreview(pic){
  var mt=mailTargets();
  if(!mt.to.length){
    var e=(ROLES[pic]||{}).email||"";
    if(e) mt.to=[e];
  }
  return mt;
}
function grpByType(rows){
  var g={},o=[];
  rows.forEach(function(r){ var t=r.typeTask||"— Chưa phân loại —"; if(!g[t]){g[t]={type:t,items:[]};o.push(t);} g[t].items.push(r); });
  o.sort();
  return o.map(function(t){
    var it=g[t].items, act=it.filter(function(r){return !/cancel/i.test(r.status);});
    var pct=act.length?Math.round(act.reduce(function(s,r){return s+statusPct(r.status);},0)/act.length):0;
    return {type:t,items:it,pct:pct};
  });
}
function wkTable(groups,isNext){
  if(!groups.length) return '<div class="empty"><p>'+(isNext?"Chưa có kế hoạch cho tuần sau":"Chưa có hoạt động trong tuần này")+'</p></div>';
  return '<div class="tbwrap" style="max-height:none"><table class="tb"><thead><tr>'+
    '<th style="width:44px">No.</th><th>Account</th><th style="width:82px">Start</th><th style="width:82px">Finish</th>'+
    '<th style="width:104px">Tiến độ</th><th>Plan &amp; result</th><th style="width:108px">Status</th></tr></thead><tbody>'+
    groups.map(function(k){
      return '<tr style="background:var(--pale)"><td colspan="7"><b style="color:var(--navy)">'+esc(k.type)+'</b> '+
        '<span class="tag t-b">'+k.items.length+'</span> <b style="color:'+pctColor(k.pct/100)+'">'+k.pct+'%</b></td></tr>'+
        k.items.map(function(s,i){
          var a=parseAcc(s.account), p=statusPct(s.status);
          var od=!/complet|cancel/i.test(s.status)&&(s.finish||s.start)&&String(s.finish||s.start).slice(0,10)<todayISO();
          var body=isNext?(s.plan||s.nextAction):(s.result||s.plan);
          return '<tr'+(od?' style="background:var(--dang-bg)"':"")+'><td class="ctr" style="color:var(--mute)">'+esc(s.no||(i+1))+'</td>'+
            '<td><b>'+esc(a.name||s.account)+'</b>'+(od?' <span class="tag t-r">QUÁ HẠN</span>':"")+
            '<div style="font-size:11px;color:var(--mute)">'+esc([a.type,a.province,s.typeAction].filter(String).join(" · "))+'</div></td>'+
            '<td class="mono">'+fmtVN(s.start)+'</td><td class="mono">'+fmtVN(s.finish||s.start)+'</td>'+
            '<td>'+pb(p/100)+'<div class="pbl"><span style="color:'+pctColor(p/100)+'">'+p+'%</span><span></span></div></td>'+
            '<td style="font-size:12.5px;max-width:340px">'+nl2br(String(body||"").slice(0,400))+(s.photo?' <span class="tag t-b">📷</span>':"")+'</td>'+
            '<td>'+statusTag(s.status)+'</td></tr>'; }).join("");
    }).join("")+'</tbody></table></div>';
}
function wkPreview(thisW,nextW){
  var g1=grpByType(thisW), g2=grpByType(nextW);
  return '<div class="card pad" style="margin-bottom:12px">'+
      '<div class="ct"><span class="dot"></span>① This week ('+fmtVN(S.rpFrom)+' – '+fmtVN(S.rpTo)+')<span class="sp"></span>'+
      '<small>'+g1.length+' type task · '+thisW.length+' hoạt động</small></div>'+wkTable(g1,false)+'</div>'+
    '<div class="card pad" style="margin-bottom:12px">'+
      '<div class="ct"><span class="dot" style="background:var(--amber)"></span>② Plan for next week ('+fmtVN(addDays(S.rpFrom,7))+' – '+fmtVN(addDays(S.rpTo,7))+')<span class="sp"></span>'+
      '<small>'+g2.length+' type task · '+nextW.length+' kế hoạch</small></div>'+wkTable(g2,true)+'</div>';
}
function mnTable(rows,isNext){
  if(!rows.length) return '<div class="empty"><p>'+(isNext?"Chưa có kế hoạch tháng sau":"Chưa có nội dung tháng này")+'</p></div>';
  return '<div class="tbwrap" style="max-height:none"><table class="tb"><thead><tr><th style="width:190px">Type task</th>'+
    '<th>'+(isNext?"Plan":"Result")+'</th><th style="width:80px">Area</th><th style="width:88px">PIC</th></tr></thead><tbody>'+
    rows.map(function(r){ var t=isNext?r.plan:(r.result||r.plan);
      return '<tr><td style="color:var(--blue-d);font-weight:650">'+esc(r.typeTask)+'</td>'+
        '<td style="font-size:12.5px;line-height:1.55">'+(t?nl2br(t):'<span style="color:var(--mute)">—</span>')+'</td>'+

    '</tbody></table></div>';
}
function mnPreview(thisM,nextM){
  var nMon=nextMonthStr(S.rpMonth);
  return '<div class="card pad" style="margin-bottom:12px"><div class="ct"><span class="dot"></span>① Kết quả tháng '+S.rpMonth.slice(4)+"/"+S.rpMonth.slice(0,4)+
      '<span class="sp"></span><small>'+thisM.length+' hạng mục</small></div>'+mnTable(thisM,false)+'</div>'+
    '<div class="card pad" style="margin-bottom:12px"><div class="ct"><span class="dot" style="background:var(--amber)"></span>② Kế hoạch tháng '+nMon.slice(4)+"/"+nMon.slice(0,4)+
      '<span class="sp"></span><small>'+nextM.length+' hạng mục</small></div>'+mnTable(nextM,true)+'</div>';
