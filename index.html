    } else {
      body='<div class="card pad"><div class="ct"><span class="dot"></span>Thông tin account'
        +'<span class="sp"></span><button class="btn sm pri" onclick="S.accEdit=true;renderAcc()">✎ Sửa thông tin</button></div>'
        +'<dl class="kv">'
        +'<dt>Customer code</dt><dd class="mono">'+esc(c.code)+'</dd>'
        +'<dt>Account name</dt><dd>'+esc(c.name)+'</dd>'
        +'<dt>Account type</dt><dd>'+esc(c.type||"—")+'</dd>'
        +'<dt>Địa chỉ</dt><dd>'+esc(c.address||"—")+'</dd>'
        +'<dt>Tỉnh / Area</dt><dd>'+esc(c.province||"—")+' · '+esc(c.area||"—")+'</dd>'
        +'<dt>MMH sales PIC</dt><dd>'+esc(c.pic||"—")+'</dd>'
        +'<dt>FY mở account</dt><dd>'+esc(c.fy||"—")+' · '+(c.openDate?fmtVN(c.openDate):"—")+'</dd>'
        +'<dt>Số CBC</dt><dd><b>'+fmtN((j.cbc||[]).length)+'</b> người liên hệ</dd>'
        +'<dt>Số ADP</dt><dd><b>'+fmtN((j.adp||[]).length)+'</b> bản ADP</dd>'
        +'<dt>Ghi chú</dt><dd>'+nl2br(c.note||"—")+'</dd></dl></div>';
    }
  }
  else if(tab==="adp"){
    body='<button class="btn sm pri" style="margin-bottom:12px" onclick="rADPFor(\''+reg(mkAcc(c))+'\')">＋ Thêm ADP cho account này</button>'
      +(j.adp.length?j.adp.map(function(a){
      return '<div class="card pad" style="margin-bottom:10px"><div class="ct"><span class="dot"></span>'+esc(a.fy||"")+' — '+esc(a.focus||"—")
        +'<span class="sp"></span><button class="btn xs" onclick=\'formADP('+JSON.stringify(a).replace(/'/g,"&#39;")+')\'>Sửa</button></div>'
        +'<dl class="kv"><dt>Objective</dt><dd>'+nl2br(a.objective||"—")+'</dd>'
        +'<dt>Key action</dt><dd>'+nl2br(a.keyAction||"—")+'</dd>'
        +'<dt>Tactic</dt><dd>'+nl2br(a.tactic||"—")+'</dd>'
        +'<dt>Case info</dt><dd>'+nl2br(a.caseInfo||"—")+'</dd>'
        +'<dt>Target / Actual</dt><dd><b>'+fmtVND(a.targetAmt)+'</b> / '+fmtVND(a.actualAmt)+'</dd>'
        +'<dt>Theo tháng</dt><dd>'+adpMonthStrip(a)+'</dd></dl></div>';
    }).join(""):'<div class="empty"><div class="e">⭐</div><p>Account này chưa có ADP</p></div>');
  }

  var foot='<button class="btn gho" onclick="closeDrw()">Đóng</button>'
    +'<div style="flex:1"></div>'
    +'<button class="btn gho" onclick="formCBC(null,\''+esc(c.code)+'\')">👤 Thêm CBC</button>'
    +'<button class="btn gho" onclick="rADPFor(\''+reg(mkAcc(c))+'\')">⭐ Thêm ADP</button>'
    +'<button class="btn gho" onclick="rWeeklyFor(\''+reg(mkAcc(c))+'\')">📍 Ghi hoạt động</button>'
    +'<button class="btn pri" onclick="S.accEdit=true;accTab(\'info\')">✎ Sửa hồ sơ</button>';

  openDrw(head,tabs,(tab==="tl"||tab==="od"?stats:"")+body,foot);
}

/* ═══════════════ CHI TIẾT 1 LẦN ĐI ĐỊA BÀN ═══════════════ */
function openVisit(w){
  if(typeof w==="string"){ try{ w=JSON.parse(w); }catch(e){ return; } }
  if(!w) return;
  if(w._row){
    var pool=(S.cache.weekly&&S.cache.weekly.rows)||[];
    if(!pool.filter(function(x){return x._row===w._row;}).length){
      S.cache.weekly=S.cache.weekly||{rows:[]};
      S.cache.weekly.rows=(S.cache.weekly.rows||[]).concat([w]);
    }
    return openTask(w._row);
  }
  toast("Task chưa có vị trí dòng trên Sheet","warn");
}
function openVisitRow(row){ return openTask(row); }

var ACTMETA={
  add   :{lb:"Thêm",   bg:"#E8F7EF", fg:"#15803D"},
  update:{lb:"Sửa",    bg:"#EDF3FE", fg:"#2F4C90"},
  delete:{lb:"Xoá",    bg:"#FDECEC", fg:"#B91C1C"},
  photo :{lb:"Ảnh",    bg:"#FFF6E4", fg:"#8A5A00"},
  report:{lb:"Báo cáo",bg:"#F3EDFB", fg:"#6B4A9E"},
  kpi   :{lb:"KPI",    bg:"#E4F5F6", fg:"#0B7480"}
};
var TABLB={customer:"Khách hàng",cbc:"CBC",order:"Đơn hàng",weekly:"Địa bàn",photos:"Ảnh địa bàn",monthly:"Báo cáo tháng",present:"Thuyết trình",adp:"ADP",kpi:"KPI"};
function toggleAct(){
  var r=$("actRail"), on=r.classList.toggle("on");
  if(on){ $("actDot").style.display="none"; if(!S.activity) loadActivity(); else renderAct(); }
}
function loadActivity(force){
  if(S.activity&&!force) return renderAct();
  $("actBody").innerHTML=skRows(4);
  apiGet("activity",{limit:120}).then(function(j){ S.activity=j.rows||[]; renderAct(); })
    .catch(function(){ $("actBody").innerHTML='<div class="empty"><p style="font-size:12.5px">Không tải được nhật ký</p></div>'; });
}
function relTime(s){
  if(!s) return "";
  var t=new Date(String(s).replace(" ","T"));
  if(isNaN(t)) return String(s);
  var d=(Date.now()-t.getTime())/1000;
  if(d<60) return "vừa xong";
  if(d<3600) return Math.floor(d/60)+" phút trước";
  if(d<86400) return Math.floor(d/3600)+" giờ trước";
  if(d<604800) return Math.floor(d/86400)+" ngày trước";
  return fmtVN(String(s).slice(0,10));
}
function renderAct(){
  var rows=S.activity||[];
  var sel=$("actPic");
  if(sel && !sel._built){
    var names={}; rows.forEach(function(a){ if(a.pic) names[a.pic]=1; });
    (S.picList||[]).forEach(function(p){ names[p.pic]=1; });
    sel.innerHTML='<option value="">👥 Tất cả</option>'+Object.keys(names).sort().map(function(p){
      return '<option value="'+esc(p)+'">'+esc(p)+'</option>'; }).join("");
    sel._built=true;
  }
  var fp=sel?sel.value:"", fk=$("actKind")?$("actKind").value:"";
  var list=rows.filter(function(a){
    if(fp && a.pic!==fp) return false;
    if(fk && a.action!==fk) return false;
    return true;
  });
  if(!list.length){ $("actBody").innerHTML='<div class="empty" style="padding:26px 0"><div class="e">🕘</div><p style="font-size:12.5px">Chưa có hoạt động nào</p></div>'; return; }
  $("actBody").innerHTML=list.map(function(a){
    var m=ACTMETA[a.action]||ACTMETA.update;
    return '<div class="acard a-'+esc(a.action||"update")+'">'
      +'<div class="ac-h"><span class="ac-av" style="background:'+avColor(a.pic)+'">'+esc(initials(a.pic))+'</span>'
      +'<span class="ac-who">'+esc(a.pic||"—")+'</span>'
      +'<span class="ac-bd" style="background:'+m.bg+';color:'+m.fg+'">'+m.lb+'</span></div>'
      +(a.target?'<div class="ac-tg">'+esc(a.target)+'</div>':"")
      +'<div class="ac-dt">'+esc(TABLB[a.tab]||a.tab||"")+(a.detail?" — "+esc(a.detail):"")+'</div>'
      +'<div class="ac-tm">'+esc(relTime(a.time))+'</div></div>';
  }).join("");
}

<script>

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v3 — KHO DỮ LIỆU TRONG BỘ NHỚ  (chuyển tab KHÔNG gọi mạng)
   Trước: mỗi lần bấm sang tab khác là 1 request JSONP tới GAS (2–6 giây).
   Nay  : nạp 1 lần lúc mở app, giữ trong RAM + localStorage. Chuyển tab
          = vẽ lại từ bộ nhớ ⇒ tức thì. Dữ liệu mới tải ngầm ở nền.
   ═══════════════════════════════════════════════════════════════════════ */
var TSTORE={};                 /* tab → {rows, at, key} */
function TKEY_(){ return ckey("tabs"); }

function scopePic(){ return (S.user && S.user.role==="manager") ? "" : (S.user ? S.user.pic : ""); }
function tabKey(tab){ return tab+"|"+S.fy+"|"+scopePic(); }
function tGet(tab){
  var e=TSTORE[tab];
  return (e&&e.key===tabKey(tab))?e.rows:null;
}
function tPut(tab,rows){
  if(tab==="weekly") tbdFixRows(rows);   /* ⭐ v11 — kết quả dòng TBD tính lại tại chỗ */
  TSTORE[tab]={rows:rows||[],at:Date.now(),key:tabKey(tab)};
  savTabs();
}
var _savT;
function savTabs(){
  clearTimeout(_savT);
  _savT=setTimeout(function(){
    try{
      var d=TSTORE;
      if(!KV.ok){                               /* localStorage dự phòng: chỉ lưu tab vừa phải */
        d={}; Object.keys(TSTORE).forEach(function(k){ if((TSTORE[k].rows||[]).length<=2500) d[k]=TSTORE[k]; });
      }
      kvSet(TKEY_(),{ver:S.verSeen||S.ver||"",d:d});
    }catch(e){}
  },600);
}
function loadTabs(){
  try{
    var v=kvGet(TKEY_());
    /* bản cache của phiên dữ liệu cũ thì bỏ, tránh hiện lại dòng đã xoá trên sheet */
    if(v&&v.d&&(!S.verSeen||!v.ver||v.ver===S.verSeen)) TSTORE=v.d;
  }catch(e){ TSTORE={}; }
}
function clearTabs(){ TSTORE={}; CVER={}; kvDel(TKEY_()); }

/* Lấy 1 tab: trả ngay nếu có sẵn, đồng thời làm mới ngầm nếu đã cũ */
function ensureTab(tab,opts,onReady){
  var have=tGet(tab);
  if(have){
    onReady(have,true);
    afterGate(function(){ var e=TSTORE[tab]; if(e && dataStale(e.at)) fetchTab(tab,opts).catch(function(){}); });
    return;
  }
  onReady(null,false);
  fetchTab(tab,opts,onReady);
}
/* ⭐ v14 — giải nén dạng LEAN (mảng-của-mảng + một dòng tên cột).
   Payload nhẹ hơn ~60% so với gửi tên cột lặp lại ở từng dòng. */
function unlean(j){
  if(!j) return [];
  if(j.rows) return j.rows;
  if(!j.lean||!j.cols) return [];
  var C=j.cols, nC=C.length;
  return j.lean.map(function(a){
    var o={}; for(var i=0;i<nC;i++) o[C[i]]=a[i]; return o;
  });
}
function fetchTab(tab,opts,onReady){
  var q=Object.assign({tab:tab,fy:S.fy,pic:scopePic(),limit:5000,lean:1},opts||{});
  if(!tGet(tab)) cvDrop("list",q);     /* trong máy không còn dữ liệu ⇒ phải xin bản đầy đủ */
  if(FETCHING[tab]){
    /* ⭐ v13 — đang có request cùng tab: vẫn báo lại cho người gọi sau (bản cũ bỏ quên
       callback ⇒ màn hình kẹt ở khung xương cho tới khi bấm tab khác) */
    if(onReady) FETCHING[tab].then(function(rows){ onReady(rows,true); },function(e){ onReady([],true,e); });
    return FETCHING[tab];
  }
  FETCHING[tab]=apiGet("list",q).then(function(j){
    delete FETCHING[tab];
    /* dữ liệu chưa đổi ⇒ giữ nguyên bản đang có, chỉ đánh dấu là còn mới */
    if(j&&j.unchanged){
      var e0=TSTORE[tab]; if(e0) e0.at=Date.now();
      var keep=tGet(tab)||[];
      if(tab==="cbc"){ S.cbcRows=keep; S._cbcLoading=false; }
      if(onReady) onReady(keep,true);
      return keep;
    }
    var rows=unlean(j);
    tPut(tab,rows);
    if(tab==="cbc"){ S.cbcRows=tGet("cbc")||rows; S._cbcLoading=false; _stCache=null; }
    if(onReady) onReady(rows,true);
    else if(S.tab===TAB_OF[tab]) softRepaint();
    return rows;
  }).catch(function(e){ delete FETCHING[tab]; if(onReady) onReady([],true,e); throw e; });
  return FETCHING[tab];
}
var FETCHING={};
var TAB_OF={order:"order",monthly:"monthly",present:"present",adp:"adp",weekly:"weekly",cbc:"cust"};

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v13 — ĐỒNG BỘ THÔNG MINH THEO VERSION
   Mở app: vẽ ngay từ bộ nhớ đệm, đồng thời hỏi Code.gs "version" (request rất nhẹ).
     · version TRÙNG lần đồng bộ trước ⇒ sheet chưa đổi ⇒ KHÔNG tải lại gì cả
     · version KHÁC ⇒ tải lại ở nền (bundle + 4 tab + địa bàn + CBC), vẽ lại tại chỗ
   Trong lúc chờ version (tối đa 8 giây) mọi lệnh "làm mới nền" được xếp hàng (afterGate)
   để không bắn trùng request.
   ═══════════════════════════════════════════════════════════════════════ */
var GATE=null;
function afterGate(fn){ if(GATE) GATE.then(function(){ try{ fn(); }catch(e){} }); else fn(); }
/* dữ liệu cũ khi nào? thăm dò version đang chạy tốt ⇒ 10 phút; mất liên lạc ⇒ 4 phút như cũ */
function dataStale(at){
  var ttl=(Date.now()-(S._verOkAt||0)<150000)?600000:240000;
  return Date.now()-(at||0)>ttl;
}
function metaKey_(){ return ckey("meta:"+S.fy+":"+(scopePic()||"ALL")); }
function touchCaches(){
  var now=Date.now();
  Object.keys(TSTORE).forEach(function(k){ var e=TSTORE[k]; if(e && e.key===tabKey(k)) e.at=now; });
  var w=S.cache.weekly; if(w && w._k===terrKey()){ w.at=now; w.fresh=true; }
}
function hydrateTerr(fresh){
  if(S.cache.weekly && S.cache.weekly._k===terrKey()){ if(fresh){ S.cache.weekly.at=Date.now(); S.cache.weekly.fresh=true; } return true; }
  var ls=terrLoadLs(); if(!ls) return false;
  S.cache.weekly={ rows:ls.rows, _k:terrKey(), at:fresh?Date.now():ls.at, fresh:!!fresh };
  S.visits=S.cache.weekly;
  return true;
}
function startSync(){
  if(GATE) return GATE;
  var meta=kvGet(metaKey_())||{}, bc=kvGet(bundleKey_())||{};
  var myPic=S.user?S.user.pic:"";
  GATE=new Promise(function(res){
    var settled=false;
    function fin(fresh,v){
      if(settled) return; settled=true;
      GATE=null;
      if(v){ S.verSeen=v; S._verOkAt=Date.now(); }
      if(fresh){ touchCaches(); syncMissing(); }
      else fullSync();
      res();
    }
    setTimeout(function(){ fin(false,""); },8000);
    apiGet("version",{}).then(function(j){
      var v=String((j&&j.ver)||"");
      if(j&&j.vers) S.verMap=j.vers;        /* ⭐ v14 — mốc so sánh cho các lần dò sau */
      fin(!!(v && meta.ver && meta.ver===v && bc._pic===myPic), v);
    }).catch(function(){ fin(false,""); });
  });
  return GATE;
}
/* sheet chưa đổi: chỉ tải những phần máy chưa từng lưu */
function syncMissing(){
  var need=["adp","monthly","order","present"].filter(function(t){ return !tGet(t); });
  if(need.length) prefetchTabs(need);
  if(!hydrateTerr(true)) loadTerritoryAll(true);
  ensureCbc();
  if(!S.custIndex.length) loadCustomerIndex();
  warmOther();
}
/* ⭐ v15 — NẠP SẴN "CÔNG VIỆC KHÁC" NGAY TỪ LÚC MỞ APP.
   Report Hub là một file Apps Script khác, đọc mất vài giây tới vài chục giây tuỳ lúc.
   Bản cũ chỉ bắt đầu đọc khi bấm vào tab ⇒ người dùng ngồi nhìn khung xương đúng ngần
   ấy thời gian. Nay đọc ngầm sau khi dữ liệu CRM đã ổn định (chậm 4 giây để không tranh
   đường truyền), nên lúc bấm vào tab là có sẵn. */
function warmOther(){
  if(S._otWarm) return; S._otWarm=1;
  setTimeout(function(){
    otherHydrate();
    if(S._otLoading) return;
    if(S.other && Date.now()-(S.other.at||0)<120000) return;   /* bản lưu còn mới */
    loadOther(true).then(function(){
      if(S.tab==="weekly"&&S.wkTab==="other") renderOther();
    }).catch(function(){ /* im lặng — bấm vào tab sẽ báo lỗi kèm cách xử lý */ });
  },4000);
}
function prefetchTabs(list){
  var half=Math.ceil(list.length/2), groups=[list.slice(0,half),list.slice(half)].filter(function(g){ return g.length; });
  return Promise.all(groups.map(function(g){
    var q={tabs:g.join(","),fy:S.fy,pic:scopePic(),lean:1};
    if(g.some(function(k){ return !tGet(k); })) cvDrop("multi",q);
    return apiGet("multi",q).then(function(j){
      if(j&&j.unchanged){
        g.forEach(function(k){ var e=TSTORE[k]; if(e) e.at=Date.now(); });
        return true;
      }
      var t=j.tabs||{};
      Object.keys(t).forEach(function(k){ tPut(k,unlean(t[k])); });
      if(g.indexOf(S.tab)>=0 || S.tab==="dash" || S.tab==="cust" || S.tab==="stake") softRepaint();
      return true;
    }).catch(function(){ return false; });
  })).then(function(r){ return r.every(Boolean); });
}
function cbcRefresh(){
  var e=TSTORE.cbc;
  if(e && e.key===tabKey("cbc") && Date.now()-(e.at||0)<60000) return Promise.resolve(true);   /* vừa tải xong */
  return fetchTab("cbc",{fy:"",pic:"",limit:8000}).then(function(){ return true; },function(){ return false; });
}
/* tải lại mọi nguồn chính ở nền — KHÔNG xoá dữ liệu đang hiển thị */
function fullSync(){
  if(S._fullSync) return S._fullSync;
  var v0=S.verSeen||"", key=metaKey_(), jobs=[];
  jobs.push(Date.now()-(S._bundleAt||0)>60000 ? refreshBundle(true) : Promise.resolve(true));
  jobs.push(prefetchTabs(["adp","monthly","order","present"]));
  jobs.push(loadTerritoryAll(true).then(function(){ return !!S._terrOk; }));
  jobs.push(new Promise(function(r){ setTimeout(r,1200); }).then(cbcRefresh));   /* CBC nặng nhất ⇒ đi sau */
  if(!S.custIndex.length) jobs.push(loadCustomerIndex().then(function(){ return true; }));
  warmOther();                     /* ⭐ v15 — Công việc khác nạp ngầm, không chặn phần còn lại */
  S._fullSync=Promise.all(jobs.map(function(p){ return Promise.resolve(p).then(function(x){ return x!==false; },function(){ return false; }); }))
    .then(function(res){
      S._fullSync=null;
      var ok=res.every(Boolean);
      if(ok && v0 && metaKey_()===key) kvSet(key,{ver:v0,at:Date.now()});
      softRepaint();
      return ok;
    });
  return S._fullSync;
}
/* giữ tên cũ cho các chỗ còn gọi */
function prefetchAll(){ return fullSync(); }

/* ⭐ v13 — VẼ LẠI MỀM: gom nhiều lần dữ liệu về thành 1 lần vẽ, không vẽ khi đang gõ ở màn hình
   chính (tránh mất chữ / nhảy con trỏ), tự thử lại sau 1,5 giây. */
var _srT=null;
function mainTyping(){
  try{
    var a=document.activeElement;
    return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $("main").contains(a));
  }catch(e){ return false; }
}
function softRepaint(){
  clearTimeout(_srT);
  _srT=setTimeout(function(){
    if(!S.user) return;
    if(mainTyping()){ _srT=setTimeout(softRepaint,1500); return; }
    ["order","present","adp","monthly"].forEach(function(t){
      var r=tGet(t); if(r && S.cache[t] && S.cache[t].rows!==r) S.cache[t]={rows:r,at:Date.now()};
    });
    _cxCache=null; _stCache=null; _lvMap=null;
    try{
      if(S.tab==="dash") renderDash();
      else if(S.tab==="kpi"){ if(!(typeof kpiDirty==="function"&&kpiDirty()) && S.kpi && S.kpi._fy===S.fy) renderKPI(); }
      else if(S.tab==="stake") renderStake();
      else repaintTab();
    }catch(e){}
  },150);
}

/* Sau khi ghi/xoá: cập nhật NGAY trong bộ nhớ (không chờ mạng), rồi đồng bộ nền.
   Nhờ vậy dòng vừa lưu/xoá hiện đúng tức thì — dữ liệu trên Sheet cũng đã ghi xong
   vì backend dùng LockService + flush đồng bộ. */
/* ⭐ v5.9 — App giữ dữ liệu ở HAI kho: TSTORE (dùng cho Dashboard, hồ sơ account…)
   và S.cache (dùng cho màn hình Địa bàn, Báo cáo tháng, Đơn hàng…).
   Trước đây chỉ vá TSTORE nên thêm task xong màn hình vẫn trống cho tới khi
   tải lại trang. Nay vá cả hai rồi vẽ lại ngay màn hình đang mở. */
function patchRows(rows,row,data,isDelete){
  if(!rows) return rows;
  var i=-1;
  for(var k=0;k<rows.length;k++) if(rows[k]._row===row){ i=k; break; }
  if(isDelete){ if(i>=0) rows.splice(i,1); }
  else if(i>=0) rows[i]=Object.assign({},rows[i],data,{_row:row});
  else if(data) rows.unshift(Object.assign({},data,{_row:row}));
  return rows;
}
/* ⭐ v14 — dòng vừa lưu phải hiện ĐẦY ĐỦ ngay, không chờ tải lại.
   Màn hình Địa bàn đọc các trường accName / accType / accProv / photos do backend
   dựng thêm; dòng vừa ghi chưa có chúng nên trước đây hiện thiếu tên, thiếu ảnh,
   có khi lọc ra mất luôn — chính là cảnh "thêm task xong, view task chẳng thấy gì". */
function enrichWeekly_(r){
  if(!r) return r;
  var a=parseAcc(r.account||"");
  if(r.accName===undefined)  r.accName=a.name;
  if(r.accType===undefined)  r.accType=a.type||r.type||"";
  if(r.accProv===undefined)  r.accProv=a.province||r.province||"";
  if(!r.photos) r.photos=photoObjsOf(r.photo);
  return r;
}
function patchLocal(tab,row,data,isDelete){
  if(tab==="cbc") stakeIdxReset();
  if(tab==="weekly" && data) enrichWeekly_(data);
  var e=TSTORE[tab];
  if(e&&e.rows){ patchRows(e.rows,row,data,isDelete); e.at=0; savTabs(); }
  var c=S.cache[tab];
  if(c&&c.rows){
    patchRows(c.rows,row,data,isDelete);
    if(tab==="weekly"){
      c.rows.forEach(enrichWeekly_);
      tbdFixRows(c.rows);                 /* kết quả dòng TBD của tuần đó tính lại ngay */
      _lvMap=null;
      try{ terrSave(c.rows); }catch(_e){}
    }
  }
}
/* vẽ lại đúng màn hình đang mở sau khi dữ liệu đổi */
/* ⭐ v7.1 — mỗi lần chuyển tab: vẽ ngay bằng dữ liệu đang có (không chờ),
   đồng thời nạp nền bản mới nhất từ sheet rồi vẽ lại. Nhờ vậy nếu anh vừa sửa
   hoặc xoá tay trên Google Sheet thì app cập nhật theo mà không phải F5. */
var TAB_SRC={ weekly:"weekly", monthly:"monthly", order:"order", present:"present", adp:"adp" };
var _tabSync={};
/* ⭐ v13 — chuyển tab chỉ tải lại khi dữ liệu thật sự cũ. Thay đổi trên Google Sheet (kể cả sửa
   tay) đã được thăm dò version phát hiện trong ≤ 45 giây, nên không cần bắn request mỗi lần bấm tab.
   Bản cũ còn huỷ request đang chạy (S._terrLoading=null / delete FETCHING) ⇒ gọi trùng 2–3 lần. */
function syncTabOnEnter(tab){
  var src=TAB_SRC[tab]; if(!src) return;
  afterGate(function(){
    var now=Date.now();
    if(_tabSync[src] && now-_tabSync[src]<15000) return;   /* vừa nạp xong thì thôi */
    if(hasOpenEditor()) return;                            /* đang gõ dở thì đừng đụng vào */
    /* ⭐ v7.3 — hoạt động đi địa bàn phải nạp bằng visitFeed (kèm ảnh và đủ dòng). */
    if(src==="weekly"){
      var w=S.cache.weekly;
      if(w && w._k===terrKey() && !dataStale(w.at)) return;
      _tabSync[src]=now;
      loadTerritoryAll(true).then(function(){ if(S.tab===tab) softRepaint(); }).catch(function(){});
      return;
    }
    var e=TSTORE[src];
    if(e && e.key===tabKey(src) && !dataStale(e.at)) return;
    _tabSync[src]=now;
    fetchTab(src,{}).then(function(rows){
      if(S.cache[src]||src==="monthly") S.cache[src]={rows:tGet(src)||rows,at:Date.now()};
      _cxCache=null; _stCache=null;
      if(S.tab===tab) softRepaint();
    }).catch(function(){});
  });
}
/* đang có ô nhập nào được focus hoặc modal đang mở thì hoãn nạp nền,
   tránh dữ liệu nhảy làm mất nội dung người dùng đang gõ */
function hasOpenEditor(){
  try{
    if($("ov").classList.contains("on")||$("ov2").classList.contains("on")) return true;
    var a=document.activeElement;
    return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  }catch(e){ return false; }
}
function repaintTab(){
  try{
    if(S.tab==="weekly"){ if(S.wkTab==="other") renderOther(); else renderTerritory(); }
    else if(S.tab==="monthly") renderMonthly();
    else if(S.tab==="order")   renderOrder();
    else if(S.tab==="present") renderPresent();
    else if(S.tab==="adp")     renderADP();

       hoạt động cả năm; nay chờ 2,2 giây sau lần lưu cuối rồi tải đúng một lần. */

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v3 — COMBOBOX: gõ tới đâu thấy danh sách mờ tới đó
   Hiện danh sách NGAY khi bấm vào ô (chưa cần gõ), lọc dần theo từng ký tự,
   tô sáng phần khớp, di chuyển bằng phím ↑ ↓ Enter.
   ═══════════════════════════════════════════════════════════════════════ */
function hl(txt,q){
  var t=String(txt||"");
  if(!q) return esc(t);
  var i=t.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
/* ⭐ v13 — ghi nhớ kết quả bỏ dấu (hàm được gọi hàng trăm nghìn lần khi lọc CBC / địa bàn / thẻ ADP) */
var _naM=(typeof Map!=="undefined")?new Map():null;
function noAcc(s){
  s=String(s||"");
  if(_naM && s.length<=160){ var v=_naM.get(s); if(v!==undefined) return v; }
  var o=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
  if(_naM && s.length<=160){ if(_naM.size>40000) _naM.clear(); _naM.set(s,o); }
  return o;
}
/* items: [{v, label, meta, raw}] */
function combo(inputId,getItems,onPick,ph){
  var el=$(inputId); if(!el||el._combo) return; el._combo=1;
  var box=document.createElement("div");
  box.className="cbo"; box.id=inputId+"_cbo";
  el.parentNode.appendChild(box);
  var cur=[], idx=-1, open=false;
  function close(){ box.classList.remove("on"); open=false; idx=-1; }
  function draw(){
    var q=el.value.trim(), nq=noAcc(q);
    var all=getItems()||[];
    cur=(nq?all.filter(function(it){ return noAcc(it.label+" "+(it.meta||"")).indexOf(nq)>=0; }):all).slice(0,60);
    if(!cur.length){
      box.innerHTML='<div class="cbo-e">Không khớp mục nào'+(q?' với “'+esc(q)+'”':'')+'</div>';
    }else{
      box.innerHTML='<div class="cbo-h">'+cur.length+(cur.length>=60?"+":"")+' kết quả'+(q?'':' · bấm chọn hoặc gõ để lọc')+'</div>'
        +cur.map(function(it,i){
          return '<div class="cbo-i'+(i===idx?" on":"")+'" data-i="'+i+'"><b>'+hl(it.label,q)+'</b>'
            +(it.meta?'<span>'+hl(it.meta,q)+'</span>':"")+'</div>';
        }).join("");
      Array.prototype.forEach.call(box.querySelectorAll("[data-i]"),function(nd){
        nd.onmousedown=function(ev){ ev.preventDefault(); pick(+nd.getAttribute("data-i")); };
      });
    }
    box.classList.add("on"); open=true;
  }
  function pick(i){
    var it=cur[i]; if(!it) return;
    el.value=it.v!==undefined?it.v:it.label;
    close(); if(onPick) onPick(it.raw!==undefined?it.raw:it, it);
  }
  el.setAttribute("autocomplete","off");
  if(ph) el.setAttribute("placeholder",ph);
  el.addEventListener("focus",draw);
  el.addEventListener("input",function(){ idx=-1; draw(); });
  el.addEventListener("keydown",function(e){
    if(!open) return;
    if(e.key==="ArrowDown"){ e.preventDefault(); idx=Math.min(cur.length-1,idx+1); draw(); scrollTo_(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); idx=Math.max(0,idx-1); draw(); scrollTo_(); }
    else if(e.key==="Enter"){ if(idx>=0){ e.preventDefault(); pick(idx); } }
    else if(e.key==="Escape"){ close(); }
  });
  el.addEventListener("blur",function(){ setTimeout(close,120); });
  function scrollTo_(){ var nd=box.querySelector(".cbo-i.on"); if(nd&&nd.scrollIntoView) nd.scrollIntoView({block:"nearest"}); }
}
/* Combobox chọn account — dùng chung cho mọi form */
function accountCombo(inputId,hiddenId,onPick){
  combo(inputId,function(){
    var pool=(S.user.role==="manager"||!S.filt.pic)?S.custIndex:S.custIndex.filter(function(c){return c.pic===S.user.pic;});
    if(!pool.length) pool=S.custIndex;
    return pool.map(function(c){
      return { v:c.name, label:c.name, meta:[c.code,c.type,c.province,c.area,"PIC "+(c.pic||"—")].filter(Boolean).join(" · "), raw:c };
    });
  },function(c){
    if($(hiddenId)) $(hiddenId).value=mkAcc(c);
    if(onPick) onPick(c);
  },"Bấm để xem danh sách · gõ để lọc");
}

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v3 — ĐI ĐỊA BÀN: thống kê & biểu đồ
   ═══════════════════════════════════════════════════════════════════════ */
var VRANGE=[["day","Ngày"],["week","Tuần"],["month","Tháng"],["quarter","Quý"],["fy","Cả FY"],["range","Khoảng ngày"]];
/* ⭐ v5 — chế độ "Khoảng ngày": tự do chọn từ ngày … đến ngày … */
function vRangeDefaults(){
  if(!S.vFrom) S.vFrom=addDays(todayISO(),-29);
  if(!S.vTo)   S.vTo=todayISO();
  if(S.vFrom>S.vTo){ var t=S.vFrom; S.vFrom=S.vTo; S.vTo=t; }
}
function vSetRange(which,val){
  if(!val) return;
  if(which==="from") S.vFrom=val; else S.vTo=val;
  S.vMode="range"; vRangeDefaults();
  if(S.wkTab==="other") renderOther(); else renderTerritory();
}
function vQuickRange(days){
  S.vMode="range"; S.vTo=todayISO(); S.vFrom=addDays(S.vTo,-(days-1));
  if(S.wkTab==="other") renderOther(); else renderTerritory();
}
function vRangeCalc(){
  var mode=S.vMode||"week";
  if(mode==="range"){
    vRangeDefaults();
    var nd=Math.round((new Date(S.vTo)-new Date(S.vFrom))/86400000)+1;
    return { from:S.vFrom, to:S.vTo, label:fmtVN(S.vFrom)+" – "+fmtVN(S.vTo)+" · "+nd+" ngày",
             step:(nd>92?"month":nd>31?"week":"day") };
  }
  if(mode==="day"){
    var d0=S.vAnchor||todayISO();
    return {from:d0,to:d0,label:wdOf(d0)+", "+fmtVN(d0)+(d0===todayISO()?" · HÔM NAY":""),step:"day"};
  }
  if(mode==="week"){
    if(!S.wkFrom){ S.wkFrom=mondayOf(todayISO()); S.wkTo=addDays(S.wkFrom,6); }
    return {from:S.wkFrom,to:S.wkTo,label:"Tuần "+fmtVN(S.wkFrom)+" – "+fmtVN(S.wkTo),step:"day"};
  }
  if(mode==="month"){
    var b=S.vAnchor||todayISO(), y=+b.slice(0,4), m=+b.slice(5,7);
    var f=y+"-"+("0"+m).slice(-2)+"-01";
    var last=new Date(y,m,0).getDate();
    return {from:f,to:y+"-"+("0"+m).slice(-2)+"-"+("0"+last).slice(-2),label:"Tháng "+("0"+m).slice(-2)+"/"+y,step:"day"};
  }
  if(mode==="quarter"){
    var b2=S.vAnchor||todayISO(), y2=+b2.slice(0,4), m2=+b2.slice(5,7);
    var q0=Math.floor((m2-1)/3)*3+1, q1=q0+2;
    var lastd=new Date(y2,q1,0).getDate();
    return {from:y2+"-"+("0"+q0).slice(-2)+"-01",to:y2+"-"+("0"+q1).slice(-2)+"-"+("0"+lastd).slice(-2),
            label:"Quý "+(Math.floor((m2-1)/3)+1)+"/"+y2,step:"week"};
  }
  var ms=fyMonths(S.fy);
  return {from:ms[0].slice(0,4)+"-"+ms[0].slice(4,6)+"-01",
          to:ms[11].slice(0,4)+"-"+ms[11].slice(4,6)+"-28",label:"Năm tài chính "+S.fy,step:"month"};
}
function vShift(k){
  var mode=S.vMode||"week";
  if(mode==="day"){ S.vAnchor=addDays(S.vAnchor||todayISO(),k); }
  else if(mode==="week"){ S.wkFrom=addDays(S.wkFrom,7*k); S.wkTo=addDays(S.wkTo,7*k); }
  else if(mode==="month"||mode==="quarter"){
    var b=S.vAnchor||todayISO(), y=+b.slice(0,4), m=+b.slice(5,7);
    m+=(mode==="month"?1:3)*k;
    while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
    S.vAnchor=y+"-"+("0"+m).slice(-2)+"-01";
  }
  else if(mode==="range"){                     /* dịch cả cửa sổ, giữ nguyên độ dài */
    vRangeDefaults();
    var len=Math.round((new Date(S.vTo)-new Date(S.vFrom))/86400000)+1;
    S.vFrom=addDays(S.vFrom,len*k); S.vTo=addDays(S.vTo,len*k);
  }
  if(S.tab==="weekly"&&S.wkTab==="other") return renderOther();
  if(S.tab==="weekly"&&S.cache.weekly) renderTerritory(); else pgWeekly();
}
function vSetMode(m){ S.vMode=m; S.vAnchor=S.vAnchor||todayISO();
  if(m==="range") vRangeDefaults();
  if(S.tab==="weekly"&&S.wkTab==="other") return renderOther();
  if(S.tab==="weekly"&&S.cache.weekly) renderTerritory(); else pgWeekly(); }

/* nhóm theo bucket thời gian để vẽ tần suất */
function vBuckets(rows,r){
  var keys=[],map={};
  function add(k,lb){ if(!map[k]){ map[k]={n:0,acc:{},lb:lb}; keys.push(k); } return map[k]; }
  if(r.step==="day"){
    for(var d=r.from; d<=r.to; d=addDays(d,1)) add(d,fmtVN(d).slice(0,5));
  }else if(r.step==="week"){
    for(var w=mondayOf(r.from); w<=r.to; w=addDays(w,7)) add(w,fmtVN(w).slice(0,5));
  }else{
    fyMonths(S.fy).forEach(function(m){ add(m,m.slice(4)+"/"+m.slice(2,4)); });
  }
  rows.forEach(function(x){
    var d=String(x.start).slice(0,10); if(!d) return;
    var k=(r.step==="day")?d:(r.step==="week"?mondayOf(d):ymOf(d));
    var b=map[k]; if(!b) return;
    b.n++; var a=parseAcc(x.account).name; if(a) b.acc[a]=1;
  });
  return { labels:keys.map(function(k){return map[k].lb;}),
           counts:keys.map(function(k){return map[k].n;}),
           accs  :keys.map(function(k){return Object.keys(map[k].acc).length;}) };
}
function cnt(rows,fn){
  var m={},out=[];
  rows.forEach(function(r){ var k=fn(r)||"(chưa ghi)"; m[k]=(m[k]||0)+1; });
  Object.keys(m).forEach(function(k){ out.push([k,m[k]]); });
  return out.sort(function(a,b){ return b[1]-a[1]; });
}
function visitStatsHtml(rows,r){
  var bk=vBuckets(rows,r);
  var accMap={}; rows.forEach(function(w){ var a=parseAcc(w.account).name; if(a) accMap[a]=(accMap[a]||0)+1; });
  var accs=Object.keys(accMap);
  var top=accs.map(function(a){return [a,accMap[a]];}).sort(function(x,y){return y[1]-x[1];}).slice(0,8);
  var actDays={}; rows.forEach(function(w){ var d=String(w.start).slice(0,10); if(d) actDays[d]=1; });
  var nDays=Object.keys(actDays).length;
  var avg=nDays?(rows.length/nDays):0;
  var repeat=accs.filter(function(a){return accMap[a]>1;}).length;

  return '<div class="grid g4" style="margin-bottom:13px">'
    +'<div class="kpi"><div class="lb">Lượt tiếp xúc</div><div class="vl">'+fmtN(rows.length)+'</div>'
      +'<div class="sb"><b>'+fmtN(nDays)+'</b> ngày có hoạt động · TB <b>'+avg.toFixed(1)+'</b> lượt/ngày</div></div>'

      +'<div class="sb"><b>'+fmtN(repeat)+'</b> khách gặp từ 2 lần trở lên</div></div>'
    +'<div class="kpi"><div class="lb">Tần suất / khách</div><div class="vl">'+(accs.length?(rows.length/accs.length).toFixed(1):"0")+'</div>'
      +'<div class="sb">lượt tiếp xúc trung bình mỗi khách</div></div>'
    +'<div class="kpi"><div class="lb">Độ phủ danh mục</div><div class="vl">'+(S.custIndex.length?Math.round(accs.length/S.custIndex.length*100):0)+'%</div>'
      +'<div class="sb"><b>'+fmtN(accs.length)+'</b>/'+fmtN(S.custIndex.length)+' account trong danh mục</div></div>'
    +'</div>'

    +'<div class="cwrap" style="margin-bottom:13px">'

/* ═══════════════════════════════════════════════════════════════════════
   ⭐ v3 — HỘP THOẠI XÁC NHẬN GỬI BÁO CÁO
   ═══════════════════════════════════════════════════════════════════════ */
var SENDLB={ self:{t:"Gửi thử cho chính bạn",d:"Email chỉ vào hộp thư của bạn để kiểm tra bố cục. Không ai khác nhận được.",c:"gho"},
             team:{t:"Gửi chính thức tới team",d:"Gửi theo đúng danh sách người nhận của nhóm bên dưới.",c:"pri"},
             pic :{t:"Gửi thay cho PIC",d:"Gửi báo cáo của một PIC khác dưới danh nghĩa của họ.",c:"pri"},
             all :{t:"Gửi toàn bộ team",d:"Gửi lần lượt báo cáo của tất cả PIC trong nhóm.",c:"pri"},
             download:{t:"Tải PDF",d:"Không gửi email, chỉ tải file PDF về máy.",c:"gho"} };
/* ⭐ v9 — NGƯỜI NHẬN BÁO CÁO TÁCH THEO NHÓM
   Dental   · To = cả Dental Sales Team          · Cc = Tuyen, Nguyen Ha, Hoa
   Surgical · To = Tuyen, Nguyen Ha, Giang, Hoa  · Cc = PIC Surgical còn lại
   Eyeless  · To = Tuyen, Nguyen Ha, Giang, Hoa  · Cc = PIC Eyeless   (⭐ v7.2)
   (nhóm Surgical chỉ có 2 PIC, Eyeless 1 PIC nên báo cáo gửi thẳng lên quản lý,
    người cùng nhóm vẫn được Cc để nắm việc của nhau) */
var MAIL_TUYEN="tt.tuyen@manimedicalhanoi.com", MAIL_HA="nt.ha@manimedicalhanoi.com",
    MAIL_PROD ="mmh.product@manimedicalhanoi.com", MAIL_HR="vtt.hoa@manimedicalhanoi.com";
var MAIL_RULE={
  dental  : { team:"Dental Sales Team",   toTeam:true,  fixed:[MAIL_TUYEN,MAIL_HA,MAIL_HR] },
  surgical: { team:"Surgical Sales Team", toTeam:false, fixed:[MAIL_TUYEN,MAIL_HA,MAIL_PROD,MAIL_HR] },
  eyeless : { team:"Eyeless Sales Team",  toTeam:false, fixed:[MAIL_TUYEN,MAIL_HA,MAIL_PROD,MAIL_HR] }
};
function mailRule(){ return MAIL_RULE[curTeamKey()]||MAIL_RULE.dental; }
function teamMails(){
  var k=curTeamKey(), out=[];
  Object.keys(ROLES).forEach(function(nm){
    var r=ROLES[nm];
    if(r.team===k && r.email && out.indexOf(r.email)<0) out.push(r.email);
  });
  return out;
}
function mailTargets(){
  var r=mailRule(), tm=teamMails();
  var to=(r.toTeam?tm:r.fixed).slice().filter(Boolean);
  var cc=(r.toTeam?r.fixed:tm).slice().filter(function(e){ return e && to.indexOf(e)<0; });
  return { to:to, cc:cc };
}
var CC_LIST=[MAIL_TUYEN,MAIL_HA,MAIL_HR];
function askSend(option){
  var kind=S.rpKind, who=(S.rpPic||S.user.pic), m=SENDLB[option]||SENDLB.self;
  var to=[],cc=[];
  if(option==="self"){ to=[(ROLES[S.user.pic]||{}).email||S.user.email||"(email của bạn)"]; }
  else{ var mt=mailTargets(); to=mt.to; cc=mt.cc; }
  var period=kind==="week"?("Tuần "+fmtVN(S.rpFrom)+" – "+fmtVN(S.rpTo)):("Tháng "+String(S.rpMonth).slice(4)+"/"+String(S.rpMonth).slice(0,4));
  var body='<div class="card pad" style="margin-bottom:12px;background:var(--pale);border-color:var(--lb1)">'
    +'<div style="font-size:15px;font-weight:800;color:var(--navy);margin-bottom:4px">'+esc(m.t)+'</div>'
    +'<div style="font-size:13px;color:var(--sub);line-height:1.55">'+esc(m.d)+'</div></div>'
    +'<dl class="kv">'
    +'<dt>Loại báo cáo</dt><dd><b>'+(kind==="week"?"Báo cáo tuần":"Báo cáo tháng")+'</b></dd>'
    +'<dt>Kỳ báo cáo</dt><dd>'+esc(period)+'</dd>'
    +'<dt>Người báo cáo</dt><dd>'+esc(who)+'</dd>'
    +(option!=="download"?'<dt>Gửi tới (To)</dt><dd style="font-size:12.5px">'+(to.length?to.map(esc).join("<br>"):"—")+'</dd>':"")
    +(cc.length&&option!=="download"?'<dt>Đồng gửi (Cc)</dt><dd style="font-size:12.5px">'+cc.map(esc).join("<br>")+'</dd>':"")
    +'<dt>Đính kèm</dt><dd>PDF báo cáo (A4)</dd></dl>'
    +(option==="pic"?'<div class="fld" style="margin-top:12px"><label>Chọn PIC</label><select class="inp" id="sd_pic">'
        +opts((S.master.pic||[]),who)+'</select></div>':"");
  openModal((kind==="week"?"Gửi báo cáo tuần":"Gửi báo cáo tháng"),body,
    '<button class="btn" onclick="closeModal()">Huỷ</button><div style="flex:1"></div>'
    +'<button class="btn '+m.c+'" onclick="doSend(\''+option+'\')">'+(option==="download"?"⤓ Tải PDF":"✉ Gửi ngay")+'</button>');
}
function doSend(option){
  if(option==="pic"&&$("sd_pic")) S.rpPic=$("sd_pic").value;
  closeModal();
  sendReport(option,true);
}

</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════════════
   ⭐ v16 — LỊCH CÔNG VIỆC  (Cập nhật ▸ 📅 Lịch công việc)
   Gộp 3 nguồn vào CÙNG MỘT LỊCH, cách hiển thị giống Report Hub:
     📍 Đi địa bàn   — tab 6. WEEKLY REPORT của file CRM (bấm vào ⇒ mở task để cập nhật)
     🧩 Việc khác    — sheet WEEKYLY new của Report Hub (bấm ⇒ cập nhật nhanh trạng thái,
                       % tiến độ, hạn, kết quả ngay trên lịch)
     ✈️ Công tác     — file Business Trip (qua Report Hub): xem chuyến đi, nhập báo cáo;
                       nút “✈️ Đề xuất công tác” ghi thẳng vào file Business Trip + gửi email xin duyệt
   Bấm vào ô trống của một ngày ⇒ thêm việc cho đúng ngày đó.
   Điện thoại: tuần hiện dạng danh sách dọc theo ngày; tháng hiện chấm màu, chạm ngày ⇒ mở danh sách.
   ═══════════════════════════════════════════════════════════════════════════════ */
var CAL={ view:"week", ref:null, pics:null, show:{v:1,o:1,t:1}, hideDone:false, exp:{}, map:{} };
(function(){ try{ var v=localStorage.getItem("mmh_calview"); if(v) CAL.view=v;
  var h=localStorage.getItem("mmh_calhide"); CAL.hideDone=h==="1"; CAL.compact=localStorage.getItem("mmh_calcompact")==="1";
  var s=JSON.parse(localStorage.getItem("mmh_calshow")||"null"); if(s) CAL.show=s; }catch(e){} })();
var CAL_WD=["CN","T2","T3","T4","T5","T6","T7"];
var CAL_WDF=["Chủ nhật","Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
var CAL_COL={ v:"#0E8A7E", t:"#7A4FD6" };
function calMob(){ try{ return window.matchMedia("(max-width:720px)").matches; }catch(e){ return false; } }
function calISO(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function calDate(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||"")); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
function calD(v){ var s=String(v||"").slice(0,10); return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:""; }
function calQ(s){ return String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }
function calDM(iso){ var d=calDate(iso); return d?(d.getDate()+"/"+(d.getMonth()+1)):""; }
function calCanTeam(){ return isMgmt() || !!(S.user && S.user.role==="manager"); }
function calPics(){
  if(!calCanTeam()) return [S.user.pic];
  if(CAL.pics===null) CAL.pics = isMgmt() ? [] : [S.user.pic];
  return CAL.pics;
}
function calPicOk(p){
  var sel=calPics(); if(!sel.length) return true;
  return sel.some(function(x){ return picEq(x,p); });
}
function calStatusKey(st){
  var s=String(st||"").toLowerCase();
  if(/complet|done|hoàn thành/.test(s)) return "done";
  if(/cancel|huỷ|hủy/.test(s)) return "cancel";
  if(/progress|đang/.test(s)) return "prog";
  return "todo";
}
function calStColor(st, od){
  if(od) return "#D9433F";
  var k=calStatusKey(st);
  return k==="done"?"#1E9E5A":k==="prog"?"#3A5CAA":k==="cancel"?"#9AA3B5":"#E08A00";
}
function calIsTrip(o){ return !!(o && /^trip/.test(String(o.vSrc||""))); }
function calEff(s){ return calD(s.revised)||calD(s.planned)||""; }

/* ── gom dữ liệu thành các mục trên lịch ── */
function calItems(){
  var out=[], today=todayISO(), map={};
  /* 📍 đi địa bàn */
  if(CAL.show.v && !CAL.onlyIP){
    terrRows().forEach(function(w){
      if(!calPicOk(w.pic)) return;
      var st=calD(w.start); if(!st) return;
      var a=parseAcc(w.account), tbd=/^tbd$/i.test(a.name||"");
      var done=calStatusKey(w.status)==="done";
      if(CAL.hideDone && done) return;
      var it={ id:"v"+w._row, kind:"v", d:st, st:st, en:calD(w.finish)||st, pic:w.pic,
        title: tbd?"Đi địa bàn (chưa chốt account)":(a.name||w.accName||"—"),
        sub: tbd?("Cả tuần · "+(a.province||w.province||"")):[w.typeAction,a.province||w.accProv||w.province].filter(Boolean).join(" · "),
        status:w.status||"", pct:statusPct(w.status), done:done, od:false, tbd:tbd, color:CAL_COL.v, w:w };
      map[it.id]=it; out.push(it);
    });
  }
  /* 🧩 việc khác + ✈️ công tác (Report Hub) */
  ((S.other&&S.other.keys)||[]).forEach(function(k){
    var trip=calIsTrip(k)||(k.subs||[]).some(calIsTrip);
    if(!trip){
      if(!OTHER_TYPE_RE.test(String(k.type||""))) return;
      if(isVisitingKey(k)) return;                       /* đi địa bàn đã lấy thẳng từ file CRM */
      if(!otherTeamOk(k)) return;
    }
    var subs=(k.subs||[]);
    var list=subs.length?subs.map(function(s){ return {s:s,key:false}; }):[{s:k,key:true}];
    list.forEach(function(o){
      var s=o.s, isT=calIsTrip(s);
      if(isT && !CAL.show.t) return;
      if(!isT && !CAL.show.o) return;
      if(/visit/i.test(String(s.vSrc||""))) return;
      if(isT && /key/i.test(String(s.vSrc||""))) return;   /* dòng key "Lịch công tác" */
      if(!calPicOk(s.pic)) return;
      var sk=calStatusKey(s.status), done=(sk==="done"||sk==="cancel");
      if(CAL.hideDone && done) return;
      if(CAL.onlyIP && (isT || sk!=="prog")) return;
      var stD=calD(s.start), en=calEff(s)||stD;
      if(!stD) stD=en;
      if(stD && en && en<stD){ var t=stD; stD=en; en=t; }
      var od=!isT && !done && !!en && en<today;
      var pct=otherPct(s); if(sk==="done") pct=100;
      var it={ id:(isT?"t":"o")+s.no, kind:isT?"t":"o", st:stD, en:en, pic:s.pic||k.pic,
        title:(o.key?(k.keyTask||""):(s.subTask||s.name||"")), sub:o.key?"Key task":(k.keyTask||""),
        status:s.status||"To Do", pct:pct, done:sk==="done", cancel:sk==="cancel", od:od, key:o.key,
        ro: isT || (!!s.vSrc) || !canEditOther(s.pic||k.pic), s:s, k:k,
        color: isT?CAL_COL.t:calStColor(s.status, od) };
      /* ngày hiển thị: đang làm ⇒ ngày hạn; đã xong/huỷ ⇒ ngày hạn; chưa làm ⇒ ngày bắt đầu */
      it.d = isT ? stD : (sk==="prog" ? (en||stD) : (done ? (en||stD) : (stD||en)));
      map[it.id]=it; out.push(it);
    });
  });
  CAL.map=map;
  return out;
}
function calRange(){
  var ref=CAL.ref||new Date();
  if(CAL.view==="week"){ var mon=calDate(mondayOf(calISO(ref))); var sun=new Date(mon); sun.setDate(mon.getDate()+6); return {from:calISO(mon), to:calISO(sun)}; }
  return {from:calISO(new Date(ref.getFullYear(),ref.getMonth(),1)), to:calISO(new Date(ref.getFullYear(),ref.getMonth()+1,0))};
}
/* đặt từng mục vào ngày: chuyến công tác nhiều ngày ⇒ hiện trên từng ngày đi;
   việc quá hạn KHÔNG nằm rải rác trên lịch mà gom vào nút “🔴 quá hạn” */
function calByDay(items){
  var by={}, today=todayISO();
  items.forEach(function(it){
    if(it.od) return;
    if(it.kind==="t" && it.st && it.en && it.en>it.st){
      var d=calDate(it.st), n=0;
      while(calISO(d)<=it.en && n<45){ (by[calISO(d)]=by[calISO(d)]||[]).push(it); d.setDate(d.getDate()+1); n++; }
      return;
    }
    if(!it.d) return;
    (by[it.d]=by[it.d]||[]).push(it);
  });
  var rank={t:0,v:1,o:2};
  Object.keys(by).forEach(function(d){ by[d].sort(function(a,b){
    if(a.done!==b.done) return a.done?1:-1;
    if(rank[a.kind]!==rank[b.kind]) return rank[a.kind]-rank[b.kind];
    return String(a.title).localeCompare(String(b.title));
  }); });
  return by;
}
function calTag(it){
  if(it.kind==="v") return it.tbd?"📍 KẾ HOẠCH TUẦN":"📍 ĐI ĐỊA BÀN";
  if(it.kind==="t") return "✈️ CÔNG TÁC";
  return it.key?"🧩 KEY TASK":"🧩 VIỆC KHÁC";
}
function calAv(p){ return '<span class="av" style="background:'+avColor(p)+'">'+esc(initials(p))+'</span>'; }
function calStTag(it){
  var c=calStColor(it.status,it.od);
  return '<span class="st" style="background:'+c+'1A;color:'+c+'">'+esc(it.status||"—")+'</span>';
}
function calCard(it, multi){
  var c=it.kind==="v"?CAL_COL.v:it.color;
  return '<button type="button" class="cal-card'+(it.done?" done":"")+(it.od?" od":"")+(it.ro?" ro":"")+'" style="--c:'+c+'" onclick="event.stopPropagation();calOpen(\''+calQ(it.id)+'\')">'
    +'<span class="tg">'+calTag(it)+'</span>'
    +'<b>'+esc(it.title||"—")+'</b>'
    +(it.sub?'<div class="k">'+(it.kind==="o"&&!it.key?"📂 ":"")+esc(it.sub)+'</div>':'')
    +'<div class="m">'+(multi?calAv(it.pic):'')+calStTag(it)
      +(it.kind==="o"?'<span class="pc" style="color:'+pctColor(it.pct/100)+'">'+it.pct+'%</span>':'')
      +(it.kind==="t"&&it.st&&it.en&&it.en>it.st?'<span class="pc" style="color:'+CAL_COL.t+'">'+calDM(it.st)+'→'+calDM(it.en)+'</span>':'')
    +'</div>'+calDueTag(it)+'</button>';
}
/* việc đang thực hiện: đếm ngày còn lại tới hạn (giống Report Hub) */
function calDaysLeft(it){ if(!it.en) return null; return Math.round((calDate(it.en)-calDate(todayISO()))/86400000); }
function calDueTag(it){
  if(it.kind!=="o" || calStatusKey(it.status)!=="prog" || it.od) return "";
  var n=calDaysLeft(it); if(n===null||n<0) return "";
  if(n===0) return '<span class="cal-due today">⏰ Đến hạn hôm nay</span>';
  return '<span class="cal-due'+(n<=2?' near':'')+'">⏳ Còn '+n+' ngày</span>';
}
/* 🔔 Sắp đến hạn: việc đang thực hiện còn 1–7 ngày tới hạn ⇒ nhắc ở cột HÔM NAY */
function calGhosts(items){
  return items.filter(function(it){ if(it.kind!=="o"||it.od||calStatusKey(it.status)!=="prog") return false;
    var n=calDaysLeft(it); it._n=n; return n!==null && n>=1 && n<=7; })
    .sort(function(a,b){ return a._n-b._n; });
}
function calGhostBlock(gh, multi){
  if(!gh.length) return "";
  var open=!!CAL.ghOpen, LIM=4, list=open?gh:gh.slice(0,LIM);
  return '<div class="cal-gh" onclick="event.stopPropagation()"><div class="cal-gh-h">🔔 Sắp đến hạn · '+gh.length+'</div>'
    +list.map(function(it){ return '<button type="button" class="cal-ghr'+(it._n<=2?' near':'')+'" onclick="calOpen(\''+calQ(it.id)+'\')" title="'+esc(it.title+' · '+(it.pic||'')+' · '+it.pct+'%')+'">'
      +(multi?'<span class="av" style="background:'+avColor(it.pic)+'">'+esc(initials(it.pic))+'</span>':'')
      +'<span class="t">'+esc(it.title)+'</span><span class="n">còn '+it._n+' ngày</span></button>'; }).join("")
    +(gh.length>LIM?'<button type="button" class="cal-more" onclick="CAL.ghOpen=!CAL.ghOpen;renderCal()">'+(open?'Thu gọn ▴':'＋ '+(gh.length-LIM)+' việc khác')+'</button>':'')
    +'</div>';
}
function calChipEv(it){
  var c=it.kind==="v"?CAL_COL.v:it.color;
  return '<button type="button" class="cal-ev'+(it.done?" done":"")+'" style="--c:'+c+'" onclick="event.stopPropagation();calOpen(\''+calQ(it.id)+'\')" title="'+esc(it.title+" · "+(it.pic||"")+" · "+(it.status||""))+'">'
    +'<span>'+(it.kind==="v"?"📍":it.kind==="t"?"✈️":"🧩")+'</span><span class="t">'+esc(it.title||"—")+'</span></button>';
}
function calSummary(items){
  var rg=calRange(), v=0, vd=0, o=0, od=0, op=0, osum=0, tdays=0, overdue=0, ip=0;
  items.forEach(function(it){
    if(it.od){ overdue++; return; }
    if(it.kind==="o" && calStatusKey(it.status)==="prog") ip++;
    if(it.kind==="t"){ if(it.st<=rg.to && it.en>=rg.from){ var a=it.st<rg.from?rg.from:it.st, b=it.en>rg.to?rg.to:it.en; tdays+=Math.round((calDate(b)-calDate(a))/86400000)+1; } return; }
    if(!it.d || it.d<rg.from || it.d>rg.to) return;
    if(it.kind==="v"){ if(it.tbd) return; v++; if(it.done) vd++; }
    else if(!it.cancel){ o++; osum+=(it.done?100:(calStatusKey(it.status)==="todo"?0:it.pct)); if(it.done) od++; else if(calStatusKey(it.status)==="prog") op++; }
  });
  var bar=function(pct){ var c=pctColor(pct/100);
    return '<div class="pbrow"><div class="pbx"><i style="width:'+pct+'%;background:'+c+'"></i></div><em style="color:'+c+'">'+pct+'%</em></div>'; };
  var box=function(lb,val,sub,pct,title){ return '<div class="cal-kpi"'+(title?' title="'+esc(title)+'"':'')+'><span>'+lb+'</span><b>'+val+'</b><small>'+sub+'</small>'
    +(pct!=null?bar(pct):'')+'</div>'; };
  var h='';
  if(CAL.show.v && !CAL.onlyIP) h+=box("📍 Đi địa bàn",v,"lượt · ✓ "+vd+" hoàn thành", v?Math.round(vd*100/v):0, "% = số lượt đã Completed / tổng lượt đi địa bàn trong khoảng đang xem");
  if(CAL.show.o) h+=box("🧩 Việc khác",o,"việc · ✓ "+od+" xong · ◐ "+op+" đang làm", o?Math.round(osum/o):0, "% = trung bình tiến độ các việc trong khoảng đang xem (To Do = 0%, bỏ việc đã huỷ)");
  if(CAL.show.t && !CAL.onlyIP) h+=box("✈️ Công tác",tdays,"ngày đi công tác", null);
  return {html:(h?'<div class="cal-sum">'+h+'</div>':''), overdue:overdue, ip:ip};
}
function calPeopleNames(){
  var set={}, out=[];
  var add=function(p){ p=String(p||"").trim(); var k=picKey_(p); if(!p||set[k]) return; set[k]=1; out.push(p); };
  try{ teamPicNames(curTeamKey()).forEach(add); }catch(e){}
  terrRows().forEach(function(w){ add(w.pic); });
  if(isMgmt()) add(S.user.pic);
  return out.sort();
}

/* ── vẽ ── */
function pgCal(){
  wkEnsureData_();

/* gọi Report Hub: nội dung ngắn đi GET (đọc được kết quả), dài quá thì POST (không đọc được
   kết quả ⇒ trả {posted:true} để nơi gọi tự kiểm tra lại) */
function tripHub(body, ms){
  var flat={}; Object.keys(body||{}).forEach(function(k){ var v=body[k]; flat[k]=(v!==null&&typeof v==="object")?JSON.stringify(v):v; });
  flat.pic=flat.pic||S.user.pic; flat.actor=flat.actor||S.user.pic;
  var qs=Object.keys(flat).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(flat[k]==null?"":flat[k]); }).join("&");
  if(qs.length>6800){
    return fetch(REPORTHUB_URL,{ method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(flat) })
      .then(function(){ return { ok:true, posted:true }; });
  }
  return hubJsonp(flat, ms||60000).then(function(j){
    if(!j || j.ok===false) throw new Error((j&&j.error)||"Report Hub không trả lời");
    return j;
  });
}
function tripErr(e){
  var m=String((e&&e.message)||e||"");
  if(/Unknown action|không hỗ trợ|unsupported/i.test(m)) return "Report Hub (file Sales & Marketing) chưa có tính năng này (cần bản ReportHub_Trip_Mail v12.7 trở lên) — trong Apps Script của Report Hub cần có file ReportHub_Trip_Mail và Deploy ▸ Manage deployments ▸ Edit ▸ New version.";

function msInit(id, opts, sel, o){

function msPaint(id){
  var m=MS[id], c=$("ms-c-"+id); if(!m||!c) return;
  c.innerHTML=m.sel.map(function(v,i){ return '<span class="ms-chip">'+esc(v)+'<button type="button" onmousedown="event.preventDefault()" onclick="event.stopPropagation();msDel(\''+id+'\','+i+')">×</button></span>'; }).join("");

function msFocus(id){ var i=$("ms-i-"+id); if(i) i.focus(); }
function msBlur(id){ setTimeout(function(){ var d=$("ms-d-"+id); if(d) d.classList.remove("on"); }, 180); }
function msFilter(id){
  var m=MS[id], inp=$("ms-i-"+id), d=$("ms-d-"+id); if(!m||!inp||!d) return;
  var q=msNorm(inp.value), sel=m.sel.map(msNorm);
  var list=m.opts.filter(function(x){ return sel.indexOf(msNorm(x))<0 && (!q || msNorm(x).indexOf(q)>=0); });
  if(q) list.sort(function(a,b){ return (msNorm(a).indexOf(q)===0?0:1)-(msNorm(b).indexOf(q)===0?0:1); });
  list=list.slice(0,40);
  var exact=m.opts.some(function(x){ return msNorm(x)===q; });
  if(q && !exact && sel.indexOf(q)<0) list.push({add:inp.value.trim()});
  m.list=list; if(m.hi>=list.length) m.hi=0;
  d.innerHTML=list.length ? list.map(function(x,i){
      var txt=typeof x==="string"?x:x.add;
      return '<div class="ms-op'+(i===m.hi?" hi":"")+(typeof x==="string"?"":" add")+'" onmousedown="event.preventDefault();msPick(\''+id+'\','+i+')">'+(typeof x==="string"?esc(txt):'＋ Thêm “'+esc(txt)+'”')+'</div>';
    }).join("") : '<div class="ms-op none">Không có gợi ý</div>';
  d.classList.add("on");
}
function msPick(id, i){
  var m=MS[id], x=m.list[i]; if(x==null) return;
  var v=typeof x==="string"?x:x.add; if(!v) return;
  if(m.none){
    if(msNorm(v)===msNorm(m.none)) m.sel=[];
    else m.sel=m.sel.filter(function(s){ return msNorm(s)!==msNorm(m.none); });
  }
  if(m.sel.map(msNorm).indexOf(msNorm(v))<0) m.sel.push(v);
  var inp=$("ms-i-"+id); inp.value=""; m.hi=0; msPaint(id); msFilter(id); inp.focus();
}
function msDel(id, i){ var m=MS[id]; m.sel.splice(i,1); msPaint(id); }
function msKey(ev, id){
  var m=MS[id]; if(!m) return;
  if(ev.key==="ArrowDown"){ ev.preventDefault(); m.hi=Math.min(m.hi+1, m.list.length-1); msFilter(id); }
  else if(ev.key==="ArrowUp"){ ev.preventDefault(); m.hi=Math.max(m.hi-1,0); msFilter(id); }
  else if(ev.key==="Enter"||ev.key===","||ev.key===";"){ if(m.list.length){ ev.preventDefault(); msPick(id,m.hi); } }
  else if(ev.key==="Backspace" && !ev.target.value && m.sel.length){ m.sel.pop(); msPaint(id); msFilter(id); }
  else if(ev.key==="Escape"){ var d=$("ms-d-"+id); if(d) d.classList.remove("on"); }
}

/* giờ up ảnh: "10:35" — khác ngày đi địa bàn thì kèm ngày */
function galUpText(w){
  var u=String(w.upAt||"");
  var m=/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/.exec(u); if(!m) return "";
  var hm=("0"+m[4]).slice(-2)+":"+m[5];
  var d=m[1]+"-"+m[2]+"-"+m[3];
  return d===String(w.start||"").slice(0,10)?hm:(hm+" ("+m[3]+"/"+m[2]+")");
}

/* ── lấy giờ up ảnh cho các ảnh cũ (trước khi app ghi 🕒 vào sheet) ── */
function galFillUpAt(rows){
  var need=rows.filter(function(w){ return !w.upAt && w.photos && w.photos[0] && w.photos[0].id; });
  var ids=need.map(function(w){ return w.photos[0].id; });
  if(!ids.length) return Promise.resolve();
  var byId={}; need.forEach(function(w){ (byId[w.photos[0].id]=byId[w.photos[0].id]||[]).push(w); });
  var chunks=[]; for(var i=0;i<ids.length;i+=150) chunks.push(ids.slice(i,i+150));
  var done=0;
  return chunks.reduce(function(p,ch){
    return p.then(function(){
      busy(true,"Đang lấy giờ up ảnh… "+done+"/"+ids.length);
      return apiGet("photoMeta",{ids:ch.join(",")}).then(function(j){
        var t=(j&&j.times)||{};
        Object.keys(t).forEach(function(id){ (byId[id]||[]).forEach(function(w){ if(t[id]) w.upAt=t[id]; }); });
        done+=ch.length;
      }).catch(function(){ done+=ch.length; });
    });
  }, Promise.resolve());
}

/* ── thư viện Excel có định dạng (tô màu tiêu đề, link bấm được) ── */
function ensureXLSXStyle(cb){
  if(window.__XLSXS) return cb(window.__XLSXS);
  var s=document.createElement("script");
  s.src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js";
  s.onload=function(){ window.__XLSXS=window.XLSX; cb(window.XLSX, true); };
  s.onerror=function(){ ensureXLSX(function(X){ cb(X,false); }); };   /* dự phòng: bản không màu */
  document.head.appendChild(s);
}
function galExcel(sel){
  var rows=sel.rows;
  busy(true,"Đang chuẩn bị dữ liệu…");
  galFillUpAt(rows).then(function(){
    busy(true,"Đang dựng file Excel…");
    ensureXLSXStyle(function(XLSX){
      try{
        var title="THỐNG KÊ ẢNH ĐI ĐỊA BÀN — "+String(curTeam().label||"").toUpperCase();
        var info="Từ "+fmtVN(sel.from)+" đến "+fmtVN(sel.to)+" · PIC: "+(GEX.pics.length===galPicsAll().length?"Tất cả":GEX.pics.join(", "))+" · "+rows.length+" ảnh · Xuất lúc "+fmtVN(todayISO());
        var head=["STT","PIC","Ngày","Tháng","Khách hàng","Địa chỉ up ảnh","Thời gian up ảnh","Link url ảnh"];
        var aoa=[["",title],["",info],[""].concat(head)];
        rows.forEach(function(w,i){
          var a=parseAcc(w.account), ph=(w.photos||[])[0]||{};
          var d=String(w.start||"").slice(0,10);
          aoa.push(["", i+1, w.pic||"", fmtVN(d), d?(d.slice(5,7)+"/"+d.slice(0,4)):"", a.name||"",
                    w.gpsAddr||w.gps||"(không có GPS)", galUpText(w)||"—", ph.open||ph.full||""]);
        });
        var ws=XLSX.utils.aoa_to_sheet(aoa);
        ws["!cols"]=[{wch:2},{wch:6},{wch:13},{wch:12},{wch:10},{wch:34},{wch:52},{wch:16},{wch:50}];
        ws["!rows"]=[{hpt:24},{hpt:18},{hpt:22}];
        var F="Aptos", bd={style:"thin",color:{rgb:"D9D9D9"}}, border={top:bd,bottom:bd,left:bd,right:bd};
        var st=function(ref,s){ if(ws[ref]) ws[ref].s=s; };
        st("B1",{font:{name:F,sz:14,bold:true,color:{rgb:"003047"}}});
        st("B2",{font:{name:F,sz:10,italic:true,color:{rgb:"666666"}}});
        var cols="BCDEFGHI".split("");
        cols.forEach(function(c){ st(c+"3",{font:{name:F,sz:11,bold:true,color:{rgb:"003047"}},fill:{fgColor:{rgb:"CFE2F3"}},
          alignment:{horizontal:"center",vertical:"center",wrapText:true},border:border}); });
        for(var r=0;r<rows.length;r++){
          var R=r+4, bg=(r%2)?"F0F7FF":"FFFFFF";
          cols.forEach(function(c,ci){
            var ref=c+R; if(!ws[ref]) ws[ref]={t:"s",v:""};
            ws[ref].s={font:{name:F,sz:10.5,color:{rgb:ci===7?"1155CC":"1A1A1A"},underline:false},fill:{fgColor:{rgb:bg}},border:border,
              alignment:{vertical:"center",wrapText:(ci===4||ci===5),horizontal:(ci===0||ci===2||ci===3||ci===6)?"center":"left"}};
          });
          var lk=ws["I"+R]; if(lk && lk.v){ lk.l={ Target:String(lk.v), Tooltip:"Mở ảnh trên Google Drive" }; }
        }

/* ═════════════ 📊 POWERPOINT: 1 buổi đi địa bàn = 1 slide (theo mẫu slide MMH) ═════════════ */
function ensurePptx(cb){
  if(window.PptxGenJS) return cb(window.PptxGenJS);
  var urls=["https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js","https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"];
  (function tryN(i){
    if(i>=urls.length){ busy(false); toast("Không tải được thư viện PowerPoint — kiểm tra mạng rồi thử lại","err",6000); return; }
    var s=document.createElement("script"); s.src=urls[i];
    s.onload=function(){ window.PptxGenJS?cb(window.PptxGenJS):tryN(i+1); };
    s.onerror=function(){ tryN(i+1); };
    document.head.appendChild(s);
  })(0);
}
/* tải ảnh (base64) từ Drive qua backend — 5 ảnh / lượt */
function galFetchPhotos(rows){
  var ids=[]; rows.forEach(function(w){ var p=(w.photos||[])[0]; if(p&&p.id&&ids.indexOf(p.id)<0) ids.push(p.id); });
  var got={}, queue=ids.slice(), n=0;
  function step(){
    if(!queue.length) return Promise.resolve(got);
    var ch=queue.splice(0,5);
    busy(true,"Đang tải ảnh từ Drive… "+n+"/"+ids.length);
    return apiGet("photoB64",{ids:ch.join(",")}).then(function(j){
      var ph=(j&&j.photos)||{};
      Object.keys(ph).forEach(function(id){ if(ph[id]&&ph[id].b64){ got[id]=ph[id]; n++; } });
      (j&&j.left||[]).forEach(function(id){ queue.unshift(id); });
      return step();
    }).catch(function(){ n+=0; return step(); });
  }
  return step();
}
function imgDims(dataUrl){
  return new Promise(function(res){ var im=new Image(); im.onload=function(){ res({w:im.naturalWidth||4,h:im.naturalHeight||3}); };
    im.onerror=function(){ res({w:4,h:3}); }; im.src=dataUrl; });
}
function pptLines(txt, max){
  var a=String(txt||"").split(/\n+/).map(function(l){ return l.replace(/^[\s•\-–➤*·]+/,"").trim(); }).filter(Boolean);
  var out=[], len=0;
  for(var i=0;i<a.length;i++){
    if(len+a[i].length>max){ var room=max-len; if(room>40) out.push(a[i].slice(0,room-1)+"…"); else if(out.length) out[out.length-1]+=" …"; break; }
    out.push(a[i]); len+=a[i].length;
  }
  return out;
}
function galPpt(sel){
  var rows=sel.rows;
  busy(true,"Đang chuẩn bị…");
  ensurePptx(function(PptxGenJS){
    galFillUpAt(rows).then(function(){ return galFetchPhotos(rows); }).then(function(photos){
      busy(true,"Đang dựng slide…");
      var ids=Object.keys(photos);
      return Promise.all(ids.map(function(id){ var p=photos[id]; p.url="data:"+(p.mime||"image/jpeg")+";base64,"+p.b64;
        return imgDims(p.url).then(function(d){ p.dim=d; }); })).then(function(){ return photos; });
    }).then(function(photos){
      galPptBuild(PptxGenJS, sel, photos);
    }).catch(function(e){ busy(false); toast("Không tạo được file: "+e.message,"err",7000); });
  });
}

         ink:"1A1A1A", muted:"666666", line:"D9D9D9", font:"Aptos" };

  function card(s,x,y,w,h,title,lines,sz){

  function kpi(s,x,y,w,label,value,sub,valSz){

  function table(s,x,y,w,colW,head,body,rowH){

  t.addText([{ text:"BÁO CÁO ĐI ĐỊA BÀN",options:{ breakLine:true } },{ text:(picsIn.length<=3?picsIn.join(" · "):"TOÀN NHÓM ("+picsIn.length+" PIC)").toUpperCase() }],

  var s2=content("Tổng quan đi địa bàn", rangeTxt+" · "+team+" · "+picsIn.length+" PIC");

  var byP={}; rows.forEach(function(w){ var p=w.pic||"—"; byP[p]=byP[p]||{n:0,ph:0,acc:{},days:{},done:0};

   ③ Tình hình thầu        : sheet 14. TENDER TRACK — tính DS ước tính còn lại trong FY.
   ④ Thông tin khác        : ghi tự do.
   Lưu ⇒ sheet 13. WEEKLY MEETING (1 dòng / tuần / PIC, lưu lại là ghi đè).
   Bản nháp tự lưu trong máy từng ký tự ⇒ tắt trình duyệt giữa chừng cũng không mất.
   ═══════════════════════════════════════════════════════════════════ */
var MT_STATUS=["Listing","Đang chấm","Đã có kết quả"];

function mtNppOfPic(pic){ return mtNppsOfPic(pic)[0]||((mtNppList()[0]||{}).label||""); }
var MT_ALL="@all";

function mtNppSel(sel,pic){
  sel=String(sel||MT_ALL);
  if(sel===MT_ALL){
    var L=mtNppsOfPic(pic); if(!L.length) L=mtNppList().map(function(x){ return x.label; });
    return { labels:L, name:(L.length>1?"Tổng "+L.join(" + "):(L[0]||"")), all:true };

  return { labels:[sel], name:sel, all:false };
}

           fcStatus:"", risk:"", pos:"", neg:"", act:"", tenderNote:"", other:"" };
}

function mtDraft(id){
  id=id||mtCurId();
  if(MT.draft[id]) return MT.draft[id];
  var ls=lsGet(ckey("mtd:"+id));
  if(ls&&ls.d){ MT.draft[id]=ls.d; MT.dirty[id]=ls.at||Date.now(); return ls.d; }
  var rec=MT.rec[id];
  MT.draft[id]=rec?Object.assign(mtDefaults(rec.pic,rec.week),mtCopy(rec.data)):mtDefaults(MT.pic,MT.week);
  return MT.draft[id];
}
function mtIn(f,v){
  var id=mtCurId(), d=mtDraft(id);
  d[f]=v; MT.dirty[id]=Date.now();
  clearTimeout(MT.lsT);
  MT.lsT=setTimeout(function(){ lsSet(ckey("mtd:"+id),{d:d,at:MT.dirty[id]}); },400);
  mtPaintSv();
}
function mtDropDraft(id){ delete MT.dirty[id]; try{ localStorage.removeItem(ckey("mtd:"+id)); }catch(e){} }
function mtListItem(id){ return (MT.list||[]).filter(function(x){ return x.id===id; })[0]||null; }

/* ───────── nạp dữ liệu ───────── */
function mtEnsureVisits(){
  var k=terrKey(), rep=function(){ if(S.tab==="meet") mtRepaint(); };
  if(!(S.cache.weekly && S.cache.weekly._k===k)){
    var ls=terrLoadLs();
    if(ls){ S.cache.weekly={ rows:ls.rows, _k:k, at:ls.at }; S.visits=S.cache.weekly; }
    if(!S._terrLoading) loadTerritoryAll(true).then(rep).catch(function(){});
  } else if(dataStale(S.cache.weekly.at) && !S._terrLoading){
    afterGate(function(){ loadTerritoryAll(true).then(rep).catch(function(){}); });
  }
}
function mtLoadList(){
  if(!MT.list){ var c=kvGet(ckey("mtlist")); if(c&&c.list) MT.list=c.list; }
  return apiGet("mtList",{_ts:Date.now()}).then(function(j){
    MT.list=j.list||[]; MT.listErr=""; kvSet(ckey("mtlist"),{list:MT.list,at:Date.now()});
    if(S.tab==="meet"){ mtEnsureRec(); mtPaintTabs(); mtPaintSv(); if(MT.mode==="cmp"){ mtPrevEnsure(); mtPaintCmp(); } }
    return MT.list;
  }).catch(function(e){ MT.listErr=mtErrTx(e); if(S.tab==="meet") mtPaintSv(); });
}
function mtGetRec(id,force){
  if(MT.rec[id] && !force) return Promise.resolve(MT.rec[id]);
  if(MT.recLd[id]) return MT.recLd[id];
  MT.recLd[id]=apiGet("mtGet",{id:id,_ts:Date.now()}).then(function(j){
    delete MT.recLd[id]; MT.rec[id]=j.rec; return j.rec;
  }).catch(function(e){ delete MT.recLd[id]; throw e; });
  return MT.recLd[id];
}
function mtEnsureRec(){
  var id=mtCurId(), it=mtListItem(id);
  if(!it) return;
  var have=MT.rec[id];
  if(have && have.updatedAt===it.updatedAt) return;
  mtGetRec(id,!!have).then(function(rec){
    if(!MT.dirty[id]){ MT.draft[id]=Object.assign(mtDefaults(rec.pic,rec.week),mtCopy(rec.data)); if(S.tab==="meet"&&mtCurId()===id) renderMeet(); }
    else if(S.tab==="meet"&&mtCurId()===id) mtPaintBanner();
  }).catch(function(){});
}
function mtNppKey(){ return ckey("mtnpp:"+S.fy); }
function mtNppLoad(force){
  if(MT.nppLd) return MT.nppLd;
  if(!MT.npp || MT.npp.fy!==S.fy){ var c=kvGet(mtNppKey()); MT.npp=(c&&c.rows)?c:null; }
  if(!force && MT.npp && Date.now()-(MT.npp.at||0)<60000) return Promise.resolve(MT.npp);
  MT.nppLd=turnoverJsonp({action:"getNppDetail", seg:"Surgical", fy:S.fy, _ts:Date.now()},30000).then(function(j){
    if(!j||!j.ok){
      var msg=(j&&j.error)||"File Turnover trả về dữ liệu không hợp lệ";
      if(/unknown action/i.test(msg)) return mtNppFallback();
      throw new Error(msg);
    }
    var rows=(j.rows||[]).map(function(a){ return { m:String(a[0]), d:a[1], p:a[2], bm:+a[3]||0, bd:+a[4]||0, fc:+a[5]||0, ac:+a[6]||0, v:+a[7]||0, cl:!!a[8] }; });
    return { fy:S.fy, mode:"detail", rows:rows, months:(j.fyInfo&&j.fyInfo.keys)||fyMonths(S.fy), closed:j.closed||{}, at:Date.now(), lm:j.lastModified||0 };
  }).then(function(N){
    MT.nppLd=null; MT.nppErr=""; var sig=JSON.stringify(N.rows), old=MT.npp?JSON.stringify(MT.npp.rows):"";
    MT.npp=N; kvSet(mtNppKey(),N);
    if(S.tab==="meet"){ if(sig!==old) mtPaintNpp(); else mtPaintStamp(); }
    return N;
  }).catch(function(e){ MT.nppLd=null; MT.nppErr=e.message; if(S.tab==="meet") mtPaintNpp(); throw e; });
  return MT.nppLd;
}
/* Web App Turnover chưa có getNppDetail ⇒ tạm dùng getTurnoverData (chỉ có Budget Mani + A/F) */
function mtNppFallback(){
  return loadTurnover(true).then(function(t){
    var cur=ymOf(todayISO()), cl={};
    fyMonths(S.fy).forEach(function(m){ if(m<cur) cl[m]=1; });
    var rows=(t.rows||[]).filter(function(r){ return noAcc(r.segment)==="surgical"; }).map(function(r){
      return { m:String(r.month), d:r.distributor, p:r.products, bm:n(r.budget), bd:0, fc:0, ac:0, v:n(r.forecast), cl:!!cl[String(r.month)] };
    });
    return { fy:S.fy, mode:"basic", rows:rows, months:fyMonths(S.fy), closed:cl, at:Date.now(), lm:0 };
  });
}
function mtTdLoad(){
  if(!MT.tenders){ var c=kvGet(ckey("mttd")); if(c&&c.list) MT.tenders=c.list; }
  return apiGet("mtTenders",{_ts:Date.now()}).then(function(j){
    MT.tenders=j.list||[]; MT.tErr=""; kvSet(ckey("mttd"),{list:MT.tenders,at:Date.now()});

function mtAutoOn(){
  if(MT.timer) return;
  MT.timer=setInterval(function(){
    if(S.tab!=="meet"){ clearInterval(MT.timer); MT.timer=null; return; }
    if(document.hidden) return;
    mtNppLoad(true).catch(function(){});

function mtVisits(pic,from,to){
  var out=[], tbd=null;
  terrRows().forEach(function(w){
    if(!mtPicEq(w.pic,pic)) return;
    if(!terrInRange(w,{from:from,to:to})) return;
    var a=parseAcc(w.account);
    if(/^MMH\b/i.test(a.name||"")) return;                 /* việc nội bộ (họp, báo cáo) */
    if(isTbdAcc(w.account)){ tbd=w; return; }
    out.push(w);
  });
  out.sort(function(x,y){ var a=String(x.start).slice(0,10), b=String(y.start).slice(0,10); return a<b?-1:a>b?1:String(x.account).localeCompare(String(y.account)); });
  return { list:out, tbd:tbd };
}

/* ───────── ② FORECAST NPP ───────── */
function mtNppAgg(sel,ym){   /* sel = mtNppSel(...) ⇒ gộp 1 hoặc nhiều NPP */
  var N=MT.npp; if(!N||!sel||!sel.labels||!sel.labels.length) return null;
  var ms=(N.months&&N.months.length===12)?N.months.map(String):fyMonths(S.fy);
  ym=String(ym||""); var idx=ms.indexOf(ym); if(idx<0){ idx=0; ym=ms[0]; }
  var z=function(){ return {bm:0,bd:0,fc:0,ac:0,v:0}; };
  var add=function(o,r){ o.bm+=r.bm; o.bd+=r.bd; o.fc+=r.fc; o.ac+=r.ac; o.v+=r.v; };
  var mk=function(){ var o={}; ms.forEach(function(m){ o[m]=z(); }); return o; };
  var want={}, byD={}, hitD={}; sel.labels.forEach(function(l){ want[l]=1; byD[l]=mk(); hitD[l]=0; });
  var byM=mk(), byP={}, hit=0;
  N.rows.forEach(function(r){
    if(!(r.m in byM)) return;
    var d=distributorOf(r.d); if(!d||!want[d.label]) return;
    var p=String(r.p||"Khác"); hit++; hitD[d.label]++;
    if(!byP[p]) byP[p]=mk();
    add(byP[p][r.m],r); add(byM[r.m],r); add(byD[d.label][r.m],r);
  });
  var sum=function(src,list){ var o=z(); list.forEach(function(m){ add(o,src[m]); }); return o; };
  var qs=Math.floor(idx/3)*3, qMs=ms.slice(qs,qs+3), qTD=ms.slice(qs,idx+1), ytd=ms.slice(0,idx+1);
  var prods=Object.keys(byP).sort(function(a,b){
    var ia=MT_PROD_ORDER.indexOf(noAcc(a)), ib=MT_PROD_ORDER.indexOf(noAcc(b));
    return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b); });
  var pr=prods.map(function(p){ return { p:p, m:byP[p][ym], ytd:sum(byP[p],ytd), fy:sum(byP[p],ms) }; });
  var dl=sel.labels.map(function(l){ var src=byD[l];
    return { label:l, hit:hitD[l], m:src[ym], qtd:sum(src,qTD), q:sum(src,qMs), ytd:sum(src,ytd), fy:sum(src,ms) }; });
  return { label:sel.name, all:!!sel.all, labels:sel.labels.slice(), byD:dl, ym:ym, idx:idx, ms:ms, qi:qs/3+1, qMs:qMs, hit:hit, mode:N.mode,
           closed:!!(N.closed&&N.closed[ym]), byM:byM, prods:pr,
           m:byM[ym], qtd:sum(byM,qTD), q:sum(byM,qMs), ytd:sum(byM,ytd), fy:sum(byM,ms),
           elQ:(idx-qs+1)/3, elY:(idx+1)/12 };
}

function mtChart(A){
  var W=720,H=190,pl=46,pb=24,pt=12,gw=(W-pl-8)/12, mx=0;
  A.ms.forEach(function(m){ mx=Math.max(mx,A.byM[m].bm,A.byM[m].v); });
  if(mx<=0) mx=1; var st=Math.pow(10,Math.floor(Math.log10(mx))); mx=Math.ceil(mx/st)*st;
  var y=function(v){ return pt+(H-pt-pb)*(1-v/mx); }, s="";
  for(var g=0;g<=4;g++){ var gv=mx*g/4, gy=y(gv).toFixed(1);
    s+='<line x1="'+pl+'" x2="'+(W-6)+'" y1="'+gy+'" y2="'+gy+'" stroke="#E3E3E3" stroke-width="1"/>'+
       '<text x="'+(pl-6)+'" y="'+(+gy+4)+'" text-anchor="end" font-size="10" fill="#595959">'+(gv>=1000?(Math.round(gv/100)/10)+"K":Math.round(gv))+'</text>'; }
  A.ms.forEach(function(m,i){
    var x=pl+i*gw, o=A.byM[m], bw=gw*0.32, cl=!!(MT.npp.closed&&MT.npp.closed[m]);
    if(m===A.ym) s+='<rect x="'+(x+1)+'" y="'+pt+'" width="'+(gw-2)+'" height="'+(H-pt-pb)+'" rx="6" fill="#F0F7FF"/>';
    s+='<rect x="'+(x+gw*0.16)+'" y="'+y(o.bm).toFixed(1)+'" width="'+bw+'" height="'+(H-pb-y(o.bm)).toFixed(1)+'" rx="2" fill="#CFE2F3"><title>Budget '+mtYmLb(m)+': '+mtUsd(o.bm)+' USD</title></rect>';
    s+='<rect x="'+(x+gw*0.52)+'" y="'+y(o.v).toFixed(1)+'" width="'+bw+'" height="'+(H-pb-y(o.v)).toFixed(1)+'" rx="2" fill="'+(cl?"#3A5CAA":"#7D97CE")+'"'+(cl?"":' fill-opacity=".75"')+'><title>'+(cl?"Actual":"Forecast")+' '+mtYmLb(m)+': '+mtUsd(o.v)+' USD</title></rect>';
    s+='<text x="'+(x+gw/2)+'" y="'+(H-7)+'" text-anchor="middle" font-size="11" font-weight="'+(m===A.ym?800:500)+'" fill="'+(m===A.ym?"#003047":"#595959")+'">T'+(+m.slice(4))+'</text>';
  });
  return '<div class="mt-chart"><div class="lg"><span><i style="background:#CFE2F3"></i>Budget MMH</span><span><i style="background:#3A5CAA"></i>Actual (đã chốt)</span><span><i style="background:#7D97CE;opacity:.75"></i>Forecast</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block" role="img" aria-label="Doanh số NPP theo tháng">'+s+'</svg></div>';
}

function mtTdCalc(t,fy){
  var qty=n(t.qty), price=n(t.price), total=qty*price, valid=parseInt(t.valid,10)||0;
  var lost=(t.status==="Đã có kết quả" && t.won==="Không trúng");
  var st=String(t.kqtt||"").replace(/\D/g,"").slice(0,6), ms=fyMonths(fy||S.fy), cur=ymOf(todayISO()), inFy=0, left=0;
  var ok=(st.length===6 && valid>0);
  if(ok) for(var i=0;i<valid;i++){ var ym=mtYmAdd(st,i); if(ms.indexOf(ym)>=0){ inFy++; if(ym>=cur) left++; } }
  var mon=valid>0?total/valid:0;
  return { qty:qty, total:total, monthly:mon, inFyM:inFy, leftM:left, inFy:lost?0:mon*inFy, remain:lost?0:mon*left,
           lost:lost, end:ok?mtYmAdd(st,valid-1):"", noDate:!ok };
}
function mtTdOf(pic){ return (MT.tenders||[]).filter(function(t){ return mtPicEq(t.pic,pic); }); }
function mtTdSum(list){
  var S0=function(){ return {n:0,qty:0,total:0,remain:0}; }, o={all:S0(),won:S0(),lost:S0()};
  MT_STATUS.forEach(function(s){ o[s]=S0(); });
  var byP={};
  list.forEach(function(t){
    var c=mtTdCalc(t), k=MT_STATUS.indexOf(t.status)>=0?t.status:"Listing";
    [o.all,o[k]].forEach(function(x){ x.n++; x.qty+=c.qty; x.total+=c.total; x.remain+=c.remain; });
    if(k==="Đã có kết quả"){ var z=c.lost?o.lost:o.won; z.n++; z.qty+=c.qty; z.total+=c.total; z.remain+=c.remain; }
    var p=t.prod||"Khác"; byP[p]=byP[p]||{n:0,qty:0,remain:0}; byP[p].n++; byP[p].qty+=c.qty; byP[p].remain+=c.remain;
  });
  o.byP=byP; return o;
}

/* ───────── ⇆ SO SÁNH VỚI TUẦN TRƯỚC (v18.1) ─────────
   2 chế độ xem: "Chỉ tuần này" (điền nhanh) · "So sánh tuần trước" (mặc định).
   Tuần trước = biên bản họp GẦN NHẤT trước tuần đang xem của cùng PIC (chọn lại được),
   + dữ liệu đi địa bàn thực tế của tuần liền trước (đọc trực tiếp, không cần biên bản). */
function mtSetMode(m){ MT.mode=m; lsSet(ckey("mtmode"),m); renderMeet(); if(m==="cmp") mtPrevEnsure(); }

  return (MT.list||[]).filter(function(x){ return mtPicEq(x.pic,pic) && String(x.week)<String(week); })
    .sort(function(a,b){ return String(b.week).localeCompare(String(a.week)); });

function mtPrevId(pic,week){
  pic=pic||MT.pic; week=week||MT.week;
  var L=mtPrevList(pic,week), s=MT.cmpSel[mtId(week,pic)];

function mtPrevRec(){ var id=mtPrevId(); return id?(MT.rec[id]||null):null; }
function mtPrevEnsure(){

  if(have && (!it || have.updatedAt===it.updatedAt)) return;

    .catch(function(e){ MT.prevErr=e.message; if(S.tab==="meet"&&MT.mode==="cmp") mtPaintCmp(); });

/* Δ có dấu + màu. unit: "n" số lượt · "usd" · "pt" điểm % · inv = giảm là tốt */
function mtDelta(a,b,unit,inv){
  if(a==null||b==null||!isFinite(a)||!isFinite(b)) return '<span style="color:#8C8C8C">—</span>';
  var d=b-a, up=d>0, c=(d===0)?"#8C8C8C":((up!==!!inv)?"#15703F":"#A82F2C");
  var v=Math.abs(d), t=(unit==="pt")?(Math.round(v*100)+" điểm"):(unit==="usd")?mtUsd(v):fmtN(v);
  if(unit==="pt"&&Math.round(v*100)===0) c="#8C8C8C";
  return '<span style="color:'+c+';font-weight:800;white-space:nowrap">'+(d===0||(unit==="pt"&&Math.round(v*100)===0)?"＝":(up?"▲ +":"▼ −")+t)+'</span>';
}
function mtVK(L){ /* chỉ số nhanh từ danh sách visit dạng snapshot */
  return { n:L.length, done:L.filter(function(v){ return /complet/i.test(v.st); }).length,
           pos:L.filter(function(v){ return /tích\s*cực/i.test(v.fb); }).length,
           nores:L.filter(function(v){ return !String(v.rs||"").trim(); }).length,
           acc:Object.keys(L.reduce(function(o,v){ o[noAcc(v.a)]=1; return o; },{})).length };
}
function mtAccKey(s){ return noAcc(s).replace(/[^a-z0-9]+/g," ").trim(); }
/* Kế hoạch đã chốt ở buổi họp trước (snap.visits.nxt) ↔ thực tế tuần này */
function mtPlanChk(plan,tbd,actual){
  var act={}; actual.forEach(function(v){ var k=mtAccKey(v.a); (act[k]=act[k]||[]).push(v); });
  var pk={}, rows=[];
  plan.forEach(function(p){ var k=mtAccKey(p.a); if(pk[k]) return; pk[k]=1; rows.push({ p:p, hit:act[k]||[] }); });
  var ok=rows.filter(function(r){ return r.hit.length; }).length;
  return { rows:rows, ok:ok, n:rows.length, rate:rows.length?ok/rows.length:null, tbd:tbd||null,
           extra:actual.filter(function(v){ return !pk[mtAccKey(v.a)]; }) };
}
function mtTdSnapItem(t){
  var c=mtTdCalc(t);
  return { id:t.id||"", hosp:t.hosp, prod:t.prod, detail:t.detail, qty:c.qty, unit:t.unit, price:n(t.price), total:c.total,
           status:t.status, won:t.won, kqtt:t.kqtt, valid:t.valid, end:c.end, remain:c.remain, npp:t.npp, note:String(t.note||"").slice(0,300) };
}
function mtTdLbl(t){ return (t.status||"—")+(t.status==="Đã có kết quả"&&t.won?(" · "+t.won):""); }
function mtTdDiff(prev,cur){
  var ck=function(t){ return mtAccKey(t.hosp)+"|"+mtAccKey(t.prod)+"|"+mtAccKey(t.detail||""); };
  var used={}, out={ added:[], changed:[], same:0, removed:[] };
  var find=function(t){
    var i, p;
    if(t.id) for(i=0;i<prev.length;i++){ p=prev[i]; if(!used[i]&&p.id&&p.id===t.id){ used[i]=1; return p; } }
    for(i=0;i<prev.length;i++){ p=prev[i]; if(!used[i]&&ck(p)===ck(t)){ used[i]=1; return p; } }
    return null;
  };
  cur.forEach(function(t){
    var p=find(t); if(!p){ out.added.push(t); return; }
    var ch=[];
    if(mtTdLbl(p)!==mtTdLbl(t)) ch.push("trạng thái: "+mtTdLbl(p)+" → "+mtTdLbl(t));
    if(n(p.qty)!==n(t.qty)) ch.push("SL "+fmtN(p.qty)+" → "+fmtN(t.qty));
    if(n(p.price)!==n(t.price)) ch.push("đơn giá "+fmtN(p.price)+" → "+fmtN(t.price));
    var ym=function(x){ x=String(x||"").replace(/\D/g,"").slice(0,6); return x?mtYmLb(x):"—"; };
    if(ym(p.kqtt)!==ym(t.kqtt)) ch.push("tháng KQTT "+ym(p.kqtt)+" → "+ym(t.kqtt));
    if(String(p.valid||"")!==String(t.valid||"")) ch.push("hiệu lực "+(p.valid||"—")+" → "+(t.valid||"—")+" tháng");
    if(ch.length) out.changed.push({ t:t, p:p, ch:ch }); else out.same++;
  });
  prev.forEach(function(p,i){ if(!used[i]) out.removed.push(p); });
  var s=function(L){ return L.reduce(function(a,t){ return a+n(t.remain); },0); };
  out.remPrev=s(prev); out.remCur=s(cur); out.nPrev=prev.length; out.nCur=cur.length;
  return out;
}
