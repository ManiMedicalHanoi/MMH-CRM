/* ⭐ v4.4 — GPS 2 tầng: thử độ chính xác cao trước, hỏng thì hạ xuống định vị
   thường (wifi/cell) với thời gian chờ dài hơn, cuối cùng mới dùng vị trí đã
   lấy được gần đây. Trên điện thoại, GPS chính xác cao thường cần >8 giây. */
function gpsFrom(p){ return {lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)}; }
function warmGps(){                       /* làm nóng sẵn để lần chụp đầu có ngay */
  if(!("geolocation" in navigator)) return;
  try{
    navigator.geolocation.getCurrentPosition(
      function(p){ S._gps={g:gpsFrom(p),at:Date.now()}; }, function(){},
      {enableHighAccuracy:false,timeout:20000,maximumAge:300000});
  }catch(e){}
}
function getGps(){
  return new Promise(function(res){
    if(!("geolocation" in navigator)) return res(null);
    /* ⭐ v14 — vừa lấy được vị trí trong 2 phút thì DÙNG LUÔN, không bắt người dùng
       đứng chờ thêm 10 giây định vị độ chính xác cao (sales vẫn đang ở đúng chỗ đó).
       Vị trí mới hơn vẫn được lấy ngầm để lần chụp sau chính xác hơn. */
    var c0=S._gps;
    if(c0 && Date.now()-c0.at<120000){
      try{ navigator.geolocation.getCurrentPosition(function(p){ S._gps={g:gpsFrom(p),at:Date.now()}; },function(){},
           {enableHighAccuracy:true,timeout:12000,maximumAge:0}); }catch(e){}
      return res(c0.g);
    }
    var done=false;
    function ok(p){ if(done)return; done=true; var g=gpsFrom(p); S._gps={g:g,at:Date.now()}; res(g); }
    function fallback(){
      if(done)return;
      navigator.geolocation.getCurrentPosition(ok,function(){
        if(done)return; done=true;
        var c=S._gps;                      /* dùng lại vị trí lấy được trong 10 phút */
        res((c&&Date.now()-c.at<600000)?c.g:null);
      },{enableHighAccuracy:false,timeout:15000,maximumAge:300000});
    }
    try{
      navigator.geolocation.getCurrentPosition(ok,fallback,{enableHighAccuracy:true,timeout:10000,maximumAge:0});
    }catch(e){ fallback(); }
  });
}
function retryGps(which){
  busy(true,"Đang lấy vị trí GPS…");
  getGps().then(function(g){
    busy(false);
    if(!g) return toast("Vẫn chưa lấy được vị trí. Kiểm tra: đã BẬT Vị trí (Location) của điện thoại, và cho phép trang này truy cập vị trí.","warn",7000);
    if(which==="nt"){ if(S.ntPhoto){ S.ntPhoto.gps=g; ntDraw(); } }
    else if(S.pending){ S.pending.gps=g; renderPending(); }
    toast("✓ Đã lấy được vị trí","ok");
  });
}
/* ═══════════ ⭐ v14 — NÉN ẢNH MẠNH TAY: ĐÂY LÀ LÝ DO "LOAD MÃI KHÔNG XONG" ═══════════
   Ảnh điện thoại bây giờ 4.000 × 3.000 (4–12 MB). Bản cũ chỉ hạ về 1.600px chất lượng
   0.82 ⇒ chuỗi base64 gửi lên khoảng 900 KB – 1,6 MB. Trên 4G ở phòng khám, riêng
   việc đẩy ngần ấy dữ liệu qua Apps Script đã mất 15–40 giây, chưa kể Drive ghi file.

   Nay:
     · hạ về tối đa 1.280px (đủ nhìn rõ biển hiệu, mặt tiền, người gặp)
     · vẽ qua createImageBitmap khi máy hỗ trợ ⇒ không chiếm luồng giao diện, app không đứng
     · tự hạ chất lượng theo từng nấc cho tới khi ≤ 280 KB, cùng lắm hạ tiếp kích thước
   Kết quả thực tế: 150–280 KB, tức nhẹ hơn 5–8 lần, gửi xong trong 2–5 giây. */
/* ⭐ v15 — hạ thêm một nấc. Ảnh chứng minh đã tới địa bàn cần đọc được biển hiệu và
   nhận ra người gặp, 1.152px là quá đủ; mỗi 100 KB bớt đi là bớt vài giây chờ trên 4G. */
var PHOTO_MAX_PX = 1152;
var PHOTO_MAX_KB = 190;
function photoSizeKB(dataUrl){ return Math.round(String(dataUrl||"").length*0.75/1024); }
function drawToCanvas_(src,w,h){
  var c=document.createElement("canvas"); c.width=w; c.height=h;
  var ctx=c.getContext("2d");
  ctx.imageSmoothingEnabled=true;
  try{ ctx.imageSmoothingQuality="high"; }catch(e){}
  ctx.drawImage(src,0,0,w,h);
  return c;
}
function fitBox_(w,h,mx){
  if(w<=mx&&h<=mx) return [w,h];
  return (w>h) ? [mx,Math.round(h*mx/w)] : [Math.round(w*mx/h),mx];
}
function encodeBest_(src,sw,sh){
  var wh=fitBox_(sw,sh,PHOTO_MAX_PX);
  var c=drawToCanvas_(src,wh[0],wh[1]);
  var q=[.72,.62,.52,.44], out="";
  for(var i=0;i<q.length;i++){
    out=c.toDataURL("image/jpeg",q[i]);
    if(photoSizeKB(out)<=PHOTO_MAX_KB) return out;
  }
  /* vẫn nặng (ảnh nhiều chi tiết) ⇒ hạ thêm kích thước một nấc nữa */
  var wh2=fitBox_(sw,sh,960);
  var c2=drawToCanvas_(src,wh2[0],wh2[1]);
  var out2=c2.toDataURL("image/jpeg",.6);
  return photoSizeKB(out2)<photoSizeKB(out)?out2:out;
}
function compress(file){
  /* createImageBitmap giải mã ảnh ở luồng nền ⇒ màn hình không khựng lúc chụp xong */
  if(window.createImageBitmap){
    return createImageBitmap(file).then(function(bm){
      var out=encodeBest_(bm,bm.width,bm.height);
      try{ bm.close(); }catch(e){}
      return out;
    }).catch(function(){ return compressImgTag_(file); });
  }
  return compressImgTag_(file);
}
function compressImgTag_(file){
  return new Promise(function(res,rej){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var out=encodeBest_(img,img.width,img.height);
      URL.revokeObjectURL(url);
      res(out);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error("Không đọc được ảnh")); };
    img.src=url;
  });
}

/* ═══════════ ⭐ v5 — QUY TẮC ẢNH ĐI ĐỊA BÀN ═══════════
   Yêu cầu: "Up ảnh tại địa chỉ khi đến địa bàn, không up sau, không dùng lại ảnh cũ."
   Ép bằng 3 lớp:
     1) chỉ còn 1 nút mở camera (capture="environment") — đã bỏ nút chọn từ thư viện;
     2) kiểm tra lastModified của tệp — ảnh vừa chụp luôn có mốc thời gian cách
        hiện tại vài giây, ảnh cũ trong máy bị chặn ngay tại trình duyệt;
     3) chặn dán ảnh từ clipboard. */
var PHOTO_MAX_AGE_MIN = 10;
function photoFresh(file){
  if(!file) return { ok:false, why:"Không đọc được tệp ảnh" };
  var lm = file.lastModified || (file.lastModifiedDate && +file.lastModifiedDate) || 0;
  if(!lm) return { ok:true };            /* máy không cung cấp mốc thời gian ⇒ cho qua */
  var ageMin = (Date.now() - lm) / 60000;
  if(ageMin > PHOTO_MAX_AGE_MIN){
    var d = new Date(lm);
    return { ok:false, why:"Ảnh này chụp lúc " +
      ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+" ngày "+
      fmtVN(d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2))+
      " — không phải ảnh vừa chụp. Quy định: chụp ngay tại địa bàn, không dùng ảnh cũ." };
  }
  if(ageMin < -5) return { ok:false, why:"Đồng hồ máy đang lệch giờ — chỉnh lại rồi chụp lại" };
  return { ok:true };
}
function photoGate(file){
  var r=photoFresh(file);
  if(!r.ok) toast("⛔ "+r.why,"err",9000);
  return r.ok;
}
function handleFiles(files){
  if(!files||!files.length) return;
  if(!photoGate(files[0])){ try{$("tk-cam").value="";}catch(e){} return; }
  var w=S.task||{}, had=(w.photos||[]).length>0;   /* mọi lần tải lên đều ĐÈ ⇒ luôn đúng 1 ảnh */
  if(had && !confirm("Task này đã có ảnh đi địa bàn.\nẢnh mới sẽ ĐÈ LÊN ảnh cũ (ảnh cũ bị xoá khỏi Drive). Tiếp tục?")){
    try{$("tk-cam").value="";}catch(e){} return;
  }
  var arr=Array.prototype.slice.call(files);
  if(arr.length>1){ arr=[arr[arr.length-1]]; toast("Mỗi task chỉ 1 ảnh — đã lấy ảnh cuối","warn"); }
  busy(true,"Đang nén ảnh…");
  /* ⭐ v14 — hiện ảnh ngay khi nén xong, KHÔNG bắt chờ GPS. Toạ độ về sau thì gắn thêm. */
  compress(arr[0]).then(function(d){
    S.pending={ dataUrl:d, gps:(S._gps&&Date.now()-S._gps.at<600000)?S._gps.g:null, replace:had };
    busy(false); renderPending();
    try{$("tk-cam").value="";}catch(e){}
    if(!S.pending.gps) getGps().then(function(g){ if(S.pending&&g){ S.pending.gps=g; renderPending(); } });
  }).catch(function(e){ busy(false); toast(e.message,"err"); });
}

function uploadPending(silent){

/* ───────── LƯU TASK ───────── */
function saveTask(){
  var w=S.task||{};
  var typeAction=curV("tk-ta","typeAction"), status=curV("tk-status","status");
  var result=curV("tk-result","result"), next=curV("tk-next","nextAction");
  var bad=[];
  function mark(id,ok,lb){ var el=$(id); if(el) el.classList.toggle("bad",!ok); if(!ok) bad.push(lb); }
  /* ⭐ v8.1 — việc mới lên kế hoạch (chưa có CBC trong kết quả) thì Next action,
     Customer feedback, kết quả và ảnh đều CHƯA bắt buộc. Chỉ siết khi đã đi gặp thật
     hoặc khi đã đặt trạng thái Completed. */
  var hasCbc=MEET_RE.test(String(result||""));
  var isDone=/complet/i.test(String(status||""));
  mark("tk-status",!!String(status).trim(),"Task Status");
  mark("tk-ta",!!String(typeAction).trim(),"Type action");
  mark("tk-tt",!!String(curV("tk-tt","typeTask")).trim(),"Type task");
  mark("tk-next",hasCbc?!!String(next).trim():true,"Next action");
  mark("tk-fb",hasCbc?!!String(curV("tk-fb","feedback")).trim():true,"Customer feedback");
  mark("tk-result",isDone?!!String(result).trim():true,"Task Result");
  if(String(result).trim() && !hasCbc) bad.push("CBC (dòng “Người gặp:” trong Task Result)");
  if(next==="Dừng lại" && !String(curV("tk-stop","stopReason")).trim()){ mark("tk-stop",false,"Lý do dừng chăm sóc"); }
  if(isDone && typeAction==="Visiting" && !S.pending && !(w.photos||[]).length) bad.push("ảnh đi địa bàn (bắt buộc với Visiting đã hoàn thành)");
  if(bad.length){ toast("⚠️ Cần bổ sung: "+bad.join(", "),"warn",6000); return; }

  var hasData=Object.keys(S.dirty).length>0, hasPh=!!S.pending;
  if(!hasData&&!hasPh) return toast("Chưa có thay đổi nào");

  var btn=$("tk-save"); if(btn) btn.disabled=true;
  var wkDay=String((w&&w.start)||todayISO()).slice(0,10);   /* ⭐ v11 — tuần cần đếm lại TBD */
  var chain;
  if(hasData){
    var d={_row:S.taskRow};
    ["plan","result","status","nextAction","stopReason","feedback","process","typeTask","typeAction","product","start"].forEach(function(f){
      if(f in S.dirty) d[f]=S.dirty[f];
    });
    if(d.start) d.finish=d.start;
    if(("nextAction" in d)&&d.nextAction!=="Dừng lại") d.stopReason="";
    /* ⭐ v15 — sửa nội dung và ảnh đi chung một lượt gọi, không còn chờ hai lần */
    var pay={action:"saveWeekly",data:d};
    if(hasPh){
      var pp=S.pending;
      pay.photo={ b64:pp.dataUrl, mime:"image/jpeg" };
      if(pp.gps){ pay.photo.lat=pp.gps.lat; pay.photo.lng=pp.gps.lng; pay.photo.acc=pp.gps.acc; }
      pay.data.account=pay.data.account||w.account;
      pay.data.pic=pay.data.pic||w.pic;
      busy(true,"Đang ghi task và tải ảnh ("+photoSizeKB(pp.dataUrl)+" KB)…");
    }else busy(true,"Đang ghi vào Google Sheet…");
    chain=apiPost(pay).then(function(r){
      if(r&&r.photo&&r.photo.url&&S.task){
        S.task.photos=[{id:r.photo.id,thumb:r.photo.thumb,full:r.photo.thumb,open:r.photo.url}];
        S.task.photo=r.photo.url; S.task.gps=r.photo.gps||""; S.task.gpsAddr=r.photo.gpsAddr||"";
        S.pending=null;
      }
      if(r&&r.photoError) toast("Task đã lưu nhưng ảnh chưa lên được: "+r.photoError,"warn",7000);
      return r;
    });
  }else{
    busy(true,"Đang tải ảnh lên Drive…");
    chain=uploadPending(true);      /* chỉ có ảnh, không sửa nội dung */
  }
  chain.then(function(){
    busy(false); if(btn) btn.disabled=false;
    toast("✓ Đã cập nhật task vào Sheet","ok",3800);
    closeDrw();
    /* ⭐ v15 — vá luôn nội dung vừa sửa vào bộ nhớ để danh sách đổi ngay,
       không phải đợi lượt tải lại nền xong mới thấy */

/* ───────── VOICE ───────── */
var _rec=null,_recT=null,_recB=null;
function toggleVoice(id,btn){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return toast("Trình duyệt không hỗ trợ nhập bằng giọng nói","warn");
  if(_rec) return stopVoice();
  _rec=new SR(); _rec.lang="vi-VN"; _rec.continuous=true; _rec.interimResults=true;
  _recT=$(id); _recB=btn; if(!_recT) return;
  var base=_recT.value?(_recT.value+" "):"";
  btn.classList.add("listening"); btn.innerHTML="⏺ Đang nghe…";
  _rec.onresult=function(e){
    var t=""; for(var i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript;
    _recT.value=base+t;
    var f={"tk-plan":"plan","tk-result":"result","tk-stop":"stopReason","nt_result":null}[_recT.id];
    if(f) markDirty(f,_recT.value);
  };
  _rec.onend=stopVoice; _rec.onerror=stopVoice;
  try{_rec.start();}catch(e){}
}
function stopVoice(){ if(_rec){try{_rec.stop();}catch(e){} _rec=null;} if(_recB){_recB.classList.remove("listening");_recB.innerHTML="🎤 Nói";_recB=null;} _recT=null; }

/* ⭐ v4.4 — Account type ở tab "2. CBC" quyết định Type task
   (Clinic ⇒ Sale-Clinics, Dealer ⇒ Sale-Dealers, Hospital ⇒ Sale-Hospitals…) */
function typeTaskForAcc(t){
  var list=S.master.typeTask||[], key=noAcc(String(t||"")).replace(/[^a-z0-9]/g,"");
  if(!key) return "";
  var k1=key, k2=key.replace(/s$/,"");
  for(var i=0;i<list.length;i++){
    var k=noAcc(list[i]).replace(/[^a-z0-9]/g,"");
    if(k.indexOf(k1)>=0||k.indexOf(k2)>=0) return list[i];
  }
  return "";
}
/* ⭐ v8.1 — dò đúng chữ trong Master của sheet, tránh hardcode sai chính tả */
function stFind(re,fb){
  var l=S.master.status||[], i;
  for(i=0;i<l.length;i++) if(re.test(String(l[i]))) return l[i];
  return fb;
}
function stTodo(){ return stFind(/to\s*-?\s*do|not\s*start|chưa|plan/i,"To do"); }
function stDone(){ return stFind(/complet|hoàn\s*thành/i,"Completed"); }
function stHas(v){ return (S.master.status||[]).indexOf(v)>=0; }
/* đủ dữ liệu ⇒ coi như đã làm xong: có CBC trong kết quả + có ảnh nếu Visiting + có Next action */
function ntReady(){
  var res=$("nt_result")?$("nt_result").value:"";
  if(!MEET_RE.test(res||"")) return false;
  if(($("nt_typeAction")||{}).value==="Visiting" && !S.ntPhoto) return false;
  return !!String((($("nt_next")||{}).value)||"").trim();
}
function ntAutoStatus(){
  var s=$("nt_status"); if(!s||S.ntStatusManual) return;
  var ready=ntReady(), want=ready?stDone():stTodo();
  if(want && stHas(want) && s.value!==want) s.value=want;
  var h=$("nt_stHint");
  if(h) h.textContent=ready
    ? "✓ Đã đủ CBC · ảnh · next action — tự chuyển Completed"
    : "Mới lên kế hoạch — để To Do; điền đủ CBC · ảnh · next action sẽ tự chuyển Completed";

function submitNewTask(){
  var accName=$("nt_accName").value.trim();
  /* ⭐ v10 — TBD: Plan bắt buộc, Result/ảnh/next action thì không.
     Kỳ ép về trọn tuần; Task Result do Code.gs điền công thức tự tổng hợp. */

      busy(false); closeModal(); S.ntDraft=""; S.ntTbd=false;
      toast("✓ Đã tạo kế hoạch đi địa bàn (chưa xác định account) cho tuần "+fmtVN(t.start)+" – "+fmtVN(t.finish),"ok",5600);

      terrRefresh();
    }).catch(function(e){ busy(false); toast(e.message,"err",6000); });
  }
  var d={ _row:0,
    account:$("nt_account").value||mkAcc({name:accName}),
    start:$("nt_start").value, finish:$("nt_start").value, pic:$("nt_pic").value,
    typeTask:$("nt_typeTask").value, typeAction:$("nt_typeAction").value,
    process:$("nt_process").value, product:$("nt_product").value,
    plan:$("nt_plan").value,
    /* ⭐ v7.1 — lấy từ ô nhập; nếu ô vừa bị dựng lại và rỗng thì dùng bản nháp đã gõ */
    result:(String($("nt_result").value||"").trim() ? $("nt_result").value : (S.ntDraft||"")),
    status:$("nt_status").value,
    feedback:$("nt_feedback").value, nextAction:$("nt_next").value,
    stopReason:($("nt_next").value==="Dừng lại")?$("nt_stop").value:"" };
  var bad=[];
  if(!accName) bad.push("Account");
  if(!d.start) bad.push("Ngày");
  if(!d.typeTask) bad.push("Type task");
  if(!d.typeAction) bad.push("Type action");
  if(!d.status) bad.push("Task Status");
  /* ⭐ v8.1 — Next action & Customer feedback CHỈ bắt buộc khi Task Result đã có CBC
     (tức là đã đi gặp thật). Còn đang lên kế hoạch thì để trống thoải mái. */
  if(MEET_RE.test(String(d.result||""))){
    if(!d.nextAction) bad.push("Next action");
  if(!d.process) bad.push("Sales Process");
  if(!d.product) bad.push("Product group");
    if(!String(d.feedback||"").trim()) bad.push("Customer feedback");
  }
  /* ⭐ v7.1 — Task Result KHÔNG bắt buộc (PIC lên kế hoạch trước, ghi kết quả sau);
     nhưng đã viết kết quả thì buộc phải có dòng "Người gặp:".
     Ảnh Visiting cũng không bắt buộc lúc tạo — bổ sung sau khi đi thực địa. */
  if(String(d.result).trim() && !MEET_RE.test(d.result))
    bad.push("CBC — dòng “Người gặp:” trong Task Result");
  if(d.nextAction==="Dừng lại"&&!String(d.stopReason).trim()) bad.push("Lý do dừng");
  if(bad.length) return toast("⚠️ Cần bổ sung: "+bad.join(", "),"warn",6000);

  var later=[];
  if(!String(d.result).trim()) later.push("kết quả");
  if(d.typeAction==="Visiting"&&!S.ntPhoto) later.push("ảnh chụp tại địa bàn");

  /* ⭐ v15 — GỬI TASK VÀ ẢNH TRONG MỘT LƯỢT.
     Bản cũ gọi saveWeekly rồi uploadPhoto nối tiếp: hai lần khởi động Apps Script,
     hai lần mở Google Sheet cho cùng một thao tác. Nay ảnh đi kèm ngay trong lần lưu. */
  var pay={action:"saveWeekly",data:d};
  if(S.ntPhoto){
    pay.photo={ b64:S.ntPhoto.dataUrl, mime:"image/jpeg" };
    if(S.ntPhoto.gps){ pay.photo.lat=S.ntPhoto.gps.lat; pay.photo.lng=S.ntPhoto.gps.lng; pay.photo.acc=S.ntPhoto.gps.acc; }
    busy(true,"Đang ghi task và tải ảnh ("+photoSizeKB(S.ntPhoto.dataUrl)+" KB)…");
  }else busy(true,"Đang ghi vào Google Sheet…");
  apiPost(pay).then(function(r){
    if(r&&r.photo&&r.photo.url){ d.photo=r.photo.url; d.gps=r.photo.gps||""; d.gpsAddr=r.photo.gpsAddr||""; }
    if(r&&r.photoError) toast("Task đã lưu nhưng ảnh chưa lên được: "+r.photoError,"warn",7000);
    return r;
  }).then(function(r){
    busy(false); closeModal(); S.ntPhoto=null; S.ntDraft="";
    toast(later.length
      ? ("✓ Đã lưu kế hoạch cho "+accName+" — nhớ bổ sung "+later.join(" và ")+" sau khi đi")
      : ("✓ Đã thêm task cho "+accName),"ok",5200);
    afterWrite("weekly", r.row||0, d);
    tbdSyncWeek(d.start, d.pic);      /* ⭐ v11 — dòng TBD cùng tuần phải đếm lại */
    S.vMode="day"; S.vAnchor=d.start; S.wkFrom=mondayOf(d.start); S.wkTo=addDays(S.wkFrom,6);
    terrRefresh();
  }).catch(function(e){ busy(false); toast(e.message,"err",6000); });
}

/* xoá dòng chung cho các tab khác */
function delRow(tab,row){
  if(!confirm("Xoá dòng này khỏi Google Sheet? Thao tác không hoàn tác được."+
              (tab==="weekly"?"\n\nẢnh đi địa bàn của dòng này cũng bị xoá khỏi folder Drive.":""))) return;
  busy(true,"Đang xoá…");
  apiPost({action:"deleteRow",tab:tab,row:row}).then(function(r){
    busy(false); closeModal(); toast(r.message||"Đã xoá","ok");
    afterWrite(tab, row, null, true);
    go(S.tab);
  }).catch(function(e){ busy(false); toast(e.message,"err",5000); });
}

</script>

<script>
/* ═══════════════════════ ĐƠN HÀNG ═══════════════════════ */
function pgOrder(){
  /* ⭐ v3: vẽ NGAY từ bộ nhớ nếu đã có; chỉ hiện khung xương ở lần đầu */
  ensureTab("order",{},function(rows,ready,err){

    S.cache.order={rows:rows||[]};

  });

}
function renderOrder(){

  var tot=rows.reduce(function(s,o){return s+n(o.amount);},0);

  $("main").innerHTML='<div class="pg">'+
    '<div class="ph"><div><h2>Đơn hàng '+esc(S.fy)+'</h2><p><b>'+fmtN(rows.length)+'</b> đơn · Tổng <b>'+fmtVND(tot)+'</b></p></div>'+
      '<div class="sp"></div><button class="btn pri sm" onclick="formOrder(null)">＋ Đơn hàng mới</button></div>'+
    '<div class="card pad" style="margin-bottom:12px">'+
      '<div class="row" style="margin-bottom:10px">'+
        '<div style="flex:2"><input class="inp" id="ord_q" autocomplete="off" placeholder="🔍 Tìm theo account, mã, sản phẩm…" value="'+esc(S.filt.q)+'" oninput="S.filt.q=this.value;debOrd()"></div>'+
        (isMgmt()?'<div><select class="inp" onchange="S.filt.pic=this.value;renderOrder()">'+opts(S.master.pic,S.filt.pic,"Mọi PIC")+'</select></div>':"")+
      '</div>'+
      '<div class="chipbar"><div class="chip'+(S.filt.month?"":" on")+'" onclick="S.filt.month=\'\';renderOrder()">Cả FY</div>'+
        months.map(function(m){ return '<div class="chip'+(S.filt.month===m?" on":"")+'" onclick="S.filt.month=\''+m+'\';renderOrder()">T'+parseInt(m.slice(4),10)+'</div>'; }).join("")+'</div>'+
    '</div>'+
    (rows.length?'<div class="tbwrap"><table class="tb"><thead><tr>'+
      '<th style="width:74px">Tháng</th><th style="width:64px">Order</th><th>Account</th><th style="width:88px">Kênh</th>'+
      '<th>Sản phẩm</th><th style="width:84px">Nhóm</th><th class="num" style="width:52px">SL</th>'+
      '<th class="num" style="width:96px">Amount</th><th style="width:74px">PIC</th></tr></thead><tbody>'+
      rows.map(function(o){ return '<tr onclick="rOrder(\''+reg(o)+'\')" style="cursor:pointer">'+
        '<td class="mono">'+esc(o.month)+'</td><td>'+esc(o.orderNo)+'</td>'+
        '<td><b>'+esc(o.name)+'</b><div style="font-size:11px;color:var(--mute)">'+esc(o.code)+' · '+esc(o.province)+'</div></td>'+
        '<td><span class="tag '+(o.channel==="Online"?"t-b":"t-n")+'">'+esc(o.channel)+'</span></td>'+
        '<td style="max-width:240px;font-size:12px;white-space:pre-wrap">'+nl2br(String(o.detail).slice(0,120))+'</td>'+
        '<td><span class="tag t-n">'+esc(o.ptype)+'</span></td><td class="num">'+fmtN(o.qty)+'</td>'+
        '<td class="num"><b>'+fmtVND(o.amount)+'</b></td><td>'+esc(o.pic)+'</td></tr>'; }).join("")+
      '</tbody></table></div>'
      :'<div class="card pad"><div class="empty"><div class="e">🧾</div><p>Chưa có đơn hàng khớp bộ lọc</p></div></div>')+
  '</div>';
}
var _dbo; function debOrd(){ clearTimeout(_dbo); _dbo=setTimeout(function(){ keepCaret("ord_q",renderOrder); },140); }

/* ═══════════ ⭐ v8 — DIALOG ĐƠN HÀNG DỰNG LẠI ═══════════
   · Order No. tự đếm tiếp số lớn nhất đang có trong sheet
   · Account → Người liên lạc lọc theo CBC của chính account đó
   · Chức danh / SĐT lấy thẳng từ CBC, không sửa ở đây
   · thêm Account / CBC ngay trong dialog mà KHÔNG đóng dialog đơn hàng
   · một đơn nhiều sản phẩm · Amount tự tính · xoá được đơn
   ═══════════════════════════════════════════════════════════ */
function nextOrderNo(){
  var rows=(((S.cache.order||{}).rows)||[]).concat(tGet("order")||[]);
  var mx=0, pre="No. ";
  rows.forEach(function(o){
    var s=String(o.orderNo||""); var m=/(\d+)\s*$/.exec(s.trim()); if(!m) return;
    var v=parseInt(m[1],10); if(!isFinite(v)) return;
    if(v>mx){ mx=v; var p=s.trim().slice(0,s.trim().length-m[1].length); pre=p; }
  });
  return mx?(pre+(mx+1)):"";
}
/* ═══════════════════════════════════════════════════════════════════════════════
   ⭐ v14 — DANH MỤC MÃ SẢN PHẨM  (tab "12. PRODUCT CODE" · cột I "Detail")
   Ô Detail trước đây gõ tay nên mỗi người viết một kiểu ("025 06 21mm 2 vỉ",
   "REAMER 21 #06"…) — không tổng hợp nổi theo sản phẩm. Nay chọn từ danh mục chuẩn,
   gom nhóm sẵn theo cột Type (REAMERS · K-FILES · JIZAI FILES · DIA-BURS …), chọn
   được nhiều mã cùng lúc cho những dòng có CÙNG đơn giá và CÙNG quy cách đóng gói.
   Danh mục nạp một lần rồi nằm trong máy, mở lại app không phải tải lại.
   ═══════════════════════════════════════════════════════════════════════════════ */
function pcodeKey_(){ return ckey("pcode"); }
function loadProductCodes(force){
  if(S._pcLoading) return S._pcLoading;
  if(!force && S.pcode && S.pcode.items) return Promise.resolve(S.pcode);
  if(!force){
    var c=kvGet(pcodeKey_());
    if(c && c.items && c.items.length){
      S.pcode=c;
      if(Date.now()-(c.at||0)<86400000) return Promise.resolve(S.pcode);
    }
  }
  S._pcLoading=apiGet("productCodes",{}).then(function(j){
    S._pcLoading=null;
    if(j&&j.unchanged) return S.pcode;
    if(j&&j.missing){ S.pcodeErr=j.message||"Chưa có tab 12. PRODUCT CODE"; return null; }
    S.pcodeErr="";
    S.pcode={ groups:j.groups||[], items:j.items||[], total:j.total||0, at:Date.now() };
    kvSet(pcodeKey_(),S.pcode);
    return S.pcode;
  }).catch(function(e){ S._pcLoading=null; S.pcodeErr=e.message; return null; });
  return S._pcLoading;
}
/* Nhóm nào "hợp" với Product type đang chọn — dùng để mở sẵn đúng nhóm cần.
   VD Product type "All - Files" ⇒ mở sẵn K-FILES, H-FILES, RT FILES, JIZAI FILES…
      Product type "Jizai"       ⇒ mở sẵn JIZAI FILES. */
var PC_STOP=/^(all|mani|va|và|cac|các|nhom|nhóm|other|khac|khác|product|san|sản|pham|phẩm)$/;
/* Product type trong MASTER LIST đặt theo cách gọi của MMH, còn cột Type của tab
   "12. PRODUCT CODE" đặt theo tên dòng sản phẩm. Bảng dưới nối hai cách gọi đó lại,
   nhờ vậy chọn "All - Files" là mở sẵn cả REAMERS, BROACHES, FINDERS… chứ không chỉ
   những nhóm có đúng chữ "FILES" trong tên. */
var PC_ALIAS={
  file   : ["file","reamer","broach","finder","spreader","plugger","jizai","flare","rt ","ultrasonic"],
  files  : ["file","reamer","broach","finder","spreader","plugger","jizai","flare","rt ","ultrasonic"],
  tram   : ["file","reamer","broach","jizai"],
  endo   : ["file","reamer","broach","finder","jizai","paste carrier","steri endo"],
  bur    : ["bur","drill","peeso","gates","metalbur"],
  burs   : ["bur","drill","peeso","gates","metalbur"],
  khoan  : ["bur","drill","peeso","gates"],
  mmg    : ["bond","bulk","flo","micro","nano","gingiva","acryl","bleach","mixing","application","eg","veins"],
  composite:["micro","nano","flo","bulk"],
  suture : ["suture"],
  sutures: ["suture"],
  chi    : ["suture"],
  knife  : ["knife"],
  dao    : ["knife"],
  ghim   : ["manipler"],
  manipler:["manipler"]
};
function pcTokens(v){
  var base=noAcc(String(v||"")).split(/[^a-z0-9]+/)
    .filter(function(x){ return x.length>2 && !PC_STOP.test(x); });
  var out=base.slice();
  base.forEach(function(t){
    (PC_ALIAS[t]||[]).forEach(function(x){ if(out.indexOf(x)<0) out.push(x); });
  });
  return out;
}
function pcGroupFits(gName,toks){
  if(!toks.length) return false;
  var g=noAcc(gName);
  return toks.some(function(t){
    if(g.indexOf(t)>=0) return true;
    if(t.length>4 && t.slice(0,-1) && g.indexOf(t.slice(0,-1))>=0) return true;   /* files ⇄ file */
    return false;
  });
}

function ordProds(){ if(!S.ordProds||!S.ordProds.length) S.ordProds=[{ptype:"",detail:"",details:[],price:"",qty:""}]; return S.ordProds; }
/* Detail lưu trong sheet là danh sách XUỐNG DÒNG; SL là một ô chung cho cả dòng */
function pcSplit(v){
  return String(v==null?"":v).split(/\r?\n|;/).map(function(x){ return x.trim(); }).filter(Boolean);
}
function ordSync(){
  ordProds().forEach(function(p,i){
    var t=$("op_t"+i), u=$("op_u"+i), q=$("op_q"+i);
    if(t) p.ptype=t.value;
    if(u) p.price=u.value;  if(q) p.qty=q.value;
    if(!p.details) p.details=pcSplit(p.detail);
    p.detail=(p.details||[]).join("\n");
  });
}
function ordDetailBox(p,i){
  var L=p.details||pcSplit(p.detail);
  var body = L.length
    ? '<div class="pcsel">'+L.map(function(d,k){
        return '<span class="pcchip" title="Bỏ mã này" onclick="ordDelDetail('+i+','+k+')">'+esc(d)+' ✕</span>';
      }).join("")+'</div>'
    : '<div class="pcempty">Chưa chọn mã sản phẩm</div>';
  return '<div class="pcbox" id="op_dbox'+i+'">'+body+
    '<button class="btn sm" type="button" style="width:100%;margin-top:6px" onclick="openDetailPicker('+i+')">'+
      (L.length?('✎ Sửa danh sách · '+L.length+' mã'):'＋ Chọn mã sản phẩm')+'</button></div>';
}
function ordDelDetail(i,k){
  ordSync(); var p=ordProds()[i]; if(!p) return;
  (p.details||[]).splice(k,1); p.detail=(p.details||[]).join("\n");
  ordDraw();
}
function ordRowHtml(p,i,single){
  var nD=(p.details||pcSplit(p.detail)).length;
  return '<div class="oprow">'+
    '<div class="opc t"><span class="oplb">Product type</span>'+
      '<select class="inp" id="op_t'+i+'" onchange="ordPtypeChg('+i+')">'+opts(S.master.product,p.ptype,"— chọn —")+'</select></div>'+
    '<div class="opc d"><span class="oplb">Detail'+(nD>1?(' · '+nD+' mã chung một mức giá'):'')+'</span>'+
      ordDetailBox(p,i)+'</div>'+
    '<div class="opc n"><span class="oplb">Unit price</span>'+
      '<input class="inp num" id="op_u'+i+'" inputmode="numeric" value="'+esc(p.price||"")+'" oninput="ordNum(this)"></div>'+
    '<div class="opc n"><span class="oplb">SL</span>'+
      '<input class="inp num" id="op_q'+i+'" inputmode="numeric" value="'+esc(p.qty||"")+'" oninput="ordNum(this)"></div>'+
    '<div class="opc n"><span class="oplb">Amount</span>'+
      '<input class="inp num piclock" id="op_a'+i+'" readonly value="'+(n(p.price)*n(p.qty)?fmtN(n(p.price)*n(p.qty)):"")+'"></div>'+
    '<button class="opdel" type="button" title="Bỏ dòng này"'+(single?' disabled':'')+' onclick="ordDelProd('+i+')">✕</button>'+
  '</div>';
}
function ordPtypeChg(i){ ordSync(); }
function ordDraw(){
  var w=$("o_prodWrap"); if(!w) return;
  var list=ordProds();
  w.innerHTML=list.map(function(p,i){ return ordRowHtml(p,i,list.length<2); }).join("");
  ordCalc();
}

/* ───────── hộp thoại chọn mã sản phẩm ───────── */
function openDetailPicker(i){
  ordSync();
  S.pcRow=i; S.pcQ=""; S.pcOpen={}; S.pcAll=false;
  var p=ordProds()[i]||{};
  S.pcPick={}; (p.details||[]).forEach(function(d){ S.pcPick[d]=1; });

  var h='<div class="pcwrap">'+
    '<div class="pchead">'+
      '<input class="inp" id="pc_q" autocomplete="off" placeholder="🔍 Gõ tên hoặc mã sản phẩm…" oninput="pcSearch()">'+
      '<div class="pcnote" id="pc_note"></div>'+
    '</div>'+
    '<div class="pclist" id="pc_list"><div class="pcempty">Đang nạp danh mục…</div></div>'+
    '<div class="pcfoot" id="pc_foot"></div></div>';
  openModal2("Chọn mã sản phẩm (Detail)",h,
    '<button class="btn" onclick="closeModal2()">Huỷ</button>'+
    '<button class="btn pri" onclick="pcApply()">Xong</button>');
  loadProductCodes().then(function(){ pcDraw(); });
}
function pcSearch(){ clearTimeout(S._pcT); S._pcT=setTimeout(function(){ S.pcQ=($("pc_q")||{}).value||""; pcDraw(true); },120); }
function pcToggleAll(){ S.pcAll=!S.pcAll; pcDraw(); }
function pcToggleGroup(gi){ S.pcOpen[gi]=!S.pcOpen[gi]; pcDraw(); }
function pcPickItem(idx,el){
  var it=((S.pcode||{}).items||[])[idx]; if(!it) return;
  var d=it[0];
  if(S.pcPick[d]){ delete S.pcPick[d]; if(el) el.classList.remove("on"); }
  else { S.pcPick[d]=1; if(el) el.classList.add("on"); }
  pcFoot();
}
function pcClear(){ S.pcPick={}; pcDraw(); }
function pcCount(){ return Object.keys(S.pcPick||{}).length; }
function pcFoot(){
  var f=$("pc_foot"); if(!f) return;
  var L=Object.keys(S.pcPick||{});
  f.innerHTML='<div class="pcsum"><b>'+L.length+'</b> mã đã chọn'+
    (L.length?' <button class="mini" onclick="pcClear()">Bỏ hết</button>':'')+'</div>'+
    (L.length?'<div class="pcsel">'+L.slice(0,40).map(function(d){
        return '<span class="pcchip on">'+esc(d)+'</span>'; }).join("")+
      (L.length>40?('<span class="pcchip">+'+(L.length-40)+' mã nữa</span>'):'')+'</div>':'');
  /* cập nhật nhãn nút "Xong" của modal 2 */
  var b=document.querySelector("#m2Foot .btn.pri");
  if(b) b.textContent=L.length?("Xong · "+L.length+" mã"):"Xong";
}
function pcDraw(keepCaret){
  var box=$("pc_list"); if(!box) return;
  var pc=S.pcode;
  if(!pc||!pc.items||!pc.items.length){
    box.innerHTML='<div class="pcempty">'+esc(S.pcodeErr||
      ('Chưa đọc được danh mục. Hãy tạo tab "12. PRODUCT CODE" trong file '+curTeam().crmFile+
       ' rồi dán nội dung file PRODUCT_CODE vào (tiêu đề ở hàng 1).'))+'</div>';
    pcFoot(); return;
  }
  var q=noAcc(String(S.pcQ||"").trim());
  var toks=pcTokens((ordProds()[S.pcRow]||{}).ptype);
  var items=pc.items, out=[], shown=0;

  if(q){
    var hits=[];
    for(var i=0;i<items.length && hits.length<300;i++){
      var it=items[i];
      if(noAcc(it[0]).indexOf(q)>=0 || noAcc(it[1]).indexOf(q)>=0) hits.push(i);
    }
    shown=hits.length;
    out.push('<div class="pcgh">Kết quả tìm kiếm · '+hits.length+(hits.length>=300?"+":"")+' mã</div>');
    out.push(hits.map(pcItemHtml).join("")||'<div class="pcempty">Không có mã nào khớp</div>');
  }else{
    var fit=[], rest=[];
    pc.groups.forEach(function(g,gi){ (pcGroupFits(g[0],toks)?fit:rest).push(gi); });
    if(!fit.length){ fit=rest; rest=[]; }
    /* nhóm hợp với Product type: mở sẵn · nhóm còn lại: thu gọn, bấm để mở */
    fit.forEach(function(gi,k){ if(S.pcOpen[gi]===undefined) S.pcOpen[gi]=(k<3); });
    var list=S.pcAll?fit.concat(rest):fit;
    list.forEach(function(gi){
      var g=pc.groups[gi], open=!!S.pcOpen[gi];
      var nSel=g[1].filter(function(ix){ return S.pcPick[items[ix][0]]; }).length;
      out.push('<div class="pcgh'+(open?" open":"")+'" onclick="pcToggleGroup('+gi+')">'+

      out.push('<button class="btn gho sm" style="width:100%;margin-top:8px" onclick="pcToggleAll()">'+
        'Hiện tất cả '+pc.groups.length+' nhóm sản phẩm ('+rest.length+' nhóm khác)</button>');

      out.push('<button class="btn gho sm" style="width:100%;margin-top:8px" onclick="pcToggleAll()">Chỉ hiện nhóm liên quan</button>');

  box.innerHTML=out.join("");
  var nt=$("pc_note");

    (toks.length?('Đang mở sẵn nhóm hợp với Product type <b>'+esc((ordProds()[S.pcRow]||{}).ptype||"")+'</b>. Gõ để tìm trong toàn bộ '+pc.total+' mã.')
                :('Danh mục '+pc.total+' mã. Chọn Product type trước để hệ thống mở sẵn đúng nhóm.'));
  pcFoot();
  if(keepCaret){ var el=$("pc_q"); if(el) el.focus(); }

function delOrder(row){
  if(!confirm("Xoá đơn hàng này khỏi sheet Sale Order? Thao tác không hoàn tác được.")) return;
  busy(true,"Đang xoá đơn hàng…");

    busy(false); closeAllModals(); toast(r.message||"Đã xoá đơn hàng","ok");
    afterWrite("order", row, null, true);
    setTimeout(syncOrderTasks,600);
    if(S.cache.order&&S.cache.order.rows) S.cache.order.rows=S.cache.order.rows.filter(function(x){return x._row!==row;});
    if(S.tab==="order") renderOrder();
  }).catch(function(e){ busy(false); toast(e.message,"err",5000); });
}
function saveOrder(){
  ordSync();
  var c=S.editing.ctx||{};
  var accName=$("o_accName").value.trim();
  if(!accName) return toast("Cần chọn Account","warn");
  if(!$("o_day").value) return toast("Cần chọn ngày đặt","warn");
  var list=ordProds().filter(function(p){
    return String(p.ptype||"").trim()||String(p.detail||"").trim()||(p.details&&p.details.length)||n(p.qty)||n(p.price); });
  if(!list.length) return toast("Cần nhập ít nhất một sản phẩm","warn");
  /* ⭐ v14 — chọn nhiều mã trên cùng một dòng thì đơn giá và SL là DÙNG CHUNG,
     nên phải chắc chắn người nhập đã điền đủ hai ô đó. */
  var badLine=0;
  list.forEach(function(p,k){ if((p.details||[]).length>1 && (!n(p.price)||!n(p.qty))) badLine=k+1; });
  if(badLine) return toast("Dòng sản phẩm "+badLine+" đang chọn nhiều mã — cần điền Unit price và SL dùng chung cho cả dòng","warn",6000);

  var base={ code:c.code||"", cbcCode:c.cbcCode||"", channel:$("o_channel").value,
    fy:$("o_fy").value, month:$("o_month").value, day:$("o_day").value, orderNo:$("o_orderNo").value,
    type:c.type||"", name:accName, address:c.address||"", province:c.province||"", area:c.area||"",
    contact:($("o_contact")?$("o_contact").value:""), jobTitle:$("o_jobTitle").value, phone:$("o_phone").value,
    pic:$("o_pic").value, partner:$("o_partner").value, partnerType:$("o_partnerType").value,
    source:$("o_source").value, note:$("o_note").value };

  /* ⭐ v14 — GỬI CẢ ĐƠN TRONG MỘT LẦN GỌI.
     Bản cũ gửi nối tiếp từng sản phẩm: đơn 4 dòng = 4 vòng gọi Apps Script, mỗi vòng
     mở lại Spreadsheet, chờ khoá, flush và xoá bộ nhớ đệm ⇒ 15–30 giây đứng hình.
     Nay backend ghi liền khối, chỉ khoá và flush đúng một lần. */
  var first=S.editing.row||0;
  var rows=list.map(function(p,k){
    var amt=n(p.price)*n(p.qty);
    return Object.assign({},base,{ _row:(k===0?first:0), ptype:p.ptype,
      detail:(p.details&&p.details.length?p.details.join("\n"):p.detail||""),
      qty:p.qty, price:p.price, amount:amt?String(amt):"" });
  });
  busy(true,"Đang lưu đơn hàng ("+rows.length+" dòng sản phẩm)…");
  apiPost({action:"saveOrders",rows:rows}).then(function(r){
    var got=(r&&r.rows)||[];
    rows.forEach(function(d,k){ afterWrite("order", got[k]||d._row||0, d); });
    busy(false); closeAllModals();
    toast("✓ Đã lưu "+rows.length+" dòng sản phẩm cho đơn "+base.orderNo,"ok",4200);
    if(S.tab==="order") renderOrder();
    /* key task "Tư vấn bán hàng" của tháng cập nhật ngay, không chờ trigger 10 phút */
    setTimeout(syncOrderTasks,600);
  }).catch(function(e){ busy(false); toast(e.message,"err",5500); });
}

function mnTypes(){
  var pic=mnPic(), seen={}, out=[];
  mnRows().forEach(function(r){
    if(pic && !picMatch(r.pic,pic)) return;
    var t=String(r.typeTask||"").trim(); if(!t||seen[t]) return; seen[t]=1; out.push(t);
  });
  out.sort(function(a,b){ var x=mnTypeOrder(a),y=mnTypeOrder(b); return x!==y?x-y:a.localeCompare(b); });
  return out;
}
function cmpS(){
  S.mnCmp=S.mnCmp||{ mode:"month", field:"result", type:"", months:[], pics:[], month:"" };
  return S.mnCmp;

function toggleCmpMonth(m){
  var c=cmpS(), i=c.months.indexOf(m);

  else { if(c.months.length>=3) return toast("Tối đa 3 tháng một lần","warn"); c.months.push(m); c.months.sort(); }
  renderMonthly();

function renderMnCompare(){
  var c=cmpS(), mgr=(S.user.role==="manager"), types=mnTypes(), months=fyMonths(S.fy);

    var here=months.indexOf(S.mnMonth||ymOf(todayISO()));
    if(here<0) here=months.length-1;
    c.months=(here>0?[months[here-1],months[here]]:[months[here]]).filter(Boolean);
  }
  var fieldLb=(c.field==="result")?"✅ RESULT — kết quả":"📘 PLAN — kế hoạch";

  var picPool=[];
  mnRows().forEach(function(r){ if(r.pic&&picPool.indexOf(r.pic)<0) picPool.push(r.pic); });
  (S.master.pic||[]).forEach(function(p){ if(picPool.indexOf(p)<0) picPool.push(p); });

  var cols=[];
  if(c.mode==="pic"){
    cols=(c.pics.length?c.pics:picPool.slice(0,2)).map(function(p){
      return { lb:p, sub:"tháng "+c.month.slice(4)+"/"+c.month.slice(0,4), row:mnFindCell(c.type,c.month,p) };
    });
  }else{
    cols=(c.months.length?c.months:[]).map(function(m){
      return { lb:"Tháng "+m.slice(4)+"/"+m.slice(0,4), sub:(mnPic()||"tất cả PIC"), row:mnFindCell(c.type,m,mnPic()) };
    });

function mnTplFor(typeTask){
  var k=noAcc(String(typeTask||"")).replace(/[^a-z0-9]/g,"");
  if(!k) return null;
  for(var i=0;i<MN_TPL.length;i++){
    for(var j=0;j<MN_TPL[i].match.length;j++)
      if(k.indexOf(MN_TPL[i].match[j])>=0) return MN_TPL[i];
  }
  return null;
}
function mnTplText(typeTask){ var t=mnTplFor(typeTask); return t?t.text:""; }
/* thứ tự hiển thị các nhóm — đúng như file Monthly Report đang dùng */
function mnTypeOrder(t){
  var x=mnTplFor(t); if(!x) return 99;
  return ["turnover","distributor","dealer","university","clinic","hospital","kpi","event"].indexOf(x.key);
}
/* chèn khung vào ô đang soạn, không đè nội dung đã gõ */
function mnInsertTpl(id,typeTaskId,field){
  var ta=$(id); if(!ta) return;
  var tt=$(typeTaskId)?$(typeTaskId).value:"";
  var tpl=mnTplText(tt);
  if(!tpl) return toast("Type task này chưa có khung mẫu — chọn Type task trước","warn",5000);
  var cur=String(ta.value||"").trim();
  if(cur && cur.indexOf(tpl.split("\n")[0])>=0) return toast("Ô này đã có khung rồi","warn");
  ta.value = cur ? (tpl+"\n\n— Nội dung cũ —\n"+cur) : tpl;
  try{ ta.dispatchEvent(new Event("input",{bubbles:true})); }catch(e){}
  if(field) markDirtyM(field,ta.value);
  try{ ta.focus(); ta.setSelectionRange(0,0); ta.scrollTop=0; }catch(e){}
  toast("✓ Đã chèn khung "+(mnTplFor(tt).label),"ok");
}
/* đổi Type task ⇒ đổi luôn chữ mờ gợi ý của 2 ô Plan / Result */

/* ⭐ v5 — tạo sẵn đủ bộ hạng mục theo khung Type task cho kỳ đang xem.
   Sales chỉ việc mở từng hạng mục lên điền, không phải tự nhớ có bao nhiêu mục. */
function mnScaffold(){
  var mn=S.mnMonth||ymOf(todayISO());
  var pic=(isMgmt()? (S.mnPic||S.user.pic) : S.user.pic);
  if(!pic) return toast("Chọn PIC trước khi tạo khung","warn");
  var have={}; mnRows().forEach(function(r){
    if(mnPer(r)===String(mn) && picMatch(r.pic,pic)) have[String(r.typeTask||"").toLowerCase()]=1; });
  var master=S.master.typeTask||[];
  /* ⭐ v7.1 — chỉ tạo Type task CHƯA có trong kỳ này của PIC đó ⇒ bấm nhiều lần
     cũng không sinh hạng mục trùng. */
  var todo=master.filter(function(t){ return mnTplFor(t) && !have[String(t).toLowerCase()]; })
                 .sort(function(a,b){ return mnTypeOrder(a)-mnTypeOrder(b); });
  var dup=master.filter(function(t){ return mnTplFor(t) && have[String(t).toLowerCase()]; });
  if(!todo.length) return toast("Kỳ "+mn.slice(4)+"/"+mn.slice(0,4)+" của "+pic+" đã có đủ "+dup.length+" hạng mục — không tạo trùng","ok",4800);
  if(!confirm("Tạo "+todo.length+" hạng mục cho "+pic+" — kỳ "+mn.slice(4)+"/"+mn.slice(0,4)+"?\n\n"+
              todo.join("\n")+"\n\nMỗi hạng mục sẽ có sẵn khung nội dung để điền.")) return;
  var area=PIC_AREA[pic]||"", i=0, okN=0;
  busy(true,"Đang tạo khung 0/"+todo.length+"…");
  (function next(){
    if(i>=todo.length){
      busy(false); toast("✓ Đã tạo "+okN+" hạng mục có sẵn khung","ok",4500);
      /* renderMonthly() đọc S.cache.monthly, còn fetchTab chỉ ghi vào TSTORE ⇒
         phải nạp lại qua pgMonthly() thì màn hình mới thấy hạng mục vừa tạo. */
      afterWrite("monthly",0,null);
      if(S.tab==="monthly") pgMonthly();
      return;
    }
    var t=todo[i++];
    busy(true,"Đang tạo khung "+i+"/"+todo.length+" — "+t+"…");
    apiPost({action:"saveMonthly",data:{ _row:0, typeTask:t, pic:pic, area:area,
      fy:fyOfMonth(mn), period:mn, plan:mnTplText(t), result:"" }})
      .then(function(){ okN++; next(); })
      .catch(function(e){ busy(false); toast("Dừng ở \""+t+"\": "+e.message,"err",6000); });
  })();
}

function selM(id,field,label,options,cur){
  var o='<option value="">—</option>'+(options||[]).map(function(x){return '<option'+(x===cur?" selected":"")+'>'+esc(x)+'</option>';}).join("");
  if(cur&&(options||[]).indexOf(cur)<0) o='<option value="'+esc(cur)+'" selected>'+esc(cur)+'</option>'+o;
  return '<div><span class="te-lb">'+esc(label)+'</span><select id="'+id+'" onchange="markDirtyM(\''+field+'\',this.value)">'+o+'</select></div>';
}
function markDirtyM(f,v){
  S.dirty[f]=v;
  if(f==="pic" && PIC_AREA[v]){                 /* Area đi theo PIC */
    S.dirty.area=PIC_AREA[v];
    var el=$("mn-ar"); if(el) el.value=PIC_AREA[v];
  }
  if(f==="period") S.dirty.fy=fyOfMonth(v);
  if(f==="typeTask") mnSyncTplPh("mn-tt","mn-plan","mn-res");
}
function saveMonthlyDrw(){
  var d={ _row:S.mnEdit.row, fy:S.fy };
  ["typeTask","period","pic","area","plan","result"].forEach(function(f){ if(f in S.dirty) d[f]=S.dirty[f]; });
  if(!Object.keys(S.dirty).length) return toast("Chưa có thay đổi nào");

/* ═══════════ ⭐ v8 — ADP TARGET TÁCH THEO PRODUCT TYPE ═══════════
   Ô "FY Target sales" trong sheet giờ chứa 2 dữ liệu gộp lại: "<Product type> | <số tiền>".
   Actual sales KHÔNG nhập tay nữa — cộng từ sheet Sale Order của chính account đó,
   chỉ tính những đơn có product type nằm trong phạm vi của target:
     · All dental → tính tất cả      · All file → Hand files + Jizai
     · All MMG    → Composite, Tẩy trắng, Nhựa …
     · còn lại    → đúng product type đó
   ══════════════════════════════════════════════════════════════ */
function adpParseTarget(v){
  var s=String(v==null?"":v);
  var m=/^\s*(.*?)\s*[|\uFF5C]\s*([\d.,\s]+)\s*$/.exec(s);
  if(m) return { ptype:m[1].trim(), amt:n(m[2]) };
  return { ptype:"", amt:n(s) };
}
function adpMergeTarget(ptype,amt){
  var a=String(amt||"").replace(/[^\d]/g,"");
  return ptype ? (ptype+" | "+a) : a;
}
/* ⭐ v7.3 — chuẩn hoá tên nhóm sản phẩm trước khi so.
   MASTER LIST ghi "All - MMG" (có gạch nối) nên chuỗi so cũ "all mmg" không bao giờ
   khớp, khiến chọn All - MMG ra 0 đồng dù account có đơn Composite và Bond. */
function adpNorm(v){ return noAcc(v).replace(/[^a-z0-9]+/g," ").trim(); }
function adpScopeMatch(scope,p){
  var s=adpNorm(scope), x=adpNorm(p);
  if(!s) return true;
  if(/^all$/.test(s) || /^all dental$/.test(s) || /tat ca/.test(s)) return true;
  if(/^all (file|files)$/.test(s))  return /file|jizai|tram|nong dua|nong rua/.test(x);
  if(/^all (bur|burs)$/.test(s))    return /bur|khoan|dia|carbide|ipr/.test(x);
  if(/^all mmg$/.test(s))           return /composite|comp|tay trang|bleach|whiten|nhua|resin|acrylic|bond|mmg/.test(x);
  if(!x) return false;
  return x.indexOf(s)>=0 || s.indexOf(x)>=0;
}
function adpOrderRows(){
  var a=(tGet("order")||[]), b=((S.cache.order||{}).rows)||[];
  if(a.length>=b.length) return a;
  return b;
}

function adpActualOf(accName,scope){
  var k=noAcc(accName||"").trim(); if(!k) return 0;
  /* bộ nhớ đệm — tránh quét lại toàn bộ đơn hàng cho từng thẻ ADP mỗi lần vẽ */
  var ck=S.fy+"|"+adpOrderRows().length;
  if(_adpActKey!==ck){ _adpAct={}; _adpActKey=ck; }
  var ik=k+"\u0001"+noAcc(scope||"");
  if(ik in _adpAct) return _adpAct[ik];
  var fym={}; fyMonths(S.fy).forEach(function(m){ fym[String(m)]=1; });
  var sum=0;
  adpOrderRows().forEach(function(o){
    if(!fym[String(o.month||"")]) return;
    if(noAcc(o.name||"").trim()!==k) return;
    if(!adpScopeMatch(scope,o.ptype)) return;
    sum+=n(o.amount);
  });
  _adpAct[ik]=sum;
  return sum;
}
/* target + actual đã chuẩn hoá cho một dòng ADP */
function adpNums(r){
  var t=adpParseTarget(r.targetAmt);
  var acc=parseAcc(r.account||"").name||"";
  var hasOrd=adpOrderRows().length>0;
  return { ptype:t.ptype, tg:t.amt, ac:(hasOrd?adpActualOf(acc,t.ptype):n(r.actualAmt)), live:hasOrd };
}
function adpSyncActual(){
  var name=$("a_accName")?$("a_accName").value.trim():"";
  var sc=$("a_tptype")?$("a_tptype").value:"";
  var v=adpActualOf(name,sc);
  if($("a_actualAmt")) $("a_actualAmt").value=v?fmtN(v):"0";
  var h=$("a_actualHint");
  if(h) h.innerHTML=name
    ? 'Cộng từ đơn hàng '+esc(S.fy)+' của <b>'+esc(name)+'</b>'+(sc?(' · phạm vi <b>'+esc(sc)+'</b>'):' · mọi product type')
    : 'Chọn Account để tính';
}

function adpCard(r,g){
  var a=parseAcc(r.account);
  var lv=lastVisitOf(a.name);
  var N=adpNums(r), tg=N.tg, ac=N.ac;
  var p=tg?ac/tg:null;
  /* ⭐ v5.2 — chỉ cảnh báo khi thật sự lệch bậc đơn vị (Actual gấp >50 lần Target).
     Ô có lẫn chữ giờ đã đọc đúng số tiền nên không còn báo nhầm. */
  var odd=(p!=null&&p>50);
  var msgT=false, msgA=false;
  var days=lv?Math.round((new Date(todayISO())-new Date(lv.date))/86400000):null;
  var vt = lv
    ? '<div class="adpv'+(days>60?" old":days>30?" mid":"")+'">🕑 Gặp gần nhất <b>'+fmtVN(lv.date)+'</b>'
      +(days!=null?' <span>('+(days===0?"hôm nay":days+" ngày trước")+')</span>':"")
      +' · <b>'+esc(lv.pic||"—")+'</b></div>'
    : '<div class="adpv none">⚠️ Chưa có buổi gặp nào trong '+esc(S.fy)+'</div>';
  var big=(S.adpView==="list");
  var accKey=reg({name:a.name,code:""});
  /* ⭐ v5 — mở thẳng hồ sơ 360 của account (dòng thời gian · đơn hàng · CBC · ảnh) */
  return '<div class="adpc" style="border-left-color:'+g.c+'">'+
    '<div class="adpc-h" onclick="rAcc(\''+accKey+'\')" style="cursor:pointer"><b>'+esc(a.name||r.account||"—")+'</b><span class="tag t-b">'+esc(r.pic||"—")+'</span></div>'+
    '<div class="adpc-m">'+[a.type,a.province,a.area].filter(Boolean).map(esc).join(" · ")+
      (N.ptype?' <span class="tag t-y">🎯 '+esc(N.ptype)+'</span>':"")+'</div>'+
    vt+
    (big?
      '<div class="adpc-kv">'+
        (r.abcd?'<i>Nhóm</i><b>'+esc(r.abcd)+'</b>':"")+
        (r.objective?'<i>Objective</i><b>'+nl2br(String(r.objective).slice(0,260))+'</b>':"")+
        (r.keyAction?'<i>Key action</i><b>'+nl2br(String(r.keyAction).slice(0,260))+'</b>':"")+
        (r.tactic?'<i>Tactic</i><b>'+nl2br(String(r.tactic).slice(0,200))+'</b>':"")+
      '</div>'
      : (r.objective||r.keyAction?'<div class="adpc-o">'+nl2br(String(r.objective||r.keyAction).slice(0,180))+'</div>':""))+
    (tg
      ? (odd
          ? '<div class="adpc-w">⚠️ Actual '+fmtVND(ac)+' lớn hơn Target '+fmtVND(tg)+' quá nhiều — kiểm tra lại đơn vị trong sheet</div>'
          : pb(p)+'<div class="pbl"><span>'+fmtVND(ac)+' / '+fmtVND(tg)+'</span><span style="color:'+pctColor(p)+'">'+Math.round(p*100)+'%</span></div>')
      : '<div class="adpc-n">Chưa đặt FY target</div>')+
    ((msgT||msgA)
      ? '<div class="adpc-note">ℹ️ Ô trong sheet có lẫn chữ, app đọc là '+
        (msgT?('Target <b>'+fmtVND(tg)+'</b>'):"")+(msgT&&msgA?" · ":"")+
        (msgA?('Actual <b>'+fmtVND(ac)+'</b>'):"")+'</div>'
      : "")+
    '<div class="adpc-acts">'+
      '<button onclick="event.stopPropagation();rAcc(\''+accKey+'\')">🗂 Dữ liệu account</button>'+
      '<button onclick="event.stopPropagation();rWeeklyFor(\''+reg(mkAcc(a))+'\')">📍 Ghi hoạt động</button>'+
      '<button class="pri" onclick="event.stopPropagation();rADP(\''+reg(r)+'\')">✎ Sửa ADP</button>'+
    '</div>'+
  '</div>';
}

/* ⭐ v7.2 — MASTER LIST đã có sẵn các mục "All - Dental", "All - MMG"…
   Trước đây app còn thêm bộ "All dental / All file / All MMG" của riêng mình nên
   danh sách hiện hai lần. Nay chỉ giữ dạng có gạch nối lấy từ MASTER LIST;
   thiếu mục nào mới bổ sung. */
function ADP_ALL_CANON(){ return ["All - Dental","All - Files","All - Burs","All - MMG"]; }
function adpIsAll(p){ return /^all\b/i.test(String(p||"").trim()); }
function ADP_PTYPES(){
  var master=(S.master.product||[]).map(function(x){ return String(x).trim(); }).filter(Boolean);
  var alls=[], others=[], seen={};
  master.forEach(function(p){
    var k=noAcc(p).replace(/[^a-z]/g,"");
    if(seen[k]) return; seen[k]=1;
    (adpIsAll(p)?alls:others).push(p);
  });
  /* mục "All" nào chưa có trong MASTER LIST thì thêm theo dạng chuẩn có gạch nối */
  ADP_ALL_CANON().forEach(function(p){
    var k=noAcc(p).replace(/[^a-z]/g,"");
    if(!seen[k]){ seen[k]=1; alls.push(p); }
  });
  return alls.concat(others);
}

/* tìm bản ADP đã có của cùng account + FY (bỏ qua chính dòng đang sửa) */
function adpFindDup(accName,fy,selfRow){
  var key=accKeyOf(accName), rows=((S.cache.adp||{rows:null}).rows)||tGet("adp")||[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(selfRow && r._row===selfRow) continue;
    if(String(r.fy||"")!==String(fy||"")) continue;
    if(accKeyOf(parseAcc(r.account).name)===key) return r._row||-1;
  }
  return 0;
}
function saveADP(){
  var d={ _row:S.editing.row, account:$("a_account").value||mkAcc({name:$("a_accName").value.trim()}),
    pic:$("a_pic").value, fy:$("a_fy").value, abcd:$("a_abcd").value,
    caseInfo:$("a_caseInfo").value, analysis:$("a_analysis").value, objective:$("a_objective").value,
    tactic:$("a_tactic").value, keyAction:$("a_keyAction").value,
    targetAmt:adpMergeTarget($("a_tptype").value,$("a_targetAmt").value),
    actualAmt:String(adpActualOf($("a_accName").value.trim(),$("a_tptype").value)||""),
    rQ1:$("a_rQ1").value, rQ2:$("a_rQ2").value, rQ3:$("a_rQ3").value, rQ4:$("a_rQ4").value, rFY:$("a_rFY").value };
  var accNm=$("a_accName").value.trim();
  if(!accNm) return toast("Cần chọn Account","warn");
  /* ⭐ v7.2 — mỗi địa bàn chỉ có MỘT bản ADP trong một FY.
     Trước đây thêm hai lần thì bảng ABCD hiện account hai chỗ, số liệu cộng đôi. */
  var dupRow=adpFindDup(accNm,d.fy,d._row);
  if(dupRow){
    return toast("⚠️ "+accNm+" đã có ADP trong "+d.fy+" — mở bản đó ra sửa thay vì tạo thêm","warn",7000);
  }
  busy(true,"Đang lưu ADP…");
  apiPost({action:"saveADP",data:d}).then(function(r){
    busy(false); closeModal(); toast(r.message||"Đã lưu","ok");
    afterWrite("adp", r.row||d._row, d);

  }).catch(function(e){ busy(false); toast(e.message,"err",5000); });
}
</script>

<script>

/* ── xuất Excel thống kê (dựng ngay trên máy, không cần server) ── */
var _xlsxQ=null;
function ensureXLSX(cb){
  if(window.XLSX) return cb(window.XLSX);
  if(_xlsxQ){ _xlsxQ.push(cb); return; }
  _xlsxQ=[cb];
  var s=document.createElement("script");
  s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload=function(){ var q=_xlsxQ; _xlsxQ=null; q.forEach(function(f){ f(window.XLSX); }); };
  s.onerror=function(){ _xlsxQ=null; busy(false); toast("Không tải được thư viện Excel","err"); };
  document.head.appendChild(s);
}
function galExcel(){
  var rows=galFiltered();
  if(!rows.length) return toast("Kỳ này chưa có ảnh để xuất","warn");
  busy(true,"Đang dựng file Excel…");
  ensureXLSX(function(XLSX){
    try{
      var head=["Ngày","Thứ","PIC","Account","Loại địa bàn","Tỉnh thành","Khu vực",
                "Type action","Type task","Sales Process","Nhóm sản phẩm","Trạng thái",
                "Next action","Kết quả","Toạ độ GPS","Địa chỉ nơi chụp","Link ảnh Drive"];
      var aoa=[head];
      rows.forEach(function(w){
        var a=parseAcc(w.account), ph=(w.photos||[])[0]||{};
        aoa.push([ fmtVN(w.start), wdOf(w.start), w.pic||"", a.name||"", a.type||"", a.province||"", a.area||"",
                   w.typeAction||"", w.typeTask||"", w.process||"", w.product||"", w.status||"",
                   w.nextAction||"", String(w.result||"").replace(/\s+/g," ").slice(0,900),
                   w.gps||"", w.gpsAddr||"", ph.open||ph.full||"" ]);
      });
      /* sheet 2: tổng hợp PIC × tháng */
      var byPic={}, mset={};
      (S.galRows||[]).forEach(function(w){
        var p=w.pic||"—", m=ymOf(String(w.start).slice(0,10));
        mset[m]=1; byPic[p]=byPic[p]||{}; byPic[p][m]=(byPic[p][m]||0)+1;
      });
      var mk=Object.keys(mset).sort();
      var sum=[["PIC"].concat(mk.map(function(m){return m.slice(4)+"/"+m.slice(0,4);})).concat(["Tổng"])];
      Object.keys(byPic).sort().forEach(function(p){
        var t=0, r=[p];
        mk.forEach(function(m){ var c=byPic[p][m]||0; t+=c; r.push(c); });
        r.push(t); sum.push(r);
      });

      var wb=XLSX.utils.book_new();
      var ws=XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"]=[{wch:11},{wch:8},{wch:12},{wch:30},{wch:13},{wch:14},{wch:10},{wch:12},{wch:16},{wch:16},{wch:14},{wch:13},{wch:22},{wch:60},{wch:20},{wch:40},{wch:46}];
      XLSX.utils.book_append_sheet(wb,ws,"Anh di dia ban");
      XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),"Tong hop PIC-Thang");
      var tag=(S.galMonth==="ALL"?S.fy:S.galMonth)+(S.galPic?("_"+S.galPic.replace(/\s+/g,"")):"");
      XLSX.writeFile(wb,"MMH_"+curTeam().label+"_AnhDiaBan_"+tag+".xlsx");
      busy(false); toast("✓ Đã tải file Excel ("+rows.length+" dòng)","ok",4200);
    }catch(e){ busy(false); toast(e.message,"err",5000); }
  });
}

      '</div>'+picBar+

    : '<div class="card pad" style="margin-bottom:12px"><div class="ct"><span class="dot"></span>Kỳ báo cáo tháng</div>'+

        return '<div class="chip'+(S.rpMonth===m?" on":"")+'" onclick="S.rpMonth=\''+m+'\';renderReport()">'+m.slice(4)+"/"+m.slice(2,4)+'</div>'; }).join("")+'</div>'+picBar+

/* ⭐ v5.8 — XEM NHANH TOÀN BỘ CÔNG VIỆC TRONG TUẦN TRƯỚC KHI GỬI MAIL.
   Gộp cả hai nguồn: hoạt động đi địa bàn (tab 6. WEEKLY REPORT) và Công việc khác
   (Key task / đầu việc con bên WEEKYLY new), hiển thị đúng các cột anh cần:
   Key task · Sub task · Ngày bắt đầu · Kế hoạch · Tiến độ · Kết quả · Deadline. */
function rpPreviewRows(from,to){
  var pics=rpPics(), inPic={};
  pics.forEach(function(p){ inPic[noAcc(p).trim()]=1; });
  var rows=[];

  /* nguồn 1 — đi địa bàn */
  terrRows().forEach(function(w){
    if(!inPic[noAcc(w.pic||"").trim()]) return;
    if(!inRp(w,from,to)) return;
    var pct=/complet/i.test(String(w.status||"")) ? 100
          : /75/.test(String(w.status||"")) ? 75
          : /50/.test(String(w.status||"")) ? 50
          : /25/.test(String(w.status||"")) ? 25 : 0;
    rows.push({ src:"Đi địa bàn", pic:w.pic, key:w.typeTask||"Đi địa bàn",
      sub:parseAcc(w.account).name||w.account, start:String(w.start||"").slice(0,10),
      plan:w.plan||"", pct:pct, status:w.status||"", result:w.result||"",
      due:String(w.finish||"").slice(0,10), row:w._row });
  });

  /* nguồn 2 — công việc khác (bỏ key Customer visiting vì đã đếm ở nguồn 1) */
  ((S.other&&S.other.keys)||[]).forEach(function(k){
    if(String(k.fy||"") && String(k.fy)!==S.fy) return;
    if(!OTHER_TYPE_RE.test(String(k.type||""))) return;
    if(isVisitingKey(k)) return;
    var subs=(k.subs||[]);
    function push(x,isKey){
      if(!inPic[noAcc(x.pic||"").trim()]) return;
      var a=String(x.start||"").slice(0,10);
      var b=String(x.planned||x.revised||x.actual||"").slice(0,10)||a;
      if(!a&&!b) return;
      if(!a) a=b; if(!b) b=a;
      if(a>b){ var t=a; a=b; b=t; }
      if(b<from || a>to) return;
      rows.push({ src:"Công việc khác", pic:x.pic, key:k.keyTask||"—",
        sub:isKey?"(key task)":(x.subTask||"—"), start:String(x.start||"").slice(0,10),
        plan:"", pct:otherPct(x), status:x.status||"To Do", result:x.result||"",
        due:String(x.planned||"").slice(0,10), no:x.no });
    }
    if(subs.length) subs.forEach(function(x){ push(x,false); });
    else push(k,true);
  });

  rows.sort(function(a,b){ return String(a.start).localeCompare(String(b.start)) ||
                                  String(a.key).localeCompare(String(b.key)); });
  return rows;
}

/* ═══════════ ⭐ v8 — OTHER TASK TRONG BÁO CÁO TUẦN ═══════════
   Trước đây báo cáo tuần chỉ lấy hoạt động đi địa bàn. Nay gộp thêm Key task /
   đầu việc con bên "Công việc khác", đúng như bảng Report Hub, và gửi kèm dữ liệu
   này trong yêu cầu gửi mail để Code.gs dựng đúng phần Other task.
   ══════════════════════════════════════════════════════════════ */
function rpFit(x,from,to){
  var a=String(x.start||"").slice(0,10);
  var b=String(x.planned||x.revised||x.actual||"").slice(0,10)||a;
  if(!a&&!b) return false;
  if(!a) a=b; if(!b) b=a;
  if(a>b){ var t=a; a=b; b=t; }
  return !(b<from || a>to);
}
function rpOtherFor(pic,from,to){
  var out=[];
  ((S.other&&S.other.keys)||[]).forEach(function(k){
    if(String(k.fy||"") && String(k.fy)!==S.fy) return;
    if(!OTHER_TYPE_RE.test(String(k.type||""))) return;
    if(isVisitingKey(k)) return;
    var subs=(k.subs||[]);
    var mine=subs.filter(function(x){ return (!pic||picEq(x.pic,pic)) && rpFit(x,from,to); });
    if(mine.length) out.push({ key:k, subs:mine });
    else if((!pic||picEq(k.pic,pic)) && !subs.length && rpFit(k,from,to)) out.push({ key:k, subs:[] });
  });
  return out;
}

function tbdForm(option,who){
  var w=tbdNextWeek();
  var h='<div class="card pad" style="margin-bottom:12px;background:var(--pale);border-color:var(--lb1)">'
   +'<div style="font-size:13.5px;font-weight:800;color:var(--navy);margin-bottom:4px">Kế hoạch đi địa bàn — chưa xác định account</div>'
   +'<div style="font-size:12.5px;color:var(--sub);line-height:1.6">Hệ thống tạo một dòng Account <b>TBD</b> cho tuần <b>'
   +fmtVN(w.from)+' – '+fmtVN(w.to)+'</b>. Cuối tuần, ô kết quả tự tổng hợp các account bạn thực sự đi.</div></div>'
   +tbdPickHTML("tbb");
  openModal("Tạo kế hoạch TBD cho tuần mới",h,
    '<button class="btn" onclick="closeModal();go(\'weekly\')">Quay lại thêm kế hoạch</button>'+
    '<button class="btn pri" onclick="tbdFormGo(\''+esc(option)+'\',\''+esc(who)+'\')">Tạo kế hoạch & gửi báo cáo</button>', true);
  tbdProvInit("tbb");
}

function tbdFormGo(option,who){
  var miss=tbdPickBad("tbb");
  if(miss) return toast("⚠️ Bắt buộc chọn: "+miss,"warn",6000);
  var w=tbdNextWeek();
  var t=tbdRow(w.from, tbdPlanText("tbb"), tbdSel("tbb","p")[0]||"", who||S.user.pic);
  /* ⭐ v14 — tuần đó đã có dòng TBD rồi thì dùng luôn, không tạo thêm dòng thứ hai */
  var dup=tbdExistingRow(t.start,t.pic,0);
  if(dup){
    closeModal();
    S._tbdOk=S.rpFrom+"|"+who;
    toast("Tuần này đã có sẵn kế hoạch đi địa bàn — dùng luôn dòng đó.","ok",4200);
    return sendReport(option,true);
  }
  busy(true,"Đang tạo kế hoạch TBD…");
  apiPost({action:"saveWeekly",data:t}).then(function(r){
    busy(false); closeModal();
    afterWrite("weekly", r.row||0, t);
    tbdSyncWeek(t.start, t.pic);
    S._tbdOk=S.rpFrom+"|"+who;
    toast("✓ Đã tạo kế hoạch đi địa bàn tuần "+fmtVN(t.start)+" – "+fmtVN(t.finish),"ok",4600);
    sendReport(option,true);
  }).catch(function(e){ busy(false); toast(e.message,"err",6000); });
}

function sendReport(option,confirmed){
  var kind=S.rpKind, who=(S.rpPic||S.user.pic);
  var labels={self:"gửi thử cho chính bạn",team:"gửi chính thức tới team",pic:"gửi thay cho "+who,all:"gửi cho toàn bộ "+curTeam().label+" team",download:"tải PDF"};
  if(!confirmed) return askSend(option);
  /* ⭐ v8.1 — báo cáo tuần PHẢI kèm Other task. Chưa nạp xong mà bấm gửi thì payload
     "other" rỗng ⇒ email thiếu hẳn phần Công việc khác. Nạp xong rồi mới gửi. */
  if(kind==="week" && !S.other){
    busy(true,"Đang nạp Công việc khác…");
    return loadOther(true).then(function(){ busy(false); sendReport(option,true); })
      .catch(function(e){ busy(false); toast("Không nạp được Other task: "+e.message,"err",6500); });
  }
  /* ⭐ v10 — chưa có kế hoạch đi địa bàn tuần sau thì hỏi trước khi gửi */
  if(kind==="week" && option!=="download" && S._tbdOk!==(S.rpFrom+"|"+who))
    return tbdGate(option,who);
  /* ⭐ v12 — người dùng đã xác nhận gửi: chốt lần cuối số account đã đi và
     chuyển dòng TBD của tuần này sang Completed TRƯỚC khi Code.gs đọc sheet. */
  if(kind==="week" && option!=="download" && S._tbdFin!==(S.rpFrom+"|"+who)){
    S._tbdFin=S.rpFrom+"|"+who;
    busy(true,"Đang chốt kết quả đi địa bàn…");
    return tbdSyncWeek(S.rpFrom, isMgmt()?"":who, true)
      .then(function(){ busy(false); sendReport(option,true); })
      .catch(function(){ busy(false); sendReport(option,true); });
  }
  busy(true, option==="download"?"Đang tạo PDF…":"Đang gửi email + tạo PDF đính kèm…");
  var send;
  if(kind==="week"){
    /* ⭐ v9 — Other task LUÔN đi bằng POST body.
       Trước đây apiPost() chỉ chuyển sang POST khi URL dài quá 6500 ký tự; payload
       ngắn thì đi bằng JSONP (GET) và nhánh doGet của Code.gs không đọc tham số
       "other" ⇒ email gửi đi mất hẳn mục Công việc khác dù bản xem trước vẫn hiện.
       Nay ép đúng một đường truyền; Code.gs v6.8 đọc tham số "other" và dựng
       mục ② / ④ Other tasks cho cả email lẫn PDF. */
    var op=rpOtherPayload(), cnt=0;
    Object.keys(op).forEach(function(k){
      (op[k].cur||[]).forEach(function(g){ cnt+=1+((g.subs||[]).length); }); });
    S._rpLastOther=cnt;
    send=postBody({ action:"weeklyReport", from:S.rpFrom, to:S.rpTo, option:option, toPic:who,
      other:JSON.stringify(op), otherCount:String(cnt) });
  } else {
    send=apiPost({ action:"monthlyReport", month:S.rpMonth, option:option, toPic:who });
  }
  send.then(function(r){
    busy(false);
    if(r.download&&r.files){ r.files.forEach(function(f){ dlB64(f.b64,f.name); }); toast(r.message||"Đã tạo PDF","ok",4200); return; }
    if(r.opaque){ toast("Đã gửi yêu cầu tới máy chủ (kèm "+(S._rpLastOther||0)+" mục Công việc khác). Kiểm tra hộp thư trong ~1 phút.","ok",5500); return; }
    toast(r.message||"Đã gửi báo cáo","ok",5000);
    /* backend bản mới trả về otherCount — bản cũ thì không, báo ngay cho người gửi biết */
    if(kind==="week" && S._rpLastOther>0 && r.otherCount==null)
      toast("⚠️ Đã gửi kèm "+S._rpLastOther+" mục Công việc khác nhưng Code.gs chưa xác nhận. "+
            "Nếu email thiếu mục ③ Other tasks, cần cập nhật Code.gs (xem hướng dẫn trong trang Gửi báo cáo).","warn",11000);
  }).catch(function(e){ busy(false); toast(e.message,"err",6500); });
}
function dlB64(b64,name){
  var bin=atob(b64), len=bin.length, arr=new Uint8Array(len);
  for(var i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  var url=URL.createObjectURL(new Blob([arr],{type:"application/pdf"}));
  var a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1200);
}

</script>

<script>

/* ═══════════════════════════════════════════════════════════════════
   ⭐ v2 — BIỂU ĐỒ SVG (thay Chart.js)
   Bỏ hẳn CDN 210KB ⇒ app mở nhanh hơn hẳn, không phụ thuộc mạng ngoài.
   ═══════════════════════════════════════════════════════════════════ */
var PAL2=["#3A5CAA","#5B8DD9","#1E9E5A","#E8A302","#B44FA6","#0E9AA7","#D9433F","#7A6BC4","#8FBF4D","#C77DFF","#E07B39","#4B7A8C"];
function palAt(i){ return PAL2[i%PAL2.length]; }

/* Donut + chú giải */
function svgDonut(entries,center,sub,fmt){
  var list=(entries||[]).filter(function(e){return n(e[1])>0;});
  var total=list.reduce(function(a,e){return a+n(e[1]);},0);
  if(!total) return '<div class="empty" style="padding:24px 0"><p style="font-size:12.5px">Chưa có dữ liệu</p></div>';
  var R=54,SW=22,C=2*Math.PI*R,off=0,GAP=list.length>1?3:0;
  var segs=list.map(function(e,i){
    var col=e[2]||palAt(i), frac=n(e[1])/total, len=Math.max(1,frac*C-GAP);
    var s='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+col+'" stroke-width="'+SW+'" stroke-linecap="butt" '
      +'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" '
      +'transform="rotate(-90 70 70)"><title>'+esc(e[0])+': '+(fmt==="vnd"?fmtVND(e[1]):fmtN(e[1]))+' ('+Math.round(frac*100)+'%)</title></circle>';
    off+=frac*C; return s;
  }).join("");
  var lg=list.map(function(e,i){
    return '<div class="dlg-i"><span class="d" style="background:'+(e[2]||palAt(i))+'"></span>'
      +'<span class="nm" title="'+esc(e[0])+'">'+esc(e[0])+'</span>'
      +'<span class="vl">'+(fmt==="vnd"?fmtVND(e[1]):fmtN(e[1]))+' <small>· '+Math.round(n(e[1])/total*100)+'%</small></span></div>';
  }).join("");
  return '<div class="donut"><div class="donut-svg" style="width:140px;height:140px">'
    +'<svg viewBox="0 0 140 140" width="140" height="140"><circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#EEF3FA" stroke-width="'+SW+'"/>'+segs+'</svg>'
    +'<div class="donut-c"><b>'+esc(center)+'</b><span>'+esc(sub||"")+'</span></div></div>'
    +'<div class="dlg">'+lg+'</div></div>';
}

/* Cột / đường theo tháng — 1 hoặc nhiều chuỗi */
function svgSeries(labels,series,fmt,type){
  var W=560,H=176,PL=46,PR=8,PT=12,PB=26;
  var iw=W-PL-PR, ih=H-PT-PB;
  var all=[]; series.forEach(function(s){ (s.data||[]).forEach(function(v){ all.push(n(v)); }); });
  var mx=Math.max.apply(null,all.concat([1]));
  var step=Math.pow(10,Math.floor(Math.log(mx)/Math.LN10)), top=Math.ceil(mx/step)*step||1;
  var y=function(v){ return PT+ih-(n(v)/top)*ih; };
  var g="";
  for(var i=0;i<=4;i++){
    var yy=PT+ih*i/4, val=top*(1-i/4);
    g+='<line class="gl" x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'"/>'
      +'<text class="ax" x="'+(PL-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+(fmt==="vnd"?fmtVND(val):fmtN(Math.round(val)))+'</text>';
  }
  var nb=labels.length||1, bw=iw/nb;
  labels.forEach(function(lb,i){
    if(nb>13 && i%2) return;
    g+='<text class="ax" x="'+(PL+bw*(i+0.5)).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(lb)+'</text>';
  });
  if(type==="line"){
    series.forEach(function(s,si){
      var col=s.color||palAt(si), pts=[],ar=[];
      (s.data||[]).forEach(function(v,i){ var px=PL+bw*(i+0.5), py=y(v); pts.push(px.toFixed(1)+","+py.toFixed(1)); });
      if(!pts.length) return;
      ar=[PL+bw*0.5+",("+0+")"];
      g+='<polyline fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="'+pts.join(" ")+'"/>';
      g+='<polygon fill="'+col+'" opacity=".10" points="'+(PL+bw*0.5).toFixed(1)+','+(PT+ih)+' '+pts.join(" ")+' '+(PL+bw*(nb-0.5)).toFixed(1)+','+(PT+ih)+'"/>';
      (s.data||[]).forEach(function(v,i){
        var px=PL+bw*(i+0.5), py=y(v);
        g+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3.2" fill="#fff" stroke="'+col+'" stroke-width="2">'
          +'<title>'+esc(labels[i]||"")+': '+(fmt==="vnd"?fmtVND(v):fmtN(v))+'</title></circle>';
      });
    });
  } else {
    var ns=series.length, gap=Math.min(6,bw*0.14), w1=(bw-gap*2)/ns;
    series.forEach(function(s,si){
      var col=s.color||palAt(si);
      (s.data||[]).forEach(function(v,i){
        var hh=Math.max(0,(PT+ih)-y(v)), px=PL+bw*i+gap+w1*si;
        g+='<rect class="bar" x="'+px.toFixed(1)+'" y="'+y(v).toFixed(1)+'" width="'+Math.max(1,w1-1.5).toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="3" fill="'+col+'">'
          +'<title>'+esc(labels[i]||"")+' · '+esc(s.name||"")+': '+(fmt==="vnd"?fmtVND(v):fmtN(v))+'</title></rect>';
      });
    });
  }
  var lgd=series.length>1?'<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;justify-content:center">'
    +series.map(function(s,si){ return '<span style="display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--sub)">'
      +'<i style="width:9px;height:9px;border-radius:3px;background:'+(s.color||palAt(si))+';display:inline-block"></i>'+esc(s.name||"")+'</span>'; }).join("")+'</div>':"";
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+g+'</svg>'+lgd;
}

/* Cột ngang xếp hạng */
function svgHBars(entries,fmt,colorFn){
  if(!entries||!entries.length) return '<div class="empty" style="padding:18px 0"><p style="font-size:12.5px">Chưa có dữ liệu</p></div>';
  var mx=Math.max.apply(null,entries.map(function(e){return n(e[1]);}).concat([1]));
  var tot=entries.reduce(function(a,e){return a+n(e[1]);},0)||1;
  return '<div class="hbars">'+entries.map(function(e,i){
    var col=colorFn?colorFn(e[0],i):palAt(i);
    return '<div><div class="hbar-t"><span class="n" title="'+esc(e[0])+'">'+esc(e[0])+'</span>'
      +'<span class="v" style="color:'+col+'">'+(fmt==="vnd"?fmtVND(e[1]):fmtN(e[1]))
      +' <small style="color:var(--mute);font-weight:600">· '+Math.round(n(e[1])/tot*100)+'%</small></span></div>'
      +'<div class="hbar-tr"><div class="hbar-f" style="width:'+Math.round(n(e[1])/mx*100)+'%;background:'+col+'"></div></div></div>';
  }).join("")+'</div>';
}
function toEntries(arr){ return (arr||[]).map(function(x){ return [x.k||"(khác)", n(x.v)]; }); }

/* Màu ổn định theo tên (avatar, PIC…) */
function avColor(name){
  var s=String(name||""),h=0;
  for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return PAL2[h%PAL2.length];
}

/* ═══════════════ SKELETON ═══════════════ */
function skRows(nn,head){
  var h='<div class="card" style="overflow:hidden">'+(head?'<div style="padding:13px 15px;border-bottom:1px solid var(--line2)"><div class="sk t" style="width:38%"></div></div>':"");
  for(var i=0;i<(nn||6);i++) h+='<div class="sk-row"><div class="sk-av"></div><div style="flex:1"><div class="sk t" style="width:'+(45+(i*7)%38)+'%;margin-bottom:7px"></div><div class="sk" style="width:'+(24+(i*11)%30)+'%"></div></div></div>';
  return h+'</div>';
}
function skDash(){
  return '<div class="pg"><div class="ph"><div><div class="sk t" style="width:190px;margin-bottom:8px"></div><div class="sk" style="width:260px"></div></div></div>'
    +'<div class="grid g4" style="margin-bottom:14px">'+Array(4).join()+[0,1,2,3].map(function(){return '<div class="card pad"><div class="sk" style="width:52%;margin-bottom:11px"></div><div class="sk b" style="width:72%;margin-bottom:10px"></div><div class="sk" style="width:100%"></div></div>';}).join("")+'</div>'
    +'<div class="grid g2" style="margin-bottom:14px">'+[0,1].map(function(){return '<div class="card pad"><div class="sk" style="width:40%;margin-bottom:14px"></div><div class="sk xl" style="height:150px"></div></div>';}).join("")+'</div>'
    +'<div class="grid g3">'+[0,1,2].map(function(){return '<div class="card pad"><div class="sk" style="width:46%;margin-bottom:14px"></div><div class="sk xl" style="height:130px"></div></div>';}).join("")+'</div></div>';
}
function staleBadge(){ return '<span class="stale"><span class="dot"></span>Đang cập nhật dữ liệu mới…</span>'; }

/* ⭐ v2: đăng ký object để gọi từ onclick — tránh hỏng thuộc tính HTML
   khi tên khách hàng có dấu nháy, ngoặc kép hoặc ký tự lạ. */
var REG={}, _rgn=0;
function reg(v){ var k="r"+(++_rgn); REG[k]=v; return k; }
function rWeekly(k){ formWeekly(REG[k]||null); }
function rWeeklyFor(k){ formWeekly(null, REG[k]||""); }
function rCustomer(k){ formCustomer(REG[k]||null); }
function rADP(k){ formADP(REG[k]||null); }
function rOrder(k){ formOrder(REG[k]||null); }
function rMonthly(k){ formMonthly(REG[k]||null); }
function rPresent(k){ formPresent(REG[k]||null); }
function rVisit(k){ openVisit(REG[k]||null); }
function rAcc(k){ var a=REG[k]||{}; openAcc(a.code||"", a.name||""); }

/* ═══════════════ DRAWER (màn hình phụ) ═══════════════ */
function openDrw(head,tabs,body,foot){
  $("drwHead").innerHTML=head||"";
  $("drwTabs").innerHTML=tabs||"";
  $("drwTabs").style.display=tabs?"":"none";
  $("drwBody").innerHTML=body||"";
  $("drwFoot").innerHTML=foot||"";
  $("drwFoot").style.display=foot?"":"none";
  $("drw").classList.add("on");
  $("drwBody").scrollTop=0;
}
function closeDrw(){ $("drw").classList.remove("on"); S.drw=null; S.accEdit=false;
  if(typeof stopVoice==="function") stopVoice();
  S.task=null; S.taskRow=0; S.pending=null; S.dirty={}; S._delArmed=false; }
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if($("lb").classList.contains("on")) closeLb();
  else if($("drw").classList.contains("on")) closeDrw();
});

/* ═══════════════ LIGHTBOX ẢNH ═══════════════ */
var LB={list:[],i:0};
function openLb(list,i){
  if(!list||!list.length) return;
  LB.list=list; LB.i=i||0;
  $("lb").classList.add("on"); lbShow();
}
function lbShow(){
  var p=LB.list[LB.i]||{};
  $("lbImg").src=p.full||p.thumb||p.open||"";
  $("lbTi").textContent=(LB.i+1)+" / "+LB.list.length+(p.date?("  ·  "+fmtVN(p.date)):"");
  $("lbCap").textContent=[p.pic?("PIC "+p.pic):"",p.note||""].filter(Boolean).join(" — ");
  var multi=LB.list.length>1;
  document.querySelectorAll("#lb .nv").forEach(function(el){ el.style.display=multi?"":"none"; });
}
function lbGo(k){ if(!LB.list.length) return; LB.i=(LB.i+k+LB.list.length)%LB.list.length; lbShow(); }
function lbOpenNew(){ var p=LB.list[LB.i]; if(p&&(p.open||p.full)) window.open(p.open||p.full,"_blank"); }
function closeLb(){ $("lb").classList.remove("on"); $("lbImg").src=""; }
document.addEventListener("keydown",function(e){
  if(!$("lb").classList.contains("on")) return;
  if(e.key==="ArrowLeft") lbGo(-1);
  if(e.key==="ArrowRight") lbGo(1);
});
/* Đăng ký 1 bộ ảnh để mở bằng onclick trong HTML sinh động */
var PHSETS={}, _phn=0;
function phSet(list){ var k="p"+(++_phn); PHSETS[k]=list||[]; return k; }
function phOpen(k,i){ openLb(PHSETS[k]||[],i); }
function thumbStrip(photos,max){
  if(!photos||!photos.length) return "";
  var k=phSet(photos), m=max||5;
  var h='<div class="thumbs">'+photos.slice(0,m).map(function(p,i){
    return '<div class="ph" onclick="event.stopPropagation();phOpen(\''+k+'\','+i+')"><img loading="lazy" src="'+esc(p.thumb||p.full)+'" alt=""></div>';
  }).join("");
  if(photos.length>m) h+='<div class="more" onclick="event.stopPropagation();phOpen(\''+k+'\','+m+')">+'+(photos.length-m)+'</div>';
  return h+'</div>';
}
function galleryHtml(photos){
  if(!photos||!photos.length) return '<div class="empty"><div class="e">📷</div><p>Chưa có ảnh nào</p></div>';
  var k=phSet(photos.map(function(x){ return Object.assign({},x.src||x,{date:x.date,pic:x.pic,note:x.note}); }));
  return '<div class="gal">'+photos.map(function(x,i){
    var s=x.src||x;
    return '<div class="ph" onclick="phOpen(\''+k+'\','+i+')"><img loading="lazy" src="'+esc(s.thumb||s.full)+'" alt="">'
      +(x.date?'<div class="cap">'+esc(fmtVN(x.date))+'</div>':"")+'</div>';
  }).join("")+'</div>';
}

/* ═══════════════ ACCOUNT 360 — màn hình phụ khách hàng ═══════════════ */
var TLMETA={
  order  :{ic:"🧾",lb:"Đơn hàng"},
  visit  :{ic:"📍",lb:"Đi địa bàn"},
  present:{ic:"🎤",lb:"Thuyết trình"},
  adp    :{ic:"⭐",lb:"ADP"}
};
function openAcc(code,name){
  S.drw={kind:"acc",tab:"tl"};
  openDrw('<div class="top"><div class="av">'+esc(initials(name||code))+'</div><div style="min-width:0;flex:1">'
    +'<h2>'+esc(name||code)+'</h2><div class="meta">Đang tải hồ sơ…</div></div></div>'
    +'<button class="x" onclick="closeDrw()">✕</button>','',
    skRows(5,true),'');
  var _ak=(code||"")+"|"+(name||"");
  S.acc360=S.acc360||{};

/* ⭐ v4.3 — dựng hồ sơ 360 ngay từ dữ liệu đã có trên máy (hiện tức thì),
   bản đầy đủ từ Google Sheet về sau sẽ ghi đè. */
function acc360Local(code,name){
  var cus=(S.custIndex||[]).filter(function(c){
    return (code&&c.code===code) || (!code&&name&&c.name===name) || (name&&c.name===name);
  })[0];
  if(!cus) return null;
  var nm=cus.name, cd=cus.code;
  var low=String(nm||"").trim().toLowerCase();
  function accIs(v){ return String(parseAcc(v).name||"").trim().toLowerCase()===low; }
  var weekly=terrRows().filter(function(w){ return accIs(w.account); });
  var orders=(tGet("order")||[]).filter(function(o){ return (cd&&o.code===cd)||(nm&&o.name===nm); });
  var present=(tGet("present")||[]).filter(function(r){ return accIs(r.account); });
  var adp=(tGet("adp")||[]).filter(function(r){ return accIs(r.account); });
  var cbc=(S.cbcRows||[]).filter(function(r){ return (cd&&r.code===cd)||accIs(r.name); });

  var tl=[];
  orders.forEach(function(o){
    tl.push({kind:"order",date:String(o.day||"").slice(0,10)||ymIso(o.month),title:"Đơn hàng "+(o.orderNo||""),
      pic:o.pic,amount:n(o.amount),qty:n(o.qty),product:o.ptype||o.detail,channel:o.channel,row:o._row,
      detail:[o.detail,n(o.qty)?("SL "+n(o.qty)):""].filter(String).join(" · ")});
  });
  weekly.forEach(function(w){
    tl.push({kind:"visit",date:String(w.start).slice(0,10),title:w.typeAction||"Đi địa bàn",pic:w.pic,
      typeTask:w.typeTask,process:w.process,status:w.status,feedback:w.feedback,product:w.product,
      photos:w.photos||[],row:w._row,plan:w.plan,result:w.result,next:w.nextAction,
      detail:w.result||w.plan});
  });
  present.forEach(function(pr){
    tl.push({kind:"present",date:String(pr.day||"").slice(0,10)||ymIso(pr.month),title:"Thuyết trình sản phẩm",
      pic:pr.pic,target:n(pr.target),actual:n(pr.actual),link:pr.folder,row:pr._row,detail:pr.review});
  });
  adp.forEach(function(a){
    tl.push({kind:"adp",date:"",title:"ADP — "+(a.abcd||"Key account"),pic:a.pic,row:a._row,detail:a.objective});
  });
  tl.sort(function(a,b){ return String(b.date||"").localeCompare(String(a.date||"")); });

  var totalAmt=0,byMonth={},byProd={};
  orders.forEach(function(o){ var a=n(o.amount); totalAmt+=a;
    var mm=String(o.month||""); if(mm) byMonth[mm]=(byMonth[mm]||0)+a;
    var pd=o.ptype||o.detail||"(khác)"; byProd[pd]=(byProd[pd]||0)+a; });
  var lastVisit="",lastOrder="";
  weekly.forEach(function(w){ var d=String(w.start).slice(0,10); if(d>lastVisit) lastVisit=d; });
  orders.forEach(function(o){ var d=String(o.day||"").slice(0,10)||ymIso(o.month); if(d>lastOrder) lastOrder=d; });
  var photos=[];
  weekly.forEach(function(w){ (w.photos||[]).forEach(function(ph){
    photos.push({src:ph,date:String(w.start).slice(0,10),pic:w.pic,note:w.result||w.plan,row:w._row}); }); });
  photos.sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); });

  return { ok:true, _local:true,
    customer:{ _row:cus._row,code:cd,name:nm,type:cus.type,province:cus.province,area:cus.area,
               pic:cus.pic,fy:cus.fy,openDate:cus.openDate,note:cus.note,address:"" },
    cbc:cbc, orders:orders, weekly:weekly, present:present, adp:adp,
    timeline:tl.slice(0,300), photos:photos.slice(0,60),
    stats:{ totalAmount:totalAmt, orderCount:orders.length, visitCount:weekly.length,
            presentCount:present.length, cbcCount:cbc.length,
            lastVisit:lastVisit, lastOrder:lastOrder, byMonth:byMonth, byProduct:byProd,
            daysSinceVisit: lastVisit?Math.floor((new Date(todayISO())-new Date(lastVisit))/86400000):-1 } };
}
function ymIso(ym){ var m=/^(\d{4})(\d{2})$/.exec(String(ym||"").replace(/\D/g,"")); return m?(m[1]+"-"+m[2]+"-01"):""; }

/* ⭐ v5 — dải 12 tháng của 1 bản ADP (Sep → Aug) */
var ADP_MONTH_FIELDS=[["m09","T9"],["m10","T10"],["m11","T11"],["m12","T12"],["m01","T1"],["m02","T2"],
                      ["m03","T3"],["m04","T4"],["m05","T5"],["m06","T6"],["m07","T7"],["m08","T8"]];
function adpMonthStrip(a){
  var vals=ADP_MONTH_FIELDS.map(function(x){ return n(a[x[0]]); });
  var mx=Math.max.apply(null,vals.concat([0]))||1;
  if(!vals.some(function(v){return v;})) return '<span style="color:var(--mute)">Chưa có số theo tháng</span>';
  return '<div class="adpms">'+ADP_MONTH_FIELDS.map(function(x,i){
    var v=vals[i], h=v?Math.max(6,Math.round(v/mx*44)):2;
    return '<div class="adpms-i" title="'+esc(x[1])+': '+fmtVND(v)+'">'+
      '<i style="height:'+h+'px;background:'+(v?"var(--blue)":"var(--line2)")+'"></i><span>'+x[1]+'</span></div>';
  }).join("")+'</div>';
}
