  if(MT.dirty[id] && confirm("Biên bản của "+MT.pic+" còn nội dung chưa lưu. Lưu trước rồi soạn email?")) return mtSave(mtMailOpen);
  var wk=MT.week, ids=(MT.list||[]).filter(function(x){ return x.week===wk; }).map(function(x){ return x.id; });
  if(!ids.length) return toast("Tuần "+mtRange(wk)+" chưa có biên bản nào được lưu — lưu biên bản trước khi gửi email","warn",6000);
  busy(true,"Đang gom biên bản của tuần…");
  mtLoadList().then(function(){
    ids=(MT.list||[]).filter(function(x){ return x.week===wk; }).map(function(x){ return x.id; });
    return Promise.all(ids.map(function(i){
      var it=mtListItem(i), have=MT.rec[i];
      return mtGetRec(i,!(have&&it&&have.updatedAt===it.updatedAt)).catch(function(){ return have||null; });
    }));
  }).then(function(recs){
    recs=recs.filter(Boolean);
    var prev={};
    return Promise.all(recs.map(function(r){
      var pid=(mtPrevList(r.pic,r.week)[0]||{}).id; if(!pid) return null;
      return mtGetRec(pid).then(function(pr){ prev[r.id]=pr; }).catch(function(){ return null; });
    })).then(function(){ return { recs:recs, prev:prev }; });
  }).then(function(R){
    busy(false);
    var recs=R.recs.sort(function(a,b){ return String(a.pic).localeCompare(String(b.pic)); });
    S._mtMail={ wk:wk, recs:recs, prev:R.prev };
    var nPrev=Object.keys(R.prev).length;
    var me=(ROLES[S.user.pic]||{}).email||"";
    var cc=[{e:"mmh.product@manimedicalhanoi.com",n:"Giang",d:"Product Team Leader",on:1}].concat(teamPicNames("surgical").map(function(p){ return {e:(ROLES[p]||{}).email,n:p,d:(ROLES[p]||{}).title,on:0}; }))
      .concat([{e:"vtt.hoa@manimedicalhanoi.com",n:"Hoa",d:"Human Resources",on:0}]).filter(function(x){ return x.e; });
    var chk=function(list,grp){ return '<div class="mt-rc">'+list.map(function(x,i){
      return '<label><input type="checkbox" data-g="'+grp+'" value="'+esc(x.e)+'"'+(x.on?" checked":"")+'><b>'+esc(x.n)+'</b> <small>'+esc(x.e)+' · '+esc(x.d||"")+'</small></label>'; }).join("")+'</div>'; };
    var h='<div class="fld"><label>Gửi tới (To)</label>'+chk(MT_MAIL_TO,"to")+'</div>'+
      '<div class="fld"><label>Đồng gửi (CC)</label>'+chk(cc,"cc")+
        '<input class="inp" id="mm_more" style="margin-top:6px" placeholder="Email khác @manimedicalhanoi.com (ngăn bằng dấu phẩy) — thêm vào CC"></div>'+
      '<div class="fld"><label>Tiêu đề</label><input class="inp" id="mm_sub" value="'+esc("[MMH Surgical] Cập nhật hoạt động Surgical Team — "+mtWeekLabel(wk))+'"></div>'+
      '<div class="fld"><label>Biên bản đưa vào email</label><div class="mt-rc">'+recs.map(function(r){
        return '<label><input type="checkbox" data-g="rec" value="'+esc(r.id)+'" checked><b>'+esc(r.pic)+'</b> <small>lưu '+esc(r.updatedAt||"")+(r.emailedAt?" · đã gửi "+esc(r.emailedAt):"")+'</small></label>'; }).join("")+'</div></div>'+
      '<div class="fld"><label>Phần so sánh</label><div class="mt-rc"><label><input type="checkbox" id="mm_cmp"'+(nPrev&&MT.mode!=="cur"?" checked":"")+(nPrev?"":" disabled")+'>'+
        '<b>⇆ Kèm so sánh với tuần trước</b> <small>'+(nPrev?"thực hiện kế hoạch đã chốt, thay đổi forecast NPP, thay đổi gói thầu, follow-up tuần trước":"chưa có biên bản họp trước để so sánh")+'</small></label></div></div>'+
      '<div class="fld"><label>Nội dung cố định</label><div class="mt-calc" style="white-space:pre-wrap">'+esc(mtMailIntro(wk))+'</div></div>'+
      '<div class="fld"><label>Nội dung bổ sung (không bắt buộc)</label><textarea class="inp" id="mm_extra" style="min-height:90px" placeholder="Điểm nổi bật trong tuần, đề xuất cần anh/chị hỗ trợ…"></textarea></div>';
    openModal("✉ Email cập nhật Surgical Team — "+mtWeekLabel(wk),h,
      '<button class="btn" onclick="closeModal()">Huỷ</button><div style="flex:1"></div>'+
      '<button class="btn gho" onclick="mtMailPreview()">👁 Xem trước</button><button class="btn pri" onclick="mtMailSend()">✉ Gửi email</button>');
    if(!me) toast("Không tìm thấy email của "+S.user.pic+" — email vẫn gửi được nhưng không có Reply-to","warn");
  }).catch(function(e){ busy(false); toast(e.message,"err"); });
}
function mtMailIntro(wk){
  return "Kính gửi Anh/Chị,\n\nEm xin gửi cập nhật hoạt động của Surgical Sales Team "+mtWeekLabel(wk)+" ("+fmtVN(wk)+" – "+fmtVN(addDays(wk,6))+
    "), tổng hợp từ buổi họp tuần với từng PIC, gồm: ① forecast nhà phân phối, ② hoạt động đi địa bàn & kế hoạch tuần sau, ③ tình hình thầu, ④ các thông tin khác.";
}
function mtMailPick(){
  var g=function(k){ return [].slice.call($("mBody").querySelectorAll('input[data-g="'+k+'"]:checked')).map(function(x){ return x.value; }); };
  var more=String(($("mm_more")||{}).value||"").split(/[,;\s]+/).map(function(x){ return x.trim(); }).filter(Boolean);
  var bad=more.filter(function(x){ return !/^[^@\s]+@manimedicalhanoi\.com$/i.test(x); });
  var ids=g("rec"), recs=(S._mtMail.recs||[]).filter(function(r){ return ids.indexOf(r.id)>=0; });
  return { to:g("to"), cc:g("cc").concat(more.filter(function(x){ return bad.indexOf(x)<0; })), bad:bad, recs:recs, ids:ids,
           sub:$("mm_sub").value.trim(), extra:$("mm_extra").value.trim(), cmp:!!(($("mm_cmp")||{}).checked) };
}
function mtMailHtml(p){
  var wk=S._mtMail.wk, me=S.user.pic, meT=(ROLES[me]||{}).title||"";
  var ov='<table style="'+MTS.tb+'"><tr><th style="'+MTS.th+'">PIC</th><th style="'+MTS.th+'">NPP · tháng</th><th style="'+MTS.th+'text-align:right">A/F tháng (USD)</th><th style="'+MTS.th+'text-align:right">% tháng</th><th style="'+MTS.th+'text-align:right">% FY lũy kế</th><th style="'+MTS.th+'text-align:right">Địa bàn tuần này</th><th style="'+MTS.th+'text-align:right">KH tuần sau</th>'+(p.cmp?'<th style="'+MTS.th+'text-align:right">Thực hiện KH đã chốt</th>':"")+'<th style="'+MTS.th+'text-align:right">Thầu còn lại FY</th></tr>'+
    p.recs.map(function(r){ var s=r.snap||{}, V=s.visits||{}, N=s.npp, T=((s.tender||{}).sum||{}).all||{};
      var cur=V.cur||[], dn=cur.filter(function(v){ return /complet/i.test(v.st); }).length;
      return '<tr><td style="'+MTS.td+'"><b>'+esc(r.pic)+'</b></td>'+
        '<td style="'+MTS.td+'">'+(N?esc(N.name)+' · '+esc(mtYmLb(N.ym)):"—")+'</td><td style="'+MTS.tdr+'">'+(N?mtUsd(N.m.v)+' / '+mtUsd(N.m.bm):"—")+'</td><td style="'+MTS.tdr+'"><b>'+(N?mtPctTx(mtPct(N.m.v,N.m.bm)):"—")+'</b></td>'+
        '<td style="'+MTS.tdr+'"><b>'+(N?mtPctTx(mtPct(N.ytd.v,N.fy.bm)):"—")+'</b></td>'+
        '<td style="'+MTS.tdr+'">'+dn+'/'+cur.length+'</td><td style="'+MTS.tdr+'">'+((V.nxt||[]).length+(V.tbdNxt?1:0))+'</td>'+(p.cmp?'<td style="'+MTS.tdr+'">'+mtPlanTx(r,(S._mtMail.prev||{})[r.id])+'</td>':"")+
        '<td style="'+MTS.tdr+'">'+fmtVND(T.remain||0)+' <span style="'+MTS.mute+'">('+(T.n||0)+' gói)</span></td></tr>'; }).join("")+'</table>';
  return '<div style="'+MTS.f+'color:#1A1A1A;font-size:14px;line-height:1.55;max-width:880px">'+
    '<div style="border-left:6px solid #FFE100;background:#F0F7FF;padding:14px 18px;border-radius:0 10px 10px 0;margin-bottom:16px">'+
      '<div style="font-size:12px;font-weight:700;color:#3A5CAA;letter-spacing:.5px">MANI MEDICAL HANOI · SURGICAL SALES TEAM</div>'+
      '<div style="font-size:20px;font-weight:800;color:#003047;margin-top:2px">Cập nhật hoạt động — '+esc(mtWeekLabel(wk))+'</div>'+
      '<div style="font-size:13px;color:#666666">'+esc(fmtVN(wk))+' – '+esc(fmtVN(addDays(wk,6)))+'</div></div>'+
    '<div style="white-space:pre-wrap">'+esc(mtMailIntro(wk))+'</div>'+
    (p.extra?'<div style="'+MTS.note+'border-left-color:#FFE100;background:#FFF8E1"><b>Nội dung bổ sung</b><br>'+mtE(p.extra)+'</div>':"")+
    '<div style="'+MTS.h2+'">Tổng quan team</div>'+ov+
    p.recs.map(function(r,i){ return mtRecHtml(r,i+1,p.cmp?(S._mtMail.prev||{})[r.id]:null); }).join("")+
    '<div style="margin-top:22px">Trân trọng,<br><b>'+esc(me)+'</b>'+(meT?' — '+esc(meT):"")+'<br>MANI Medical Hanoi</div>'+
    '<div style="'+MTS.mute+'margin-top:16px;border-top:1px solid #D9D9D9;padding-top:8px">Email tạo từ MMH CRM · biên bản lưu tại sheet “13. WEEKLY MEETING” (file MMH_Surgical_CRM).</div></div>';
}
function mtPlanTx(r,prev){
  if(!prev||prev.week!==addDays(r.week,-7)) return '<span style="color:#8C8C8C">—</span>';
  var pv=(prev.snap||{}).visits||{}, pc=mtPlanChk(pv.nxt||[],pv.tbdNxt,((r.snap||{}).visits||{}).cur||[]);
  return pc.n?(pc.ok+'/'+pc.n+' <b style="color:'+pctColor(pc.rate)+'">('+Math.round(pc.rate*100)+'%)</b>'):'<span style="color:#8C8C8C">—</span>';
}
function mtMailPreview(){
  var p=mtMailPick(); if(!p.recs.length) return toast("Chọn ít nhất một biên bản","warn");
  var html=mtMailHtml(p);
  $("modal2").style.maxWidth="960px";
  openModal2("👁 Xem trước email","<div style=\"font-size:12.5px;color:var(--sub);margin-bottom:8px\"><b>Tiêu đề:</b> "+esc(p.sub)+"<br><b>To:</b> "+esc(p.to.join(", ")||"—")+(p.cc.length?"<br><b>CC:</b> "+esc(p.cc.join(", ")):"")+"</div>"+
    '<iframe id="mtPrev" style="width:100%;height:62vh;border:1px solid var(--line);border-radius:10px;background:#fff"></iframe>',
    '<button class="btn" onclick="$(\'modal2\').style.maxWidth=\'\';closeModal2()">Đóng</button>');
  var f=$("mtPrev"); if(f) f.srcdoc='<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:14px">'+html+'</body></html>';
}
function mtMailSend(){
  var p=mtMailPick();
  if(!p.to.length) return toast("Chọn ít nhất một người nhận (To)","warn");
  if(!p.recs.length) return toast("Chọn ít nhất một biên bản","warn");
  if(p.bad.length) return toast("Email không hợp lệ (chỉ nhận @manimedicalhanoi.com): "+p.bad.join(", "),"warn",6500);
  if(!confirm("Gửi email tới "+p.to.join(", ")+(p.cc.length?"\nCC: "+p.cc.join(", "):"")+"?")) return;
  busy(true,"Đang gửi email…");
  postBody({ action:"mtMail", by:S.user.pic, to:p.to, cc:p.cc, subject:p.sub, html:mtMailHtml(p), ids:p.ids,
             replyTo:(ROLES[S.user.pic]||{}).email||"", week:S._mtMail.wk }).then(function(r){
    busy(false); closeModal();
    toast(r&&r.opaque?"Đã gửi yêu cầu tới máy chủ — kiểm tra hộp thư trong ~1 phút":(r.message||"Đã gửi email"),"ok",6000);
    setTimeout(mtLoadList,r&&r.opaque?2500:300);
  }).catch(function(e){ busy(false); toast(e.message,"err",7000); });
}
</script>

</body>
</html>
