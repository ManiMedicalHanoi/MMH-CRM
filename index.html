<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#3A5CAA">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MMH CRM system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
/* ═══════════════ MMH DESIGN TOKENS ═══════════════ */
:root{
  --blue:#3A5CAA; --blue-d:#2F4C90; --blue-l:#7D97CE;
  --navy:#003047; --ink:#152238; --sub:#5F7292; --mute:#8A97B5;
  --yellow:#FFE100; --amber:#E8A302;
  --lb1:#C2D4F1; --lb2:#DCE7F8; --lb3:#CFE2F3; --pale:#F2F7FF; --paler:#F8FBFF;
  --bg:#F4F7FC; --card:#FFFFFF; --line:#E4EBF6; --line2:#EFF3FA;
  --ok:#1E9E5A; --ok-bg:#E8F7EF;
  --warn:#E08A00; --warn-bg:#FFF6E4;
  --dang:#D9433F; --dang-bg:#FDECEC;
  --info:#3A5CAA; --info-bg:#EDF3FE;
  --r-xl:20px; --r-lg:15px; --r-md:11px; --r-sm:8px;
  --sh-1:0 1px 2px rgba(21,34,56,.05),0 2px 8px rgba(58,92,170,.06);
  --sh-2:0 4px 18px rgba(58,92,170,.12);
  --sh-3:0 12px 44px rgba(21,34,56,.18);
  --hdr:60px; --nav:62px; --sb:236px;
  --safe:env(safe-area-inset-bottom,0px);
  --font:Aptos,'Be Vietnam Pro','Segoe UI',Calibri,system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#C9D6EC;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

/* ═══════════════ SHELL ═══════════════ */
#loader{position:fixed;inset:0;background:linear-gradient(160deg,#EDF3FE,#F8FBFF 60%,#FFFDF0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:900}
#loader .mark{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--blue),#5B7BC4);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:var(--sh-2)}
.spin{width:30px;height:30px;border:3px solid var(--lb1);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldtxt{color:var(--sub);font-size:13px;font-weight:500}

#login{position:fixed;inset:0;background:linear-gradient(165deg,#EDF3FE 0%,#F8FBFF 55%,#FFFCEB 100%);z-index:880;display:none;overflow:auto;padding:28px 18px 40px}
#login.on{display:block}
.lgwrap{max-width:520px;margin:0 auto}
.lghead{text-align:center;margin:18px 0 26px}
.lghead .mark{width:64px;height:64px;border-radius:19px;background:linear-gradient(135deg,var(--blue),#6E8CD0);color:#fff;display:grid;place-items:center;font-weight:800;font-size:23px;margin:0 auto 14px;box-shadow:var(--sh-2)}
.lghead h1{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.lghead p{color:var(--sub);font-size:13.5px;margin-top:5px}
.lglab{font-size:12px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:0 4px 10px}
.picgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.piccard{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-lg);padding:14px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:.16s;box-shadow:var(--sh-1)}
.piccard:hover{border-color:var(--blue-l);transform:translateY(-2px);box-shadow:var(--sh-2)}
.piccard .av{width:38px;height:38px;border-radius:11px;background:var(--lb2);color:var(--blue-d);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.piccard.mg .av{background:linear-gradient(135deg,var(--blue),#6E8CD0);color:#fff}
.piccard b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.piccard span{display:block;font-size:11px;color:var(--mute);margin-top:1px}

#app{display:none;height:100%;flex-direction:column}
#app.on{display:flex}

header{height:var(--hdr);flex:none;background:linear-gradient(105deg,var(--blue) 0%,#5273BE 100%);color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 2px 12px rgba(58,92,170,.28);z-index:40;position:relative}
header .brand{display:flex;align-items:center;gap:9px;min-width:0}
header .bm{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;border:1px solid rgba(255,255,255,.25)}
header .bt{font-weight:800;font-size:15px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .bs{font-size:10.5px;opacity:.82;font-weight:500;margin-top:-2px}
header .sp{flex:1}
.hbtn{height:34px;min-width:34px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:.15s}
.hbtn:hover{background:rgba(255,255,255,.26)}
.hbtn.sel{background:#fff;color:var(--blue-d);border-color:#fff}
#fySel{appearance:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;height:34px;border-radius:9px;padding:0 26px 0 10px;font-weight:700;font-size:12.5px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 4px center;background-size:16px}
#fySel option{color:#152238}

.body{flex:1;display:flex;min-height:0}
aside{width:var(--sb);flex:none;background:var(--card);border-right:1px solid var(--line);padding:12px 10px;overflow:auto;display:flex;flex-direction:column;gap:2px}
aside .grp{font-size:10.5px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.7px;padding:14px 10px 6px}
.nvi{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;cursor:pointer;color:var(--sub);font-weight:600;font-size:13.5px;transition:.14s;border:none;background:none;width:100%;text-align:left}
.nvi:hover{background:var(--pale);color:var(--blue-d)}
.nvi.on{background:linear-gradient(100deg,var(--lb2),var(--pale));color:var(--blue-d);font-weight:700;box-shadow:inset 3px 0 0 var(--blue)}
.nvi .ic{font-size:16px;width:20px;text-align:center;flex:none}
.nvi .bdg{margin-left:auto;background:var(--lb3);color:var(--blue-d);font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:8px}

main{flex:1;overflow:auto;padding:16px 18px 34px;min-width:0;scroll-behavior:smooth}
nav.mob{display:none}

/* ═══════════════ PRIMITIVES ═══════════════ */
.pg{max-width:1400px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph h2{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
.ph p{font-size:12.5px;color:var(--sub);margin-top:2px}
.ph .sp{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.card.pad{padding:15px 16px}
.ct{font-size:13.5px;font-weight:800;color:var(--navy);display:flex;align-items:center;gap:8px;margin-bottom:11px}
.ct .dot{width:4px;height:15px;border-radius:3px;background:var(--blue);flex:none}
.ct .sp{flex:1}
.ct small{font-weight:500;color:var(--mute);font-size:11.5px}

.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)} .g6{grid-template-columns:repeat(6,1fr)}
.gauto{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}

.btn{height:38px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:650;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--blue-l);background:var(--paler)}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(100deg,var(--blue),#5B7BC4);border-color:transparent;color:#fff;box-shadow:0 2px 10px rgba(58,92,170,.3)}
.btn.pri:hover{background:linear-gradient(100deg,var(--blue-d),#4F6FB8)}
.btn.acc{background:var(--yellow);border-color:#E8CF00;color:#4A3B00;font-weight:750}
.btn.gho{background:var(--pale);border-color:transparent;color:var(--blue-d)}
.btn.dg{background:var(--dang-bg);border-color:#F6C9C7;color:#A82F2C}
.btn.sm{height:31px;padding:0 11px;font-size:12px;border-radius:8px}
.btn.xs{height:26px;padding:0 9px;font-size:11.5px;border-radius:7px}
.btn.blk{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:5px;letter-spacing:.2px}
.fld label .rq{color:var(--dang)}
.inp,select.inp,textarea.inp{width:100%;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--paler);transition:.15s;font-size:14px}
textarea.inp{height:auto;min-height:82px;padding:10px 12px;resize:vertical;line-height:1.55}
.inp:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(58,92,170,.12)}
select.inp{appearance:none;cursor:pointer;padding-right:32px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235F7292'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 7px center;background-size:18px}
.hint{font-size:11px;color:var(--mute);margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:150px}

.chip{display:inline-flex;align-items:center;gap:5px;height:29px;padding:0 11px;border-radius:9px;background:var(--pale);border:1px solid var(--line);color:var(--sub);font-size:12.5px;font-weight:650;cursor:pointer;transition:.14s;white-space:nowrap}
.chip:hover{border-color:var(--blue-l)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chipbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}
.chipbar::-webkit-scrollbar{display:none}

.tag{display:inline-block;padding:2px 8px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}
.t-b{background:var(--info-bg);color:var(--blue-d)}
.t-g{background:var(--ok-bg);color:#15703F}
.t-y{background:var(--warn-bg);color:#8A5A00}
.t-r{background:var(--dang-bg);color:#A82F2C}
.t-n{background:#EFF2F7;color:var(--sub)}

table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{background:var(--lb3);color:var(--navy);font-weight:750;font-size:11.5px;text-align:left;padding:9px 10px;position:sticky;top:0;z-index:2;white-space:nowrap}
table.tb th:first-child{border-radius:8px 0 0 0}
table.tb th:last-child{border-radius:0 8px 0 0}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.tb tbody tr:hover td{background:var(--paler)}
table.tb tbody tr.sel td{background:var(--pale)}
.tbwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);max-height:70vh}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctr{text-align:center}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;box-shadow:var(--sh-1);position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:var(--pale);opacity:.75}
.kpi .lb{font-size:11px;font-weight:750;color:var(--blue);text-transform:uppercase;letter-spacing:.5px;position:relative}
.kpi .vl{font-size:25px;font-weight:800;color:var(--navy);line-height:1.15;margin:4px 0 3px;letter-spacing:-.6px;position:relative}
.kpi .sb{font-size:11.5px;color:var(--sub);position:relative}
.kpi .sb b{color:var(--ink)}

.pb{height:7px;border-radius:5px;background:#E7EDF8;overflow:hidden;margin-top:7px;position:relative}
.pb i{display:block;height:100%;border-radius:5px;transition:width .5s}
.pbl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;margin-top:4px;color:var(--sub)}

.empty{text-align:center;padding:38px 16px;color:var(--mute)}
.empty .e{font-size:32px;margin-bottom:8px;opacity:.65}
.empty p{font-size:13px}

/* modal */
/* ⭐ v5.2 — modal phải nằm TRÊN drawer hồ sơ khách hàng (z-index 840),
   nếu không thì "Thêm CBC / Thêm ADP / Ghi hoạt động" mở ra sẽ bị trang hồ sơ che mất. */
#ov{position:fixed;inset:0;background:rgba(12,24,45,.5);backdrop-filter:blur(3px);z-index:860;display:none;align-items:flex-end;justify-content:center;padding:0}
#ov.on{display:flex}
@media(min-width:721px){#ov{align-items:center;padding:22px}}
/* ⭐ v4.7 — LỚP 2: picker CBC nổi ĐÈ LÊN form nhập, form nhập không bị gỡ khỏi DOM */
#ov2{position:fixed;inset:0;background:rgba(12,24,45,.55);backdrop-filter:blur(3px);z-index:880;display:none;align-items:flex-end;justify-content:center;padding:0}
#ov2.on{display:flex}
@media(min-width:721px){#ov2{align-items:center;padding:22px}}
#modal2{max-width:620px}
.modal{background:var(--card);width:100%;max-width:760px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--sh-3);animation:up .24s cubic-bezier(.2,.9,.3,1)}
@media(min-width:721px){.modal{border-radius:var(--r-xl);max-height:88vh}}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
.modal.wide{max-width:1240px}
.modal.xwide{max-width:1440px}
.mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.mh h3{font-size:15.5px;font-weight:800;color:var(--navy);flex:1;letter-spacing:-.2px}
.mh .x{width:32px;height:32px;border-radius:9px;border:none;background:var(--pale);color:var(--sub);font-size:17px;cursor:pointer;flex:none}
.mh .x:hover{background:var(--lb2)}
.mb{padding:16px 18px;overflow:auto;flex:1}
.mf{padding:12px 18px calc(12px + var(--safe));border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex:none;background:var(--paler);border-radius:0 0 var(--r-xl) var(--r-xl);flex-wrap:wrap}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px + var(--safe));z-index:900;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(94vw,460px)}
@media(min-width:721px){#toast{bottom:22px}}
.tst{background:#182B4A;color:#fff;padding:10px 15px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:var(--sh-3);animation:up .2s;max-width:100%;display:flex;gap:8px;align-items:flex-start}
.tst.ok{background:#15703F}.tst.err{background:#A82F2C}.tst.warn{background:#8A5A00}

#busy{position:fixed;inset:0;background:rgba(244,247,252,.72);backdrop-filter:blur(2px);z-index:890;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#busy.on{display:flex}
#busy .t{font-size:13px;font-weight:650;color:var(--blue-d)}

/* search dropdown */
.sbox{position:relative}
.sres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-2);max-height:260px;overflow:auto;z-index:50;display:none}
.sres.on{display:block}
.sitem{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line2);font-size:13px}
.sitem:hover{background:var(--pale)}
.sitem b{display:block;font-weight:700;color:var(--ink)}
.sitem span{font-size:11.5px;color:var(--mute)}

/* photo */
.phgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:8px}
.phit{position:relative;aspect-ratio:1;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--line);background:var(--pale)}
.phit img{width:100%;height:100%;object-fit:cover;display:block}
.phit .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;border:none;background:rgba(216,60,55,.92);color:#fff;font-size:13px;cursor:pointer;line-height:1}
.phadd{aspect-ratio:1;border:2px dashed var(--lb1);border-radius:var(--r-md);background:var(--paler);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--blue);font-size:11px;font-weight:700}
.phadd:hover{border-color:var(--blue);background:var(--pale)}
.phadd .ic{font-size:21px}

.list{display:flex;flex-direction:column;gap:9px}
.li{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;box-shadow:var(--sh-1);cursor:pointer;transition:.14s}
.li:hover{border-color:var(--blue-l);box-shadow:var(--sh-2)}
.li .t1{display:flex;align-items:flex-start;gap:8px}
.li .t1 b{font-size:14px;font-weight:700;color:var(--ink);flex:1;line-height:1.35}
.li .m{font-size:11.5px;color:var(--mute);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.li .d{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.li.acc{border-left:3px solid var(--blue)}

.sect{border-top:1px solid var(--line);margin:16px 0 12px;padding-top:13px}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.kv .k{width:150px;flex:none;color:var(--sub);font-weight:650;font-size:12px}
.kv .v{flex:1;word-break:break-word}

.mono{font-variant-numeric:tabular-nums}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide{display:none!important}
.cw{position:relative;height:250px}
.cw.sm{height:200px}
.cw.lg{height:310px}

/* ═══════════════ MOBILE ═══════════════ */
@media(max-width:720px){
  body{font-size:14px}
  aside{display:none}
  main{padding:12px 12px calc(var(--nav) + 26px + var(--safe))}
  nav.mob{display:flex;position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe));padding-bottom:var(--safe);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:120;box-shadow:0 -2px 16px rgba(21,34,56,.07);overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav.mob::-webkit-scrollbar{display:none}
  nav.mob button{flex:none;min-width:76px;padding-left:4px;padding-right:4px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mute);font-size:10px;font-weight:700;cursor:pointer;padding-top:6px}
  nav.mob button .ic{font-size:19px;line-height:1}
  nav.mob button.on{color:var(--blue)}
  nav.mob button.on .ic{transform:translateY(-1px)}
  .g2,.g3,.g4,.g6{grid-template-columns:1fr}
  .gauto{grid-template-columns:1fr}
  .g2.keep{grid-template-columns:repeat(2,1fr)}
  .ph h2{font-size:17px}
  .kpi .vl{font-size:22px}
  .row>*{min-width:100%}
  .mf{position:sticky;bottom:0}
  header .bs{display:none}
  .kv .k{width:112px}
}
@media(min-width:721px) and (max-width:1080px){
  :root{--sb:64px}
  aside{padding:12px 8px;align-items:center}
  aside .grp{display:none}
  .nvi{justify-content:center;padding:11px 0}
  .nvi span.lb,.nvi .bdg{display:none}
  .nvi .ic{font-size:18px}
}
.fab{position:fixed;right:16px;bottom:calc(var(--nav) + 18px + var(--safe));width:54px;height:54px;border-radius:17px;border:none;background:linear-gradient(135deg,var(--blue),#5B7BC4);color:#fff;font-size:23px;box-shadow:0 6px 22px rgba(58,92,170,.42);cursor:pointer;z-index:110;display:none}
@media(max-width:720px){.fab.on{display:grid;place-items:center}}
/* ══════════════════════════════════════════════════════════════════
   ⭐ v2 — SKELETON (thay vì màn hình chờ trắng + spinner chặn)
   ══════════════════════════════════════════════════════════════════ */
@keyframes shim{0%{background-position:-420px 0}100%{background-position:420px 0}}
.sk{background:linear-gradient(90deg,#EDF2FA 0%,#F7FAFF 45%,#EDF2FA 90%);background-size:420px 100%;animation:shim 1.15s linear infinite;border-radius:8px;height:13px}
.sk.t{height:19px}.sk.b{height:28px}.sk.xl{height:74px;border-radius:14px}
.sk-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2)}
.sk-av{width:36px;height:36px;border-radius:11px;flex:none;background:linear-gradient(90deg,#EDF2FA,#F7FAFF,#EDF2FA);background-size:420px 100%;animation:shim 1.15s linear infinite}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.stale{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--blue);background:var(--info-bg);border:1px solid var(--lb1);padding:3px 9px;border-radius:20px}
.stale .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

/* ══════════════ SVG CHARTS (bỏ Chart.js ⇒ tải nhanh hơn nhiều) ══════════════ */
.cwrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
/* ⭐ v5 — thanh nhóm thông tin trên Dashboard */
.dashg{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:13px;-webkit-overflow-scrolling:touch}
.dashg::-webkit-scrollbar{display:none}
.dashg button{flex:none;height:38px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.dashg button:hover{border-color:var(--blue-l);color:var(--blue-d)}
.dashg button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:var(--sh-1)}
.cbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 17px;box-shadow:var(--sh-1);min-width:0}
.cbox h4{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:3px;letter-spacing:-.1px}
.cbox .csub{font-size:11.5px;color:var(--mute);margin-bottom:12px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut-svg{position:relative;flex:none}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-c b{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.6px}
.donut-c span{font-size:10.5px;color:var(--mute);font-weight:600;margin-top:1px}
.dlg{flex:1;min-width:130px;display:flex;flex-direction:column;gap:6px}
.dlg-i{display:flex;align-items:center;gap:8px;font-size:12.5px}
.dlg-i .d{width:9px;height:9px;border-radius:3px;flex:none}
.dlg-i .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sub);font-weight:600}
.dlg-i .vl{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.dlg-i .vl small{color:var(--mute);font-weight:600}
.spark{width:100%;height:auto;display:block;overflow:visible}
.spark .gl{stroke:var(--line2);stroke-width:1}
.spark .ax{font-size:9px;fill:var(--mute);font-weight:600}
.spark .bar{transition:.4s}
.spark .bar:hover{opacity:.78}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar-t{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:4px;gap:8px}
.hbar-t .n{font-weight:600;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-t .v{font-weight:800;font-variant-numeric:tabular-nums;flex:none}
.hbar-tr{height:9px;border-radius:9px;background:var(--line2);overflow:hidden}
.hbar-f{height:100%;border-radius:9px;transition:width .55s cubic-bezier(.32,.72,0,1)}
/* ⭐ v11 — danh sách tìm tỉnh/thành cho dòng TBD */
.tbdlist{margin-top:7px;border:1px solid var(--line);border-radius:11px;max-height:186px;
  overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card)}
.tbdli{padding:10px 13px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;
  border-bottom:1px solid var(--line2)}
.tbdli:last-child{border-bottom:none}
.tbdli:active,.tbdli:hover{background:var(--pale);color:var(--blue-d)}
.tbdli.mute{color:var(--mute);font-weight:600;cursor:default;background:none}
/* ⭐ v9 — huy hiệu vượt kế hoạch, đặt ngay trên thanh tiến độ */
.xlnt-w{display:flex;margin-bottom:4px}
.xlnt{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:800;color:#0E7C43;
  background:#DFF6E8;border:1px solid #A9E3C2;border-radius:999px;padding:1px 7px;letter-spacing:.3px;white-space:nowrap;line-height:1.5}
.tag.pctt{border-style:solid;border-width:1px;font-weight:750}
/* ⭐ v9 — cột TIẾN ĐỘ dạng thanh kéo trong bảng Công việc khác */
.rh-pgc{vertical-align:middle}
.rh-pgl{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:3px;font-size:10.5px;color:var(--mute)}
.rh-pgl b{font-size:12px;font-variant-numeric:tabular-nums}
.rh-rgr{display:flex;align-items:center;gap:4px}
.rh-rgr input[type=range]{flex:1;min-width:56px}
.rh-rgr button{width:20px;height:20px;border:1px solid var(--line);background:var(--card);border-radius:6px;
  font-size:12px;line-height:1;cursor:pointer;color:var(--sub);flex:none;padding:0}
.rh-rgr button:hover{background:var(--pale);color:var(--blue-d)}
/* ⭐ v9 — ô Activities trong danh sách khách hàng */
.actc{display:flex;align-items:center;gap:9px}
.actc>b{font-size:16px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;min-width:20px}
.actc>b.z{color:var(--mute);font-size:14px}
.actc-n{font-size:10.5px;color:var(--mute);font-weight:600;margin-top:3px}
.actl{display:flex;flex-wrap:wrap;gap:4px}
.acti{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:750;border-radius:7px;
  padding:1px 6px;background:var(--line2);color:var(--sub);white-space:nowrap;line-height:1.6}
.acti.v{background:#E6EFFC;color:#2B4E97}
.acti.t{background:#E7F6EC;color:#1B7A45}
.acti.m{background:#F3EDFB;color:#6B4A9E}
.acti.e{background:#FFF3E0;color:#96590A}
.kpi-actl{margin-top:7px}
/* ⭐ v9 — hộp kiểm tra Other task trên trang Gửi báo cáo */
.otchk.ok{border-color:#A9E3C2;background:linear-gradient(140deg,#F2FBF6,#fff)}
.otchk.warn{border-color:#F3D69B;background:linear-gradient(140deg,#FFFBF1,#fff)}
.otchk code{background:var(--line2);border-radius:5px;padding:1px 5px;font-size:11.5px}
.fylb{display:inline-flex;align-items:center;font-size:11px;font-weight:800;color:var(--mute);
  text-transform:uppercase;letter-spacing:.4px;padding-right:3px;white-space:nowrap}
/* ⭐ v9 — 3 biểu đồ gọn trong tab Đơn hàng của hồ sơ account */
.odbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.odsum{font-size:12.5px;color:var(--sub);font-weight:650}
.odsum b{color:var(--navy);font-weight:800}
.odc{margin-bottom:14px;align-items:start}
.odc .cbox{padding:13px 14px;display:flex;flex-direction:column}
.odc .cbox h4{font-size:12.5px}
.odc .csub{margin-bottom:9px}
.odc .spark{width:100%;height:auto;max-height:190px}
.odc .donut{flex-direction:column;align-items:stretch;gap:9px}
.odc .donut-svg{margin:0 auto;width:118px!important;height:118px!important}
.odc .donut-svg svg{width:118px;height:118px}
.odc .donut-c b{font-size:16px}
.odc .dlg{min-width:0;max-height:132px;overflow:auto}
.odc .dlg-i{font-size:11.5px}
@media(max-width:1180px){ .odc.g3{grid-template-columns:1fr 1fr} .odc .cbox:first-child{grid-column:1/-1} }
@media(max-width:900px){ .odc.g3{grid-template-columns:1fr} .odc .cbox:first-child{grid-column:auto} }

/* ══════════════ DRAWER (màn hình phụ trượt từ phải) ══════════════ */
#drw{position:fixed;inset:0;z-index:840;display:none;transition:filter .2s,opacity .2s}
body.modal-on #drw{filter:blur(2px) saturate(.85);opacity:.55}
#drw.on{display:block}
#drw .bd{position:absolute;inset:0;background:rgba(16,29,51,.42);backdrop-filter:blur(3px);opacity:0;transition:.25s}
#drw.on .bd{opacity:1}
#drw .pn{position:absolute;inset:0;width:100%;background:var(--bg);box-shadow:var(--sh-3);display:flex;flex-direction:column;transform:translateX(24px);opacity:0;transition:.28s cubic-bezier(.32,.72,0,1)}
#drw.on .pn{transform:none;opacity:1}
.drw-h{background:linear-gradient(118deg,#37538F,var(--blue) 62%,#5B7BC4);color:#fff;padding:16px 18px 15px;flex:none;position:relative}
.drw-h .x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:10px;border:none;background:rgba(255,255,255,.16);color:#fff;font-size:16px;cursor:pointer;transition:.15s}
.drw-h .x:hover{background:rgba(255,255,255,.3)}
.drw-h .top{display:flex;align-items:center;gap:12px;padding-right:38px}
.drw-h .av{width:46px;height:46px;border-radius:14px;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;box-shadow:0 3px 12px rgba(0,0,0,.16)}
.drw-h h2{font-size:17.5px;font-weight:800;letter-spacing:-.3px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.drw-h .meta{font-size:12px;color:#CFDEF7;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drw-h .meta b{color:#fff;font-weight:700}
.drw-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.dchip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.dchip.y{background:var(--yellow);color:var(--navy);border-color:var(--yellow)}
.drw-tabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);padding:0 12px;flex:none;overflow-x:auto;scrollbar-width:none}
.drw-tabs::-webkit-scrollbar{display:none}
.drw-tabs button{border:none;background:none;padding:14px 15px 12px;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;transition:.15s}
.drw-tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.drw-tabs button:hover:not(.on){color:var(--sub)}
.drw-b{flex:1;overflow:auto;padding:15px 17px 40px;-webkit-overflow-scrolling:touch}
.drw-f{flex:none;border-top:1px solid var(--line);background:var(--card);padding:11px 15px;display:flex;gap:8px;flex-wrap:wrap;padding-bottom:calc(11px + var(--safe))}
@media(max-width:640px){ .drw-h h2{font-size:17px} }
/* ⭐ v5 — hồ sơ khách hàng xem toàn màn hình: chữ và bảng to hơn hẳn */
#drw .drw-b{font-size:14px}
#drw .drw-b .tb{font-size:13.5px}
#drw .drw-b .tb th{font-size:12px}
#drw .drw-b .tb td{padding:11px 12px}
#drw .drw-b .kv{grid-template-columns:210px 1fr;font-size:14px;gap:2px 16px}
#drw .drw-b .kv dt{font-size:12.5px}
#drw .drw-b .li .t1 b{font-size:14.5px}
#drw .drw-b .tli-t{font-size:14.5px}
#drw .drw-b .tli-b{font-size:13.5px;line-height:1.6}
#drw .drw-b .mstat .v{font-size:22px}
#drw .drw-h h2{font-size:22px}


/* strip chỉ số nhỏ trong drawer */
.mstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;margin-bottom:15px}
.mstat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 11px;box-shadow:var(--sh-1)}
.mstat .v{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.15}
.mstat .l{font-size:10.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.mstat.hi{background:linear-gradient(140deg,var(--pale),#fff);border-color:var(--lb1)}
.mstat.warn .v{color:var(--warn)}.mstat.dang .v{color:var(--dang)}.mstat.ok .v{color:var(--ok)}

/* ══════════════ TIMELINE (lịch sử tương tác) ══════════════ */
.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--lb1),var(--line2))}
.tl-d{font-size:11px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px -30px;padding-left:30px}
.tl-d:first-child{margin-top:0}
.tli{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;margin-bottom:9px;box-shadow:var(--sh-1);transition:.15s;cursor:pointer}
.tli:hover{border-color:var(--blue-l);box-shadow:var(--sh-2);transform:translateX(2px)}
.tli::before{content:"";position:absolute;left:-24px;top:15px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2.5px solid var(--blue);box-shadow:0 0 0 3px var(--bg)}
.tli.k-order::before{border-color:#1E9E5A}
.tli.k-visit::before{border-color:#3A5CAA}
.tli.k-present::before{border-color:#B8860B}
.tli.k-adp::before{border-color:#8A5FB8}
.tli-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tli-ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;flex:none}
.k-order .tli-ic{background:#E8F7EF}.k-visit .tli-ic{background:var(--info-bg)}
.k-present .tli-ic{background:#FFF6E4}.k-adp .tli-ic{background:#F3EDFB}
.tli-t{font-weight:700;font-size:13.5px;color:var(--navy);flex:1;min-width:0}
.tli-dt{font-size:11.5px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.tli-b{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.tli-m{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tli-am{font-weight:800;color:#1E9E5A;font-variant-numeric:tabular-nums}

/* ══════════════ THƯ VIỆN ẢNH ══════════════ */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.gal .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line2);cursor:pointer;border:1px solid var(--line)}
.gal .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}
.gal .ph:hover img{transform:scale(1.07)}
.gal .ph .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,rgba(0,20,40,.78),transparent);color:#fff;font-size:9.5px;font-weight:700;padding:12px 5px 4px;text-align:center}
.thumbs{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.thumbs .ph{width:54px;height:54px;border-radius:8px;overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative;flex:none;background:var(--line2)}
.thumbs .ph img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .more{width:54px;height:54px;border-radius:8px;background:var(--lb2);color:var(--blue-d);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;cursor:pointer}

/* LIGHTBOX */
#lb{position:fixed;inset:0;background:rgba(8,16,30,.94);z-index:960;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .bar{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;flex:none}
#lb .bar .ti{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .bar button,#lb .nv{border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;cursor:pointer;transition:.15s}
#lb .bar button{width:34px;height:34px;font-size:15px;flex:none}
#lb .bar button:hover,#lb .nv:hover{background:rgba(255,255,255,.3)}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:0 8px 8px;min-height:0}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
#lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:60px;font-size:22px;display:grid;place-items:center}
#lb .nv.l{left:10px}#lb .nv.r{right:10px}
#lb .cap{color:#C7D6EF;font-size:12px;text-align:center;padding:9px 16px calc(14px + var(--safe));flex:none;line-height:1.5}

/* ══════════════ BẢNG TIN HOẠT ĐỘNG (rail phải) ══════════════ */
#actRail{position:fixed;top:var(--hdr);right:0;bottom:0;width:330px;background:var(--card);border-left:1px solid var(--line);box-shadow:var(--sh-3);z-index:820;display:flex;flex-direction:column;transform:translateX(100%);transition:.28s cubic-bezier(.32,.72,0,1)}
#actRail.on{transform:none}
.ar-h{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;flex:none}
.ar-h b{font-size:13.5px;font-weight:800;color:var(--navy);flex:1}
.ar-h button{border:none;background:var(--line2);width:28px;height:28px;border-radius:9px;cursor:pointer;color:var(--sub);font-size:13px}
.ar-h button:hover{background:var(--lb2);color:var(--blue-d)}
.ar-f{padding:9px 12px;border-bottom:1px solid var(--line2);display:flex;gap:6px;flex:none}
.ar-f select{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px;background:var(--paler);color:var(--sub);font-weight:600}
.ar-b{flex:1;overflow:auto;padding:11px 12px 24px;-webkit-overflow-scrolling:touch}
.acard{background:var(--paler);border:1px solid var(--line2);border-left:3px solid var(--blue);border-radius:10px;padding:9px 11px;margin-bottom:8px}
.acard.a-add{border-left-color:#1E9E5A}.acard.a-update{border-left-color:#3A5CAA}
.acard.a-delete{border-left-color:#D9433F}.acard.a-photo{border-left-color:#B8860B}
.acard.a-report{border-left-color:#8A5FB8}.acard.a-kpi{border-left-color:#0E9AA7}
.ac-h{display:flex;align-items:center;gap:7px}
.ac-av{width:22px;height:22px;border-radius:7px;color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:800;flex:none}
.ac-who{font-size:12.5px;font-weight:800;color:var(--navy);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-bd{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;flex:none;text-transform:uppercase;letter-spacing:.3px}
.ac-tg{font-size:12.5px;color:var(--ink);font-weight:600;margin-top:5px;line-height:1.45;word-break:break-word}
.ac-dt{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ac-tm{font-size:10.5px;color:var(--mute);font-weight:700;margin-top:5px}
.hbtn.bell{position:relative}
.hbtn.bell .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--dang);border:1.5px solid #fff}

/* ═══════════════════════════════════════════════════════════════════
   MMH CRM — Frontend v17
   Backend: Google Apps Script (Code.gs v8.3)  ·  Deploy: GitHub Pages
   ───────────────────────────────────────────────────────────────────
   ⭐ v16 — LỊCH CÔNG VIỆC + CÔNG TÁC · ĐƠN GÕ TAY TRÊN SHEET HIỆN TRÊN APP
    ① Cập nhật ▸ 📅 Lịch công việc: tuần / tháng / danh sách, gộp đi địa bàn (file CRM)
       + công việc khác + chuyến công tác (Report Hub). Bấm vào việc ⇒ cập nhật ngay;
       bấm ngày trống / "＋ Thêm việc" ⇒ thêm việc đúng ngày đó.
    ② ✈️ Đề xuất công tác ghi thẳng vào file Business Trip + gửi email xin duyệt;
       xem chuyến đi, nhập báo cáo công tác cho chuyến đã Approved.
    ③ FY tính theo ngày (T9 → T8): sang tháng 9 app tự mở FY mới — trước đây kẹt FY67
       nên đơn FY68 sales gõ trên sheet bị lọc mất.
   ⭐ v14 — BẢN TĂNG TỐC & DANH MỤC MÃ SẢN PHẨM
    ① Ảnh đi địa bàn nén về ≤ 280 KB (trước 0,9–1,6 MB) và không chặn giao diện;
       không bắt chờ GPS mới hiện ảnh; tải xong KHÔNG nạp lại cả năm dữ liệu nữa.
    ② Mọi lời gọi đọc dữ liệu gửi kèm mã phiên bản: sheet chưa đổi thì máy chủ trả
       ~50 byte và không mở Spreadsheet ⇒ dò dữ liệu mới 15 giây/lần vẫn nhẹ.
    ③ Sheet đổi ở đâu chỉ nạp lại đúng chỗ đó (bảng phiên bản theo từng tab),
       thay vì nạp lại 6–7 nguồn như bản cũ.
    ④ Dữ liệu danh sách truyền dạng nén (mảng-của-mảng) — nhẹ hơn ~60%.
    ⑤ Ô Detail của đơn hàng: chọn từ danh mục "12. PRODUCT CODE", gom nhóm theo

/* ⭐ v5.2 — ĐỌC SỐ TIỀN KIỂU VIỆT NAM, CHỊU ĐƯỢC Ô LẪN CHỮ.
   Trước đây "700.000.000 VNĐ100 vỉ jizai150 tuýp comp" bị bóc thành
   "700.000.000100150" ⇒ parseFloat ra 700 ⇒ app tưởng Target = 700 và
   báo "lệch đơn vị". Nay:
     · dấu chấm/phẩy phân cách nghìn được hiểu đúng ("700.000.000" = 700 triệu)
     · bỏ qua phần chữ, lấy con số tiền thật trong ô
     · hiểu hậu tố tr / triệu / tỷ / k / nghìn  ("20 triệu" = 20.000.000) */
function numChunk(t){
  t=String(t).replace(/\s/g,"");
  var hasDot=t.indexOf(".")>=0, hasCom=t.indexOf(",")>=0, parts;
  if(hasDot&&hasCom){
    if(t.lastIndexOf(",")>t.lastIndexOf(".")) t=t.replace(/\./g,"").replace(/,/g,".");
    else t=t.replace(/,/g,"");
  } else if(hasDot){
    parts=t.split(".");
    if(parts.length>1&&parts.slice(1).every(function(x){return x.length===3;})) t=parts.join("");
  } else if(hasCom){
    parts=t.split(",");
    t=(parts.length>1&&parts.slice(1).every(function(x){return x.length===3;}))
      ? parts.join("") : t.replace(/,/g,".");
  }
  var x=parseFloat(t); return isNaN(x)?null:x;
}
var _NUM_RE=/(-?\d[\d.,]*)\s*(tỷ|ty|triệu|trieu|tr|nghìn|nghin|ngàn|ngan|k|m)?/gi;
function n(v){
  if(v===""||v==null) return 0;
  if(typeof v==="number") return isFinite(v)?v:0;
  var str=String(v);
  var plain=numChunk(str);                       /* ô sạch: đi đường nhanh */
  if(plain!=null && !/[^\d.,\-\s]/.test(str)) return plain;
  var m, vals=[];
  _NUM_RE.lastIndex=0;
  while((m=_NUM_RE.exec(str))!==null){
    if(!m[1]) continue;
    var x=numChunk(m[1]); if(x==null) continue;
    var suf=(m[2]||"").toLowerCase();
    if(suf==="tỷ"||suf==="ty") x*=1e9;
    else if(suf==="triệu"||suf==="trieu"||suf==="tr"||suf==="m") x*=1e6;
    else if(suf==="nghìn"||suf==="nghin"||suf==="ngàn"||suf==="ngan"||suf==="k") x*=1e3;
    vals.push(x);
    if(_NUM_RE.lastIndex===m.index) _NUM_RE.lastIndex++;
  }
  if(!vals.length) return 0;
  for(var i=0;i<vals.length;i++) if(Math.abs(vals[i])>=1000) return vals[i];  /* số tiền đầu tiên */
  return vals[0];
}
/* ô có lẫn chữ ⇒ trả về chuỗi gốc để hiển thị chú thích cho người dùng đối chiếu */
function messyNum(v){

  var str=String(v).trim();
  return (str && /[^\d.,\-\s]/.test(str)) ? str : "";
}

  if(Math.abs(x)>=1e9) return (x/1e9).toFixed(x>=1e10?1:2).replace(/\.?0+$/,"")+" tỷ";
  if(Math.abs(x)>=1e6) return (x/1e6).toFixed(x>=1e8?0:1).replace(/\.0$/,"")+" tr";
  return fmtN(x);
}
function fmtVN(iso){ if(!iso) return ""; var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso)); return m?(m[3]+"/"+m[2]+"/"+m[1]):String(iso); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function addDays(iso,k){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); if(!m) return iso; var d=new Date(+m[1],+m[2]-1,+m[3]); d.setDate(d.getDate()+k);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function mondayOf(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso); if(!m) return iso; var d=new Date(+m[1],+m[2]-1,+m[3]);
  var w=(d.getDay()+6)%7; d.setDate(d.getDate()-w);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function ymOf(iso){ var m=/^(\d{4})-(\d{2})/.exec(String(iso)); return m?(m[1]+m[2]):""; }
function fyOfMonth(ym){ var y=parseInt(String(ym).slice(0,4),10), mm=parseInt(String(ym).slice(4,6),10);
  var base=(mm>=9)?y:y-1; return "FY"+(base-1958); }
function fyMonths(fy){ var k=parseInt(String(fy).replace(/\D/g,""),10), y=1958+k, o=[];
  [9,10,11,12].forEach(function(m){o.push(String(y*100+m));});

/* ───────── API (JSONP đọc · POST ghi) ───────── */
var _seq=0;
function gasAuthMsg(){
  return "Không đọc được dữ liệu từ Google. Thường gặp khi điện thoại đang đăng nhập "+
         "nhiều tài khoản Google cùng lúc — Google chuyển sang trang chọn tài khoản nên app "+
         "không nhận được dữ liệu.\n\nCách xử lý: mở app bằng cửa sổ ẩn danh, hoặc trong "+
         "Chrome chọn đúng một tài khoản rồi tải lại trang.";
}
function jsonp(params,timeoutMs){
  return new Promise(function(res,rej){
    var cb="__mmh_"+Date.now()+"_"+(++_seq);
    var s=document.createElement("script");
    var t=setTimeout(function(){ done(); rej(new Error("__TIMEOUT__")); }, timeoutMs||45000);
    function done(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb]=function(d){ done(); res(d); };
    params.callback=cb;
    if(S.user&&S.user.pic&&!("pic" in params)) params.pic=S.user.pic;
    var qs=Object.keys(params).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(params[k]==null?"":params[k]); }).join("&");
    var url=gasUrl()+"?"+qs;
    if(url.length>7000){ done(); rej(new Error("__TOO_LONG__")); return; }
    s.src=url;
    /* ⭐ v5.7 — thẻ <script> hỏng thường KHÔNG phải do sai link mà do Google chuyển hướng
       sang trang chọn tài khoản (máy đang đăng nhập nhiều Gmail cùng lúc). Thử lại một
       lần bằng fetch để lấy đúng nội dung, hỏng nữa mới báo lỗi kèm cách xử lý. */
    s.onerror=function(){
      done();
      fetch(url.replace(/([?&])callback=[^&]*/,"$1_j=1"),{method:"GET",credentials:"omit"})
        .then(function(r){ return r.text(); })
        .then(function(t){
          var m=String(t||"").replace(/^[^{[]*/,"").replace(/\);?\s*$/,"");
          try{ res(JSON.parse(m)); }
          catch(e){ rej(new Error(gasAuthMsg())); }
        })
        .catch(function(){ rej(new Error(gasAuthMsg())); });
    };
    document.body.appendChild(s);
  });
}
/* ═══════════ ⭐ v14 — HỎI "CÓ GÌ MỚI KHÔNG" THAY VÌ TẢI LẠI TẤT CẢ ═══════════
   Mỗi lần nhận dữ liệu, app nhớ luôn mã phiên bản (_ver) kèm theo câu hỏi đó.
   Lần sau gửi mã này lên; nếu Google Sheet chưa đổi, backend trả đúng một chữ
   "unchanged" (~50 byte) và KHÔNG hề mở Spreadsheet. Nhờ vậy việc làm mới nền
   mỗi 15 giây gần như không tốn gì, mà dữ liệu sửa tay trên sheet vẫn hiện nhanh. */
var CVER={};
function cvKey_(action,extra){
  var e=extra||{}, ks=Object.keys(e).filter(function(k){ return k!=="cv"&&k!=="callback"&&k!=="_ts"; }).sort();
  return action+"|"+ks.map(function(k){ return k+"="+String(e[k]==null?"":e[k]); }).join("&");
}
/* Quên mã phiên bản của một câu hỏi ⇒ lần sau backend gửi lại dữ liệu đầy đủ.
   BẮT BUỘC gọi khi bộ nhớ trong máy không còn giữ dữ liệu của câu hỏi đó, nếu không
   backend sẽ trả "chưa đổi" trong khi app đã chẳng còn gì để hiển thị. */
function cvDrop(action,extra){ delete CVER[cvKey_(action,extra)]; }
function apiGet(action,extra){
  var p={action:action}; if(extra) Object.keys(extra).forEach(function(k){ p[k]=extra[k]; });
  var ck=cvKey_(action,extra);
  if(CVER[ck]) p.cv=CVER[ck];
  return jsonp(p).then(function(j){
    if(j&&j.ok===false) throw new Error(j.error||"Lỗi không rõ");
    if(j&&j._ver) CVER[ck]=j._ver;
    return j;
  })
    .catch(function(e){
      if(e&&e.message==="__TIMEOUT__"){ delete CVER[ck]; throw new Error("Máy chủ phản hồi chậm. Thử lại sau."); }
      throw e;
    });
}
/* POST body — dùng cho payload dài (ảnh base64, text nhiều dòng).
   Thăm dò 1 lần xem GAS có trả CORS header không; sau đó CHỈ dùng đúng 1 cách
   ⇒ không bao giờ gửi lặp request (tránh ghi trùng dòng / trùng ảnh). */
/* ⭐ v14 — kết quả thăm dò CORS nhớ luôn trên máy. Bản cũ thăm dò lại ở MỖI lần mở app,
   nghĩa là trước mỗi lần gửi ảnh đầu tiên phải mất thêm một vòng gọi Apps Script (2–5 giây). */
var CORS_OK=null, LS_CORS="mmh_cors_ok";
(function(){ try{ var v=localStorage.getItem(LS_CORS); if(v==="1") CORS_OK=true; else if(v==="0") CORS_OK=false; }catch(e){} })();
function probeCors(){
  if(CORS_OK!==null) return Promise.resolve(CORS_OK);
  return fetch(gasUrl(),{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"ping"}), redirect:"follow" })
    .then(function(r){ return r.json(); })
    .then(function(j){ CORS_OK=!!(j&&j.ok); try{ localStorage.setItem(LS_CORS,CORS_OK?"1":"0"); }catch(e){} return CORS_OK; })
    .catch(function(){ CORS_OK=false; return false; });
}
function postBody(body){
  if(S.user&&S.user.pic&&!("pic" in body)) body.pic=S.user.pic;
  var payload=JSON.stringify(body);
  return probeCors().then(function(ok){
    if(ok){
      return fetch(gasUrl(),{ method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:payload, redirect:"follow" })
        .then(function(r){ return r.json(); })
        .then(function(j){ if(j&&j.ok===false) throw new Error(j.error||"Lỗi"); return j; });
    }
    return fetch(gasUrl(),{ method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:payload })
      .then(function(){ return { ok:true, opaque:true }; });
  });
}
function apiPost(body){
  if(!body.action) return Promise.reject(new Error("thiếu action"));
  S._lastWriteAt=Date.now();                 /* ⭐ v13 — version đổi do chính mình ⇒ không tải lại toàn bộ */
  var flat={}; Object.keys(body).forEach(function(k){ var v=body[k]; flat[k]=(v!==null&&typeof v==="object")?JSON.stringify(v):v; });
  var qs=Object.keys(flat).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(flat[k]==null?"":flat[k]); }).join("&");
  if((gasUrl()+"?"+qs).length>6500) return postBody(body);
  return jsonp(flat,90000).then(function(j){ if(j&&j.ok===false) throw new Error(j.error||"Lỗi"); return j; })
    .catch(function(e){
      /* __TOO_LONG__: request CHƯA hề gửi đi → an toàn để gửi lại bằng POST body */
      if(e&&e.message==="__TOO_LONG__") return postBody(body);
      /* __TIMEOUT__: request ĐÃ tới máy chủ, chỉ là phản hồi chậm → KHÔNG gửi lại,
         tránh ghi trùng. Trả cờ mềm để caller tự refetch xác nhận. */
      if(e&&e.message==="__TIMEOUT__") return { ok:true, softTimeout:true, message:"Đã gửi lên máy chủ — dữ liệu sẽ hiện sau khi tải lại" };
      throw e;
    });
}

/* ───────── BOOT ───────── */
function lsGet(k){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

/* ═══════════ ⭐ v13 — BỘ NHỚ ĐỆM INDEXEDDB (thay localStorage cho dữ liệu lớn) ═══════════
   localStorage chỉ ~5 MB, ghi/đọc đồng bộ (đứng hình khi JSON lớn) và bản cũ bỏ qua mọi tab
   > 2.500 dòng (CBC 8.000 dòng, địa bàn > 3.000 dòng) ⇒ lần mở nào cũng phải tải lại từ đầu.
   Nay: dữ liệu nằm trong IndexedDB (hàng trăm MB, bất đồng bộ), nạp vào RAM một lần lúc mở
   app, ghi xuống gom lô khi rảnh. Máy không hỗ trợ IndexedDB thì tự quay về localStorage. */
var KV={ mem:{}, db:null, ok:false, pend:{}, timer:null };
function kvOpen(){
  return new Promise(function(res){
    try{
      if(!window.indexedDB) return res(null);
      var rq=indexedDB.open("mmh_crm_cache",1);
      rq.onupgradeneeded=function(){ try{ rq.result.createObjectStore("kv"); }catch(e){} };
      rq.onsuccess=function(){ res(rq.result); };
      rq.onerror=function(){ res(null); };
      rq.onblocked=function(){ res(null); };
    }catch(e){ res(null); }
  });
}
function kvReadRange(db,prefix){
  return new Promise(function(res){
    try{
      var tx=db.transaction("kv","readonly"), st=tx.objectStore("kv");
      var cur=st.openCursor(IDBKeyRange.bound(prefix,prefix+"\uffff"));
      cur.onsuccess=function(){ var c=cur.result; if(c){ KV.mem[c.key]=c.value; c.continue(); } else res(); };
      cur.onerror=function(){ res(); };
    }catch(e){ res(); }
  });
}
function kvWarm(){
  return new Promise(function(res){
    var done=false;
    function fin(){ if(done) return; done=true; res(); }
    setTimeout(fin,1800);                       /* IndexedDB chậm bất thường ⇒ vẫn mở app */
    kvOpen().then(function(db){
      if(!db) return fin();
      KV.db=db; KV.ok=true;
      Promise.all([kvReadRange(db,"k:"+curTeamKey()+":"), kvReadRange(db,"k:*:")]).then(function(){
        kvMigrateLegacy(); fin();
      });
    });
  });
}
/* chuyển cache cũ trong localStorage sang IndexedDB một lần rồi giải phóng dung lượng */
function kvMigrateLegacy(){
  try{
    var tk=curTeamKey();
    [["mmh_bundle_v2_"+tk,"bundle"],["mmh_tabs_v4_"+tk,"tabs"]].forEach(function(p){
      var raw=localStorage.getItem(p[0]); if(!raw || KV.mem[ckey(p[1])]) return;
      try{ KV.mem[ckey(p[1])]=JSON.parse(raw); kvQueue(ckey(p[1])); }catch(e){}
    });
    var drop=[];
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(/^mmh_(bundle_v2_|tabs_v4_|terr_)/.test(k||"")) drop.push(k);
    }
    drop.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  }catch(e){}
}
function kvGet(k){
  if(k in KV.mem) return KV.mem[k];
  if(!KV.ok){ var v=lsGet(k); if(v!=null) KV.mem[k]=v; return v; }
  return null;
}
function kvSet(k,v){ KV.mem[k]=v; kvQueue(k); }
function kvDel(k){ KV.mem[k]=undefined; kvQueue(k); }
function kvQueue(k){ KV.pend[k]=1; clearTimeout(KV.timer); KV.timer=setTimeout(kvFlush,900); }
function kvFlush(){
  clearTimeout(KV.timer);
  var keys=Object.keys(KV.pend); if(!keys.length) return; KV.pend={};
  if(KV.ok && KV.db){
    try{
      var tx=KV.db.transaction("kv","readwrite"), st=tx.objectStore("kv");
      keys.forEach(function(k){
        try{ if(KV.mem[k]===undefined){ st.delete(k); delete KV.mem[k]; } else st.put(KV.mem[k],k); }catch(e){}
      });
      tx.onerror=function(){};
    }catch(e){}
    return;
  }
  keys.forEach(function(k){
    try{
      if(KV.mem[k]===undefined){ localStorage.removeItem(k); delete KV.mem[k]; return; }
      var s=JSON.stringify(KV.mem[k]);
      if(s.length<2400000) localStorage.setItem(k,s);
    }catch(e){}
  });
}
window.addEventListener("pagehide",function(){ try{ kvFlush(); }catch(e){} });
document.addEventListener("visibilitychange",function(){ if(document.hidden){ try{ kvFlush(); }catch(e){} } });

/* ⭐ v13 — khởi động ngay khi HTML sẵn sàng (không đợi font / ảnh tải xong như sự kiện "load") */

/* ⭐ v2: mở app bằng DỮ LIỆU ĐÃ LƯU trước (hiện ngay lập tức), rồi mới
   tải bản mới ở nền. Người dùng không còn phải ngồi nhìn vòng xoay. */

/* đủ điều kiện tự vào app không? */
function canAuto(saved){

function fetchBundle(pic){

  var q={pic:pic||"",fy:S.fy||""};
  /* chưa có danh mục khách hàng trong máy ⇒ đừng hỏi "có gì mới không", xin hẳn bản đầy đủ */
  if(!(S.custIndex&&S.custIndex.length)) cvDrop("bundle",q);

/* Áp dữ liệu bundle vào state. fromCache=true ⇒ không ghi đè localStorage. */
function applyBundle(b,fromCache){
  S.picList  = b.picList||S.picList||[];
  S.master   = b.master||S.master||{};
  S.driveFolder = b.driveFolder||S.driveFolder||"";
  /* ⭐ v16 — FY đang xem luôn ≥ FY của ngày hôm nay (trừ khi người dùng tự chọn FY khác).
     Bản cũ giữ mãi FY lưu trong máy ⇒ sang tháng 9 vẫn mở FY67, đơn FY68 gõ trên sheet bị lọc mất. */
  var _fy0=S.fy;
  S.fy       = S._fyUser ? (S.fy||b.fyCurrent) : fyNewest_(S.fy, b.fyCurrent, fyToday());
  if(_fy0&&_fy0!==S.fy){ S.cache={}; S.kpi=null; }
  S.fyList   = (b.fyList&&b.fyList.length)?b.fyList.slice():((S.master.fy&&S.master.fy.length)?S.master.fy.slice():[S.fy]);
  [fyToday(),S.fy].forEach(function(f){ if(f&&S.fyList.indexOf(f)<0) S.fyList.unshift(f); });
  S.fyList.sort(function(a,b){ return String(b).localeCompare(String(a)); });
  if(b.cidx&&b.cidxCols){
    var C=b.cidxCols;
    S.custIndex=b.cidx.map(function(r){ var o={}; for(var i=0;i<C.length;i++) o[C[i]]=r[i]; return o; });
    S.custMap={}; S.custIndex.forEach(function(c){ S.custMap[c.code]=c; });
  }
  if(b.dash){ S.dash=b.dash; S.dash._fy=b.fyCurrent||S.fy; S.dash._pic=""; }
  if(b.kpi){ S.kpi=b.kpi; S.kpi._fy=b.fyCurrent||S.fy; }
  if(b.activity) S.activity=b.activity;
  S.ver=b.ver||S.ver||"";
  normTeamPics();                             /* ⭐ v13 — danh sách PIC đúng theo nhóm */
  if(fromCache){ S._bundlePic=b._pic; }
  else{
    S._bundleAt=Date.now(); S._bundlePic=S._lastBundlePic||"";
    kvSet(bundleKey_(),{
      picList:S.picList, master:S.master, driveFolder:S.driveFolder,
      fyCurrent:b.fyCurrent, fyList:S.fyList,
      cidxCols:b.cidxCols, cidx:b.cidx, dash:b.dash, kpi:b.kpi, activity:b.activity, ver:b.ver,
      _pic:S._bundlePic, _at:Date.now()
    });
  }
}

/* ═══════════ ⭐ v10 — DỮ LIỆU SỬA TAY TRÊN SHEET PHẢI HIệN NGAY ═══════════
   Code.gs cache kết quả 6 giờ theo dataVersion(); trước đây version chỉ đổi khi

var VER_POLL_MS=15000, _verTimer=null, _verBusy=false;
/* ⭐ v13 — ĐỒNG BỘ MỀM: không xoá trắng dữ liệu đang hiển thị nữa.
   Bản cũ xoá sạch bộ nhớ rồi tải lại TẤT CẢ mỗi khi version đổi — kể cả khi chính mình

   Nay: giữ nguyên dữ liệu đang xem, tải bản mới ở nền, có bản mới là vẽ lại tại chỗ;

function verSyncNow(){

  if(S.cache.weekly){ S.cache.weekly.at=0; S.cache.weekly.fresh=false; }

/* ═══════════ ⭐ v14 — ĐỒNG BỘ ĐÚNG THỨ VỪA ĐỔI, KHÔNG TẢI LẠI TẤT CẢ ═══════════
   Backend v8 trả kèm bảng phiên bản của TỪNG tab. So với bảng đang giữ là biết ngay
   ai vừa đổi: sửa một dòng đi địa bàn thì chỉ nạp lại tab đó, danh bạ CBC 8.000 dòng

function verApply(vers,mine){
  var prev=S.verMap||{}, changed=[], jobs=[], seen={};
  Object.keys(vers||{}).forEach(function(k){
    if(k==="_all") return;
    if(prev[k]===vers[k]) return;
    changed.push(k);
  });
  S.verMap=vers;
  if(!Object.keys(prev).length) return [];   /* lần đầu: chỉ ghi nhận, không nạp lại */
  changed.forEach(function(k){
    var f=VTAB_JOB[k]; if(!f||seen[k]) return;
    seen[k]=1;
    /* customer / master / kpi cùng gọi refreshBundle ⇒ chỉ chạy một lần */
    if(/^(customer|master|kpi)$/.test(k)){ if(seen._bundle) return; seen._bundle=1; }
    try{ jobs.push(f()); }catch(e){}
  });
  if(jobs.length) Promise.all(jobs.map(function(p){ return Promise.resolve(p).catch(function(){}); }))
    .then(function(){ softRepaint(); });
  return changed;
}
function verPoll(){
  if(_verBusy||document.hidden||!S.user||!S.user.pic||GATE) return;
  _verBusy=true;
  apiGet("version",{}).then(function(j){
    _verBusy=false; S._verOkAt=Date.now();
    var v=String((j&&j.ver)||"");
    if(!v) return;
    var first=!S.verSeen;
    var prev=S.verSeen; S.verSeen=v;
    if(first){ S.verMap=(j&&j.vers)||{}; return; }
    if(v===prev) return;

    var mine=Date.now()-(S._lastWriteAt||0)<12000;   /* vừa do chính mình ghi */
    var m=kvGet(metaKey_()); if(m&&m.ver===prev) kvSet(metaKey_(),{ver:v,at:Date.now()});

    if(j&&j.vers){
      var ch=verApply(j.vers,mine);
      if(ch.length&&!mine) toast("Google Sheet vừa thay đổi — đang cập nhật "+ch.length+" mục…","ok",2600);
      return;
    }
    if(mine) return;                                  /* backend đời cũ, không có bảng tab */
    verSyncNow();
    toast("Google Sheet vừa thay đổi — đang cập nhật dữ liệu mới…","ok",3200);
  }).catch(function(){ _verBusy=false; });
}
function verAutoOn(){ verAutoOff(); _verTimer=setInterval(verPoll,VER_POLL_MS); }

function refreshBundle(silent){
  if(S._refreshing) return S._refreshing;
  if(!silent) toast("Đang tải lại dữ liệu…");
  var badge=$("stale"); if(badge) badge.style.display="";
  S._refreshing=fetchBundle(S.user?S.user.pic:"").then(function(b){
    S._refreshing=null;
    if(b&&b.unchanged){                      /* ⭐ v14 — chưa có gì mới thì thôi */
      S._bundleAt=Date.now();
      var bd0=$("stale"); if(bd0) bd0.style.display="none";
      if(!silent) toast("✓ Dữ liệu đang là bản mới nhất","ok");
      return true;
    }
    applyBundle(b);
    /* ⭐ v13 — không xoá S.cache nữa (trước đây làm các tab Đơn hàng/ADP… trống tạm thời) và
       không gọi go() vẽ lại cả trang; softRepaint tự tránh lúc đang gõ / đang sửa KPI */
    if(S.tab==="dash"||S.tab==="kpi"||S.tab==="cust") softRepaint();
    var bd=$("stale"); if(bd) bd.style.display="none";
    if(!silent) toast("✓ Đã cập nhật dữ liệu mới","ok");
    return true;
  }).catch(function(e){
    S._refreshing=null;
    var bd=$("stale"); if(bd) bd.style.display="none";
    if(!silent) toast(e.message,"err");
    return false;
  });
  return S._refreshing;
}

/* ═══════════ ⭐ v15 — ĐỌC OTHER TASK: CÓ ĐƯỜNG DỰ PHÒNG ═══════════
   Bản cũ chỉ nạp bằng thẻ <script>. Thẻ này hỏng là báo ngay "chưa Deploy quyền
   Anyone" — nhưng thực tế phần lớn không phải vậy: Google chuyển hướng sang trang
   chọn tài khoản (máy đang đăng nhập nhiều Gmail), hoặc Report Hub trả lời chậm quá
   nên trình duyệt cắt kết nối. Cả hai trường hợp đều hiện đúng một câu sai nguyên nhân.

   Nay giống hệt cách app đọc file CRM: thẻ <script> hỏng thì thử lại bằng fetch để
   lấy đúng nội dung, hỏng nữa mới báo lỗi — và báo đúng thứ đã xảy ra. */
var HUB_TIMEOUT=60000;
function hubJsonp(params,timeoutMs){
  return new Promise(function(res,rej){
    var cb="__mmhhub_"+Date.now()+"_"+(++_seq);
    var el=document.createElement("script"), settled=false;
    var t=setTimeout(function(){
      if(settled) return; settled=true; done();
      rej(new Error("__HUB_TIMEOUT__"));
    }, timeoutMs||HUB_TIMEOUT);
    function done(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
                     if(el.parentNode) el.parentNode.removeChild(el); }
    window[cb]=function(d){ if(settled) return; settled=true; done(); res(d); };
    params=params||{}; params.callback=cb;
    var qs=Object.keys(params).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(params[k]==null?"":params[k]); }).join("&");
    var url=REPORTHUB_URL+"?"+qs;
    el.src=url;
    el.onerror=function(){
      if(settled) return; settled=true; done();
      /* thử lại bằng fetch — lấy JSON thô, không cần thẻ script */
      fetch(url.replace(/([?&])callback=[^&]*/,"$1_j=1"),{method:"GET",credentials:"omit"})
        .then(function(r){ return r.text(); })
        .then(function(txt){
          var m=String(txt||"").replace(/^[^{[]*/,"").replace(/\);?\s*$/,"");
          try{ res(JSON.parse(m)); }
          catch(e){ rej(new Error("__HUB_BLOCKED__")); }
        })
        .catch(function(){ rej(new Error("__HUB_BLOCKED__")); });
    };
    document.body.appendChild(el);
  });
}

  return m||"Không đọc được Other task";

   việc chưa có ngày nào thì luôn hiện để không bị giấu mất. */
function otherInRange(x,r){
  if(!r||!r.from||!r.to) return true;
  var a=String(x.start||"").slice(0,10);
  var b=String(x.planned||x.revised||x.actual||"").slice(0,10)||a;
  if(!a&&!b) return true;
  if(!a) a=b;
  if(!b) b=a;
  if(a>b){ var t=a; a=b; b=t; }
  return !(b<r.from || a>r.to);
}
/* các đầu việc Sales trong FY + PIC + kỳ đang xem.
   Trả về BẢN SAO của key task với subs đã lọc — key gom nhiều PIC (VD
   "202606_Dental Customer visiting") sẽ chỉ còn đầu việc của đúng người đang xem. */
function otherKeys(){
  var pic = isMgmt() ? (S.otherPic||"") : S.user.pic;   /* sales chỉ thấy việc của mình */
  var r = vRangeCalc();
  var out=[];
  ((S.other&&S.other.keys)||[]).forEach(function(k){
    if(String(k.fy||"") && String(k.fy)!==S.fy) return;
    if(!OTHER_TYPE_RE.test(String(k.type||""))) return;
    if(!otherTeamOk(k)) return;                          /* ⭐ v13 */
    if(!S.otherShowVisit && isVisitingKey(k)) return;   /* việc đi địa bàn: xem ở tab bên cạnh */
    if(S.otherType && String(k.type||"")!==S.otherType) return;   /* ⭐ v8 — lọc theo Loại việc */

    var subs=(k.subs||[]).filter(function(x){
      if(pic && !picEq(x.pic,pic)) return false;
      return otherInRange(x,r);
    });
    var keyMine = !pic || picEq(k.pic,pic);
    /* key task không còn đầu việc nào của mình trong kỳ ⇒ chỉ giữ nếu chính key đó
       là của mình VÀ nằm trong kỳ (key task đơn lẻ, chưa có đầu việc con) */
    if(!subs.length){
      if(!keyMine) return;
      if((k.subs||[]).length) return;          /* có sub nhưng không sub nào lọt lọc */
      if(!otherInRange(k,r)) return;
    }
    var kk={}; Object.keys(k).forEach(function(f){ kk[f]=k[f]; });
    kk.subs=subs;

    if(S.otherStatus){
      var all=[kk].concat(subs);
      if(!all.some(function(x){ return String(x.status||"To Do")===S.otherStatus; })) return;
    }
    if(S.otherQ){
      var tk=skTokens(S.otherQ);
      var hay=noAcc([kk.keyTask,kk.subTask,kk.result,kk.type,kk.pic,
        subs.map(function(x){return x.subTask+" "+x.result+" "+x.pic;}).join(" ")].join(" "));
      if(!tk.every(function(t){ return hay.indexOf(t)>=0; })) return;
    }
    out.push(kk);
  });
  return out;
}

/* ⭐ v5.7 — chèn link tham chiếu (Drive, báo giá, hồ sơ thầu…) vào ô kết quả.
   Lưu thẳng trong nội dung nên Report Hub cũng đọc được, không cần cột riêng. */
function addLinkTo(id){
  var ta=$(id); if(!ta) return;
  var url=prompt("Dán link tham chiếu (Drive, Sheet, báo giá, hồ sơ thầu…):","https://");
  if(!url) return;
  url=String(url).trim();
  if(!/^https?:\/\//i.test(url)) return toast("Link phải bắt đầu bằng http:// hoặc https://","warn");
  var label=prompt("Đặt tên cho link (bỏ trống thì dùng chính link):","")||"";
  label=String(label).trim();
  var line=(label? (label+": ") : "")+url;
  var cur=String(ta.value||"").replace(/\s+$/,"");
  ta.value=cur ? (cur+"\n🔗 "+line) : ("🔗 "+line);
  try{ ta.dispatchEvent(new Event("input",{bubbles:true})); ta.focus();
       ta.setSelectionRange(ta.value.length,ta.value.length); ta.scrollTop=ta.scrollHeight; }catch(e){}
  toast("✓ Đã chèn link","ok");
}

/* ⭐ v8.1 — Ô TIẾN ĐỘ DÙNG CHUNG cho dialog Key Task (ok_) và Đầu việc con (os_).
   Kéo thanh ⇒ trạng thái tự theo (100% Completed · >0 In Progress · 0 To Do)
   và ngược lại đổi trạng thái ⇒ thanh nhảy về đúng mốc. */
function progFld(px,val){
  val=Math.max(0,Math.min(100,parseInt(val,10)||0));
  return '<div class="fld"><label>Tiến độ</label>'
    +'<div class="pgrow">'
      +'<button class="mini" type="button" onclick="pgStep(\''+px+'\',-5)">−</button>'
      +'<input type="range" id="'+px+'_prog" min="0" max="100" step="5" value="'+val+'" '
        +'oninput="pgLabel(\''+px+'\')" onchange="pgLabel(\''+px+'\')">'
      +'<button class="mini" type="button" onclick="pgStep(\''+px+'\',5)">＋</button>'
      +'<b id="'+px+'_pgl" style="min-width:46px;text-align:right;color:'+pctColor(val/100)+'">'+val+'%</b>'
    +'</div>'
    +'<div class="hint">Kéo để đặt % · 100% tự chuyển Completed, 0% về To Do</div></div>';
}
function pgVal(px){ var e=$(px+"_prog"); return e?(parseInt(e.value,10)||0):0; }
function pgPaint(px){
  var v=pgVal(px), b=$(px+"_pgl");
  if(b){ b.textContent=v+"%"; b.style.color=pctColor(v/100); }
}
function pgLabel(px){
  pgPaint(px);
  var st=$(px+"_status"); if(!st) return;
  if(/cancel/i.test(String(st.value||""))) return;
  var v=pgVal(px);
  st.value = v>=100 ? "Completed" : v>0 ? "In Progress" : "To Do";
}
function pgStep(px,d){
  var e=$(px+"_prog"); if(!e) return;
  e.value=Math.max(0,Math.min(100,(parseInt(e.value,10)||0)+d)); pgLabel(px);
}
function pgFromStatus(px){
  var st=$(px+"_status"), e=$(px+"_prog"); if(!st||!e) return;
  var v=String(st.value||""), cur=parseInt(e.value,10)||0;
  e.value = /complet/i.test(v) ? 100
          : /cancel/i.test(v)  ? 0
          : /progress/i.test(v)? ((cur>0&&cur<100)?cur:25)
          : 0;
  pgPaint(px);
}
function okSyncProg(){ pgFromStatus("ok"); }
function osSyncProg(){ pgFromStatus("os"); }

/* ⭐ v7.2 — bấm đúp vào dòng bất kỳ trong bảng công việc là mở hộp sửa,
   khỏi phải nhắm vào icon nhỏ. Gắn một lần cho cả bảng. */
function bindRhDblClick(){
  var box=$("main"); if(!box||box._rhDbl) return; box._rhDbl=1;
  box.addEventListener("dblclick",function(e){
    var tr=e.target.closest?e.target.closest("tr"):null; if(!tr) return;
    if(e.target.closest("input,select,button,textarea,a")) return;
    var sub=tr.getAttribute("data-sub"), key=tr.getAttribute("data-key");
    if(sub&&key) formOtherSub(key,sub);
    else if(key) formOtherKey(key);
  });
}
function otherKeyCard(k){
  var can=canEditOther(k.pic), pct=otherPct(k);
  var subs=k.subs||[];
  var done=subs.filter(function(x){ return /complet/i.test(String(x.status||"")); }).length;
  return '<div class="card pad ot-key">'+
    '<div class="ot-h"><span class="tag t-b">'+esc(k.type||"—")+'</span>'+
      '<span class="tag t-n">'+esc(k.pic||"—")+'</span>'+
      otherStatusTag(k.status,pct)+
      (k.priority?'<span class="tag t-y">⭐ Ưu tiên</span>':"")+
      '<span class="sp"></span><span class="ot-no">#'+esc(k.no)+'</span>'+
      (can?'<button class="ot-ic" title="Sửa Key Task" onclick="formOtherKey(\''+esc(k.no)+'\')">✎</button>'+
           '<button class="ot-ic del" title="Xoá Key Task" onclick="delOther(\''+esc(k.no)+'\',true)">🗑</button>'
          :'<span class="ot-lock" title="Chỉ '+esc(k.pic||"PIC")+' sửa được">🔒</span>')+
    '</div>'+
    '<div class="ot-t'+(can?" can":"")+'"'+(can?' onclick="formOtherKey(\''+esc(k.no)+'\')" title="Bấm để sửa Key Task"':"")+'>'+
      esc(k.keyTask||k.subTask||"—")+'</div>'+
    (k.result?'<div class="ot-r"><b>Kết quả:</b> '+linkify(String(k.result).slice(0,600))+'</div>':"")+
    '<div class="ot-bar">'+
      '<span class="ot-cnt">'+done+'/'+subs.length+' đầu việc xong</span>'+
      (subs.length?pb(done/subs.length):"")+
      '<button class="btn xs pri" onclick="formOtherSub(\''+esc(k.no)+'\',\'\')">＋ Thêm đầu việc</button>'+
    '</div>'+
    (subs.length?'<div class="ot-subs">'+subs.map(function(x){ return otherSubRow(k,x); }).join("")+'</div>':"")+
  '</div>';
}
function otherSubRow(k,x){

  return '<div class="ot-sub'+(late?" late":"")+(can?" can":"")+'">'+

      '<span class="tag t-n">'+esc(x.pic||"—")+'</span>'+
      (late?'<span class="tag t-r">quá hạn</span>':"")+
      (can?'<button class="ot-ic" title="Sửa" onclick="event.stopPropagation();formOtherSub(\''+esc(k.no)+'\',\''+esc(no)+'\')">✎</button>'+

    '</div>'+
    '<div class="ot-ctl">'+
      (can
        ? '<select class="ot-st" onchange="otherSetStatus(\''+esc(no)+'\',this.value)">'+opts(OTHER_STATUS,x.status||"To Do","")+'</select>'+
          '<input class="ot-rg" type="range" min="0" max="100" step="5" value="'+pct+'" '+

      '<span class="sp"></span>'+
      '<button class="btn xs" onclick="toggleOther(\''+esc(no)+'\')">'+(open?"▴ Thu gọn":"▾ Kết quả")+'</button>'+
    '</div>'+
    '<div class="ot-m">'+[x.start?("Bắt đầu "+fmtVN(x.start)):"",

}

function helpChapters(){
  return HELP_CHAPTERS.filter(function(c){ return c.who!=="mgmt" || isMgmt(); });
}
/* ⭐ v13 — HƯỚNG DẪN DẠNG SÁCH: mở ra là vào thẳng trang 1, lật bằng nút, phím
   mũi tên hoặc vuốt ngang; thanh tab trên cùng nhảy nhanh tới bất kỳ trang nào. */
function openHelp(i){
  var L=helpChapters();
  if(!L.length) return;
  S.hpPage=Math.max(0,Math.min(L.length-1, i!=null?i:(S.hpPage||0)));
  openModal("Hướng dẫn sử dụng",
    '<div class="hpbk">'+
      '<div class="hp-tabs" id="hpTabs">'+L.map(function(c,k){
        return '<button class="hp-tab" id="hpTab'+k+'" onclick="hpGo('+k+')">'+
          '<span>'+c.ic+'</span>'+esc(c.t)+'</button>'; }).join("")+'</div>'+
      '<div class="hp-page" id="hpPage"></div>'+
    '</div>',
    '<button class="btn" id="hpPrev" onclick="hpStep(-1)">‹ Trang trước</button>'+
    '<span class="hp-count" id="hpCount"></span>'+
    '<div style="flex:1"></div>'+
    '<button class="btn" id="hpNext" onclick="hpStep(1)">Trang sau ›</button>'+
    '<button class="btn pri" onclick="closeModal()">Đóng</button>', true);
  hpDraw(); hpSwipe();
}
function hpGo(i){
  var L=helpChapters();
  i=Math.max(0,Math.min(L.length-1,i));
  if(i===S.hpPage && $("hpPage") && $("hpPage").innerHTML) return;
  S.hpPage=i; hpDraw();
}
function hpStep(d){ hpGo((S.hpPage||0)+d); }
function hpBlock(rows,tips,cls){
  return '<ol class="hp-steps'+(cls||"")+'">'+rows.map(function(r){
      return '<li><b>'+r[0]+'</b><div>'+r[1]+'</div></li>'; }).join("")+'</ol>'+
    ((tips&&tips.length)?'<div class="hp-tip"><b>Ghi nhớ</b><ul>'+
      tips.map(function(t){ return '<li>'+t+'</li>'; }).join("")+'</ul></div>':"");
}
function hpDraw(){
  var L=helpChapters(), i=S.hpPage||0, c=L[i], pg=$("hpPage");
  if(!c||!pg) return;
  var img = c.img
    ? '<div class="hp-img">'+
        '<img src="'+helpImgUrl(c.img)+'" alt="'+esc(c.t)+'" loading="lazy" '+
          'onerror="this.style.display=\'none\';this.parentNode.querySelector(\'.hp-err\').style.display=\'block\'">'+
        '<div class="hp-err" style="display:none">Không tải được ảnh — bấm “Mở ảnh gốc” bên dưới.</div>'+
        '<div class="hp-cap"><span>Ảnh hướng dẫn — chạm để xem cỡ lớn</span>'+
          '<a href="'+helpImgOpen(c.img)+'" target="_blank" rel="noopener">Mở ảnh gốc ›</a></div>'+
      '</div>'
    : "";
  pg.innerHTML=
    '<div class="hp-head"><span class="hp-ic">'+c.ic+'</span><div><b>'+c.t+
      (c.who==="mgmt"?' <i class="hp-badge">Quản lý</i>':"")+'</b><span>'+esc(c.sub)+'</span></div></div>'+
    img+
    '<div class="hp-h">CÁC BƯỚC LÀM</div>'+
    hpBlock(c.rows,c.tips)+
    (c.note?'<div class="hp-note"><div class="hp-nh"><span>'+c.note.ic+'</span><div><b>'+c.note.t+'</b>'+
      '<span>'+esc(c.note.sub)+'</span></div></div>'+hpBlock(c.note.rows,c.note.tips)+'</div>':"");
  pg.scrollTop=0;
  try{ $("mBody").scrollTop=0; }catch(e){}
  pg.classList.remove("in"); void pg.offsetWidth; pg.classList.add("in");
  L.forEach(function(_,k){ var t=$("hpTab"+k); if(t) t.classList.toggle("on",k===i); });
  var at=$("hpTab"+i); if(at&&at.scrollIntoView) try{ at.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"}); }catch(e){}
  if($("hpCount")) $("hpCount").textContent=(i+1)+" / "+L.length;
  if($("hpPrev")) $("hpPrev").disabled=(i===0);
  if($("hpNext")) $("hpNext").disabled=(i===L.length-1);
}
/* vuốt ngang trên điện thoại */
function hpSwipe(){
  var pg=$("hpPage"); if(!pg||pg._sw) return; pg._sw=1;
  var x0=0,y0=0,t0=0;
  pg.addEventListener("touchstart",function(e){
    var t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); },{passive:true});
  pg.addEventListener("touchend",function(e){
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Date.now()-t0>600) return;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6) return;
    hpStep(dx<0?1:-1); },{passive:true});
}
/* phím mũi tên khi đang mở sách */
document.addEventListener("keydown",function(e){
  if(!$("hpPage")) return;
  if(!$("ov")||!$("ov").classList.contains("on")) return;
  var t=(e.target&&e.target.tagName)||"";
  if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT") return;
  if(e.key==="ArrowRight"){ e.preventDefault(); hpStep(1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); hpStep(-1); }
});


/* ═══════════ ⭐ v6.0 — KEY STAKEHOLDER (CBC) & KHÁCH HÀNG TỪ EVENT ═══════════
   Nguồn: tab "2. CBC" của file CRM.
     · Ghi chú (cột R) chứa "Khách hàng từ Event: <tên>" ⇒ nhận ra khách đến từ event nào

   Số lần làm việc: đếm các task đi địa bàn có dòng "Người gặp:" nhắc tên CBC đó,

   không ghi theo từng người liên hệ) — nhãn trên bảng nói rõ điều này. */
var EVENT_URL  = "https://script.google.com/macros/s/AKfycbz1qIyw42C1qz_rBlzI0PPGPuDubo1s5r5BT0knuUf84mfROB7U97QbzNLqOWezK-d-/exec";
var EVENT_NOTE_RE = /Khách hàng từ Event:\s*([^·\n]+)/i;

function eventOfCbc(b){
  var m = EVENT_NOTE_RE.exec(String(b.note||""));
  return m ? String(m[1]).trim() : "";
}
function stampOfLog(v){
  var m = /(\d{2})\/(\d{2})\/(\d{4})/.exec(String(v||""));
  return m ? (m[3]+"-"+m[2]+"-"+m[1]) : "";
}
/* gom toàn bộ chỉ số cho từng CBC — có bộ nhớ đệm theo FY + kích thước nguồn */
var _stCache=null,_stKey="";
function stakeRows(){
  var cbc=S.cbcRows||[], wk=terrRows(), od=tGet("order")||[];
  var key=[S.fy,cbc.length,wk.length,od.length,(S.cache.weekly?S.cache.weekly.at:0)].join("|");
  if(_stCache&&_stKey===key) return _stCache;

  /* doanh số theo account trong FY đang chọn */
  var fym={}; fyMonths(S.fy).forEach(function(m){ fym[String(m)]=1; });
  var salesByAcc={};
  od.forEach(function(r){
    if(!fym[String(r.month||"")]) return;
    var k=noAcc(r.name).trim(); if(!k) return;
    salesByAcc[k]=(salesByAcc[k]||0)+n(r.amount);
  });

  /* các buổi làm việc trong FY, gom theo account để dò nhanh */
  var actByAcc={};
  wk.forEach(function(w){
    if(String(w.fy||"")!==S.fy) return;
    var k=noAcc(parseAcc(w.account).name).trim(); if(!k) return;
    (actByAcc[k]=actByAcc[k]||[]).push(w);
  });

  var out=(cbc||[]).filter(function(b){ return String(b.contact||"").trim(); }).map(function(b){
    var accKey=noAcc(b.name).trim();
    var list=actByAcc[accKey]||[];
    var who=noAcc(b.contact).replace(/\s+/g," ").trim();
    var nVisit=0,nTele=0,nMsg=0,nOther=0,last="";
    list.forEach(function(w){
      var meet=(MEET_RE.exec(String(w.result||""))||[""])[0];
      if(!who || noAcc(meet).indexOf(who)<0) return;      /* task không nhắc tên người này */
      var ta=noAcc(w.typeAction||"");
      if(ta.indexOf("visit")>=0) nVisit++;
      else if(ta.indexOf("tele")>=0||ta.indexOf("phone")>=0||ta.indexOf("goi")>=0) nTele++;
      else if(ta.indexOf("mess")>=0||ta.indexOf("zalo")>=0||ta.indexOf("mail")>=0||ta.indexOf("chat")>=0) nMsg++;
      else nOther++;
      var d=String(w.start||"").slice(0,10);
      if(d>last) last=d;
    });
    return {
      _row:b._row, code:b.code||"", acc:b.name||"", contact:b.contact||"",
      phone:b.phone||"", jobTitle:b.jobTitle||"", specialize:b.specialize||"",
      role:b.role||"", influence:b.influence||"", trust:b.trust||"",
      area:b.area||"", province:b.province||"", pic:b.pic||"", cbcNo:b.cbcNo||"",
      note:b.note||"", event:eventOfCbc(b), created:stampOfLog(b.log),
      evFy:(stampOfLog(b.log)?fyOfMonth(ymOf(stampOfLog(b.log))):""),
      nVisit:nVisit, nTele:nTele, nMsg:nMsg, nOther:nOther,
      nTotal:nVisit+nTele+nMsg+nOther, last:last,
      sales:salesByAcc[accKey]||0
    };
  });
  _stCache=out; _stKey=key; return out;
}
/* danh sách tỉnh có trong danh bạ, kèm số người — dùng cho bộ lọc */
function stakeProvinces(){
  var m={};
  stakeRows().forEach(function(r){
    if(S.stTab==="event" && !r.event) return;
    if(S.stTab==="event" && S.stFy && r.evFy!==S.stFy) return;
    var p=String(r.province||"").trim(); if(!p) return;
    m[p]=(m[p]||0)+1;
  });
  return Object.keys(m).sort(function(a,b){ return m[b]-m[a]||a.localeCompare(b); })
               .map(function(p){ return {p:p,n:m[p]}; });
}
function stakeEvents(){
  var m={};
  stakeRows().forEach(function(r){
    if(!r.event) return;
    if(S.stTab==="event" && S.stFy && r.evFy!==S.stFy) return;
    m[r.event]=(m[r.event]||0)+1; });
  return Object.keys(m).sort(function(a,b){ return String(b).localeCompare(String(a)); })
               .map(function(k){ return {ev:k,n:m[k]}; });
}
function stakeFiltered(){
  var rows=stakeRows(), toks=skTokens(S.stQ||"");
  var mgr=isMgmt(), me=S.user.pic;
  var out=[];
  rows.forEach(function(r){
    if(!mgr && r.pic && !picEq(r.pic,me)) return;        /* sales chỉ xem CBC mình phụ trách */
    if(S.stTab==="event" && !r.event) return;
    /* ⭐ v9 — lọc khách event theo FY được thêm vào danh bạ (cột Log ngày tạo) */
    if(S.stTab==="event" && S.stFy && r.evFy!==S.stFy) return;
    if(S.stEvent && r.event!==S.stEvent) return;
    if(S.stProv && noAcc(r.province||"").trim()!==noAcc(S.stProv).trim()) return;
    if(toks.length){
      var hay=noAcc([r.contact,r.acc,r.phone,r.jobTitle,r.specialize,r.province,r.pic,r.event].join(" "));
      if(!toks.every(function(t){ return hay.indexOf(t)>=0; })) return;
    }
    out.push(r);
  });
  if(S.stSort==="sales")  out.sort(function(a,b){ return b.sales-a.sales; });
  else if(S.stSort==="act") out.sort(function(a,b){ return b.nTotal-a.nTotal; });
  else if(S.stSort==="none") out.sort(function(a,b){ return a.nTotal-b.nTotal; });
  else out.sort(function(a,b){ return String(a.acc).localeCompare(String(b.acc))
                                  || String(a.contact).localeCompare(String(b.contact)); });
  return { rows:out, toks:toks };
}
